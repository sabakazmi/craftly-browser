<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create</title>
<style>
:root{--bg:#070a0f;--panel:#0d1219;--line:#1c2430;--ink:#eef2f7;--dim:#8794a6;
      --acc:#3ddc97;--warn:#e0a94b;--fail:#e4635a;--r:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
 font:15px/1.62 Inter,ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
 -webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:40px 18px 100px}
h1{font-size:clamp(28px,3.4vw,44px);margin:0 0 8px;letter-spacing:-.022em}
.lede{color:var(--dim);max-width:60ch;margin:0 0 30px}
.lab{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;
 color:var(--dim);margin:22px 0 8px;font-weight:600}
.ask{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px}
textarea,input,select{width:100%;background:#0a0f16;color:var(--ink);
 border:1px solid var(--line);border-radius:11px;padding:12px 14px;font:inherit}
textarea{min-height:104px;resize:vertical;line-height:1.55}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--acc)}
.kinds{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));margin-top:4px}
.k{background:#0a0f16;border:1px solid var(--line);border-radius:13px;padding:15px 14px;
 cursor:pointer;text-align:left;color:var(--ink);font:inherit;transition:.14s}
.k:hover{border-color:#2b3643}
.k[aria-pressed=true]{border-color:var(--acc);background:#0b1a14}
.k b{display:block;font-size:14.5px;margin-bottom:3px}
.k span{color:var(--dim);font-size:12.5px;line-height:1.42;display:block}
.k svg{width:19px;height:19px;stroke:var(--acc);fill:none;stroke-width:1.5;
 stroke-linecap:round;stroke-linejoin:round;margin-bottom:9px;display:block}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 180px}
.btn{width:100%;margin-top:18px;padding:14px;border-radius:12px;border:0;
 background:var(--acc);color:#04140b;font:600 15.5px/1 Inter,sans-serif;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.note{color:var(--dim);font-size:13px;margin:12px 0 0}
.warn{color:var(--warn)}.ok{color:var(--acc)}.bad{color:var(--fail)}
.plan{margin-top:16px;border:1px solid var(--line);border-radius:13px;overflow:hidden}
.plan h3{margin:0;padding:13px 16px;font-size:12.5px;letter-spacing:.09em;
 text-transform:uppercase;color:var(--dim);background:#0a0f16;border-bottom:1px solid var(--line)}
.step{display:flex;gap:12px;align-items:baseline;padding:9px 16px;border-bottom:1px solid #141b24;font-size:13.5px}
.step:last-child{border-bottom:0}
.step b{flex:0 0 118px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;
 color:var(--acc);font-weight:700}
.step i{color:var(--dim);font-style:normal;font-size:12.5px;margin-left:auto;text-align:right;flex:0 0 40%}
.outs{display:flex;flex-wrap:wrap;gap:9px;margin-top:14px}
.outs a{padding:10px 15px;border:1px solid var(--line);border-radius:11px;
 color:var(--ink);text-decoration:none;font-size:13.5px}
.outs a:hover{border-color:var(--acc)}.outs a b{color:var(--acc)}
.gate{margin-top:14px;padding:13px 16px;border-radius:12px;border:1px solid var(--line);
 background:#0a0f16;font-size:13.5px}
.gate .f{display:flex;gap:10px;padding:4px 0;color:var(--dim)}
.gate .f em{font-style:normal;flex:0 0 46px;font-size:10px;letter-spacing:.07em;
 text-transform:uppercase;font-weight:700;padding-top:3px}
.gate .f.fail em{color:var(--fail)}.gate .f.warn em{color:var(--warn)}
.spin{display:inline-block;width:11px;height:11px;margin-right:8px;border-radius:50%;
 border:2px solid #2b3643;border-top-color:var(--acc);animation:s .7s linear infinite;vertical-align:-1px}
@keyframes s{to{transform:rotate(360deg)}}
</style></head><body><div class="wrap">

<h1>What would you like to create?</h1>
<p class="lede">Describe it, or paste the source material. The studio reads it, shows
you the plan it intends to follow, and only then builds. Every word in the output
comes from what you put in.</p>

<div class="ask">
  <span class="lab">1 — What are you making</span>
  <div class="kinds" id="kinds"></div>

  <span class="lab">2 — Describe it, or paste your source</span>
  <textarea id="src" placeholder="Paste a report, notes, a brief, a table — or just describe what you want."></textarea>
  <p class="note" id="stat"></p>

  <span class="lab">3 — Brand</span>
  <div class="row">
    <input id="brand" value="iCore" placeholder="name">
    <input id="sector" value="consulting" placeholder="sector">
    <input id="lead" type="color" value="#2f9e63" style="flex:0 0 64px">
    <input id="deep" type="color" value="#0e2340" style="flex:0 0 64px">
  </div>
  <p class="note" id="bnote"></p>

  <button class="btn sec" id="read">Read it and show me the plan</button>
  <button class="btn" id="go" disabled>Build it</button>
  <p class="note" id="msg"></p>
</div>

<div id="planbox"></div>
<div id="result"></div>

<script>
const $ = id => document.getElementById(id);
const T = () => { const t = new URLSearchParams(location.search).get("t");
                  return t ? "?t=" + encodeURIComponent(t) : ""; };
const esc = t => (t||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Thin-line icons only — outline, never filled. House rule, no exceptions. */
const IC = {
 deck:'<path d="M3 4h18v12H3z"/><path d="M12 16v4M8 20h8"/>',
 document:'<path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12h6M9 16h6"/>',
 video:'<rect x="3" y="6" width="13" height="12" rx="2"/><path d="m16 10 5-3v10l-5-3z"/>',
 campaign:'<path d="M4 10v4h4l6 4V6l-6 4H4z"/><path d="M18 9a4 4 0 0 1 0 6"/>',
 website:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M7 6.5h.01M10 6.5h.01"/>',
 assets:'<circle cx="12" cy="12" r="9"/><path d="M12 7v10M7 12h10"/>',
};
const KINDS = [
 ["deck","A presentation","Slides from your source, built with layouts chosen by the content."],
 ["document","A document or report","A set Word file and PDF, with your cover and type."],
 ["video","A video","A spatial walk-through, animated figures, or your deck as film."],
 ["campaign","A social campaign","Posts, carousels and the upload copy for each platform."],
 ["website","A website or store","Five questions, six complete designs."],
 ["assets","Marketing assets","Logos, palettes, charts and graphics in your brand."],
];
let KIND = "deck", PLAN = null;

$("kinds").innerHTML = KINDS.map(([id,t,d])=>
 `<button class="k" data-k="${id}" aria-pressed="${id===KIND}">
    <svg viewBox="0 0 24 24">${IC[id]}</svg><b>${t}</b><span>${d}</span></button>`).join("");
$("kinds").onclick = e => { const b=e.target.closest(".k"); if(!b) return;
  KIND = b.dataset.k;
  [...$("kinds").children].forEach(x=>x.setAttribute("aria-pressed", x===b));
  if (KIND === "website") location.href = "/webstudio" + T();
  if (KIND === "campaign") location.href = "/studio" + T();
};

$("src").addEventListener("input", ()=>{
  const t=$("src").value.trim();
  $("stat").textContent = t ? t.split(/\s+/).length+" words · "+
    t.split("\n").filter(l=>l.trim()).length+" lines" : "";
  $("go").disabled = true; PLAN = null;
});

async function post(path, body){
  const r = await fetch(path+T(), {method:"POST",
    headers:{"Content-Type":"application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok || j.error) throw new Error(j.error || ("error "+r.status));
  return j;
}
const payload = extra => Object.assign({
  text:$("src").value, kind:KIND, brand:$("brand").value.trim(),
  sector:$("sector").value.trim(), lead:$("lead").value, deep:$("deep").value
}, extra||{});

$("read").onclick = async ()=>{
  if ($("src").value.trim().length < 20){
    $("msg").innerHTML='<span class="warn">There is not enough here to read yet.</span>'; return; }
  $("msg").innerHTML='<span class="spin"></span>Reading…';
  try{
    const j = await post("/api/create/plan", payload());
    PLAN = j;
    $("bnote").innerHTML = j.brand_note ? esc(j.brand_note) : "";
    $("planbox").innerHTML =
      '<div class="plan"><h3>'+j.steps.length+' slides planned — the content chose each layout</h3>'+
      j.steps.map(s=>'<div class="step"><b>'+esc(s.archetype)+'</b>'+
        '<span>'+esc(s.title||"")+'</span><i>'+esc(s.why||"")+'</i></div>').join("")+'</div>';
    $("go").disabled = false;
    $("msg").innerHTML='<span class="ok">Plan ready. Change your text and read again, or build it.</span>';
  }catch(e){ $("msg").innerHTML='<span class="bad">'+esc(e.message)+'</span>'; }
};

$("go").onclick = async ()=>{
  $("go").disabled = true;
  $("msg").innerHTML='<span class="spin"></span>Building, then checking the rendered pages…';
  $("result").innerHTML="";
  try{
    const j = await post("/api/create/build", payload());
    const NAME={pptx:"Deck",docx:"Word",pdf:"PDF",pdf_deck:"Deck PDF",spatial:"Spatial video",motion:"Animated chart"};
    let html = '<div class="outs">'+Object.entries(j.files||{}).map(([k,u])=>
      '<a href="'+u+'" download><b>'+(NAME[k]||k)+'</b> · '+((j.bytes[k]||0)/1024).toFixed(0)+' KB</a>').join("")+'</div>';
    if (j.gate){
      const g=j.gate;
      html += '<div class="gate"><b class="'+(g.pass?"ok":"bad")+'">'+esc(g.verdict)+'</b>'+
        (g.findings||[]).slice(0,8).map(f=>'<div class="f '+f.level+'"><em>'+f.level+
          '</em><span>p'+f.page+' — '+esc(f.what)+': '+esc(f.measured)+'</span></div>').join("")+
        '<p class="note">Measured on the rendered pages, not on the file.</p></div>';
    }
    $("result").innerHTML = html;
    $("msg").innerHTML='<span class="ok">Done.</span>';
  }catch(e){ $("msg").innerHTML='<span class="bad">'+esc(e.message)+'</span>'; }
  $("go").disabled = false;
};
</script></div><script src="offline.js"></script><script src="nav.js"></script></body></html>

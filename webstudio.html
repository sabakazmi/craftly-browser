  -webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.hero .lede{max-width:50ch;margin:26px 0 0;color:var(--dim);font-size:clamp(16px,1.7vw,19px);font-weight:300}
.acts{display:flex;gap:11px;margin-top:38px;flex-wrap:wrap}
.btn{padding:15px 30px;border-radius:999px;font-weight:500;font-size:15px;display:inline-flex;align-items:center;gap:9px;
  transition:transform .25s cubic-bezier(.16,.84,.3,1),box-shadow .25s,border-color .25s}
.btn.p{background:var(--ink);color:var(--bg)}
.btn.p:hover{transform:translateY(-2px);box-shadow:0 16px 40px -14px var(--brand)}
.btn.s{border:1px solid var(--hair);color:var(--ink)}
.btn.s:hover{border-color:var(--brandText);transform:translateY(-2px)}
.scrollcue{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);z-index:3;font-size:10.5px;letter-spacing:.3em;
  text-transform:uppercase;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:9px}
.scrollcue i{width:1px;height:38px;background:linear-gradient(var(--dim),transparent);display:block}
${m.dur ? `.hero .eye,.hero h1,.hero .lede,.hero .acts{opacity:0;transform:translateY(20px);animation:rise ${m.dur}ms cubic-bezier(.16,.84,.3,1) forwards}
.hero h1{animation-delay:${m.stagger}ms}.hero .lede{animation-delay:${m.stagger * 2}ms}.hero .acts{animation-delay:${m.stagger * 3}ms}
@keyframes rise{to{opacity:1;transform:none}}` : ''}

/* ---- scroll storytelling: sticky stage, panels cross-fade ---- */
.story{position:relative}
.story .sticky{position:sticky;top:0;height:100svh;height:100vh;display:grid;place-items:center;overflow:hidden}
.story .panel{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:0 24px;
  opacity:0;transform:translateY(26px) scale(.985);transition:opacity .7s cubic-bezier(.16,.84,.3,1),transform .7s cubic-bezier(.16,.84,.3,1)}
.story .panel.on{opacity:1;transform:none}
.story .panel h2{font-size:clamp(30px,5.6vw,68px);max-width:17ch}
.story .panel p{color:var(--dim);max-width:52ch;margin:22px auto 0;font-size:17px}
.story .panel .n{font:500 11px/1 ${F.display},sans-serif;letter-spacing:.3em;color:var(--brandText);margin-bottom:22px}
.story .spacer{height:100svh;height:100vh}
.rail{position:fixed;right:22px;top:50%;transform:translateY(-50%);z-index:40;display:flex;flex-direction:column;gap:9px;opacity:0;transition:opacity .4s}
.rail.on{opacity:1}
.rail i{width:2px;height:22px;background:var(--hair);border-radius:2px;transition:background .4s,height .4s}
.rail i.act{background:var(--brand);height:34px}
@media(max-width:820px){.rail{display:none}
  .story .sticky{position:static;height:auto;padding:70px 0}
  .story .panel{position:static;opacity:1;transform:none;padding:0}
  .story .spacer{display:none}}

section{padding:clamp(80px,11vw,150px) 0}
.rule{border-top:1px solid var(--hair)}
.head{display:grid;grid-template-columns:auto 1fr;gap:clamp(20px,4vw,46px);align-items:start}
.ix{font:500 11.5px/1 ${F.display},sans-serif;color:var(--dim);letter-spacing:.22em;padding-top:13px;white-space:nowrap}
h2{font-size:clamp(28px,4.8vw,56px)}
.sub{color:var(--dim);max-width:58ch;margin-top:20px;font-size:17px;font-weight:300}
.prose{color:var(--dim);max-width:62ch;margin-top:22px;font-size:17.5px;white-space:pre-wrap;font-weight:300}
@media(max-width:720px){.head{grid-template-columns:1fr;gap:12px}.ix{padding:0}}

.svc{margin-top:clamp(44px,6vw,72px);display:grid;gap:1px;background:var(--hair);border:1px solid var(--hair);border-radius:22px;overflow:hidden}
@media(min-width:800px){.svc{grid-template-columns:1fr 1fr}}
.svc .c{background:var(--bg);padding:clamp(28px,3.6vw,46px) clamp(24px,3vw,38px);position:relative;transition:background .5s}
.svc .c:hover{background:var(--chip)}
.svc .c em{font-style:normal;font:500 11px/1 ${F.display},sans-serif;color:var(--brandText);letter-spacing:.2em;display:block;margin-bottom:20px}
.svc .c h3{font-size:clamp(20px,2.3vw,26px);margin-bottom:12px}
.svc .c p{color:var(--dim);font-size:15.5px;margin:0;font-weight:300}

.work{margin-top:clamp(40px,6vw,66px);display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.work a{border:1px solid var(--hair);border-radius:20px;padding:30px;display:block;transition:border-color .35s,transform .35s,background .35s}
.work a:hover{border-color:var(--brandText);transform:translateY(-4px);background:var(--chip)}
.work h3{font-size:21px;margin-bottom:9px}
.work span{color:var(--dim);font-size:14px}

.stats{display:grid;gap:34px;margin-top:clamp(40px,6vw,66px);grid-template-columns:repeat(auto-fit,minmax(165px,1fr))}
.stats b{display:block;font-family:${F.display},sans-serif;font-weight:500;font-size:clamp(36px,5.6vw,62px);letter-spacing:-.06em;line-height:1;
  background:linear-gradient(118deg,var(--ink),var(--brandText));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats span{color:var(--dim);font-size:14px;display:block;margin-top:8px}

.quote{text-align:center}
.quote blockquote{font-family:${F.display},sans-serif;font-weight:500;font-size:clamp(25px,4vw,46px);line-height:1.14;letter-spacing:-.045em;max-width:21ch;margin:0 auto}
.quote .who{color:var(--dim);font-size:13.5px;margin-top:26px;letter-spacing:.06em}

.contact{position:relative;overflow:hidden}
.contact::before{content:'';position:absolute;width:140%;aspect-ratio:2;left:-20%;bottom:-70%;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--brand) calc(var(--glow)*70%),transparent),transparent 62%);filter:blur(70px)}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,5vw,64px);align-items:start;margin-top:clamp(32px,4vw,50px);position:relative}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
form{display:grid;gap:13px;grid-template-columns:1fr 1fr}
form label.full,form button,form .formnote{grid-column:1/-1}
form span{display:block;font-size:12px;color:var(--dim);margin-bottom:7px;letter-spacing:.08em;text-transform:uppercase}
form input,form textarea{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--hair);background:var(--panel);color:var(--ink);font:inherit}
form input:focus,form textarea:focus{outline:none;border-color:var(--brandText)}
form button{background:var(--ink);color:var(--bg);padding:14px;border-radius:12px;font-weight:500;transition:transform .2s}
form button:hover{transform:translateY(-1px)}
.cdetail{display:grid;gap:18px}
.cdetail .k{color:var(--dim);font-size:11.5px;letter-spacing:.16em;text-transform:uppercase;display:block;margin-bottom:5px}
.cdetail a{border-bottom:1px solid var(--hair);padding-bottom:3px;font-size:16.5px}
.cdetail a:hover{border-color:var(--brandText)}

footer{border-top:1px solid var(--hair);padding:64px 0 44px;color:var(--dim);font-size:14px}
.fg{display:grid;gap:34px;grid-template-columns:1.8fr 1fr 1fr}
footer h4{color:var(--ink);font:500 11px/1 ${F.display},sans-serif;letter-spacing:.22em;text-transform:uppercase;margin:0 0 15px}
footer a{display:block;padding:4px 0}footer a:hover{color:var(--ink)}
.fbot{margin-top:50px;padding-top:22px;border-top:1px solid var(--hair);font-size:12.5px;display:flex;gap:14px;flex-wrap:wrap;align-items:center}
@media(max-width:700px){.fg{grid-template-columns:1fr}}

<script>
__icoreThree(function(){
  var cv=document.getElementById('gl'); if(!cv||!window.THREE) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var small = innerWidth<760, deviceWeak = (navigator.hardwareConcurrency||4)<=4;

  var sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(46,1,.1,100); cam.position.z=7.2;
  var BR=new THREE.Color('${brand}'), AC=new THREE.Color('${accent}');

  /* The solid sits in the right third of the frame, not the middle. Centred,
     it ran straight through the headline — visible the moment the page was
     actually rendered. On a narrow viewport it moves back to centre, because
     there the copy stacks below it. */
  var obj=new THREE.Group();
  obj.position.x = small ? 0 : 2.35;
  sc.add(obj);
  var geo=new THREE.IcosahedronGeometry(1.74, 1);
  var solid=new THREE.LineSegments(new THREE.WireframeGeometry(geo),
    new THREE.LineBasicMaterial({color:BR,transparent:true,opacity:.42}));
  obj.add(solid);
  var inner=new THREE.Mesh(new THREE.IcosahedronGeometry(1.2,0),
    new THREE.MeshBasicMaterial({color:AC,wireframe:true,transparent:true,opacity:.2}));
  obj.add(inner);

  /* a round sprite for the dust. The default point is a hard square, which
     at this density reads as confetti rather than a particle field. */
  var sprite=(function(){
    var cn=document.createElement('canvas'); cn.width=cn.height=64;
    var g=cn.getContext('2d').createRadialGradient(32,32,0,32,32,32);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.55)');
    g.addColorStop(1,'rgba(255,255,255,0)');
    var x=cn.getContext('2d'); x.fillStyle=g; x.fillRect(0,0,64,64);
    var t=new THREE.CanvasTexture(cn); t.needsUpdate=true; return t;
  })();

  /* particle field */
  var N=small?420:${m.three >= 2 ? 1400 : 800}, pos=new Float32Array(N*3), col=new Float32Array(N*3);
  for(var i=0;i<N;i++){
    var rr=3.1+Math.random()*5.4, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1);
    pos[i*3]=rr*Math.sin(ph)*Math.cos(th); pos[i*3+1]=rr*Math.sin(ph)*Math.sin(th)*.62; pos[i*3+2]=rr*Math.cos(ph);
    var c=Math.random()<.5?BR:AC; col[i*3]=c.r; col[i*3+1]=c.g; col[i*3+2]=c.b;
  }
  var pg=new THREE.BufferGeometry();
  pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
  pg.setAttribute('color',new THREE.BufferAttribute(col,3));
  var pts=new THREE.Points(pg,new THREE.PointsMaterial({size:.085,vertexColors:true,transparent:true,opacity:.52,
    map:sprite,blending:THREE.AdditiveBlending,depthWrite:false,sizeAttenuation:true}));
  sc.add(pts);

  function size(){ var w=cv.clientWidth||innerWidth, h=cv.clientHeight||innerHeight;
    r.setSize(w,h,false); cam.aspect=w/h; cam.updateProjectionMatrix(); }
  size(); addEventListener('resize',size,{passive:true});

  var mx=0,my=0,tx=0,ty=0,scrollY=0,run=true;
  addEventListener('pointermove',function(e){ tx=(e.clientX/innerWidth-.5); ty=(e.clientY/innerHeight-.5); },{passive:true});

  /* The scene has to answer to the appearance mode. Additive wireframe on a
     light surface reads as a rendering fault, which is exactly how it looked
     the first time these pages were rendered in day mode. The colours are
     read back from the page's own tokens, so any palette the generator picks
     is honoured without the engine knowing which one it got. */
  function applyMode(){
    var cs=getComputedStyle(document.documentElement);
    var day=(document.documentElement.getAttribute('data-mode')||'night')==='day';
    var bt=(cs.getPropertyValue('--brandText')||'').trim()||'${brand}';
    var at=(cs.getPropertyValue('--accentText')||'').trim()||'${accent}';

    pts.material.opacity   = day?.3:.52;

   With no figures it shows an honest empty state, never invented data.
   Holographic depth: pointer-tracked sheen + layered parallax planes.
   ===================================================================== */
function dsHalon(cfg) {
  const t = cfg.theme, c = cfg.content, b = cfg.business;
  const brand = t.brand || '#39E7D4', accent = t.accent || '#7B6BFF';
  const F = FP(t.fontPair), m = MOTION[t.motion] || MOTION.premium;
  const nav = navItems(cfg), MONO = "'JetBrains Mono',ui-monospace,monospace";
  const stats = statItems(cfg);
  const useGL = m.three >= 1;

  const css = `
:root{--brand:${brand};--accent:${accent}}
html[data-mode=day]{--bg:#F4F7FB;--ink:#060A12;--dim:#5A6478;--hair:#D8E0EC;--chip:#E7EDF6;--panel:rgba(255,255,255,.72);--mesh:.07;--sheen:.14;${textTokens(brand,accent,'#F4F7FB','#060A12')}}
html[data-mode=night]{--bg:#03060C;--ink:#E8EEF9;--dim:#757F93;--hair:rgba(120,160,255,.16);--chip:rgba(120,160,255,.08);--panel:rgba(255,255,255,.035);--mesh:.16;--sheen:.3;${textTokens(brand,accent,'#03060C','#E8EEF9')}}
body{background:var(--bg);color:var(--ink);font:300 15.5px/1.72 ${F.body},system-ui,sans-serif;transition:background .5s,color .5s}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(58% 42% at 82% -6%,color-mix(in srgb,var(--accent) calc(var(--mesh)*100%),transparent),transparent 60%),
             radial-gradient(52% 40% at 2% 102%,color-mix(in srgb,var(--brand) calc(var(--mesh)*90%),transparent),transparent 62%)}
body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);
  background-size:72px 72px;mask-image:radial-gradient(circle at 50% 40%,#000,transparent 78%)}
.w{max-width:1240px;margin:0 auto;padding:0 clamp(18px,4vw,30px);position:relative;z-index:1}
h1,h2,h3{margin:0;font-family:${F.display},sans-serif;font-weight:600;letter-spacing:-.045em;line-height:1.02}
.tag{font:400 10.5px/1 ${MONO};letter-spacing:.22em;text-transform:uppercase;color:var(--dim)}

nav{position:sticky;top:0;z-index:70;border-bottom:1px solid var(--hair);
  background:color-mix(in srgb,var(--bg) 78%,transparent);backdrop-filter:blur(20px) saturate(1.4)}
.nb{display:flex;align-items:center;justify-content:space-between;height:58px;gap:18px}
.mk{font:600 14px/1 ${MONO};letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
.mk img{height:20px;width:auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--brand);box-shadow:0 0 12px var(--brand);flex:0 0 auto}
.nl{display:flex;gap:20px;font:400 12.5px/1 ${MONO}}
.nl a{color:var(--dim);transition:color .2s}.nl a:hover{color:var(--brandText)}
.nr{display:flex;align-items:center;gap:9px}
.nbtn{border:1px solid var(--hair);padding:9px 15px;border-radius:8px;font:400 12.5px/1 ${MONO};
  background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 14%,transparent),transparent);transition:border-color .25s}
.nbtn:hover{border-color:var(--brandText)}
#installbtn{font:400 12px/1 ${MONO};color:var(--dim);padding:8px 10px;border-radius:7px}
#installbtn:hover{color:var(--brandText)}
@media(max-width:900px){.nl{display:none}}

/* ---- hero: layered holographic planes over a live data terrain ---- */
.hero{padding:clamp(54px,7vw,100px) 0 clamp(46px,6vw,84px);position:relative;isolation:isolate;overflow:hidden}
/* the WebGL canvas sits behind the hero content. It keeps pointer events so a
   drag on open ground orbits the scene, including on touch; the copy and the
   glass panel sit above it and scroll normally. */
#hgl{position:absolute;left:-2%;right:-2%;top:-6%;height:124%;width:104%;z-index:0;
  opacity:0;transition:opacity 1.2s cubic-bezier(.16,.84,.3,1);touch-action:none;cursor:grab;
  /* without this the terrain is cut off by the hero's overflow and leaves a
     hard horizontal seam across the page — obvious in a render, invisible
     in the source */
  -webkit-mask-image:radial-gradient(112% 74% at 58% 40%,#000 28%,rgba(0,0,0,.5) 60%,transparent 86%);
  mask-image:radial-gradient(112% 74% at 58% 40%,#000 28%,rgba(0,0,0,.5) 60%,transparent 86%)}
#hgl.on{opacity:1}
#hgl.drag{cursor:grabbing}
.hero > .w{position:relative;z-index:1}
.hero::after{content:'';position:absolute;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(130% 90% at 18% 42%,var(--bg) 18%,transparent 64%)}
@media(prefers-reduced-motion:reduce){#hgl{display:none}}
.hg{display:grid;grid-template-columns:1.02fr .98fr;gap:clamp(28px,4.6vw,58px);align-items:center}
@media(max-width:940px){.hg{grid-template-columns:1fr;gap:34px}}
.hero h1{font-size:clamp(34px,5.9vw,72px);margin-top:18px}
.hero h1 b{font-weight:600;background:linear-gradient(100deg,var(--brandText),var(--accentText));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--dim);max-width:48ch;margin:22px 0 0;font-size:16.5px}
.hacts{display:flex;gap:10px;margin-top:32px;flex-wrap:wrap}
.b1{background:linear-gradient(100deg,var(--brand),var(--accent));color:#02101A;padding:14px 26px;border-radius:10px;font-weight:600;font-size:14.5px;
  transition:transform .25s cubic-bezier(.16,.84,.3,1),box-shadow .25s}
.b1:hover{transform:translateY(-2px);box-shadow:0 14px 34px -12px var(--brand)}
.b2{border:1px solid var(--hair);padding:14px 26px;border-radius:10px;font-size:14.5px;transition:border-color .25s,transform .25s}
.b2:hover{border-color:var(--brandText);transform:translateY(-2px)}

.deck{position:relative;perspective:1200px}
.glass{border:1px solid var(--hair);border-radius:18px;background:var(--panel);backdrop-filter:blur(16px);padding:20px;position:relative;overflow:hidden;
  transform-style:preserve-3d;transition:transform .4s cubic-bezier(.16,.84,.3,1)}
.glass::before{content:'';position:absolute;inset:0;border-radius:18px;padding:1px;
  background:linear-gradient(140deg,color-mix(in srgb,var(--brand) 60%,transparent),transparent 42%,color-mix(in srgb,var(--accent) 52%,transparent));
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.glass::after{content:'';position:absolute;inset:0;border-radius:18px;pointer-events:none;opacity:var(--sheen);
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),color-mix(in srgb,var(--brand) 55%,transparent),transparent 62%);
  transition:opacity .4s}
.deck .behind{position:absolute;inset:14px -14px -16px 14px;border:1px solid var(--hair);border-radius:18px;opacity:.42;z-index:-1}
.deck .behind2{position:absolute;inset:28px -28px -32px 28px;border:1px solid var(--hair);border-radius:18px;opacity:.2;z-index:-2}

/* data viz, from entered figures only */
.viz{margin-top:14px}
.vizrow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--hair)}
.vizrow:last-child{border:0}
.vizrow .lbl{font:400 12px/1.4 ${MONO};color:var(--dim)}
.vizrow .val{font:600 20px/1 ${MONO};letter-spacing:-.03em;
  background:linear-gradient(100deg,var(--brandText),var(--accentText));-webkit-background-clip:text;background-clip:text;color:transparent}
.vizbar{grid-column:1/-1;height:3px;border-radius:3px;background:var(--chip);overflow:hidden}
.vizbar i{display:block;height:100%;width:0;border-radius:3px;background:linear-gradient(90deg,var(--brand),var(--accent));
  transition:width 1.3s cubic-bezier(.16,.84,.3,1)}
.vizbar.in i{width:var(--pct)}
.vizempty{border:1px dashed var(--hair);border-radius:12px;padding:22px;text-align:center;color:var(--dim);font-size:13.5px;line-height:1.6}
.lattice{height:168px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(180deg,var(--chip),transparent)}
.lattice i{position:absolute;inset:0;background-image:
  linear-gradient(var(--hair) 1px,transparent 1px),linear-gradient(90deg,var(--hair) 1px,transparent 1px);background-size:30px 30px}

  border-radius:50%;opacity:.55;text-decoration:none}

  ${m.dur ? 'animation:scan 4.2s linear infinite' : 'top:50%'}}

section{padding:clamp(60px,8vw,112px) 0;border-top:1px solid var(--hair);position:relative;z-index:1}

.prose{color:var(--dim);max-width:62ch;margin-top:20px;font-size:16.5px;white-space:pre-wrap}
.grid{display:grid;gap:12px;margin-top:clamp(34px,4.4vw,50px);grid-template-columns:repeat(auto-fit,minmax(252px,1fr))}

  transition:border-color .3s,transform .3s}

  border-radius:15px;overflow:hidden;margin-top:clamp(30px,4vw,46px)}
.metrics div{background:var(--bg);padding:26px 20px}
.metrics b{display:block;font:600 clamp(27px,3.7vw,42px)/1 ${MONO};letter-spacing:-.05em;
  background:linear-gradient(100deg,var(--brandText),var(--accentText));-webkit-background-clip:text;background-clip:text;color:transparent}
.metrics span{color:var(--dim);font-size:12.5px;margin-top:8px;display:block}
.quote blockquote{font-size:clamp(23px,3.5vw,40px);line-height:1.18;letter-spacing:-.04em;max-width:24ch;margin:0;font-weight:600}
.quote .who{color:var(--dim);margin-top:18px;font:400 12.5px/1 ${MONO}}

@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
form{display:grid;gap:12px;grid-template-columns:1fr 1fr}
form label.full,form button,form .formnote{grid-column:1/-1}
form span{display:block;font:400 10.5px/1 ${MONO};letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
form input,form textarea{width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--hair);background:var(--panel);color:var(--ink);font:inherit}
form input:focus,form textarea:focus{outline:none;border-color:var(--brandText)}

.cdetail div{border:1px solid var(--hair);border-radius:12px;padding:15px;margin-bottom:10px;background:var(--panel)}

.fg{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:28px}
footer h4{color:var(--ink);font:400 10.5px/1 ${MONO};letter-spacing:.2em;text-transform:uppercase;margin:0 0 14px}
footer a{display:block;padding:4px 0}footer a:hover{color:var(--brandText)}
.fbot{margin-top:40px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
`;

  /* figures → bars. The maximum is derived from the user's own numbers. */
  const nums = stats.map(s => parseFloat(String(s.v).replace(/[^0-9.]/g, '')) || 0);
  const mx = Math.max(1, ...nums);
  const viz = stats.length
    ? '<div class="viz">' + stats.slice(0, 5).map((s, i) => {
        const pct = Math.max(6, Math.round((nums[i] / mx) * 100));
        return '<div class="vizrow"><span class="lbl">' + E(s.k || '—') + '</span>' +
          '<span class="val">' + E(s.v) + '</span>' +
          '<span class="vizbar" data-rv style="--pct:' + pct + '%;transition-delay:' + (i * 90) + 'ms"><i></i></span></div>';
      }).join('') + '</div>'
    /* Editor guidance, not website copy: the published document gets
       nothing rather than an instruction aimed at the site's owner. */
    : (publishing() ? ''
      : '<div class="vizempty">No figures entered yet.<br>Add numbers you can evidence and this panel charts them.</div>');

  const S = [];
  S.push('<nav><div class="w"><div class="nb"><span class="mk"><span class="dot"></span>' +
    (cfg.media.logo ? '<img src="' + cfg.media.logo + '" alt="">' : '') +
    (b.name ? E(b.name) : PH('Business name')) + '</span>' +
    (nav.length ? '<span class="nl">' + nav.map(n => '<a href="' + n.href + '">' + E(n.label) + '</a>').join('') + '</span>' : '') +
    '<span class="nr">' + modeBar() + installBtn() + '<a class="nbtn" href="#contact">' + E(b.ctaLabel) + '</a></span>' +
    '</div></div></nav>');

  S.push('<header class="hero" id="hero">' +
    (useGL ? '<canvas id="hgl" aria-hidden="true"></canvas>' : '') +
    '<div class="w"><div class="hg"><div>' +
    '<div class="tag">' + (c.hero.eyebrow || b.sector ? E(c.hero.eyebrow || b.sector) : PH('Eyebrow')) + '</div>' +
    '<h1>' + (c.hero.headlineA ? E(c.hero.headlineA) : PH('Write your headline')) +
    (c.hero.headlineB ? ' <b>' + E(c.hero.headlineB) + '</b>' : '') + '</h1>' +
    '<p>' + (c.hero.sub || b.tagline ? E(c.hero.sub || b.tagline) : PH('One sentence on what the business does')) + '</p>' +
    '<div class="hacts"><a class="b1" href="#contact">' + E(b.ctaLabel) + '</a>' +
    (sec(cfg, 'services') ? '<a class="b2" href="#services">Capabilities</a>' : '') + '</div></div>' +
    '<div class="deck"><div class="behind2"></div><div class="behind"></div>' +
    '<div class="glass" id="tilt">' +
    (heroMedia(cfg, cfg.media.hero ? '<img src="' + cfg.media.hero + '" alt="" style="' + focal(cfg.media.heroFocal) + '">' : '')
      || '<div class="lattice"><i></i><u></u><div class="scan"></div></div>') +
    viz + '</div></div>' +
    '</div></div></header>');

  if (sec(cfg, 'about')) S.push('<section id="about"><div class="w"><div class="tag">// about</div>' +
    '<h2 style="margin-top:14px">' + E(c.about.heading) + '</h2><div class="prose">' + E(c.about.body) + '</div></div></section>');

  if (sec(cfg, 'services')) S.push('<section id="services"><div class="w"><div class="tag">// capabilities</div>' +
    '<h2 style="margin-top:14px">' + E(c.services.heading) + '</h2>' +
    (c.services.intro ? '<p class="sub">' + E(c.services.intro) + '</p>' : '') +
    (svcItems(cfg).length ? '<div class="grid">' + svcItems(cfg).map((s, i) =>
      '<div class="card hov" data-rv style="transition-delay:' + (i * m.stagger) + 'ms"><span class="ix">[' + String(i + 1).padStart(2, '0') + ']</span>' +
      '<h3>' + E(s.title) + '</h3><p>' + (s.body ? E(s.body) : PH('Describe this service')) + '</p></div>').join('') + '</div>'
      : '<div style="margin-top:34px">' + PH('Add your services in the editor', 1) + '</div>') + '</div></section>');


  if (sec(cfg, 'products')) S.push('<section id="products"><div class="w"><div class="tag">// catalogue</div>' +
    '<h2 style="margin-top:14px">' + E(c.products.heading) + '</h2>' +
    (c.products.intro ? '<p class="sub">' + E(c.products.intro) + '</p>' : '') +
    '<div class="grid">' + prodItems(cfg).map((p, i) => '<a class="card hov" href="#contact" data-rv style="transition-delay:' + (i * m.stagger) + 'ms">' +
      '<h3>' + E(p.name) + '</h3><p>' + money(cfg, p.price) + ' \u00B7 enquire</p></a>').join('') + '</div></div></section>');

  if (sec(cfg, 'work')) S.push('<section id="work"><div class="w"><div class="tag">// work</div>' +
    '<h2 style="margin-top:14px">' + E(c.work.heading) + '</h2><div class="grid">' +
    workItems(cfg).map((x, i) => '<a class="card hov" href="#contact" data-rv style="transition-delay:' + (i * m.stagger) + 'ms">' +
      '<h3>' + E(x.title) + '</h3><p>' + E(x.meta || '') + '</p></a>').join('') + '</div></div></section>');

  if (sec(cfg, 'stats')) S.push('<section id="stats"><div class="w"><div class="tag">// record</div>' +
    '<h2 style="margin-top:14px">' + E(c.stats.heading) + '</h2><div class="metrics">' +
    stats.map(s => '<div data-rv><b>' + E(s.v) + '</b><span>' + E(s.k) + '</span></div>').join('') + '</div></div></section>');

  if (sec(cfg, 'testimonial')) S.push('<section id="testimonial" class="quote"><div class="w"><div class="tag">// client</div>' +
    '<blockquote style="margin-top:16px">“' + E(c.testimonial.quote) + '”</blockquote>' +
    '<div class="who">' + (c.testimonial.who ? E(c.testimonial.who) : PH('Attribution')) + '</div></div></section>');

  S.push('<section id="contact"><div class="w"><div class="tag">// contact</div>' +
    '<h2 style="margin-top:14px">' + E(c.contact.heading) + '</h2>' +
    (c.contact.body ? '<p class="sub">' + E(c.contact.body) + '</p>' : '') +
    '<div class="cgrid">' + contactForm(cfg) + '<div class="cdetail">' +
    (b.email ? '<div><span class="tag">Email</span><br><a href="mailto:' + E(b.email) + '">' + E(b.email) + '</a></div>' : '') +
    (b.phone ? '<div><span class="tag">Phone</span><br><a href="tel:' + E(b.phone.replace(/\s/g, '')) + '">' + E(b.phone) + '</a></div>' : '') +
    (b.city ? '<div><span class="tag">Location</span><br>' + E(b.city) + '</div>' : '') +
    '</div></div></div></section>');

  S.push('<footer><div class="w"><div class="fg">' +
    '<div><span class="mk"><span class="dot"></span>' + (b.name ? E(b.name) : PH('Business name')) + '</span>' +
    '<p style="max-width:34ch;margin:12px 0 0">' + E(b.tagline) + '</p></div>' +
    '<div><h4>System</h4>' + nav.map(n => '<a href="' + n.href + '">' + E(n.label) + '</a>').join('') + '</div>' +
    '<div><h4>Contact</h4>' + (b.email ? '<a href="mailto:' + E(b.email) + '">' + E(b.email) + '</a>' : '') +
    (b.phone ? '<a href="tel:' + E(b.phone.replace(/\s/g, '')) + '">' + E(b.phone) + '</a>' : '') + '</div>' +
    '</div><div class="fbot"><span class="tag">© ' + new Date().getFullYear() + ' ' + E(b.name || 'Your business') + ' · Halon</span>' +
    modeBar() + '</div></div></footer>');

  /* ---------------------------------------------------------------
     The WebGL hero: a data terrain, not a decorative blob.

     The columns standing on the grid are the figures the client entered,
     scaled against their own largest number — the same source the panel
     charts. With no figures entered there are no columns, because a 3D
     scene that invents data is the same lie as a fake chart.

     Degradation, in order: Essential motion never emits the script ·
     reduced-motion returns before any context is created · a small screen
     on a weak device returns · a failed WebGL context is caught · in every
     case the hero renders its CSS composition and the layout is unchanged.
     --------------------------------------------------------------- */
  const dataSeries = JSON.stringify(
    stats.slice(0, 7).map((s, i) => ({ k: String(s.k || ''), v: Math.max(0.08, (nums[i] || 0) / mx) })));

  const gl = useGL ? `
${GL_RUNTIME}
<script>
__icoreThree(function(){
  var cv=document.getElementById('hgl'); if(!cv||!window.THREE) return;
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var coarse=matchMedia('(pointer:coarse)').matches;
  var small=innerWidth<760, weak=(navigator.hardwareConcurrency||4)<=4;
  if(small&&weak) return;
  var r;
  try{ r=new THREE.WebGLRenderer({canvas:cv,alpha:true,antialias:!small,powerPreference:'low-power'}); }
  catch(e){ return; }
  r.setPixelRatio(Math.min(devicePixelRatio,small?1.5:2));

  var DATA=${dataSeries};
  var BR=new THREE.Color('${brand}'), AC=new THREE.Color('${accent}');
  var sc=new THREE.Scene(), cam=new THREE.PerspectiveCamera(42,1,.1,120);
  var rig=new THREE.Group(); sc.add(rig);

  /* the terrain */
  var SEGX=small?30:46, SEGY=small?20:30;
  var grid=new THREE.PlaneGeometry(27,18,SEGX,SEGY);
  var mesh=new THREE.Mesh(grid,new THREE.MeshBasicMaterial({
    color:BR,wireframe:true,transparent:true,opacity:.26}));
  mesh.rotation.x=-Math.PI/2; mesh.position.y=-2.1; rig.add(mesh);
  rig.position.y=-1.35;   /* the terrain is a floor, not a wall across the frame */
  var base=grid.attributes.position.array.slice();

    (b.city ? '<div><span class="k">Where</span>' + E(b.city) + '</div>' : '') +
    '</div></div></div></section>');

  S.push('<footer><div class="w"><div class="fg">' +
    '<div><div class="mk" style="margin-bottom:12px">' + (b.name ? E(b.name) : PH('Business name')) + '</div>' +
    '<p style="max-width:34ch;margin:0">' + E(b.tagline) + '</p></div>' +
    '<div><h4>Index</h4>' + nav.map(n => '<a href="' + n.href + '">' + E(n.label) + '</a>').join('') + '</div>' +
    '<div><h4>Enquiries</h4>' + (b.email ? '<a href="mailto:' + E(b.email) + '">' + E(b.email) + '</a>' : '') +
    (b.phone ? '<a href="tel:' + E(b.phone.replace(/\s/g, '')) + '">' + E(b.phone) + '</a>' : '') + '</div>' +
    '</div><div class="fbot"><span>© ' + new Date().getFullYear() + ' ' + E(b.name || 'Your business') + ' · Atelier</span>' +
    modeBar() + '</div></div></footer>');

  /* ---------------------------------------------------- paper-drift
     Sheets suspended in the plate, turning very slowly. The engine is
     editorial and warm, so the scene is paper rather than geometry:
     thin planes at shallow angles, tinted with the palette's own ink,
     drifting at a speed that reads as stillness until you watch it. */
  const gl = useGL ? GL_RUNTIME + `
<script>
__icoreScene({
  z: 9, fov: 40, brand: '${brand}', accent: '${accent}',
  build: function(c){
    var T = c.THREE;
    c.sheets = [];
    var N = c.small ? 5 : 8;
    for (var i = 0; i < N; i++) {
      var w = 3.4 + (i % 3) * 1.1, h = w * (0.62 + (i % 2) * 0.18);
      var mat = new T.MeshBasicMaterial({ transparent: true, opacity: .13,
        side: T.DoubleSide, depthWrite: false });
      var mesh = new T.Mesh(new T.PlaneGeometry(w, h), mat);
      /* spread across the plate rather than stacked: the first version
         piled every sheet into the lower middle and read as a heap */
      mesh.position.set((i - (N - 1) / 2) * 1.15 + (i % 2 ? .3 : -.3),
                        Math.sin(i * 1.7) * 1.15,
                        -i * .42);
      mesh.rotation.set(-.30 + Math.sin(i * .9) * .12,
                        .18 + Math.cos(i * .7) * .22,
                        (i % 2 ? 1 : -1) * (.04 + i * .015));
      c.sheets.push({ mesh: mesh, phase: i * .7, rise: .018 + (i % 3) * .006 });
      c.scene.add(mesh);
      /* a hairline along the top edge, so a sheet reads as an edge and
         not as a smear of colour */
      var eg = new T.EdgesGeometry(new T.PlaneGeometry(w, h));
      var line = new T.LineSegments(eg, new T.LineBasicMaterial({
        transparent: true, opacity: .2, depthWrite: false }));
      mesh.add(line);
      c.sheets[i].line = line;
    }
  },
  mode: function(c, tk){
    c.sheets.forEach(function(s, i){
      s.mesh.material.color.set(i % 3 === 0 ? tk.accent : tk.brand);
      /* eight translucent sheets overlapping build up to a muddy mass in
         the middle; each one has to be fainter than it looks alone */
      s.mesh.material.opacity = tk.day ? .07 : .11;
      s.line.material.color.set(i % 3 === 0 ? tk.accent : tk.brand);
      s.line.material.opacity = tk.day ? .26 : .34;
    });
  },
  frame: function(c, t){
    c.sheets.forEach(function(s){
      s.mesh.position.y += Math.sin(t * .22 + s.phase) * 0.0016;
      s.mesh.rotation.z += Math.sin(t * .17 + s.phase) * 0.00018;
      s.mesh.rotation.y = .22 - Math.sin(t * .13 + s.phase) * .09;
    });
    c.camera.position.x = Math.sin(t * .09) * .34;
    c.camera.lookAt(0, 0, 0);
  }
});
<\/script>` : '';

  return docShell(cfg, css, orderSections(cfg, S).join('') + gl);
}

    '<div><div class="lab" style="margin-bottom:12px">Contact</div>' +
    (b.email ? '<a href="mailto:' + E(b.email) + '">' + E(b.email) + '</a>' : '') +
    (b.phone ? '<a href="tel:' + E(b.phone.replace(/\s/g, '')) + '">' + E(b.phone) + '</a>' : '') + '</div>' +

  /* -------------------------------------------------------- massing

     the institutional one, so the scene is the thing an institutional
     client recognises from a planning submission rather than an

  const gl = useGL ? GL_RUNTIME + `
<script>
__icoreScene({
  z: 6.4, fov: 40, brand: '${brand}', accent: '${accent}',
  build: function(c){
    var T = c.THREE;
    c.blocks = [];
    c.group = new T.Group();
    /* wide and shallow: this plate is a letterbox, so a square grid sat
       as a small island in the middle of it */
    var cols = c.small ? 6 : 11, rows = c.small ? 2 : 3, gap = 1.04;
    /* a fixed pseudo-random sequence: the same page must look the same
       on every visit, so nothing here calls Math.random() */
    var seed = 7;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var x = 0; x < cols; x++) {
      for (var z = 0; z < rows; z++) {
        /* capped so the tallest block clears the top of the plate: at
           this camera the visible half-height is about 2.3 */
        var h = 0.45 + rnd() * 2.3;
        var g = new T.BoxGeometry(0.82, h, 0.82);
        var face = new T.Mesh(g, new T.MeshBasicMaterial({
          transparent: true, opacity: .07, depthWrite: false }));
        var edge = new T.LineSegments(new T.EdgesGeometry(g),
          new T.LineBasicMaterial({ transparent: true, opacity: .42 }));
        face.position.set((x - (cols - 1) / 2) * gap, h / 2 - 1.75, (z - (rows - 1) / 2) * gap);
        edge.position.copy(face.position);
        c.group.add(face); c.group.add(edge);
        c.blocks.push({ face: face, edge: edge, h: h, phase: rnd() * 6.28 });
      }
    }
    c.group.rotation.x = -0.34;
    c.scene.add(c.group);
  },
  mode: function(c, tk){
    c.blocks.forEach(function(b, i){

         brand is dark and the whole model disappeared into the plate.

      var col = i % 7 === 0 ? tk.accent : '#ffffff';

      b.edge.material.color.set(col);
      b.face.material.opacity = .06;
      b.edge.material.opacity = i % 7 === 0 ? .80 : .58;
    });
  },
  frame: function(c, t){
    c.group.rotation.y = t * 0.055;
    c.blocks.forEach(function(b){
      /* the smallest possible breath, so the model is alive without
         anything appearing to move */
      var s = 1 + Math.sin(t * 0.5 + b.phase) * 0.012;
      b.face.scale.y = s; b.edge.scale.y = s;
    });
  }
});
<\/script>` : '';

  return docShell(cfg, css, orderSections(cfg, S).join('') + gl);
}

   05 · SPECTRA — product-first commerce
   Product grid, quick-view gallery with thumbnails, variant chips,

   ===================================================================== */
function dsSpectra(cfg) {
  const t = cfg.theme, c = cfg.content, b = cfg.business;
  const brand = t.brand || '#5B3DF5', accent = t.accent || '#C8FF4D';
  const F = FP(t.fontPair), m = MOTION[t.motion] || MOTION.premium;
  const useGL = m.three >= 1 && (!cfg._comp || cfg._comp.scene === 'product-field');
  const nav = navItems(cfg), prods = prodItems(cfg);

  const css = `
:root{--brand:${brand};--accent:${accent}}
html[data-mode=day]{--bg:#FAF8FF;--ink:#130E24;--dim:#6A6386;--hair:#E6DFF6;--chip:#F1ECFC;--panel:#fff;${textTokens(brand,accent,'#FAF8FF','#130E24')}}
html[data-mode=night]{--bg:#0B0814;--ink:#F4F1FF;--dim:#9A92B8;--hair:#241C3A;--chip:#17122A;--panel:#120D22;${textTokens(brand,accent,'#0B0814','#F4F1FF')}}
body{background:var(--bg);color:var(--ink);font:400 16.5px/1.68 ${F.body},system-ui,sans-serif;transition:background .5s,color .5s}
.w{max-width:1320px;margin:0 auto;padding:0 clamp(16px,4vw,30px)}
h1,h2,h3{margin:0;font-family:${F.display},sans-serif;font-weight:800;letter-spacing:-.052em;line-height:.94}

nav{position:sticky;top:10px;z-index:70;margin:10px auto 0;max-width:1320px;padding:0 clamp(16px,4vw,30px)}
/* --navFg is the bar's foreground, declared by whoever declares the
   bar's surface. Spectra paints the bar as a solid ink pill, so its
   foreground is --bg; a nav variant that paints or clears the bar
   redeclares both in compCSS. Before this, these children named --bg
   directly, and the variant that cleared the pill left light text on
   the light page: the brand mark, every nav link and the appearance
   toggle measured 1:1. */
.nb{display:flex;align-items:center;gap:14px;background:var(--ink);color:var(--bg);--navFg:var(--bg);border-radius:999px;padding:8px 8px 8px 22px}
.mk{font-family:${F.display},sans-serif;font-weight:800;font-size:18px;letter-spacing:-.05em;display:flex;align-items:center;gap:9px;white-space:nowrap}
.mk img{height:22px;width:auto;border-radius:5px}
.nl{display:flex;gap:17px;font-size:14.5px;margin-inline-start:auto}
.nl a{color:color-mix(in srgb,var(--navFg,var(--bg)) 72%,transparent);transition:color .2s}.nl a:hover{color:var(--accentText)}
.nr{display:flex;align-items:center;gap:7px;margin-inline-start:auto}
.nr .modebar{border-color:color-mix(in srgb,var(--navFg,var(--bg)) 30%,transparent)}
.nr .modebar button{color:var(--navFg,var(--bg))}
.nr .modebar button[aria-pressed=true]{background:color-mix(in srgb,var(--navFg,var(--bg)) 22%,transparent)}
#installbtn{font-size:12.5px;color:color-mix(in srgb,var(--navFg,var(--bg)) 70%,transparent);padding:7px 9px}
/* ---------------------------------------------------------------------
   TEXT ON A FILLED SURFACE COMES FROM A TOKEN, NEVER A LITERAL

   Spectra was written against one dark-violet palette, and its filled
   chrome carried that palette's text colours as literals: #130E24 on
   accent fills, #fff on brand fills. It now renders against forty-nine
   harvested palettes, and those literals stopped matching: the "Shop
   now" call to action measured 1.93:1 and the bag button 3.65:1 on a
   pale luxury palette — a primary CTA a customer cannot read.

   The --onBrand and --onAccent tokens are computed per palette by
   onFill, which picks whichever of ink, background, black or white
   clears 4.5:1 against that fill. The literals remain only as CSS
   fallbacks for a document rendered without the composition
   stylesheet.

   (No backticks in here: this comment sits inside a template literal,
   where one would close it and break the bundle.)
   --------------------------------------------------------------------- */
.bag{background:var(--accent);color:var(--onAccent,#130E24);border-radius:999px;padding:10px 18px;font-weight:700;font-size:14.5px;white-space:nowrap;
  display:inline-flex;align-items:center;gap:7px;transition:transform .22s cubic-bezier(.16,.84,.3,1)}
.bag:hover{transform:translateY(-2px)}
.bag b{background:#130E24;color:var(--accentText);border-radius:999px;min-width:19px;height:19px;display:grid;place-items:center;font-size:11.5px}
@media(max-width:900px){.nl{display:none}}

.hero{padding:clamp(28px,4vw,56px) 0 0}
.hgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:clamp(22px,4vw,48px);align-items:center}
@media(max-width:900px){.hgrid{grid-template-columns:1fr}}
.hero h1{font-size:clamp(40px,8.4vw,104px);max-width:13ch}
/* The highlight behind the second headline line.
   Two things were wrong and both were visible on a rendered page.
   The ink was the constant #130E24, so on a palette whose accent is
   itself dark the highlighted words were near-black on near-black;
   --onAccent is the ink computed to stay readable on an accent fill.
   And a solid inline background is as tall as the font's own box, so
   with a display line-height below 1 the slab from one line overlapped
   the slab from the next and neither lined up with the letters. Painting
   the band inside the inline box with a gradient keeps it clear of the
   line above and below at any line-height. */
.hero h1 mark{background:linear-gradient(to bottom,transparent 0 10%,var(--accent) 10% 92%,transparent 92%);
  color:var(--onAccent);padding:0 .07em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.hero p{max-width:40ch;color:var(--dim);margin:22px 0 0;font-size:17.5px}
.pill{background:var(--brand);color:var(--onBrand,#fff);padding:15px 30px;border-radius:999px;font-weight:700;font-size:16px;display:inline-flex;align-items:center;gap:9px;
  transition:transform .22s cubic-bezier(.16,.84,.3,1),box-shadow .22s;margin-top:28px}
.pill:hover{transform:translateY(-2px);box-shadow:0 16px 36px -14px var(--brand)}
/* width is load-bearing. The centred-stack hero sets
   justify-items:center on the grid, and a grid item with an
   aspect-ratio and no width resolves to zero — so the whole showcase
   panel, gradient and caption and all, silently disappeared under that
   one composition. max-width keeps it from becoming a billboard when it
   is the only thing in a single centred column. */
.showcase{width:100%;max-width:min(100%,720px);border-radius:26px;overflow:hidden;position:relative;aspect-ratio:4/3;background:linear-gradient(142deg,var(--brand),color-mix(in srgb,var(--accent) 52%,var(--brand)))}
.showcase img{width:100%;height:100%;object-fit:cover}
.showcase canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
/* the CSS orb and a drawn scene in the same panel compete; the drawn
   one wins */
.showcase:has(canvas) .orb{display:none}
.showcase .orb{position:absolute;width:44%;aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.2);top:16%;left:28%;
  box-shadow:inset 0 -26px 56px rgba(0,0,0,.18)}
/* The caption sits over whatever the showcase contains — a photograph,
   a generated composition, or in day mode a pale gradient. Hard-coded
   white was invisible against the last of those: the visual sweep
   measured it at 1.07:1 against its own background. A scrim of its own
   makes it legible over anything without assuming what is behind it. */
.showcase .cap{position:absolute;left:18px;bottom:16px;color:#fff;font-size:12px;font-weight:600;
  letter-spacing:.04em;background:rgba(10,10,14,.58);padding:5px 10px;border-radius:999px;
  backdrop-filter:blur(6px);max-width:calc(100% - 36px)}

.marq{margin-top:clamp(28px,4vw,52px);background:var(--ink);color:var(--bg);padding:13px 0;overflow:hidden;
  font-family:${F.display},sans-serif;font-weight:700;font-size:16px;letter-spacing:-.03em}
.track{display:flex;gap:34px;width:max-content;${m.dur ? 'animation:slide 32s linear infinite' : ''}}
.track span{display:flex;gap:34px;white-space:nowrap;align-items:center}
.track i{color:var(--accentText);font-style:normal}
@keyframes slide{to{transform:translateX(-50%)}}

section{padding:clamp(48px,7vw,98px) 0}
h2{font-size:clamp(28px,5.2vw,60px);max-width:16ch}
.sub2{color:var(--dim);max-width:52ch;margin-top:16px;font-size:17px}
.prose{color:var(--dim);max-width:62ch;margin-top:18px;font-size:17px;white-space:pre-wrap}

/* ---- product grid ---- */
/* ---- shop controls: facets, sort, count, paging ---- */
.shopbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:clamp(22px,3vw,34px);
  padding-bottom:16px;border-bottom:1px solid var(--hair)}
.facets{display:flex;flex-wrap:wrap;gap:7px}
.facet{border:1px solid var(--hair);background:var(--panel);border-radius:999px;padding:8px 15px;font-size:13.5px;
  transition:border-color .22s,background .22s,color .22s}
.facet b{font-weight:700;opacity:.5;margin-inline-start:5px;font-size:12px}
.facet:hover{border-color:var(--brandText)}
.facet[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.sortwrap{display:flex;align-items:center;gap:16px;margin-inline-start:auto;flex-wrap:wrap}

  border-radius:999px;padding:8px 12px}

.noresult button{color:var(--brandText);text-decoration:underline;font-size:inherit}
.morewrap{display:flex;justify-content:center;margin-top:26px}
.more{border:1px solid var(--hair);border-radius:999px;padding:13px 30px;font-size:14px;transition:border-color .22s,transform .22s}
.more:hover{border-color:var(--brandText);transform:translateY(-2px)}
.pgrid{display:grid;gap:clamp(12px,2vw,20px);margin-top:clamp(28px,4vw,44px);grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.pc[hidden]{display:none}
.pc{background:var(--panel);border:1px solid var(--hair);border-radius:20px;overflow:hidden;display:flex;flex-direction:column;

.pc .im{aspect-ratio:1;position:relative;overflow:hidden;background:var(--chip);cursor:zoom-in;border:0;width:100%;display:block;padding:0}
.pc .im img{width:100%;height:100%;object-fit:cover;transition:transform .7s cubic-bezier(.16,.84,.3,1)}

  background:linear-gradient(150deg,var(--chip),color-mix(in srgb,var(--brand) 14%,var(--chip)))}
.pc .badge{position:absolute;top:10px;left:10px;background:var(--accent);color:var(--onAccent,#130E24);font-weight:700;font-size:11px;padding:4px 9px;border-radius:999px}

.pc .cat,.qv .info .cat{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--dim)}

.stk{font-size:13px;margin-top:12px;display:inline-flex;align-items:center;gap:7px}
.stk::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.stk.in{color:#1F9D5B}.stk.out{color:var(--dim)}
.cart .row.na span:last-child{color:var(--dim);font-size:13px}
.pc .bd{padding:13px 14px 15px;display:flex;flex-direction:column;gap:7px;flex:1}
.pc h3{font-size:16.5px;letter-spacing:-.03em}
.pc .price{font-family:${F.display},sans-serif;font-weight:800;font-size:17px;margin-top:auto}

.vars{display:flex;gap:5px;flex-wrap:wrap}

.pc .add{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px;font-weight:700;font-size:13.5px;margin-top:4px;transition:background .2s}
.pc .add:hover{background:var(--brand)}
.pc .add[disabled]{opacity:.45;cursor:not-allowed}

/* ---- quick view ---- */
.qv{position:fixed;inset:0;z-index:95;background:rgba(10,8,20,.6);display:none;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(6px)}
.qv.on{display:flex}
.qvs{background:var(--panel);border-radius:24px;width:min(880px,100%);max-height:88vh;overflow:auto;display:grid;grid-template-columns:1fr 1fr}

.qvs .gal{padding:16px}
.qvs .main{aspect-ratio:1;border-radius:16px;overflow:hidden;background:var(--chip)}

/* ---- cart ---- */
.cart{position:fixed;top:0;right:0;height:100dvh;width:min(410px,100%);background:var(--panel);z-index:96;
  display:flex;flex-direction:column;transform:translateX(104%);transition:transform .35s cubic-bezier(.16,.84,.3,1);border-left:1px solid var(--hair)}

.scrim{position:fixed;inset:0;background:rgba(10,8,20,.5);z-index:94;opacity:0;pointer-events:none;transition:opacity .3s}

.svc{display:grid;gap:12px;margin-top:clamp(28px,4vw,44px);grid-template-columns:repeat(auto-fit,minmax(244px,1fr))}
.sc{background:var(--panel);border:1px solid var(--hair);border-radius:20px;padding:26px 22px;transition:box-shadow .3s,transform .3s}

.sc .n{width:34px;height:34px;border-radius:11px;background:var(--accent);color:var(--onAccent,#130E24);display:grid;place-items:center;
  font-family:${F.display},sans-serif;font-weight:800;font-size:15px;margin-bottom:15px}

.strip{background:var(--brand);color:var(--onBrand,#fff);border-radius:26px;padding:clamp(32px,5vw,62px) clamp(22px,4vw,50px)}
.strip h2{color:#fff}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:26px;margin-top:28px}
.strip b{display:block;font-family:${F.display},sans-serif;font-weight:800;font-size:clamp(30px,4.8vw,54px);letter-spacing:-.06em;line-height:1}
.strip span{color:rgba(255,255,255,.78);font-size:14px}
.quote{text-align:center}
.quote blockquote{font-family:${F.display},sans-serif;font-weight:800;font-size:clamp(24px,4.2vw,48px);letter-spacing:-.055em;line-height:1.08;max-width:20ch;margin:0 auto}
.quote .who{color:var(--dim);margin-top:20px;font-size:14.5px}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4vw,50px);margin-top:clamp(24px,4vw,42px);align-items:start}
@media(max-width:860px){.cgrid{grid-template-columns:1fr}}
form{display:grid;gap:13px;grid-template-columns:1fr 1fr}
form label.full,form button,form .formnote{grid-column:1/-1}
form span{display:block;font-size:12.5px;font-weight:600;color:var(--dim);margin-bottom:6px}
form input,form textarea{width:100%;padding:13px 15px;border-radius:14px;border:1px solid var(--hair);background:var(--panel);color:var(--ink);font:inherit}
form input:focus,form textarea:focus{outline:none;border-color:var(--brandText)}
form button{background:var(--ink);color:var(--bg);padding:14px;border-radius:999px;font-weight:700}
.cdetail div{background:var(--panel);border:1px solid var(--hair);border-radius:17px;padding:16px;margin-bottom:10px}
.cdetail .k{font-size:12px;color:var(--dim);font-weight:600;display:block;margin-bottom:3px}
footer{background:var(--ink);color:color-mix(in srgb,var(--bg) 68%,transparent);padding:56px 0 34px;font-size:15px;margin-top:clamp(36px,6vw,74px)}
.fg{display:grid;grid-template-columns:1.7fr 1fr 1fr;gap:28px}
footer h4{color:var(--bg);font:700 11.5px/1 ${F.body},sans-serif;letter-spacing:.2em;text-transform:uppercase;margin:0 0 13px}
footer a{display:block;padding:4px 0}footer a:hover{color:var(--accentText)}
.fbot{margin-top:40px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:12.5px}
@media(max-width:700px){.fg{grid-template-columns:1fr}}
`;

  const bits = [b.sector, b.city, b.ctaLabel].filter(Boolean);
  const mq = (bits.length ? bits : ['Add details in the editor']).map(x => '<span>' + E(x) + '<i>\u2726</i></span>').join('');

  /* categories come from what the client typed; "Everything" is the only
     label this design adds, and only when there is more than one category */
  const catOf = (p) => String(p.cat || '').trim();
  const cats = [];
  prods.forEach(p => { const k = catOf(p); if (k && cats.indexOf(k) < 0) cats.push(k); });
  const uncategorised = prods.some(p => !catOf(p));
  const FIRST_PAGE = 24;          /* a large catalogue is paged, not dumped */

  const card = (p, i) => {
    const imgs = (p.images || []).filter(Boolean);
    const vars = (p.variants || '').split(',').map(s => s.trim()).filter(Boolean);
    const oos = String(p.stock) === '0';
    const low = !oos && p.stock !== '' && p.stock != null && Number(p.stock) > 0 && Number(p.stock) <= 3;
    return '<article class="pc' + (i >= FIRST_PAGE ? ' paged' : '') + '" data-rv' +
      ' style="transition-delay:' + (Math.min(i, 12) * m.stagger) + 'ms" data-id="' + i + '"' +
      ' data-cat="' + E(catOf(p)) + '" data-price="' + (Number(p.price) || 0) + '"' +
      ' data-name="' + E(String(p.name || '').toLowerCase()) + '"' +
      ' data-stock="' + (oos ? '0' : '1') + '" data-sale="' + (p.was ? '1' : '0') + '">' +
      '<button class="im" onclick="QV(' + i + ')" aria-label="View ' + E(p.name) + '">' +
      (imgs.length ? '<img src="' + imgs[0] + '" alt="' + E(p.name) + '" loading="lazy" style="' + focal(p.focal) + '">'
        : '<span class="none">No photograph yet<br>Upload one in the editor</span>') +
      (oos ? '<span class="badge out">Out of stock</span>' : p.was ? '<span class="badge">Sale</span>' : '') + '</button>' +
      '<div class="bd">' +
      (catOf(p) ? '<div class="cat">' + E(catOf(p)) + '</div>' : '') +
      '<h3>' + E(p.name) + '</h3>' +
      (vars.length ? '<div class="vars">' + vars.map((v, j) =>
        '<button aria-pressed="' + (j === 0) + '" onclick="PV(' + i + ',this)">' + E(v) + '</button>').join('') + '</div>' : '') +
      '<div class="price">' + money(cfg, p.price) + (p.was ? '<del>' + money(cfg, p.was) + '</del>' : '') + '</div>' +
      (low ? '<div class="low">Only ' + Number(p.stock) + ' left</div>' : '') +
      (oos ? '<button class="add" disabled>Out of stock</button>'
           : '<button class="add" onclick="ADD(' + i + ')">Add to bag</button>') +
      '</div></article>';
  };

  /* the facet and sort bar. Rendered only when there is something to filter. */
  const controls = !prods.length ? '' :
    '<div class="shopbar">' +
    ((cats.length > 1 || (cats.length === 1 && uncategorised))
      ? '<div class="facets" role="group" aria-label="Filter by category">' +

  const gl = useGL ? GL_RUNTIME + `
<script>
__icoreScene({
  z: 8.4, fov: 44, brand: '${brand}', accent: '${accent}',
  build: function(c){
    var T = c.THREE;
    c.items = [];
    var N = c.small ? 7 : 12, seed = 19;
    function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    for (var i = 0; i < N; i++) {
      var sz = .5 + rnd() * .72;
      var g = rnd() > .45
        ? new T.BoxGeometry(sz, sz, sz)
        : new T.CylinderGeometry(sz * .46, sz * .46, sz * 1.05, 18);
      var mesh = new T.Mesh(g, new T.MeshBasicMaterial({
        transparent: true, opacity: .16, depthWrite: false }));
      var edge = new T.LineSegments(new T.EdgesGeometry(g),
        new T.LineBasicMaterial({ transparent: true, opacity: .5 }));
      mesh.add(edge);
      mesh.position.set((rnd() - .5) * 7.4, (rnd() - .5) * 5.2, (rnd() - .5) * 4.2);
      mesh.rotation.set(rnd() * 3, rnd() * 3, rnd() * 3);
      c.scene.add(mesh);
      c.items.push({ mesh: mesh, edge: edge,
        spin: new T.Vector3((rnd() - .5) * .34, (rnd() - .5) * .34, (rnd() - .5) * .2),
        bob: .1 + rnd() * .16, phase: rnd() * 6.28 });
    }
  },
  mode: function(c, tk){
    c.items.forEach(function(it){
      /* Always white, in both modes.
         The panel behind this is a brand-to-accent gradient whatever the
         appearance mode is, so tinting the objects with the brand put
         brand on brand and they all but vanished — which is exactly how
         the first render looked. Only the strength changes with mode. */
      it.mesh.material.color.set('#ffffff');
      it.edge.material.color.set('#ffffff');
      it.mesh.material.opacity = tk.day ? .20 : .16;
      it.edge.material.opacity = tk.day ? .72 : .58;
    });
  },
  frame: function(c, t){
    c.items.forEach(function(it){
      it.mesh.rotation.x += it.spin.x * .01;
      it.mesh.rotation.y += it.spin.y * .01;
      it.mesh.position.y += Math.sin(t * .5 + it.phase) * .0022;
    });
    c.camera.position.x = Math.sin(t * .11) * .5;
    c.camera.position.y = Math.cos(t * .09) * .3;
    c.camera.lookAt(0, 0, 0);
  }
});
<\/script>` : '';

   GENERATIVE DESIGN LAYER

   The previous build shipped five render functions and called them "the
   five designs". That was the wrong product. Five is a batch size, not an
   inventory.

   What is here instead:

     intake  ->  deriveDNA()      a structured, explainable Design DNA
     DNA     ->  BANKS            extensible registries, no fixed count
     BANKS   ->  compose()        seeded, constraint-based combination
     set     ->  uniqueness()     pairwise structural distance, enforced

   A proposal is a COMPOSITION, not a template: an engine (the craft — its
   hero scene, its ornament vocabulary) combined with a palette, a type
   system, a navigation architecture, a hero grammar, a section order, a
   motion language, a density and an ornament set. The engines are skins
   over a composition, which is why two proposals built on the same engine
   can be structurally different websites.

   The space is the product of the banks, so adding one palette adds a
   proposal to every engine. Nothing in here counts to five except the
   default batch size, which is an argument.
   ===================================================================== */

/* ---------- deterministic randomness -------------------------------
   Seeded, so a seed reproduces a batch exactly — a client can be sent
   back the same five proposals tomorrow, and a test can assert them. */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hashSeed(s) {
  let h = 2166136261;
  for (let i = 0; i < String(s).length; i++) { h ^= String(s).charCodeAt(i); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
const newSeed = () => Math.floor(Math.random() * 0xFFFFFFFF).toString(36).toUpperCase();

/* ---------- the intake ---------------------------------------------
   What the questionnaire asks beyond the facts. Every field is a choice
   the client makes about their own business; none of it is inferred from
   a model's opinion of their industry. */
const INTAKE = {
  positioning: ['Established and institutional', 'Specialist and technical',
                'Premium and considered', 'Challenger and direct'],
  audience:    ['Government and public bodies', 'Large corporates', 'Founders and small business', 'Consumers'],
  tone:        ['Formal', 'Plain and direct', 'Warm', 'Confident'],
  objective:   ['Win enquiries', 'Establish credibility', 'Sell products', 'Attract talent'],
  imagery:     ['Strong photography', 'A little photography', 'No photography yet'],
  appetite:    ['Still and quiet', 'Measured movement', 'Immersive and cinematic']
};
function blankIntake() {
  return { positioning: '', audience: '', tone: '', objective: '', imagery: '', appetite: '' };
}

/* ---------- Design DNA ----------------------------------------------
   Derived, not guessed. Every axis says which answers moved it, so a
   client can be told why their proposals look the way they do. */
function deriveDNA(cfg) {
  const i = cfg.intake || blankIntake(), b = cfg.business || {}, c = cfg.content || {};
  const why = {};
  const ax = (name, v, reason) => { why[name] = reason; return Math.max(0, Math.min(1, v)); };

  const nServices = (c.services && c.services.items || []).filter(x => x.title).length;
  const nProducts = (c.products && c.products.items || []).filter(x => x.name).length;
  const nWork = (c.work && c.work.items || []).filter(x => x.title).length;
  const nStats = (c.stats && c.stats.items || []).filter(x => x.v).length;
  const words = String((c.about && c.about.body) || '').split(/\s+/).filter(Boolean).length;
  const hasPhoto = !!(cfg.media && (cfg.media.hero || (c.work.items || []).some(x => x.img)));

  const authority = ax('authority',
    (i.positioning === 'Established and institutional' ? .85 : i.positioning === 'Premium and considered' ? .6 :
     i.positioning === 'Specialist and technical' ? .55 : .3) +
    (i.audience === 'Government and public bodies' ? .15 : i.audience === 'Large corporates' ? .08 : -.05) +
    (i.tone === 'Formal' ? .08 : 0),
    'positioning and audience');

  const expressive = ax('expressive',
    (i.positioning === 'Challenger and direct' ? .8 : i.positioning === 'Premium and considered' ? .45 : .3) +
    (i.audience === 'Consumers' ? .2 : i.audience === 'Founders and small business' ? .1 : -.08) +
    (i.tone === 'Confident' ? .12 : i.tone === 'Warm' ? .06 : -.05),
    'positioning, audience and tone');

  const techDepth = ax('techDepth',
    (i.appetite === 'Immersive and cinematic' ? .9 : i.appetite === 'Measured movement' ? .5 : .12) +
    (i.positioning === 'Specialist and technical' ? .12 : 0),
    'motion appetite');

  const imageLed = ax('imageLed',
    (i.imagery === 'Strong photography' ? .85 : i.imagery === 'A little photography' ? .45 : .1) +
    (hasPhoto ? .1 : -.1),
    'photography answer and what was actually uploaded');

  const commerce = ax('commerce',
    (i.objective === 'Sell products' ? .85 : 0) + Math.min(.4, nProducts * .12) +
    (b.sector === 'Retail or e-commerce' ? .25 : 0),
    'objective, sector and the number of products entered');

  const editorial = ax('editorial',
    Math.min(.7, words / 160) + (i.tone === 'Warm' ? .12 : 0) + (nWork >= 2 ? .12 : 0),
    'length of the about text and the number of projects');

  const density = ax('density',
    Math.min(.85, (nServices + nProducts + nWork + nStats) / 16) + (i.audience === 'Consumers' ? .12 : 0),
    'how much content there is to lay out');

  const evidence = ax('evidence', Math.min(1, nStats / 4) + (nWork ? .2 : 0),
    'figures and projects available to show');

  return {
    authority, expressive, techDepth, imageLed, commerce, editorial, density, evidence,
    why,
    counts: { services: nServices, products: nProducts, work: nWork, stats: nStats, aboutWords: words, hasPhoto },
    /* the voice label is a readout of the axes, not an extra judgement */
    label: authority > .65 ? 'Institutional' : expressive > .6 ? 'Expressive'
         : editorial > .5 ? 'Editorial' : techDepth > .6 ? 'Technical' : 'Considered'
  };
}

function combinationCount() {
  return AXES.reduce((n, a) => n * Math.max(1, BANKS[a].items().length), 1) * variantSpace();

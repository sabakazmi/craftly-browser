    var px=document.querySelectorAll('[data-px]');
    if(px.length) window.addEventListener('pointermove',function(ev){
      var cx=(ev.clientX/innerWidth-.5), cy=(ev.clientY/innerHeight-.5);
      px.forEach(function(n){ var d=parseFloat(n.dataset.px)||8;
        n.style.transform='translate3d('+(cx*d).toFixed(2)+'px,'+(cy*d).toFixed(2)+'px,0)'; });
    },{passive:true});
  }

  /* ---- background video slots ----
     Nothing here promises playback. The clip is removed outright for a
     motion-sensitive visitor, on a small screen when the slot is not marked
     mobile-safe, and when the browser refuses to autoplay — in each case the
     poster image is what the visitor sees, which is why a poster matters. */
  document.querySelectorAll('.vwrap[data-vslot]').forEach(function(wrap){
    var v = wrap.querySelector('video'); if(!v) return;
    var narrow = innerWidth < 760 && wrap.dataset.mobile !== '1';
    if(RM || narrow){ v.remove(); return; }
    var start = parseFloat(wrap.dataset.start) || 0;
    if(start > 0) v.addEventListener('loadedmetadata', function(){
      try{ v.currentTime = Math.min(start, (v.duration || start) - 0.1); }catch(e){}
    });
    v.addEventListener('playing', function(){ wrap.classList.add('playing'); });
    v.addEventListener('error', function(){ v.remove(); wrap.classList.remove('playing'); });
    if(v.dataset.autoplay === '0') return;
    /* pause when it scrolls away: a background loop nobody can see is
       battery and bandwidth spent on nothing */
    var vio = new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){ var p = v.play(); if(p && p.catch) p.catch(function(){ v.remove(); }); }
        else { try{ v.pause(); }catch(err){} }
      });
    },{threshold:.12});
    vio.observe(wrap);
  });

  /* contact form: validates, never fakes a send */
  /* The contact form.

     It posts only when the page was published with an endpoint and the
     ids to go with it. A preview, or a published page from a build with
     no endpoint, has nowhere to post and says so rather than appearing
     to send. The reply repeats what actually happened: the enquiry is
     stored for the studio, and it is NOT emailed, because no email
     service is connected. */
  var f=document.getElementById('cform');
  var POST=${JSON.stringify(cfg._enquiry || null)};
  if(f) f.addEventListener('submit',function(ev){
    ev.preventDefault(); var o=document.getElementById('cform-out');
    if(!f.checkValidity()){ o.textContent='Please complete the required fields.'; return; }
    if(!POST){
      o.textContent=${JSON.stringify(
        'This form is not connected, so nothing was sent. ' + (cfg.business.email
          ? 'Write to ' + String(cfg.business.email) + ' instead.'
          : 'No form handler is configured for this page.'))};
      return;
    }
    var btn=f.querySelector('button[type=submit]');
    if(btn){ btn.disabled=true; }
    o.textContent='Sending…';
    var d=new FormData(f);
    fetch(POST.url,{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({projectId:POST.projectId,agencyId:POST.agencyId,
        name:d.get('name'),email:d.get('email'),message:d.get('msg')})})
      .then(function(r){ return r.json().then(function(j){ return {ok:r.ok,j:j}; }); })
      .then(function(res){
        if(res.ok && res.j && res.j.ok){
          o.textContent = res.j.message || 'Your message has been saved.';
          f.reset();
        } else {
          o.textContent = (res.j && res.j.error) ? res.j.error : 'This message could not be sent.';
          if(btn){ btn.disabled=false; }
        }
      })
      .catch(function(){
        o.textContent='This message could not be sent. Please check your connection.';
        if(btn){ btn.disabled=false; }
      });
  });

  /* install: only offered when the browser actually supports it */
  var ib=document.getElementById('installbtn'), deferred=null;
  if(ib){
    window.addEventListener('beforeinstallprompt',function(e){ e.preventDefault(); deferred=e;
      ib.hidden=false; ib.disabled=false; ib.textContent='Install app'; });
    ib.addEventListener('click',async function(){
      if(!deferred){ ib.textContent='Install unavailable here'; return; }
      deferred.prompt(); await deferred.userChoice; deferred=null; ib.hidden=true;
    });
  }
})();
<\/script>`;

/* Tag every link that points at one of this site's pages, in one pass,
   rather than threading an extra attribute through five engines' nav
   and footer markup. The preview reads `data-page` to switch pages
   inside the sandbox; a published site just follows the href. */
function linkPages(cfg, html) {
  const by = {};
  (cfg.pages || []).forEach(p => { by[pageHref(p)] = p.id; });
  return html.replace(/<a href="([^"]+)"/g, (m, href) =>
    by[href] ? '<a href="' + href + '" data-page="' + by[href] + '"' : m);
}

/* Every page but Home opens with a page header instead of the hero.
   This is shared chrome, not engine code: it uses the tokens each
   engine has already defined, so it takes on that engine's type,
   colour and rhythm rather than looking bolted on. */
function pageHead(cfg) {
  const p = cfg.page;
  if (!p || isHome(p)) return '';
  const sub = (p.description || '').trim();
  return '<header class="pagehead"><div class="w">' +
    '<p class="phx">' + E(cfg.business.name || '') + '</p>' +
    '<h1>' + E(p.title || p.name) + '</h1>' +
    (sub ? '<p class="phs">' + E(sub) + '</p>' : '') +
    '</div></header>';
}
/* This block asked for --mute and --line, which this application has
   never emitted: the tokens are --dim and --hair. Every internal page
   header therefore fell back to a hardcoded #667 grey and a black 10%
   rule, ignoring the palette completely — fine on a pale design, and
   measured at 3.6:1 on the dark ones, on the eyebrow and standfirst of
   every About, Services and Contact page. The real token names, with
   the old literals left as fallbacks. */
const PAGEHEAD_CSS = `
header.hero{display:none !important}
.pagehead{padding:calc(var(--gap,80px) * .9) 0 calc(var(--gap,80px) * .55);border-bottom:1px solid var(--hair,rgba(0,0,0,.1))}
.pagehead .phx{margin:0 0 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim,#667)}
.pagehead h1{margin:0;font-size:clamp(34px,5.2vw,62px);line-height:1.04;letter-spacing:-.025em;color:var(--ink,#111)}
.pagehead .phs{margin:16px 0 0;max-width:56ch;color:var(--dim,#667);font-size:clamp(15px,1.6vw,18px);line-height:1.6}
`;

function docShell(cfg, css, body, head) {
  const p = cfg.page;
  const onHome = !p || isHome(p);
  const siteName = cfg.business.name || 'Untitled site';
  const title = onHome
    ? (p && p.title ? p.title : siteName)
    : ((p.title || p.name) + ' — ' + siteName);
  const desc = (p && p.description) || cfg.business.tagline || '';

  /* The page header is seated immediately after the navigation, which
     every engine closes with </nav>. If one ever stops doing that, the
     header goes to the top of the body rather than vanishing. */
  if (!onHome) {
    const ph = pageHead(cfg);
    body = /<\/nav>/.test(body) ? body.replace('</nav>', '</nav>' + ph) : ph + body;
    css = css + PAGEHEAD_CSS;
  }
  /* A parent page's links to its children, placed before the footer so
     it closes the page rather than interrupting it. */
  const kids = childLinks(cfg);
  if (kids) body = /<footer/.test(body) ? body.replace('<footer', kids + '<footer') : body + kids;
  body = withDelivery(cfg, body);
  body = linkPages(cfg, body);
  css = css + DELIVERY_CSS + CART_CSS + EXTRA_CSS;

  /* The appearance the document is BORN in.
     This used to be hard-coded to "day", with the runtime script
     flipping it afterwards. Three things were wrong with that. A site
     whose direction is conceived dark — a cinematic studio, quiet
     luxury, immersive dimension — painted white and then snapped to
     black, which is the flash of wrong theme every client notices and
     no client can describe. A published page with JavaScript blocked
     stayed in the wrong appearance permanently. And a screenshot or a
     print taken before the script ran captured the wrong site.
     'auto' is left to the script, because only the browser knows what
     the visitor's system prefers; a fixed choice is emitted here. */
  const bornMode = (cfg.theme && cfg.theme.mode === 'night') ? 'night' : 'day';
  return '<!DOCTYPE html><html lang="en" data-mode="' + bornMode + '"><head><meta charset="utf-8">' +
    '<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">' +
    '<title>' + E(title) + '</title>' +
    '<meta name="description" content="' + E(desc) + '">' +
    '<meta property="og:title" content="' + E(title) + '">' +
    '<meta property="og:description" content="' + E(desc) + '">' +
    '<meta property="og:type" content="website">' +
    '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
    '<link href="' + FONTS_URL(cfg.theme.fontPair) + '" rel="stylesheet">' +
    (head || '') + (cfg._seoHead || '') +
    '<style>' + baseCSS(cfg) + css + compCSS(cfg) + '</style></head><body>' +
    withCart(cfg, body + RUNTIME(cfg) + previewBridge()) + '</body></html>';
}

/* ---------------------------------------------------------------------
   The composition layer.

   An engine supplies the craft — its hero scene, its ornament vocabulary,
   its section treatments. The composition supplies the architecture:
   palette, type system, navigation, hero grammar, density, ornament and
   motion. This stylesheet is emitted AFTER the engine's own, so it wins.

   Everything here uses structural selectors that hold across all five
   engines, which is what lets a new engine inherit every variant without
   writing a line of variant CSS, and lets one engine produce structurally
   different websites rather than recolours.
   --------------------------------------------------------------------- */

/* =====================================================================
   WebGL scaffolding, shared by every engine that draws a scene.

   Three things were duplicated in each engine and are now in one place:

   1. LOADING three.js. The library was pulled from a public CDN, which
      is free but is also a third party between a client's website and
      its own motion: on a network that blocks it the scene silently
      never appears. It is served from this application first, at
      /vendor/three.min.js, and the CDN is only a fallback. Loading is
      asynchronous, so a scene registers a callback rather than assuming
      THREE is already defined.

   2. THE GUARDS. Reduced motion, a small weak device, a browser with no
      WebGL at all. Each is a reason not to paint, and each was written
      out again in every engine.

   3. MODE. A scene that ignores the day/night switch reads as a
      rendering fault — which is exactly how these looked the first time
      they were rendered in day mode. Colours come from the page's own
      --brandText and --accentText, so any palette the generator picks is
      honoured without the scene knowing which one it got.

   A scene supplies build(ctx), frame(ctx, seconds) and optionally
   mode(ctx, tokens). It never touches the renderer, the camera, resize
   or the frame loop.
   ===================================================================== */
/* Empty in the ordinary build, where the library is fetched.
   A single-file export replaces this one line with the library's own
   source, so every generated document carries its own copy and needs no
   network at all — which matters because the previews are sandboxed
   iframes: they have an opaque origin and cannot reach anything the
   parent page loaded. */
const THREE_INLINE = '';

const GL_RUNTIME =
  (THREE_INLINE ? '<scr' + 'ipt>' + THREE_INLINE + '<\/scr' + 'ipt>' : '') + `
<script>
(function(){
  /* Relative FIRST, then rooted, then the CDN. "/vendor/three.min.js"
     means the filesystem root when the page is opened as a file, which
     the browser refuses outright — so the local copy was never found
     from app/, and every scene silently fell through to a network
     request that an offline machine cannot serve either. The relative
     path finds the copy that ships beside the page; the rooted one
     still works when the studio serves it from a sub-path. */
  var SRC = ['vendor/three.min.js',
             '/vendor/three.min.js',
             'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js'];
  var waiting = [], started = false;
  window.__icoreThree = function(cb){
    if (window.THREE) { cb(); return; }
    waiting.push(cb);
    if (started) return;
    started = true; next(0);
  };
  function next(i){
    if (i >= SRC.length) return;              /* no library: no scene, no error */
    var s = document.createElement('script');
    s.src = SRC[i]; s.async = false;
    s.onload = function(){
      if (!window.THREE) return next(i + 1);
      var w = waiting; waiting = [];
      w.forEach(function(f){ try { f(); } catch(e) {} });
    };
    s.onerror = function(){ next(i + 1); };
    document.head.appendChild(s);
  }

  window.__icoreScene = function(o){
    __icoreThree(function(){
      var cv = document.getElementById(o.canvas || 'gl');
      if (!cv) return;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      var small = innerWidth < 760, weak = (navigator.hardwareConcurrency || 4) <= 4;
      if (small && weak) return;              /* honest mobile fallback */
      var r;
      try { r = new THREE.WebGLRenderer({ canvas: cv, alpha: true,
              antialias: !small, powerPreference: 'low-power' }); }
      catch(e) { return; }
      r.setPixelRatio(Math.min(devicePixelRatio, small ? 1.5 : 2));

      var sc = new THREE.Scene();
      var cam = new THREE.PerspectiveCamera(o.fov || 46, 1, .1, 200);
      cam.position.z = o.z || 7.2;

      function tokens(){
        var cs = getComputedStyle(document.documentElement);
        return {
          day: (document.documentElement.getAttribute('data-mode') || 'night') === 'day',
          brand: (cs.getPropertyValue('--brandText') || '').trim() || o.brand,
          accent: (cs.getPropertyValue('--accentText') || '').trim() || o.accent
        };
      }
      var ctx = { THREE: THREE, renderer: r, scene: sc, camera: cam,
                  canvas: cv, small: small, tokens: tokens };

      try { o.build(ctx); } catch(e) { return; }

      function size(){
        var w = cv.clientWidth || cv.offsetWidth || 1;
        var h = cv.clientHeight || cv.offsetHeight || 1;
        r.setSize(w, h, false);
        cam.aspect = w / h; cam.updateProjectionMatrix();
      }
      size();
      addEventListener('resize', size, { passive: true });

      if (o.mode) {
        var apply = function(){ try { o.mode(ctx, tokens()); } catch(e) {} };
        apply();
        new MutationObserver(apply).observe(document.documentElement,
          { attributes: true, attributeFilter: ['data-mode'] });
      }

      var run = false, t0 = performance.now();
      function tick(){
        if (!run) return;
        requestAnimationFrame(tick);
        try { o.frame(ctx, (performance.now() - t0) / 1000); } catch(e) { run = false; return; }
        r.render(sc, cam);
      }
      /* stop painting when the hero is off screen */
      new IntersectionObserver(function(es){
        run = es[0].isIntersecting; if (run) tick();
      }, { threshold: .01 }).observe(cv);
    });
  };
})();
<\/script>`;

const NAV_BAR = 'nav, nav > .nb, nav > .w > .nb';
const HERO_GRID = '.hero .inner, .hero .hg, .hero .hgrid';

function compCSS(cfg) {
  const comp = cfg._comp;
  if (!comp) return '';
  const pal = bankItem('palette', comp.palette);
  const ty = bankItem('typeset', comp.typeset);
  const den = bankItem('density', comp.density);
  const mo = bankItem('motion', comp.motion);
  const tch = cfg.theme._touched || {};
  const brand = tch.brand ? cfg.theme.brand : (pal ? pal.brand : cfg.theme.brand);
  const accent = tch.accent ? cfg.theme.accent : (pal ? pal.accent : cfg.theme.accent);
  let out = '\n/* ---- composition: ' + comp.id + ' ---- */\n';

  /* 1 · surfaces. The whole token set is re-derived from the palette so a
     hairline never belongs to one palette and a background to another. */
  if (pal) {
    const set = (mode, bg, ink) =>
      'html[data-mode=' + mode + ']{' +
      '--bg:' + bg + ';--paper:' + bg + ';--ink:' + ink + ';' +
      /* Validated against --chip, not --bg. Muted text frequently sits
         on a card or chip, which is already 7% ink — so a blend that
         just clears 4.5:1 on the page background lands at about 4.37:1
         on a card, which is where the benchmark kept finding it. The
         worst surface muted text actually lands on is the one worth
         validating against. */
      '--dim:color-mix(in srgb,' + ink + ' ' +
        dimMix(ink, mixSrgb(ink, bg, 18), 58, 4.7) + '%,' + bg + ');' +
      '--hair:color-mix(in srgb,' + ink + ' 14%,' + bg + ');' +
      '--chip:color-mix(in srgb,' + ink + ' 7%,' + bg + ');' +
      '--panel:color-mix(in srgb,' + ink + ' 3%,' + bg + ');' +
      textTokens(brand, accent, bg, ink) + '}\n';
    out += set('day', pal.dayBg, pal.dayInk) + set('night', pal.nightBg, pal.nightInk);
  }

  /* 2 · type system */
  if (ty) {
    out += 'h1,.hero h1{font-size:' + ty.h1 + ';font-weight:' + ty.h1w +
      ';letter-spacing:' + ty.track + ';text-transform:' + ty.case + '}\n' +
      'h2{font-size:' + ty.h2 + ';letter-spacing:' + (ty.case === 'uppercase' ? '.01em' : ty.track) + '}\n' +
      'body{font-size:' + ty.body + '}\n' +
      '.hero p,.lede,.sub,.sub2,.prose,.std{max-width:' + ty.measure + '}\n' +
      NAV_BAR.split(',').map(s => s.trim() + ' a').join(',') +
      '{text-transform:' + ty.navCase + ';letter-spacing:' + ty.navTrack + '}\n';
  }

  /* 3 · density and measure */
  if (den) {
    out += 'section{padding-block:calc(clamp(56px,7.5vw,108px) * ' + den.pad + ')}\n' +
      '.grid,.pgrid,.svc,.metrics{gap:calc(clamp(12px,2vw,20px) * ' + den.gap + ')}\n' +
      '.grid,.pgrid{grid-template-columns:repeat(auto-fit,minmax(' + den.col + 'px,1fr))}\n' +
      '.w{max-width:' + den.width + 'px}\n' +
      '.card,.pc,.sc,.glass,.vwrap{border-radius:' + den.radius + 'px}\n';
  }

  /* 4 · navigation architecture */
  /* This guard exists because a nav variant can replace the bar's
     surface, and an engine that assumed a dark fill then rendered white
     text on a white bar. It was too blunt in two ways, and both showed
     up as unreadable controls in the benchmark:

     1. It reset EVERY anchor in the bar to `inherit`, including the
        call to action, which paints its own brand-coloured background
        and states its own text colour. The reset selector
        (`nav > .w > .nb > span > a`) carries two classes and three
        elements, so it outranked the engine's `.nbtn` — and even
        `a.nbtn` — and forced the text back to the page ink. A
        brand-filled button with page-ink text measured 1.06:1. So the
        reset now skips anything that paints its own surface.

     2. It set the colour on `.nb` as well as `nav`. Spectra paints
        `.nb` as a solid ink pill and states `color:var(--bg)` for it;
        the guard outranked that too. The colour now goes on `nav`
        only, where it still inherits down to everything that has not
        painted itself, and an engine that paints the bar keeps its own
        pairing.

     The exclusion list is the control classes the engines use. A new
     filled control class belongs here. */
  const SELF_PAINTING = ':not(.nbtn):not(.cta):not(.pill):not(.bag)' +
    ':not(.hcta):not(.btn):not(.p)';
  out += 'nav{color:var(--ink)}\n' +
    NAV_BAR.split(',').map(s => {
      const t = s.trim();
      return t + ' > .mk, ' + t + ' > a' + SELF_PAINTING +
             ', ' + t + ' > span > a' + SELF_PAINTING;
    }).join(',') +
    '{color:inherit}\n';

  const navRule = {
    'center-pill':
      NAV_BAR + '{max-width:min(1060px,92vw);margin-inline:auto;border-radius:999px;' +
      'color:var(--ink);--navFg:var(--ink);background:color-mix(in srgb,var(--bg) 82%,transparent);backdrop-filter:blur(14px);' +
      'border:1px solid var(--hair);padding-inline:18px}\n',
    'split-rail':
      NAV_BAR + '{justify-content:space-between;border-bottom:1px solid var(--hair);' +
      'border-radius:0;color:var(--ink);--navFg:var(--ink);background:none;padding-inline:clamp(16px,4vw,46px)}\n' +
      NAV_BAR.split(',').map(s => s.trim() + ' > :last-child').join(',') +
      '{border-inline-start:1px solid var(--hair);padding-inline-start:clamp(14px,2.4vw,26px)}\n',
    /* Stacks the bar into three rows, so it is roughly twice the height
       of a single-row bar. Engines must not assume a bar height: see the
       note on Plinth's nav, where a constant could not track it. */
    'stacked-caps':
      NAV_BAR + '{flex-direction:column;gap:12px;padding-block:18px;border-radius:0;' +
      'color:var(--ink);--navFg:var(--ink);background:none;border-bottom:1px solid var(--hair);justify-content:center}\n' +
      '@media(max-width:760px){' + NAV_BAR + '{gap:8px}}\n',
    'minimal-rule':
      NAV_BAR + '{border-radius:0;color:var(--ink);--navFg:var(--ink);background:none;border:0;border-bottom:1px solid var(--hair);' +
      'padding-inline:clamp(14px,3vw,34px)}\n' +
      NAV_BAR.split(',').map(s => s.trim() + ' a').join(',') +
      '{font-size:12.5px;opacity:.78}\n',
    'wide-spread':
      NAV_BAR + '{justify-content:space-between;gap:clamp(10px,5vw,70px);border-radius:0;' +
      'color:var(--ink);--navFg:var(--ink);background:none;padding-inline:clamp(14px,5vw,74px)}\n',
    'float-island':
      NAV_BAR + '{max-width:min(920px,88vw);margin:14px auto 0;border-radius:16px;' +
      'color:var(--ink);--navFg:var(--ink);background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(18px);' +
      'border:1px solid var(--hair);box-shadow:0 18px 44px -28px rgba(0,0,0,.55);padding-inline:16px}\n' +
      'nav{color:var(--ink);--navFg:var(--ink);background:none;border:0}\n'
  }[comp.nav];
  if (navRule) out += navRule;

  /* Phone guard for every navigation architecture.
     The six architectures are designed at desktop width, where a
     wordmark, links, a mode toggle and a call to action fit on one
     line. At 390px they do not, and the floating island was photographed
     with "Marwat and Co." broken across three lines beside a button that
     had wrapped to three of its own. Written once here rather than six
     times in the architectures, so a seventh inherits it. */
  out += '@media(max-width:560px){' +
    NAV_BAR + '{flex-wrap:wrap;row-gap:8px;padding-block:10px}\n' +
    NAV_BAR.split(',').map(s => s.trim() + ' .mk, ' + s.trim() + ' .brand').join(',') +
    '{white-space:nowrap;font-size:clamp(13px,3.6vw,16px);letter-spacing:-.02em}\n' +
    /* Every engine's own call-to-action class, not just the three this
       guard started with: Spectra names its button `.bag`, which the
       first version missed, and the visual sweep measured the nav four
       pixels past a 390px viewport on every page of that engine. */
    NAV_BAR.split(',').map(s => s.trim() +
      ' .btn, ' + s.trim() + ' .cta, ' + s.trim() + ' .pill, ' + s.trim() + ' .bag').join(',') +
    '{white-space:nowrap;font-size:11.5px;padding-inline:12px}\n' +
    /* the right-hand cluster may wrap instead of forcing the bar wider */
    NAV_BAR.split(',').map(s => s.trim() + ' .nr, ' + s.trim() + ' > span').join(',') +
    '{flex-wrap:wrap;row-gap:6px;min-width:0}\n' +
    '}\n';

  /* 5 · hero grammar */
  const heroRule = {
    'copy-left-scene-right': HERO_GRID + '{grid-template-columns:1.05fr .95fr;align-items:center}\n',
    'centred-stack':
      HERO_GRID + '{grid-template-columns:1fr;justify-items:center;text-align:center}\n' +
      '.hero h1,.hero p,.hero .lede{margin-inline:auto}\n' +
      '.hacts,.hero .acts,.hero .hacts{justify-content:center}\n',
    /* The media child is found by what it contains rather than by its
       position, because the engines do not agree on which side it sits.
       It is also capped: a full-width plate in a single column grew to
       three quarters of the viewport on the first render. */
    'plate-over':
      HERO_GRID + '{grid-template-columns:1fr;gap:clamp(24px,3.4vw,46px)}\n' +
      HERO_GRID.split(',').map(s => s.trim() + ' > *:has(img,video,canvas,.vwrap,.deck,.showcase,.plate)').join(',') +
      '{order:1;max-height:min(46vh,460px);overflow:hidden}\n' +
      HERO_GRID.split(',').map(s => s.trim() + ' > *:not(:has(img,video,canvas,.vwrap,.deck,.showcase,.plate))').join(',') +
      '{order:2}\n' +
      HERO_GRID.split(',').map(s => s.trim() + ' img, ' + s.trim() + ' video').join(',') +
      '{max-height:min(46vh,460px);object-fit:cover}\n',
    'editorial-measure':
      HERO_GRID + '{grid-template-columns:minmax(0,1fr) minmax(0,.58fr);align-items:end;' +
      'gap:clamp(30px,5vw,80px)}\n' +
      '.hero{padding-block-start:clamp(80px,12vw,190px)}\n',
    'offset-asym':
      HERO_GRID + '{grid-template-columns:.72fr 1.28fr;align-items:center}\n' +
      HERO_GRID.split(',').map(s => s.trim() + ' > :first-child').join(',') +
      '{padding-inline-start:clamp(0px,3vw,46px)}\n',
    /* No min-height here: forcing one on an engine that already sizes its
       hero left a void the height of the viewport between the headline and
       the rule below it. Padding gives the same weight without the hole. */
    'full-bleed-overlay':
      HERO_GRID + '{grid-template-columns:1fr;align-items:end}\n' +
      '.hero{position:relative;padding-block:clamp(74px,12vw,170px) clamp(44px,7vw,96px)}\n' +
      '.heroimg img,.hero .vwrap video,.hero .vwrap .vposter{opacity:.52}\n'
  }[comp.hero];
  if (heroRule) out += heroRule;
  out += '@media(max-width:940px){' + HERO_GRID + '{grid-template-columns:1fr !important;align-items:start}}\n';

  /* 6 · ornament */
  const orn = {
    bare:  '.ix,.idx,.n,.tag i{display:none}\n',
    index: '.ix,.idx,.n{opacity:1}\n',
    rules: 'section{border-top:1px solid var(--hair)}\n.card,.sc{border-radius:0}\n',
    ticks: '.card,.pc,.sc{position:relative}\n' +
           '.card::before,.sc::before{content:"";position:absolute;inset-block-start:9px;inset-inline-start:9px;' +
           'width:9px;height:9px;border-block-start:1px solid var(--brandText);border-inline-start:1px solid var(--brandText);opacity:.65}\n',
    grain: 'body::after{content:"";position:fixed;inset:0;z-index:999;pointer-events:none;opacity:.055;' +
           'background-image:radial-gradient(var(--ink) .5px,transparent .5px);background-size:3px 3px}\n',
    keyline: '.card,.pc,.sc,.glass{outline:1px solid var(--hair);outline-offset:-5px}\n' +
             'section > .w{position:relative}\n'
  }[comp.ornament];
  if (orn) out += orn;

  /* 7 · motion language */
  if (mo) {
    const from = { none: 'none', up: 'translateY(20px)', scale: 'scale(.965)',
      side: 'translateX(-26px)', drift: 'translateY(10px) scale(1.012)' }[mo.reveal] || 'none';
    out += '[data-rv]{' + (mo.reveal === 'none' ? 'opacity:1;transform:none'
      : 'transform:' + from + ';transition-timing-function:' + mo.ease) + '}\n';
  }

  /* 8 · the creative direction, last so it overrides the bank entries it
     chose. See parts/071_directions.js for what a direction is and why
     it needs its own layer rather than a wider set of banks. */
  out += dirCSS(cfg);

  /* 9 · the section layout variants, last and therefore most specific.
     See parts/072_registry.js. */
  out += variantCSS(cfg);

  return out;
}

/* ---------------------------------------------------------------------
   Click-to-edit.

   The preview runs in a sandboxed iframe with no same-origin access, so
   the editor cannot reach into it and it cannot reach out. `postMessage`
   is the one channel that works across that boundary, and it carries a
   section id and nothing else — no DOM, no config, no code.

   This script is emitted ONLY while the editor is painting its own live
   pane. An exported or published site never contains it; `previewMode`
   is set for the length of one render and cleared immediately.
   --------------------------------------------------------------------- */
let PREVIEW_BRIDGE = false;
/* 'edit' gives click-to-edit plus page links; 'nav' gives page links
   only, which is what the full-screen preview wants — there you are
   reading the site, not pointing at sections to edit. */
const previewMode = (on, kind) => { PREVIEW_BRIDGE = on ? (kind || 'edit') : false; };
const previewBridge = () => !PREVIEW_BRIDGE ? '' : (PREVIEW_BRIDGE === 'nav' ? NAV_BRIDGE : EDIT_BRIDGE + NAV_BRIDGE);

/* Page links. The preview is a sandboxed document with an opaque
   origin: following /about/ would leave the preview and load nothing.
   The click is intercepted and the editor is asked to switch page, so
   the navigation a visitor would use is the navigation you can use
   here. A published site has no bridge and follows the href. */
const NAV_BRIDGE = `
<script>
(function(){
  document.addEventListener('click',function(e){
    var n=e.target;
    while(n&&n!==document.body){
      if(n.tagName==='A'&&n.getAttribute('data-page')){
        e.preventDefault(); e.stopPropagation();
        try{ parent.postMessage({ws:'page',page:n.getAttribute('data-page')},'*'); }catch(err){}
        return;
      }
      n=n.parentNode;
    }
  },true);
})();
<\/script>`;

const EDIT_BRIDGE = `
<style>
[data-ce]{cursor:pointer}
[data-ce]::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:40;
  outline:2px dashed color-mix(in srgb,var(--brand) 70%,transparent);outline-offset:-6px;
  border-radius:8px;opacity:0;transition:opacity .16s}
[data-ce].ce-hot::after{opacity:1}
.ce-tip{position:fixed;z-index:60;pointer-events:none;background:#0B0D12;color:#fff;
  font:500 11.5px/1 system-ui,sans-serif;padding:6px 10px;border-radius:999px;opacity:0;transition:opacity .16s}
.ce-tip.on{opacity:.92}
</style>
<script>
(function(){
  var LABEL={hero:'hero',about:'about',services:'services',products:'products',
             work:'work',stats:'figures',testimonial:'client quote',contact:'contact'};
  var zones=[].slice.call(document.querySelectorAll('header.hero,header#hero,section[id]'));
  if(!zones.length) return;
  var tip=document.createElement('div'); tip.className='ce-tip'; document.body.appendChild(tip);
  var hot=null;
  zones.forEach(function(z){
    var id=z.id||'hero'; if(!LABEL[id]) return;
    z.setAttribute('data-ce',id);
    if(getComputedStyle(z).position==='static') z.style.position='relative';
    z.addEventListener('pointerenter',function(){
      if(hot) hot.classList.remove('ce-hot');
      hot=z; z.classList.add('ce-hot');
      tip.textContent='Click to edit the '+LABEL[id]+' section'; tip.classList.add('on');
    });
    z.addEventListener('pointerleave',function(){ z.classList.remove('ce-hot'); tip.classList.remove('on'); });
    z.addEventListener('pointermove',function(e){
      tip.style.left=Math.min(innerWidth-190,Math.max(8,e.clientX+14))+'px';
      tip.style.top=Math.max(8,e.clientY-34)+'px';
    });
    z.addEventListener('click',function(e){
      /* a real link or control in the preview keeps doing its own job */
      var n=e.target;
      while(n&&n!==z){ if(/^(A|BUTTON|INPUT|SELECT|TEXTAREA|LABEL)$/.test(n.tagName)) return; n=n.parentNode; }
      e.preventDefault();
      try{ parent.postMessage({ws:'edit',section:id},'*'); }catch(err){}
    });
  });
})();
<\/script>`;

/* =====================================================================
   CREATIVE DIRECTIONS — eight complete generation systems
   =====================================================================

   Before this file, the eight entries in STYLES carried four intake
   answers each. They nudged the Design DNA, the DNA shifted the odds in
   the banks, and that was the whole of their influence. Two of them
   could land on the same navigation, the same hero, the same type scale
   and the same section order, and the only reliable difference a client
   would see was colour. The brief for this work says that is not
   enough, and it is right: "Reject superficial palette-only variations."

   A direction here is a complete system. It carries:

     axes       a hard allow-list, per composition axis. The generator
                may only choose within it, so the direction is legible
                in the output rather than probable in it.
     type       its own type scale — size, weight, tracking, measure,
                leading — layered over the typeset bank entry, because
                four of the eight directions want a serif and the bank
                holds two. The scale is what separates them.
     shape      a shape language: corner radius, and the plate figure
                taken from the gallery card so the generated site and
                the card that sold it agree.
     rhythm     page rhythm — section padding, alternating bands, rule
                weight. This is what makes one direction feel measured
                and another relentless at the same word count.
     media      how photography is composed: aspect, crop, treatment.
     interact   hover and focus behaviour, which is the part a client
                feels rather than sees.
     surfaces   optional surface overrides, so a direction can hold its
                own ground colours rather than inheriting the palette's.

   The allow-lists are deliberately 2-3 wide rather than 1, so six
   proposals inside one direction are still six different websites. The
   narrowest direction here still leaves several thousand combinations.

   WHAT IS NOT CLAIMED: these are compositions over the existing six
   engines, not eight new rendering engines. The engines do the drawing.
   A direction decides which engine, with which grammar, at which scale,
   in which rhythm — which is what a design agency decides — and the
   distinctness test measures whether that produced different websites
   rather than asserting it.
   ===================================================================== */

/* Same contract as dirFilter/dirRank, for the variant axes. */
function dirVariantFilter(dirId, type, items) {
  const pref = (DIRECTION_VARIANTS[dirId] || {})[type];
  if (!pref) return items;
  const kept = items.filter(v => pref.indexOf(v.id) >= 0);
  return kept.length ? kept : items;
}
function dirVariantRank(dirId, type, variantId) {
  const pref = (DIRECTION_VARIANTS[dirId] || {})[type];
  if (!pref) return 1;
  const i = pref.indexOf(variantId);
  return i < 0 ? 1 : ([1, .72, .54, .4][i] || .3);
}

/* The composition axes a direction constrains. `engine` is included: a
   direction that cannot choose its renderer is not a direction. */
const DIR_AXES = ['engine', 'palette', 'typeset', 'nav', 'hero', 'order',
                  'motion', 'scene', 'ornament', 'density'];

/* ---------- how a direction reaches the generator --------------------
   Narrow the candidate list to the direction's allow-list, but never to
   nothing: if eligibility has already removed everything the direction
   permits — a shop-first topology on a site with no shop, a WebGL scene
   on a brief with no technical depth — the allow-list is dropped for
   that axis and the ordinary weighting decides. A direction is a strong
   preference about design, not a licence to emit an incoherent page. */
function dirFilter(dirId, axis, items) {
  const d = directionById(dirId);
  if (!d || !d.axes[axis]) return items;
  const allow = d.axes[axis];
  const kept = items.filter(it => allow.indexOf(it.id) >= 0);
  return kept.length ? kept : items;
}

/* Inside the allow-list, earlier entries are the direction's first
   choice. This is what keeps one direction's six proposals recognisably
   one direction rather than a tour of its permissions. */
function dirRank(dirId, axis, itemId) {
  const d = directionById(dirId);
  if (!d || !d.axes[axis]) return 1;
  const i = d.axes[axis].indexOf(itemId);
  if (i < 0) return 1;
  return [1, .62, .42][i] || .3;
}

/* ---------- assigning directions across a batch ----------------------
   The default is the interesting case. With no direction chosen, each
   of the six proposals is given a different direction, which is what
   makes a batch read as six studios rather than one studio's mood
   board. With one chosen, all six sit inside it. With two or three, they
   are dealt round-robin so each appears more than once.

   Ordering inside the pool is by DNA fit, so a government-facing
   consultancy is not handed Experimental brutalism first when the pool
   is wide — but every direction in the pool is still used before any is
   repeated, because the point of the default is breadth. */
function directionFit(d, dna) {
  if (!dna) return .5;
  const f = {
    cinematic: dna.techDepth * .6 + dna.expressive * .2,
    luxury:    dna.authority * .35 + dna.editorial * .35 + dna.imageLed * .2,
    editorial: dna.editorial * .6 + (1 - dna.density) * .2,
    bold:      dna.expressive * .65 - dna.authority * .25 + dna.imageLed * .15,
    corporate: dna.authority * .6 + dna.evidence * .25 - dna.expressive * .2,
    organic:   dna.imageLed * .35 + dna.editorial * .25 + (1 - dna.techDepth) * .2,
    dark:      dna.techDepth * .5 + dna.expressive * .25,
    light:     dna.commerce * .45 + dna.imageLed * .25 + dna.expressive * .15
  }[d.id];
  return Math.max(.05, Math.min(1, .25 + (f || 0)));
}

function assignDirections(count, pool, dna) {
  let ids = (pool && pool.length ? pool : DIRECTION_IDS).filter(id => directionById(id));
  if (!ids.length) ids = DIRECTION_IDS.slice();
  const ranked = ids.slice().sort((a, b) =>
    directionFit(directionById(b), dna) - directionFit(directionById(a), dna));
  const out = [];
  for (let i = 0; i < count; i++) out.push(ranked[i % ranked.length]);
  return out;
}

/* ---------- the direction's own CSS layer ----------------------------
   Emitted after compCSS, so a direction overrides the bank entry it
   chose rather than fighting it. Everything here is written against the
   structural selectors the engines already agree on — section, .w,
   .card, .hero, HERO_GRID, NAV_BAR — so a direction needs no knowledge
   of which of the six engines is drawing, and a new engine inherits all
   eight directions without writing any of them.

   Mobile is handled per rule rather than in one block at the end,
   because the parts that have to give way differ: a 152px headline has
   to come down a long way, an alternating band has to keep its
   alternation, and a 1/1 media crop should stay square. */
function dirCSS(cfg) {
  const comp = cfg && cfg._comp;
  const d = comp && directionById(comp.direction);
  if (!d) return '';
  const t = d.type, sh = d.shape, r = d.rhythm, me = d.media, ia = d.interact;
  let out = '\n/* ---- direction: ' + d.id + ' (' + d.name + ') ---- */\n';

  /* 1 · type scale. The direction wins over the typeset bank entry for
     size, weight, tracking, measure and leading; the bank keeps the
     family pairing, which is what it is actually for. */
  out += 'h1,.hero h1{font-size:' + t.h1 + ';font-weight:' + t.h1w +
         ';letter-spacing:' + t.track + ';line-height:' + (t.h1w >= 700 ? .92 : .98) + '}\n' +
         'h2{font-size:' + t.h2 + ';letter-spacing:' + t.track + '}\n' +
         'body{font-size:' + t.body + ';line-height:' + t.lead + '}\n' +
         '.hero p,.lede,.sub,.sub2,.prose,.std{max-width:' + t.measure +
         ';line-height:' + t.lead + '}\n' +
         NAV_BAR.split(',').map(s => s.trim() + ' a').join(',') +
         '{text-transform:' + t.navCase + ';letter-spacing:' + t.navTrack + '}\n';
  /* A display scale that is right at 1440px is unreadable at 380px. The
     cap comes down with the viewport rather than relying on the clamp's
     middle term alone, which is tuned for the desktop end. */
  out += '@media(max-width:620px){h1,.hero h1{letter-spacing:' +
         (parseFloat(t.track) < -.04 ? '-.035em' : t.track) + ';line-height:1.02}\n' +
         'body{font-size:' + Math.max(15.5, parseFloat(t.body) - 1) + 'px}}\n';

  /* 2 · shape language. The plate figure is the one the gallery card
     showed, so the card and the site it sells agree. It is applied only
     to the hero plate, never to photography the client uploaded — a
     portrait cropped into a leaf shape is a liability, not a style. */
  out += '.card,.pc,.sc,.glass,.vwrap{border-radius:' + sh.card + 'px}\n' +
         '.btn,button,.cta,.acts a{border-radius:' + Math.min(999, sh.radius * 1.2) + 'px}\n';
  if (sh.plate && sh.plate !== '0%') {
    out += '.hero .plate,.hero .deck > :first-child,.hero .showcase > :first-child' +
           '{border-radius:' + sh.plate + '}\n' +
           '@media(max-width:620px){.hero .plate,.hero .deck > :first-child,' +
           '.hero .showcase > :first-child{border-radius:' + sh.card + 'px}}\n';
  }

  /* 3 · page rhythm */
  out += 'section{padding-block:calc(clamp(56px,7.5vw,108px) * ' + r.pad + ')}\n';
  if (r.rule === '0') out += 'section{border-top:0}\n';
  else out += 'section{border-top:' + r.rule + ' solid color-mix(in srgb,var(--ink) ' +
              Math.round(r.ruleOpacity * 18) + '%,var(--bg))}\n';
  /* Banding has to survive the generator reordering sections, so it is
     keyed on position, not on section id.

     THE BAND STATES ITS FOREGROUND. These selectors are positional and
     therefore hit whatever section lands there, including a section an
     engine deliberately inverts: Atelier paints its contact section
     with --ink and sets --paper text on it, the band replaced the
     background with a near-page surface, and white text on near-white
     measured 1.08:1 on the About page of a delivered site. A surface
     and the colour on it are one decision, at every layer — compCSS
     and the section variants already follow this rule and now so does
     the rhythm. Both bands are derived from --bg, so --ink is correct
     in either appearance mode. */
  if (r.bands === 'alternate') {
    out += 'section:nth-of-type(even){background:color-mix(in srgb,var(--ink) 3.5%,var(--bg));' +
           'color:var(--ink)}\n';
  } else if (r.bands === 'accent') {
    out += 'section:nth-of-type(3n+2){background:color-mix(in srgb,var(--brand) 9%,var(--bg));' +
           'color:var(--ink)}\n';
  }

  /* 4 · media composition. An aspect box with a crop position is the
     honest version of "art direction": it does not invent a focal point,
     it just stops a 3:2 photograph being letterboxed into a square. */
  out += '.card img,.pc img,.sc img,.heroimg img,.plate img,.gal img' +
         '{aspect-ratio:' + me.aspect + ';object-fit:cover;object-position:' + me.position + '}\n';
  const treat = {
    glow:   '.heroimg,.plate{box-shadow:0 40px 120px -60px var(--brand)}\n',
    warm:   '.card img,.pc img,.heroimg img{filter:saturate(.92) contrast(1.04)}\n',
    frame:  '.card img,.pc img,.heroimg img{outline:1px solid var(--hair);outline-offset:-1px}\n',
    offset: '.card,.pc{position:relative}\n' +
            '.card::after,.pc::after{content:"";position:absolute;inset:0;z-index:-1;' +
            'transform:translate(7px,7px);background:var(--brand);opacity:.9}\n' +
            '.card,.pc{background:var(--bg)}\n',
    arch:   '.heroimg img,.plate img{border-radius:' + sh.plate + '}\n',
    soft:   '.card img,.pc img,.heroimg img{filter:brightness(1.03) saturate(1.04)}\n',
    plain:  ''
  }[me.treatment];
  if (treat) out += treat;

  /* 5 · interaction. One transition definition, four behaviours. The
     reduced-motion case is handled by baseCSS, which already disables
     every transition globally, so none of this needs repeating there. */
  out += '.card,.pc,.sc,.btn,.cta,.acts a{transition:all ' + ia.dur + 'ms ' + ia.ease + '}\n';
  const hov = {
    glow:   '.card:hover,.pc:hover{transform:translateY(-' + ia.lift + 'px);' +
            'box-shadow:0 30px 70px -45px var(--brand)}\n',
    fade:   '.card:hover,.pc:hover{opacity:.86' +
            (ia.lift ? ';transform:translateY(-' + ia.lift + 'px)' : '') + '}\n',
    rule:   '.card:hover,.pc:hover{border-top:2px solid var(--brandText)}\n',
    shift:  '.card:hover,.pc:hover{transform:translate(-3px,-3px)}\n' +
            '.card:hover::after,.pc:hover::after{transform:translate(10px,10px)}\n',
    border: '.card:hover,.pc:hover{border-color:var(--brandText);' +
            'transform:translateY(-' + ia.lift + 'px)}\n'
  }[ia.kind];
  if (hov) out += hov;
  /* Hover is a pointer idiom. On a touch screen these rules fire on tap
     and stick until the next tap elsewhere, which reads as a stuck card. */
  out += '@media(hover:none){.card:hover,.pc:hover{transform:none;opacity:1;box-shadow:none}}\n';

  /* 6 · surface overrides, when a direction holds its own ground */
  if (d.surfaces) {
    const s = d.surfaces;
    out += 'html[data-mode=day]{--bg:' + s.dayBg + ';--paper:' + s.dayBg + ';--ink:' + s.dayInk + '}\n' +
           'html[data-mode=night]{--bg:' + s.nightBg + ';--paper:' + s.nightBg + ';--ink:' + s.nightInk + '}\n';
  }
  return out;
}

/* ---------- what the studio and the tests read -----------------------
   A direction's signature is the tuple a client would notice. The
   distinctness test compares signatures rather than ids, because two
   directions with different names and the same signature would be the
   palette-only variation the brief rejects. */
function directionSignature(dirId) {
  const d = directionById(dirId);
  if (!d) return null;
  return {
    nav: d.axes.nav[0], hero: d.axes.hero[0], typeset: d.axes.typeset[0],
    order: d.axes.order[0], density: d.axes.density[0], engine: d.axes.engine[0],
    motion: d.axes.motion[0], palette: d.axes.palette[0],
    h1: d.type.h1, h1w: d.type.h1w, measure: d.type.measure, lead: d.type.lead,
    pad: d.rhythm.pad, bands: d.rhythm.bands, radius: d.shape.radius,
    aspect: d.media.aspect, treatment: d.media.treatment, interact: d.interact.kind,
    mode: d.mode
  };
}

/* How many whole websites one direction can express on its own. Reported
   in the studio next to the total, because "238 million" is only
   meaningful if a client who picks one direction still has room. */
function directionSpace(dirId) {
  const d = directionById(dirId);
  if (!d) return 0;
  return DIR_AXES.reduce((n, a) => n * Math.max(1, (d.axes[a] || []).length), 1);
}
/* =====================================================================
   COMPONENT REGISTRY — typed sections and their structural variants
   =====================================================================

   Where this came from, and why it is shaped like this.

   The two integration guides supplied with the premium kit ask for the
   same thing in different words: "at least 6 structurally distinct
   variants of hero, navigation, feature grids, storytelling, product
   collections, testimonials, pricing and footer", varying "actual
   structure, hierarchy, imagery crop, whitespace, content density, grid
   geometry, section sequence, type scale, interaction and motion. Do not
   simply recolor."

   There was also a measured reason to build it. With the eight creative
   directions constraining each composition axis to two or three values,
   a batch of six proposals inside ONE direction could only score 0.10 to
   0.40 on structural distance against a floor of 0.55 — six proposals,
   ten axes, three options each: by pigeonhole most axes had to repeat.
   Open-pool batches were fine (0.59 to 0.65) because each proposal had
   its own direction. The fix is not to loosen the directions, which is
   what makes them directions; it is to give the generator more axes that
   vary WITHIN one. That is what this file is.

   HOW IT WORKS, AND WHY NOT A NEW RENDERER

   Every one of the six engines emits the same landmarks: a header.hero
   and a <section id="..."> per section type. That was verified across
   all six before this was written. So a variant is a scoped CSS layer
   addressed at those landmarks and at the grid wrapper inside them —
   exactly the technique the navigation and hero grammars in compCSS
   already use, which is why a new engine inherits every variant without
   writing any of them, and why no engine had to be touched to add these.

   WHAT IS AND IS NOT CLAIMED

   Shipped here: typed prop schemas for the eight section types the
   application renders today, and 27 structural layout variants across
   seven of them, each with its own grid geometry, hierarchy, density and
   mobile behaviour. Every one is selectable by the generator, by a
   direction, by the AI plan and by hand in the editor.

   Not shipped here, and not described as working anywhere: the section
   types named in 01_design_catalog.json that this application does not
   render yet — announcement bars, logo walls, pricing tables, FAQ
   accordions, newsletter capture and configurable footers from the
   component kit, and the catalog's horizontal-narrative, sticky-chapters,
   before-after, bundle-builder, product-configurator and 3d-product
   families. Those are listed in PLANNED_COMPONENTS at the foot of this
   file so the gap is in the code rather than only in a message, and so
   the studio can show a client what exists against what does not.
   ===================================================================== */

const variantsOf = (type) => VARIANTS[type] || [];
const variantItem = (type, id) =>
  variantsOf(type).find(v => v.id === id) || variantsOf(type)[0] || null;

/* A variant is eligible when the section is actually on the site and
   holds enough content for the layout to make sense. `min` counts items;
   `need` is for anything else. */
function variantEligible(type, v, cfg, dna) {
  /* The caller only asks about live sections now — composeOne skips the
     rest — but a hand-built plan can ask about anything, so this still
     answers for a section that is not on the site. */
  const live = allSections(cfg).some(s => s.type === type && s.visible !== false);
  if (!live) return v.id === variantsOf(type)[0].id;
  if (v.min) {
    const items = ((cfg.content[type] || {}).items || [])
      .filter(x => x && (x.title || x.name || x.v));
    if (items.length < v.min) return false;
  }
  if (typeof v.need === 'function' && !v.need(cfg)) return false;
  return true;
}

/* ---------- the CSS layer -------------------------------------------
   Emitted after the direction layer, so a variant is the most specific
   statement about a section's geometry. Only the variants actually
   chosen are emitted: a page carries the CSS for its own seven
   sections, not for all 27. */
function variantCSS(cfg) {
  const comp = cfg && cfg._comp;
  if (!comp || !comp.variants) return '';
  let out = '\n/* ---- section variants ---- */\n';
  VARIANT_TYPES.forEach(type => {
    const id = comp.variants[type];
    if (!id) return;
    const v = variantItem(type, id);
    if (!v || typeof v.css !== 'function') return;
    const body = v.css('#' + type, GRID_SEL[type] || '.grid');
    if (body) out += '/* ' + type + ': ' + v.name + ' */\n' + body;
  });
  return out;
}

/* ---------- validation ----------------------------------------------
   Used by the plan validator for AI output and by the editor for owner
   input. Returns a list of problems; an empty list means the content
   fits the schema. It never repairs silently — a model that returns a
   300-word headline should be told, not quietly truncated into
   something the client did not approve. */
function checkProp(path, spec, val, errs) {
  if (val === undefined || val === null || val === '') {
    if (spec.required) errs.push({ path, code: 'required', msg: path + ' is required' });
    return;
  }
  if (spec.kind === 'array') {
    if (!Array.isArray(val)) { errs.push({ path, code: 'type', msg: path + ' must be an array' }); return; }
    if (spec.max && val.length > spec.max)
      errs.push({ path, code: 'max', msg: path + ' holds ' + val.length + ', limit is ' + spec.max });
    val.slice(0, spec.max || val.length).forEach((it, i) => {
      if (!it || typeof it !== 'object') {
        errs.push({ path: path + '[' + i + ']', code: 'type', msg: 'item must be an object' }); return;
      }
      Object.keys(spec.of || {}).forEach(k =>
        checkProp(path + '[' + i + '].' + k, spec.of[k], it[k], errs));
      Object.keys(it).forEach(k => {
        if (spec.of && !spec.of[k]) errs.push({ path: path + '[' + i + '].' + k, code: 'unknown', msg: 'unknown field' });
      });
    });
    return;
  }
  if (spec.kind === 'url') {
    const s = String(val);
    /* Rejecting javascript: and data:text/html here rather than at
       render time: the plan is persisted, so an unsafe value that is
       merely escaped on output is still an unsafe value in the database. */
    if (!/^(https?:\/\/|\/|data:image\/)/i.test(s))
      errs.push({ path, code: 'url', msg: path + ' must be an https, root-relative or data:image URL' });
    if (spec.max && s.length > spec.max)
      errs.push({ path, code: 'max', msg: path + ' is longer than ' + spec.max });
    return;
  }
  if (typeof val !== 'string') { errs.push({ path, code: 'type', msg: path + ' must be a string' }); return; }
  if (spec.max && val.length > spec.max)
    errs.push({ path, code: 'max', msg: path + ' is ' + val.length + ' characters, limit is ' + spec.max });
}

function validateSection(type, variant, content) {
  const errs = [];
  const def = SECTION_COMPONENTS[type];
  if (!def) { errs.push({ path: type, code: 'unknown-type', msg: 'unknown section type "' + type + '"' }); return errs; }
  if (variant) {
    const allowed = def.variants || (def.variantsFrom === 'hero' ? HERO_BANK.map(h => h.id) : []);
    if (allowed.indexOf(variant) < 0)
      errs.push({ path: type + '.variant', code: 'unknown-variant',
        msg: '"' + variant + '" is not a variant of ' + type + ' (allowed: ' + allowed.join(', ') + ')' });
  }
  const c = content || {};
  Object.keys(def.props).forEach(k => checkProp(type + '.' + k, def.props[k], c[k], errs));
  Object.keys(c).forEach(k => {
    if (!def.props[k]) errs.push({ path: type + '.' + k, code: 'unknown', msg: 'unknown field "' + k + '" on ' + type });
  });
  return errs;
}

/* Fields a model must never fill, whatever it is asked for. These are
   the client's own claims about themselves, and a generated figure or a
   generated testimonial is a fabrication with their name on it. */
function ownerOnlyFields() {
  const out = [];
  COMPONENT_TYPES.forEach(t => {
    const p = SECTION_COMPONENTS[t].props;
    Object.keys(p).forEach(k => {
      if (p[k].ownerOnly) out.push(t + '.' + k);
      if (p[k].of) Object.keys(p[k].of).forEach(k2 => {
        if (p[k].of[k2].ownerOnly) out.push(t + '.' + k + '[].' + k2);
      });
    });
  });
  return out;
}

/* How many structural layouts the variant axes alone can express. */
function variantSpace() {
  return VARIANT_TYPES.reduce((n, t) => n * Math.max(1, variantsOf(t).length), 1);
}

  { type: 'product-configurator', label: 'Product configurator', from: 'design-catalog', note: 'commerce family. Needs variants and stock.' },
  { type: '3d-product',   label: '3D product viewer',  from: 'design-catalog',   note: 'Needs licensed GLB models; no 3D product runtime is wired.' },
  { type: 'reviews',      label: 'Verified reviews',   from: 'design-catalog',   note: 'Requires a real review source. Will not be faked.' },
  { type: 'certifications', label: 'Certifications',   from: 'design-catalog',   note: 'Owner-supplied evidence only.' },
  { type: 'booking',      label: 'Appointment booking', from: 'design-catalog',  note: 'Needs a calendar provider.' },
  { type: 'blog',         label: 'Blog and articles',  from: 'design-catalog',   note: 'Needs a content store and article routes.' }

/* =====================================================================
   THE SITE PLAN — the only thing a language model is allowed to return
   =====================================================================

   Both integration guides say the same thing, and it is the single most
   important decision in this whole piece of work:

     "Do not have an LLM write a full HTML application for every
      generation. Build a deterministic, tested component renderer driven
      by validated AI-generated JSON."
     "...returns strictly validated site-plan JSON, and never
      model-generated executable JS."

   So the model never writes markup, CSS, JavaScript, a URL it invented,
   or a number about the client's business. It chooses from tables this
   file publishes, and it writes prose into fields this file bounds. What
   comes back is checked against the registry before anything renders.

   WHY THE SCHEMA IS GENERATED RATHER THAN WRITTEN

   planJSONSchema() builds the model's structured-output schema from the
   same tables validatePlan() checks against — SECTION_COMPONENTS, the
   banks, DIRECTIONS, VARIANTS. A hand-written schema and a hand-written
   validator drift apart, and the failure mode is the worst kind: the
   model is told it may send something the validator rejects, so
   generation fails in production for a reason nobody can see in either
   file. Here they cannot disagree, because they are the same data.

   WHAT THE MODEL IS NOT PERMITTED TO WRITE

   Every field marked ownerOnly in the registry — the client's figures
   and their client's words. A fabricated "98% satisfaction" or an
   invented testimonial goes out under the client's name, on the client's
   domain, to the client's regulator. validatePlan rejects a plan that
   fills them, rather than stripping them quietly, because a model that
   tried once will try again and the operator should see it.
   ===================================================================== */

const PLAN_SCHEMA_VERSION = 1;

/* The axes a plan may set, and where the legal values come from. Kept as
   a table so planJSONSchema and validatePlan read the same list. */
const PLAN_AXES = {
  engine:   () => DESIGN_SYSTEMS.map(d => d.id),
  palette:  () => PALETTE_BANK.map(p => p.id),
  typeset:  () => TYPE_BANK.map(t => t.id),
  nav:      () => NAV_BANK.map(n => n.id),
  hero:     () => HERO_BANK.map(h => h.id),
  order:    () => ORDER_BANK.map(o => o.id),
  motion:   () => MOTION_BANK.map(m => m.id),
  scene:    () => SCENE_BANK.map(s => s.id),
  ornament: () => ORNAMENT_BANK.map(o => o.id),
  density:  () => DENSITY_BANK.map(d => d.id)
};

/* ---------- the structured-output schema the server sends ------------
   Deliberately a plain JSON Schema subset: it is the common ground
   between OpenAI's response_format json_schema and Anthropic's tool
   input_schema, so one definition serves both providers. */
function planJSONSchema() {
  const sectionSchemas = COMPONENT_TYPES.map(type => {
    const def = SECTION_COMPONENTS[type];
    const props = {};
    Object.keys(def.props).forEach(k => {
      const s = def.props[k];
      if (s.ownerOnly) return;                 /* not offered to the model at all */
      if (s.kind === 'array') {
        const item = {}; const req = [];
        Object.keys(s.of || {}).forEach(k2 => {
          const s2 = s.of[k2];
          if (s2.ownerOnly) return;
          item[k2] = { type: 'string', maxLength: s2.max };
          if (s2.required) req.push(k2);
        });
        if (!Object.keys(item).length) return;
        props[k] = { type: 'array', maxItems: s.max,
          items: { type: 'object', properties: item, required: req, additionalProperties: false } };
      } else {
        props[k] = { type: 'string', maxLength: s.max };
      }
    });
    const variants = def.variants || (def.variantsFrom === 'hero' ? HERO_BANK.map(h => h.id) : []);
    return {
      type: 'object', additionalProperties: false,
      properties: {
        type: { const: type },
        variant: variants.length ? { enum: variants } : { type: 'string' },
        content: { type: 'object', properties: props, additionalProperties: false }
      },
      required: ['type']
    };
  });

  const tokens = {};
  Object.keys(PLAN_AXES).forEach(a => { tokens[a] = { enum: PLAN_AXES[a]() }; });

  return {
    type: 'object', additionalProperties: false,
    required: ['schemaVersion', 'brand', 'proposals'],
    properties: {
      schemaVersion: { const: PLAN_SCHEMA_VERSION },
      brand: {
        type: 'object', additionalProperties: false,
        required: ['name'],
        properties: {
          name:   { type: 'string', maxLength: 90 },
          voice:  { type: 'string', maxLength: 160 },
          sector: { type: 'string', maxLength: 90 }
        }
      },
      proposals: {
        type: 'array', minItems: 1, maxItems: 8,
        items: {
          type: 'object', additionalProperties: false,
          required: ['id', 'direction'],
          properties: {
            id:        { type: 'string', maxLength: 40 },
            direction: { enum: DIRECTION_IDS },
            rationale: { type: 'string', maxLength: 240,
              description: 'One sentence a client could read, on why this direction suits them.' },
            tokens:    { type: 'object', additionalProperties: false, properties: tokens },
            pages: {
              type: 'array', maxItems: 8,
              items: {
                type: 'object', additionalProperties: false,
                required: ['slug', 'sections'],
                properties: {
                  slug:  { type: 'string', maxLength: 48 },
                  title: { type: 'string', maxLength: 70 },
                  sections: { type: 'array', maxItems: 12, items: { anyOf: sectionSchemas } }
                }
              }
            }
          }
        }
      },
      meta: {
        type: 'object', additionalProperties: false,
        properties: {
          notes: { type: 'string', maxLength: 500 },
          seo:   { type: 'object', additionalProperties: false, properties: {
            title:       { type: 'string', maxLength: 70 },
            description: { type: 'string', maxLength: 180 } } }
        }
      }
    }
  };
}

/* The instruction that travels with the schema. Written here, next to
   the validator, so the two cannot describe different rules. */
function planSystemPrompt() {
  return [
    'You are the art director for a website generator. You choose and compose;',
    'you never write code. Return ONLY the structured plan.',
    '',
    'Hard rules, enforced by a validator that will reject the whole plan:',
    '1. Every id you use must come from the enums in the schema. Do not invent',
    '   a direction, palette, engine, section type or variant name.',
    '2. Never write figures, statistics, awards, years in business, client names,',
    '   logos, reviews or testimonials. Those fields are not in your schema',
    '   because only the business owner may supply them. Do not put them in',
    '   prose fields either.',
    '3. Never write a URL, an email address or a phone number.',
    '4. Write plain text. No HTML, no Markdown, no scripts.',
    '5. Headlines are short. Respect every maxLength; a long headline breaks',
    '   the layout it is going into.',
    '',
    'Make the proposals genuinely different from one another: different',
    'direction, different opening frame, different section order, different',
    'page composition. Six recolours of one layout is a failed response.'
  ].join('\n');
}

/* ---------- validation -----------------------------------------------
   Returns { ok, errors, warnings }. Errors reject the plan. Warnings are
   recorded and shown, and do not. Nothing is silently repaired. */
function validatePlan(plan, cfg) {
  const errors = [], warnings = [];
  const E = (path, code, msg) => errors.push({ path, code, msg });
  const W = (path, code, msg) => warnings.push({ path, code, msg });

  if (!plan || typeof plan !== 'object') {
    E('', 'shape', 'the plan is not an object'); return { ok: false, errors, warnings };
  }
  if (plan.schemaVersion !== PLAN_SCHEMA_VERSION)
    E('schemaVersion', 'version', 'expected schemaVersion ' + PLAN_SCHEMA_VERSION +
      ', got ' + JSON.stringify(plan.schemaVersion));

  const brand = plan.brand || {};
  if (!brand.name || typeof brand.name !== 'string')
    E('brand.name', 'required', 'brand.name is required');
  else if (brand.name.length > 90) E('brand.name', 'max', 'brand.name is longer than 90');

  if (!Array.isArray(plan.proposals) || !plan.proposals.length) {
    E('proposals', 'required', 'proposals must be a non-empty array');
    return { ok: false, errors, warnings };
  }
  if (plan.proposals.length > 8) E('proposals', 'max', 'at most 8 proposals');

  const owner = ownerOnlyFields();
  const seenIds = new Set();

  plan.proposals.forEach((p, i) => {
    const at = 'proposals[' + i + ']';
    if (!p || typeof p !== 'object') { E(at, 'shape', 'proposal must be an object'); return; }
    if (!p.id) E(at + '.id', 'required', 'id is required');
    else if (seenIds.has(p.id)) E(at + '.id', 'duplicate', 'duplicate proposal id "' + p.id + '"');
    else seenIds.add(p.id);

    if (!directionById(p.direction))
      E(at + '.direction', 'enum', '"' + p.direction + '" is not a creative direction');

    const tk = p.tokens || {};
    Object.keys(tk).forEach(axis => {
      if (!PLAN_AXES[axis]) { E(at + '.tokens.' + axis, 'unknown', 'unknown axis "' + axis + '"'); return; }
      if (PLAN_AXES[axis]().indexOf(tk[axis]) < 0)
        E(at + '.tokens.' + axis, 'enum', '"' + tk[axis] + '" is not a value of ' + axis);
    });
    /* A token outside the chosen direction's allow-list is a warning, not
       an error: the direction is a strong preference and an art director
       may have a reason. It is recorded so the operator can see how often
       the model argues with the direction it picked. */
    const dir = directionById(p.direction);
    if (dir) Object.keys(tk).forEach(axis => {
      const allow = dir.axes[axis];
      if (allow && allow.indexOf(tk[axis]) < 0)
        W(at + '.tokens.' + axis, 'off-direction',
          '"' + tk[axis] + '" is outside ' + dir.name + "'s usual " + axis);
    });

    const pages = p.pages || [];
    if (!Array.isArray(pages)) { E(at + '.pages', 'shape', 'pages must be an array'); return; }
    const slugs = new Set();
    pages.forEach((pg, j) => {
      const pat = at + '.pages[' + j + ']';
      if (!pg || typeof pg !== 'object') { E(pat, 'shape', 'page must be an object'); return; }
      const slug = String(pg.slug === undefined ? '' : pg.slug);
      if (slug !== slugify(slug)) E(pat + '.slug', 'slug', '"' + slug + '" is not a usable address');
      if (slugs.has(slug)) E(pat + '.slug', 'duplicate', 'two pages share the address "' + slug + '"');
      slugs.add(slug);

      if (!Array.isArray(pg.sections)) { E(pat + '.sections', 'shape', 'sections must be an array'); return; }
      const seenTypes = new Set();
      pg.sections.forEach((s, k) => {
        const sat = pat + '.sections[' + k + ']';
        if (!s || typeof s !== 'object') { E(sat, 'shape', 'section must be an object'); return; }
        if (!SECTION_COMPONENTS[s.type]) {
          const planned = PLANNED_COMPONENTS.find(x => x.type === s.type);
          E(sat + '.type', planned ? 'not-built' : 'unknown-type',
            planned ? '"' + s.type + '" is catalogued but not built: ' + planned.note
                    : 'unknown section type "' + s.type + '"');
          return;
        }
        if (seenTypes.has(s.type))
          E(sat + '.type', 'duplicate', '"' + s.type + '" appears twice on one page');
        seenTypes.add(s.type);

        validateSection(s.type, s.variant, s.content).forEach(e =>
          E(sat + '.' + e.path.replace(/^[a-z]+\./, ''), e.code, e.msg));

        /* The owner-only rule, enforced rather than trusted. */
        const c = s.content || {};
        owner.forEach(f => {
          const [t, field, sub] = f.replace('[].', '.').split('.');
          if (t !== s.type) return;
          if (sub) {
            (c[field] || []).forEach((it, n) => {
              if (it && it[sub] !== undefined && it[sub] !== '')
                E(sat + '.content.' + field + '[' + n + '].' + sub, 'owner-only',
                  'this is the business owner\'s own claim and may not be generated');
            });
          } else if (c[field] !== undefined && c[field] !== '') {
            E(sat + '.content.' + field, 'owner-only',
              'this is the business owner\'s own claim and may not be generated');
          }
        });

        /* Anything that looks like markup, a script or a link, in any
           prose field. The renderer escapes, but a stored value is a
           stored value and the operator should know it was attempted. */
        Object.keys(c).forEach(k2 => {
          const vals = Array.isArray(c[k2])
            ? c[k2].flatMap(it => Object.values(it || {}))
            : [c[k2]];
          vals.forEach(v => {
            if (typeof v !== 'string') return;
            if (/<\s*\/?\s*[a-z]/i.test(v) || /javascript:/i.test(v) || /\bon\w+\s*=/i.test(v))
              E(sat + '.content.' + k2, 'markup', 'prose fields must be plain text');
            if (/https?:\/\//i.test(v) || /\b[\w.+-]+@[\w-]+\.[a-z]{2,}\b/i.test(v))
              E(sat + '.content.' + k2, 'contact', 'the model may not write URLs or addresses');
          });
        });
      });
      if (pg.sections.length && pg.sections[0].type !== 'hero' && slug === '')
        W(pat, 'no-hero', 'the home page does not open with a hero');
    });
  });

  /* Did it actually produce different websites? Checked here rather than
     taken on trust, with the same measure the deterministic generator is
     held to. */
  if (plan.proposals.length > 1) {
    const dirs = plan.proposals.map(p => p.direction);
    if (new Set(dirs).size === 1 && plan.proposals.length >= 4)
      W('proposals', 'one-direction',
        'all ' + plan.proposals.length + ' proposals share one creative direction');
  }
  return { ok: !errors.length, errors, warnings };
}

/* ---------- a plan becomes a batch the renderer can draw -------------
   Anything the plan leaves out is filled by the deterministic generator,
   which is what makes a partial or failed model response survivable:
   the client gets six real proposals, and `source` records which parts
   were the model's and which were not. */
function planToBatch(plan, cfg, opts) {
  opts = opts || {};
  const v = validatePlan(plan, cfg);
  if (!v.ok) return { ok: false, errors: v.errors, warnings: v.warnings, batch: null };

  const count = opts.count || Math.max(plan.proposals.length, 6);
  const base = generate(cfg, {
    count,
    directions: plan.proposals.map(p => p.direction),
    seed: opts.seed
  });

  const proposals = base.proposals.map((comp, i) => {
    const p = plan.proposals[i];
    if (!p) return Object.assign({}, comp, { source: 'generator' });
    const out = Object.assign({}, comp, { direction: p.direction, planId: p.id,
      rationale: p.rationale || '', source: 'model' });
    Object.keys(p.tokens || {}).forEach(a => { if (PLAN_AXES[a]) out[a] = p.tokens[a]; });
    /* section variants the plan asked for, where the section is live */
    const home = (p.pages || [])[0];
    if (home && Array.isArray(home.sections)) {
      out.variants = Object.assign({}, comp.variants);
      home.sections.forEach(s => {
        if (s.variant && VARIANT_TYPES.indexOf(s.type) >= 0 && out.variants[s.type] !== undefined)
          out.variants[s.type] = s.variant;
      });
    }
    reconcileScene(out, base.dna);
    return out;
  });

  const u = uniqueness(proposals);
  return {
    ok: true, errors: [], warnings: v.warnings,
    batch: Object.assign({}, base, { proposals, uniqueness: u,
      met: u.single ? u.structMin >= STRUCT_FLOOR : u.min >= DISTINCT_FLOOR,
      floor: u.single ? { kind: 'structural', value: STRUCT_FLOOR, got: u.structMin }
                      : { kind: 'overall', value: DISTINCT_FLOOR, got: u.min },
      planned: plan.proposals.length, source: 'model+generator' })
  };
}

/* The copy a plan carries, applied to the configuration. Separate from
   planToBatch because content and composition are separate decisions:
   a client can keep their own words and take the model's layout, or the
   reverse. Owner-written text is never overwritten. */
function planContent(plan, cfg, index) {
  const p = (plan.proposals || [])[index || 0];
  if (!p) return { applied: [], skipped: [] };
  const applied = [], skipped = [];
  const touched = (cfg._touched || {});
  (p.pages || []).forEach(pg => (pg.sections || []).forEach(s => {
    const def = SECTION_COMPONENTS[s.type];
    if (!def || !s.content) return;
    const target = cfg.content[s.type];
    if (!target) return;
    Object.keys(s.content).forEach(k => {
      if (!def.props[k] || def.props[k].ownerOnly) { skipped.push(s.type + '.' + k); return; }
      const cur = target[k];
      const empty = cur === undefined || cur === '' ||
        (Array.isArray(cur) && !cur.filter(x => x && (x.title || x.name)).length);
      if (!empty || touched[s.type + '.' + k]) { skipped.push(s.type + '.' + k); return; }
      target[k] = s.content[k];
      applied.push(s.type + '.' + k);
    });
  }));
  cfg._drafted = Object.assign({}, cfg._drafted || {});
  applied.forEach(f => { cfg._drafted[f] = 'model'; });
  return { applied, skipped };
}

/* The reverse: what the generator produced, as a plan. Used to seed the
   model with a starting point, to export, and to diff a model response
   against the deterministic baseline. */
function batchToPlan(cfg, batch) {
  return {
    schemaVersion: PLAN_SCHEMA_VERSION,
    brand: { name: cfg.business.name || '', sector: cfg.business.sector || '' },
    proposals: (batch.proposals || []).map((c, i) => ({
      id: c.id || ('concept-' + (i + 1)),
      direction: c.direction || '',
      tokens: Object.keys(PLAN_AXES).reduce((o, a) => { o[a] = c[a]; return o; }, {}),
      pages: (cfg.pages || []).map(pg => ({
        slug: pg.slug, title: pg.name,
        sections: (pg.sections || []).filter(s => s.visible !== false).map(s => ({
          type: s.type,
          variant: (c.variants || {})[s.type] || undefined
        }))
      }))
    })),
    meta: { notes: 'Produced by the deterministic generator, not by a model.' }
  };
}

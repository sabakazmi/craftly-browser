const repAdd = (p) => { const l = dig(S.cfg, p) || []; l.push({}); set(p, l); render(); };
const repDel = (p, i) => { dig(S.cfg, p).splice(i, 1); S.dirty = true; render(); };
const repSet = (p, i, k, v) => { dig(S.cfg, p)[i][k] = v; S.dirty = true; schedule(); };

/* ---------------------------------------------------------------------
   The brief — five steps, one typed field.

   Step 0 is the fork: a site or a shop. Then name, category, visual
   direction, features, generate. Only the name is typed; everything
   else is a card.
   --------------------------------------------------------------------- */
/* Five, and only the name has to be answered.
   The last step was "Anything else?" — twelve feature checkboxes on the
   one screen where nothing had to be decided, because the category had
   already ticked the right ones. It is now "Which pages?", which is a
   real decision the specification asks for and the product could not
   previously offer, with the few genuine feature toggles folded in
   underneath. Still five. */
const BRIEF_STEPS = ['mode', 'name', 'kind', 'style', 'pages'];

function briefOf() { return S.cfg.brief || (S.cfg.brief = blankBrief()); }

function viewQ() {
  const br = briefOf();
  const step = BRIEF_STEPS[S.step] || 'mode';
  const total = BRIEF_STEPS.length;
  const isStore = br.mode === 'store';

  let head = '', body = '', can = true, nextLabel = 'Continue';

  if (step === 'mode') {
    head = ['What are you making?', 'One question, then four screens of cards. The only thing you have to type is the name.'];
    body = '<div class="cards two">' +
      [['site', 'A website', 'Pages, services, work, contact — for a business or a practice.'],
       ['store', 'An online shop', 'Everything a website has, plus products, delivery and payment options.']]
      .map(([id, t, d]) => card(br.mode === id, "briefSet('mode','" + id + "')", t, d)).join('') + '</div>';
    can = !!br.mode;
    nextLabel = br.mode ? 'Continue' : 'Choose one';
  }

  if (step === 'name') {
    head = [isStore ? 'What is the shop called?' : 'What is it called?',
            'This is the only thing you need to type. Everything after this is a choice between cards.'];
    body = '<div class="onefield"><label class="f big"><span>' + (isStore ? 'Shop name' : 'Website or business name') + '</span>' +
      '<input id="briefname" value="' + E(br.name) + '" placeholder="' + (isStore ? 'Persian Weave' : 'Haxara') + '" ' +
      'oninput="briefSet(\'name\',this.value)" onkeydown="if(event.key===\'Enter\')qNext()"></label>' +
      /* Optional, and attached to a question that already exists rather
         than becoming a sixth one. Dropping a logo here reads its
         colours in the browser in a few milliseconds and puts them at
         the front of every direction's palette list, so all six
         proposals come back in the client's own colours. */
      '<div class="labdrop"><label class="labup"><input type="file" accept="image/*" ' +
        'onchange="briefLogo(this)"><span><b>Use my logo’s colours</b>' +
        '<em>Optional. Read in your browser — the file is never uploaded anywhere.</em></span></label>' +
        labSwatchRow() + '</div>' +
      /* One optional line, on a question that already exists rather than
         becoming a sixth one. It is the single highest-value thing a
         client can give the copy engine: with a name and a category
         alone, a generated site came to about 130 words, because there
         were only two facts to arrange. A sentence about what the
         business actually does is the raw material every paragraph on
         the site is then built from. */
      '<div class="onedesc"><label class="f"><span>In a sentence, what does it do? ' +
        '<em>Optional — but this is what the writing is built from</em></span>' +
        '<textarea id="briefdesc" rows="2" placeholder="' +
        E(isStore ? 'Hand-knotted rugs and ceramics made by families in Quetta.'
                  : 'Feasibility studies and transaction advisory for government bodies.') +
        '" oninput="briefSet(\'desc\',this.value)">' + E(br.desc || '') + '</textarea></label></div>' +
      '<p class="note">A web address can be added later, in the editor. It is not needed now.</p></div>';
    can = !!br.name.trim();
    nextLabel = can ? 'Continue' : 'Enter a name';
  }

  if (step === 'kind') {
    const list = isStore ? STORE_KINDS : SITE_KINDS;
    head = [isStore ? 'What does it sell?' : 'What kind of website?',
            'This decides the pages, the sections and the order they come in. It can be changed afterwards.'];
    body = '<div class="cards">' + list.map(k =>
      card(br.kind === k.id, "briefSet('kind','" + k.id + "')", k.name, k.hint || '')).join('') + '</div>';
    can = !!br.kind;
    nextLabel = can ? 'Continue' : 'Choose one';
  }

  if (step === 'style') {
    head = ['How should it look?',
            'Pick one or more. The last one you pick wins where two disagree. Or let the studio choose.'];
    body = '<div class="cards style">' + STYLES.map(st => {
      const on = (br.styles || []).indexOf(st.id) >= 0;
      return '<button class="card st' + (on ? ' on' : '') + '" onclick="briefStyle(\'' + st.id + '\')" aria-pressed="' + on + '">' +
        '<span class="prev" style="background:' + st.swatch[0] + '">' +
          '<i style="background:' + st.swatch[1] + '"></i>' +
          '<b style="color:' + st.swatch[1] + '">Aa</b>' +
          '<u style="background:' + st.swatch[2] + '"></u>' +
        '</span>' +
        '<span class="ct"><b>' + E(st.name) + '</b></span>' +
        '<span class="tick" aria-hidden="true">' + (on ? '✓' : '') + '</span></button>';
    }).join('') + '</div>' +
    '<button class="card wide' + (br.surprise ? ' on' : '') + '" onclick="briefSurprise()" aria-pressed="' + !!br.surprise + '">' +
      '<span class="ct"><b>Surprise me — let the studio decide</b>' +
      '<em>Picks the direction this kind of site usually wants. The same name always gets the same answer.</em></span>' +
      '<span class="tick" aria-hidden="true">' + (br.surprise ? '✓' : '') + '</span></button>';
    can = (br.styles || []).length > 0 || br.surprise;
    nextLabel = can ? 'Continue' : 'Pick one, or Surprise me';
  }

  if (step === 'pages') {
    head = ['Which pages?',
            'Already chosen for what you are making. Tick what you want — Generate is the only button you need.'];
    const chosen = briefPages(br);
    body = '<div class="cards feat">' + PAGE_KINDS.map(k => {
      const on = chosen.indexOf(k.id) >= 0;
      const avail = pageAvailable(S.cfg, k);
      /* "not built" and "needs content" are different problems and must
         not share a label: the Shop page IS built, it is waiting for a
         product. `.soon` carries a "· not built" suffix, which would be
         a lie here. */
      const cls = 'card' + (on ? ' on' : '') + (avail || k.pinned ? '' : ' needs');
      return '<button class="' + cls + '" onclick="briefPage(\'' + k.id + '\')" ' +
        'aria-pressed="' + on + '"' + (k.pinned ? ' disabled title="Every site has one"' : '') + '>' +
        '<span class="ct"><b>' + E(k.name) + (k.pinned ? ' · always' : '') + '</b>' +
        '<em>' + E(avail || k.pinned ? k.blurb
          : 'Needs ' + k.needsWhat + '. Add it in the editor and this page can be built.') + '</em></span>' +
        '<span class="tick" aria-hidden="true">' + (on ? '✓' : '') + '</span></button>';
    }).join('') + '</div>';

    /* The feature toggles that are not pages, folded away. */
    const on = (f) => (br.features || []).indexOf(f.id) >= 0;
    const shown = FEATURES.filter(f => on(f) || S.moreFeat);
    const hidden = FEATURES.length - shown.length;
    body += '<button class="btn ghost wide" onclick="S.moreFeat=!S.moreFeat;render()" aria-expanded="' +
      !!S.moreFeat + '">' + (S.moreFeat ? 'Hide extras' : 'Other features (' + hidden + ')') + '</button>';
    if (S.moreFeat) {
      body += '<div class="cards feat">' + shown.map(f =>
        '<button class="card' + (on(f) ? ' on' : '') + (f.built ? '' : ' soon') + '" onclick="briefFeature(\'' +
        f.id + '\')" aria-pressed="' + on(f) + '">' +
        '<span class="ct"><b>' + E(f.name) + '</b>' +
        (f.built ? (f.note ? '<em>' + E(f.note) + '</em>' : '') : '<em>' + E(f.note || 'Not built yet') + '</em>') +
        '</span><span class="tick" aria-hidden="true">' + (on(f) ? '✓' : '') + '</span></button>').join('') + '</div>';
      body += '<details class="plan"><summary>Pages this builder cannot fill yet (' +
        PAGE_PLANNED.length + ')</summary><ul>' +
        PAGE_PLANNED.map(x => '<li><b>' + E(x.name) + '</b> — ' + E(x.note) + '</li>').join('') +
        '</ul></details>';
    }
    if (isStore) {
      body += '<div class="labdrop"><label class="labup"><input type="file" accept=".csv,text/csv" ' +
        'onchange="briefCSV(this)"><span><b>Import products from a CSV</b>' +
        '<em>Optional. Columns: name, price, sku, category, description, image. ' +
        'Read in your browser — nothing is uploaded.</em></span></label>' + labCsvReport() + '</div>';
    }
    const unbuilt = unbuiltFeatures(br);
    if (unbuilt.length) body += '<p class="note warnnote">Ticked but not built yet: ' +
      E(unbuilt.map(f => f.name).join(', ')) + '. They are recorded on the project and left off the site rather than faked.</p>';
    nextLabel = 'Generate 6 ' + (isStore ? 'shops' : 'websites');
  }

  return '<div class="q brief"><div class="bar"><i style="width:' + Math.round(S.step / total * 100) + '%"></i></div>' +
    '<div class="qhead"><div class="ix">Step ' + (S.step + 1) + ' of ' + total + '</div>' +
    '<h1>' + E(head[0]) + '</h1><p>' + E(head[1]) + '</p></div>' + body +
    '<div class="qnav">' + (S.step ? '<button class="btn ghost" onclick="qBack()">Back</button>' : '') +
    '<button class="btn brand' + (can ? '' : ' off') + '" onclick="qNext()">' + E(nextLabel) + '</button>' +
    /* The escape hatch. Once there is a name, every remaining question
       has a defensible answer already: the category falls back to the
       commonest one, the direction falls back to all eight, and the
       features are whatever the category ticked. So the four screens
       after the name are a refinement, not a requirement, and saying so
       with a button is worth more than saying so in a sentence. */
    (briefCanSkip(br, step)
      ? '<button class="btn ghost skip" onclick="briefSkip()">Skip — generate six now</button>' : '') +
    '<span class="sp">Nothing here is permanent. Every choice can be changed in the editor.</span></div></div>';
}

/* ---------- the labs, attached to questions that already exist -------
   The twelve Python labs are real and they run, but a Python worker
   cannot sit inside a thirty-second preview. The three that belong in
   the creation flow run in the browser instead (parts/077_imagelab.js);
   the other nine stay on the server for batch work. Neither of these
   adds a question: the logo hangs off the name, the catalogue hangs off
   the last step. */

/* The import is reported, not just applied. Every row that could not be
   read is named with its line number, because "47 of 50 imported" with
   no account of the other three is how a shop goes live missing stock. */
function labCsvReport() {
  const r = S.csvReport;
  if (!r) return '';
  const w = r.warnings || [];
  return '<div class="labrep' + (w.length ? ' warn' : '') + '">' +
    '<b>' + r.count + ' product' + (r.count === 1 ? '' : 's') + ' ready to review</b>' +
    (w.length
      ? '<ul>' + w.slice(0, 8).map(x => '<li>' + E(x) + '</li>').join('') +
        (w.length > 8 ? '<li>and ' + (w.length - 8) + ' more</li>' : '') + '</ul>'
      : '<em>Every row read cleanly.</em>') +
    '<em class="q">Nothing is published. They land in the editor for you to check first.</em></div>';
}

function labSwatchRow() {
  const p = S.brandPal;
  if (!p) return '';
  return '<div class="labsw" role="group" aria-label="Colours read from your logo">' +
    (p.swatch || []).map(c => '<i style="background:' + E(c) + '" title="' + E(c) + '"></i>').join('') +
    '<b>' + E(p.name) + '</b>' +
    '<button class="btn ghost tiny" onclick="briefLogoClear()">Remove</button></div>';
}

async function briefLogo(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)) return toast('That is not an image', 'err');
  if (f.size > 12 * 1024 * 1024) return toast('That image is very large — 12 MB is the limit', 'err');
  try {
    const pal = await labBrandPalette(f, briefOf().name || 'Your logo');
    if (!pal) return toast('No usable colour was found in that image', 'err');
    labUsePalette(pal);
    S.brandPal = pal;
    S.dirty = true;
    /* Patch the swatches in place. The name field is on this screen and
       re-rendering would take the focus out of it. */
    const host = $('.labdrop');
    if (host) {
      const old = host.querySelector('.labsw');
      if (old) old.remove();
      host.insertAdjacentHTML('beforeend', labSwatchRow());
    }
    save(true);
    toast('Read ' + (pal.swatch || []).length + ' colours — your six designs will use them', 'ok');
  } catch (e) {
    toast(String(e && e.message || 'That image could not be read'), 'err');
  }
}

function briefLogoClear() {
  labDropPalette();
  S.brandPal = null;
  S.dirty = true;
  const old = $('.labsw');
  if (old) old.remove();
  save(true);
  toast('Back to the studio palettes', 'ok');
}

async function briefCSV(input) {
  const f = input && input.files && input.files[0];
  if (!f) return;
  try {
    const text = await f.text();
    const parsed = labCatalog(text);
    if (!parsed.count && parsed.warnings.length)
      return toast(parsed.warnings[0], 'err');
    const n = labApplyCatalog(S.cfg, parsed);
    S.csvReport = parsed;
    S.dirty = true;
    save(true);
    render();
    toast(n + ' product' + (n === 1 ? '' : 's') + ' read' +
      (parsed.warnings.length ? ' · ' + parsed.warnings.length + ' need attention' : ''),
      parsed.warnings.length ? 'warn' : 'ok');
  } catch (e) {
    toast('That file could not be read as a CSV', 'err');
  }
}

/* Skipping is offered from the moment there is a name, and never on the
   last step, where Generate is already the button. */
/* Which pages the brief has settled on. Untouched means "whatever the
   studio recommends", which is a real answer and the better default for
   someone who has not decided — not an empty one. */
function briefPages(br) {
  if (Array.isArray(br.pages) && br.pages.length) return br.pages;
  return recommendedPages(S.cfg, br);
}

function briefPage(id) {
  const k = pageKind(id);
  if (!k || k.pinned) return;
  if (!pageAvailable(S.cfg, k)) {
    return toast(k.name + ' needs ' + k.needsWhat + ' first — add it in the editor', 'warn');
  }
  const br = briefOf();
  const cur = briefPages(br).slice();
  const i = cur.indexOf(id);
  if (i >= 0) cur.splice(i, 1); else cur.push(id);
  br.pages = cur;
  /* ticking Shop is how someone says they want to sell */
  if (id === 'shop') {
    br.features = br.features || [];
    const j = br.features.indexOf('shop');
    if (i >= 0 && j >= 0) br.features.splice(j, 1);
    if (i < 0 && j < 0) br.features.push('shop');
  }
  S.dirty = true; render();
}

function briefCanSkip(br, step) {
  return !!(br.name || '').trim() && step !== 'features' && step !== 'mode';
}

/* Fill what is unanswered with the defaults the studio would have used
   anyway, then generate. Nothing is invented: the category falls back to
   the first in the list for the chosen mode, and leaving the direction
   empty is a real answer — it means all eight, one per proposal, which
   is the better default for someone who has not decided. */
function briefSkip() {
  const br = briefOf();
  if (!(br.name || '').trim()) return toast('A name first', 'err');
  if (!br.mode) br.mode = 'site';
  if (!br.kind) {
    const list = br.mode === 'store' ? STORE_KINDS : SITE_KINDS;
    br.kind = list[0].id;
    br.features = br.mode === 'store' ? ['contact', 'shop', 'whatsapp']
      : (FEATURE_PRESET[br.kind] || ['contact']).slice();
  }
  /* styles left empty on purpose — six directions rather than one */
  S.step = BRIEF_STEPS.length - 1;
  qNext();
}

function card(on, action, title, desc) {
  return '<button class="card' + (on ? ' on' : '') + '" onclick="' + action + '" aria-pressed="' + !!on + '">' +
    '<span class="ct"><b>' + E(title) + '</b>' + (desc ? '<em>' + E(desc) + '</em>' : '') + '</span>' +
    '<span class="tick" aria-hidden="true">' + (on ? '✓' : '') + '</span></button>';
}

/* ---------------------------------------------------------------------
   A text field must never call render().

   render() replaces the whole of #app, which destroys the input the
   person is typing into. The browser then has no focused element, and a
   phone takes that as the signal to put the keyboard away — so the
   keyboard closed after every single character. On a desktop it was
   quieter but no better: the caret jumped to the end of the field on
   every keystroke.

   So nothing below re-renders from an input event. Each one writes the
   value and then updates by hand the few things on screen that depend
   on it. Where the change only affects the preview, the existing
   debounce handles it.
   --------------------------------------------------------------------- */
function briefSet(k, v) {
  const br = briefOf();
  br[k] = v;
  if (k === 'mode') { br.kind = ''; br.features = []; }
  if (k === 'kind' && br.mode === 'site') {
    /* sensible defaults, so the features step can simply be skipped */
    br.features = (FEATURE_PRESET[v] || ['contact']).slice();
  }
  if (k === 'kind' && br.mode === 'store') br.features = ['contact', 'shop', 'whatsapp'];
  S.dirty = true;
  if (k === 'name') { syncBriefNav(); return; }   /* typing — leave the field alone */
  render();
}

/* The only thing the name step shows that depends on the name is the
   state of the Continue button. */
function syncBriefNav() {
  const step = BRIEF_STEPS[S.step] || 'mode';
  const btn = $('.qnav .btn.brand');
  if (!btn) return;
  const ready = briefReady(step);
  btn.classList.toggle('off', !ready);
  if (step === 'name') btn.textContent = ready ? 'Continue' : 'Enter a name';
}
function briefStyle(id) {
  const br = briefOf();
  br.styles = br.styles || [];
  const i = br.styles.indexOf(id);
  if (i >= 0) br.styles.splice(i, 1); else br.styles.push(id);
  if (br.styles.length) br.surprise = false;
  S.dirty = true; render();
}
function briefSurprise() {
  const br = briefOf();
  br.surprise = !br.surprise;
  if (br.surprise) br.styles = [];
  S.dirty = true; render();
}
function briefFeature(id) {
  const br = briefOf();
  br.features = br.features || [];
  const i = br.features.indexOf(id);
  if (i >= 0) br.features.splice(i, 1); else br.features.push(id);
  S.dirty = true; render();
}

function briefReady(step) {
  const br = briefOf();
  if (step === 'mode') return !!br.mode;
  if (step === 'name') return !!(br.name || '').trim();
  if (step === 'kind') return !!br.kind;
  if (step === 'style') return (br.styles || []).length > 0 || !!br.surprise;
  return true;
}

const qNext = () => {
  const step = BRIEF_STEPS[S.step] || 'mode';
  if (!briefReady(step)) {
    return toast({ mode: 'Choose a website or a shop', name: 'The name is the one thing needed',
      kind: 'Choose a category', style: 'Pick a direction, or Surprise me' }[step] || 'Make a choice', 'err');
  }
  if (S.step === BRIEF_STEPS.length - 1) {
    applyBrief(S.cfg, briefOf());
    /* The pages the client chose, built before the designs are composed
       so every proposal renders the same site map. */
    applyPageChoice(S.cfg, briefPages(briefOf()));
    /* ORDER MATTERS, and getting it wrong is what kept the sites empty.
       Both passes refuse to overwrite a filled field, so whichever runs
       first owns the prose. draftContent writes a one-paragraph stock
       about-us from a twelve-category bank; writeSite composes a longer
       one from what the client actually typed. Running draftContent
       first meant the stock paragraph always won and the composer was a
       no-op — the whole site stayed at about a hundred words.
       writeSite goes first and takes the long prose; draftContent then
       fills the short headline fields it is genuinely good at. */
    writeSite(S.cfg);
    regenAll(true);
    S.screen = 'select';
    save(true);
    render();
    const un = unbuiltFeatures(briefOf());
    toast(un.length ? 'Six generated. ' + un.length + ' requested feature(s) are not built and were left off.'
                    : 'Six designs, written and ready to edit', un.length ? 'warn' : 'ok');
    return;
  }
  S.step++; render();
};
const qBack = () => { if (S.step) { S.step--; render(); } };

/* ---------- generated proposals ----------
   Not a template picker. Each card is a composition drawn from the banks
   for this client's Design DNA; the batch records the seed that produced
   it and the structural distance between its members. */
function viewSelect() {

  const dna = batch.dna || deriveDNA(S.cfg), u = batch.uniqueness || { min: 0, mean: 0, verdict: '—', pairs: [] };

  return '<div class="sel"><div class="wrap"><div class="selhead"><div>' +

    '</div><button class="btn ghost sm" onclick="goto(\'q\')">Change the brief</button>' +
    '<button class="btn brand sm" onclick="regenAll()">Regenerate all six</button></div></div>' +

    /* Two measures, and the one that applies depends on what was asked
       for. Choosing a single direction deliberately fixes the palette,

       on overall distance reports a client getting what they chose as a

    '<div class="uniq ' + (u.verdict === 'distinct' || u.verdict.startsWith('distinct') ? 'ok'

/* ---- generation actions. Content is never an input to any of these. ---- */
function regenAll(quiet) {
  /* The sitemap is settled before the directions are composed — v11 §06
     puts it there, and the composition's section order has to be applied
     to pages that already exist. */
  S.cfg.pages = deriveSitemap(S.cfg);
  if (!pageById(S.cfg, S.pageId)) S.pageId = HOME;
  const batch = generate(S.cfg, { seed: newSeed(), locks: (S.cfg.batch || {}).locks || {} });
  S.cfg.batch = batch; S.dirty = true;
  if (!quiet) { save(true); render(); toast('Six fresh compositions — your content untouched', 'ok'); }
}
function regenOne(i) {
  S.cfg.batch = regenerateOne(S.cfg, S.cfg.batch, i, (S.cfg.batch || {}).locks || {});
  S.dirty = true; save(true); render(); toast('Proposal ' + (i + 1) + ' recomposed', 'ok');
}
function lockAxis(axis, value) {
  const b = S.cfg.batch; b.locks = b.locks || {};
  if (b.locks[axis] === value) delete b.locks[axis]; else b.locks[axis] = value;
  S.dirty = true; save(true); render();
}
const unlockAxis = (axis) => { delete S.cfg.batch.locks[axis]; S.dirty = true; save(true); render(); };
function toggleFav(i) {
  const p = S.cfg.batch.proposals[i];
  S.cfg.favourites = S.cfg.favourites || [];
  const at = S.cfg.favourites.findIndex(f => f.id === p.id);
  if (at >= 0) S.cfg.favourites.splice(at, 1);
  else { if (S.cfg.favourites.length >= 12) S.cfg.favourites.shift(); S.cfg.favourites.push(JSON.parse(JSON.stringify(p))); }
  S.dirty = true; save(true); render();
}
function restoreFav(i) {
  const f = S.cfg.favourites[i];
  S.cfg.batch.proposals = S.cfg.batch.proposals.slice(0, -1).concat([JSON.parse(JSON.stringify(f))]);
  S.cfg.batch.uniqueness = uniqueness(S.cfg.batch.proposals);
  S.dirty = true; save(true); render(); toast('Favourite added to the batch', 'ok');
}
function useProposal(i) {
  const p = S.cfg.batch.proposals[i];
  const applied = withComposition(S.cfg, p);
  S.cfg.theme = applied.theme; S.cfg.theme.comp = p;
  S.cfg.pages = applied.pages;
  if (!pageById(S.cfg, S.pageId)) S.pageId = HOME;
  S.screen = 'edit'; S.dirty = true; save(true); render();
  toast(describe(p).title + ' applied — content preserved', 'ok');
}

const SC = { desktop: { w: 1280, box: 320 }, mobile: { w: 390, box: 320 } };
function paintShots() {
  const batch = S.cfg.batch || { proposals: [] };
  $$('.shot').forEach(host => {
    const comp = batch.proposals[+host.dataset.idx];
    if (!comp) return;
    const d = S.device, s = SC[d], avail = host.clientWidth || 300;
    const scale = d === 'desktop' ? avail / s.w : Math.min(0.34, (avail - 40) / s.w);
    const f = document.createElement('iframe');
    f.setAttribute('sandbox', 'allow-scripts'); f.setAttribute('title', describe(comp).title + ' preview');
    f.width = s.w; f.height = Math.ceil(s.box / scale);
    f.style.transform = 'scale(' + scale + ')';
    if (d === 'mobile') { f.style.transform = 'scale(' + scale + ') translateX(-50%)'; f.style.marginInlineStart = '50%'; }
    f.srcdoc = renderProposal(S.cfg, comp, homePage(S.cfg));
    host.innerHTML = ''; host.appendChild(f);
  });
}
function withDesign(cfg, id) {
  const ds = dsById(id), c = JSON.parse(JSON.stringify(cfg));
  c.theme = Object.assign({}, c.theme, { ds: id });
  const tch = cfg.theme._touched || {};
  ['brand', 'accent', 'fontPair', 'motion'].forEach(k => { if (!tch[k]) c.theme[k] = ds.defaults[k]; });
  return c;
}
function useDesign(id) {
  /* Switching engine from the Design tab keeps the composition: the client
     wanted this architecture with a different craft layer, not a reset. */
  const ds = dsById(id), tch = S.cfg.theme._touched || {};
  S.cfg.theme.ds = id;
  if (S.cfg.theme.comp) {
    S.cfg.theme.comp = Object.assign({}, S.cfg.theme.comp, { engine: id });
    const own = SCENE_BANK.find(x => x.engines && x.engines.indexOf(id) >= 0);
    const cur = bankItem('scene', S.cfg.theme.comp.scene);
    if (cur && cur.engines && cur.engines.indexOf(id) < 0)
      S.cfg.theme.comp.scene = own ? own.id : 'light-field';
    if (!own && cur && cur.webgl) S.cfg.theme.comp.scene = 'light-field';
  } else {
    ['brand', 'accent', 'fontPair', 'motion'].forEach(k => { if (!tch[k]) S.cfg.theme[k] = ds.defaults[k]; });
  }
  S.screen = 'edit'; S.dirty = true; save(true); render();
  toast(ds.name + ' applied — content preserved', 'ok');
}


/* ---------- editor ---------- */
const TABS = [['pages', 'Pages'], ['content', 'Content'], ['products', 'Products'], ['design', 'Design'],
  ['sections', 'Sections'], ['media', 'Media'], ['store', 'Store'], ['review', 'Review'], ['publish', 'Publish']];
function viewEdit() {
  return '<div class="edit"><aside class="panel"><div class="ptabs">' +
    TABS.map(([k, l]) => '<button class="' + (S.tab === k ? 'on' : '') + '" onclick="setTab(\'' + k + '\')">' + l + '</button>').join('') +
    '</div><div class="pbody">' + ({ pages: tabPages, content: tabContent, products: tabProducts, design: tabDesign, sections: tabSections, media: tabMedia, store: tabStore, review: tabReview, publish: tabPublish }[S.tab] || tabContent)() + '</div></aside>' +
    '<div class="stage"><div class="stbar"><div class="seg">' +
    ['desktop', 'mobile'].map(d => '<button class="' + (S.device === d ? 'on' : '') + '" onclick="setDevice(\'' + d + '\')">' + d[0].toUpperCase() + d.slice(1) + '</button>').join('') +
    '</div><span class="dsname">' + E(S.cfg.theme.comp ? describe(S.cfg.theme.comp).title : dsById(S.cfg.theme.ds).name) + '</span>' +
    '<div class="right"><button class="btn ghost sm" onclick="goto(\'select\')">Proposals</button>' +
    '<button class="btn ghost sm" onclick="regenAll();goto(\'select\')">Regenerate six</button></div></div>' +
    /* The iframe is NOT written here. An iframe that enters the page
       empty commits about:blank, and the srcdoc assigned to it
       afterwards parses but never lays out — the preview showed its

}
const txt = (p, label, ph, area) => '<label class="f"><span>' + E(label) + '</span>' +
  (area ? '<textarea rows="4" placeholder="' + E(ph || '') + '" oninput="liveSet(\'' + p + '\',this.value)">' + E(dig(S.cfg, p) || '') + '</textarea>'
        : '<input value="' + E(dig(S.cfg, p) || '') + '" placeholder="' + E(ph || '') + '" oninput="liveSet(\'' + p + '\',this.value)">') + '</label>';
const num = (p, label, val, lo, hi) => '<label class="f"><span>' + E(label) + '</span>' +
  '<input type="number" min="' + lo + '" max="' + hi + '" value="' + E(val == null ? '' : val) +
  '" oninput="liveSet(\'' + p + '\',Math.max(' + lo + ',Math.min(' + hi + ',Number(this.value)||0)))"></label>';
const chk = (p, label, on) => '<label class="fchk"><input type="checkbox"' + (on ? ' checked' : '') +
  ' onchange="liveSet(\'' + p + '\',this.checked)"><span>' + E(label) + '</span></label>';

/* ---------------------------------------------------------------------
   Pages.

   A page owns a slice of the section list, so moving a section between
   pages is the one operation that genuinely restructures the site. The
   content never moves with it — content is keyed by section type, so an
   About section carries its text wherever it is shown, and nothing has
   to be retyped.
   --------------------------------------------------------------------- */
const SECTION_LABEL = { hero: 'Hero', about: 'About', services: 'Services',
  products: 'Products', work: 'Work', stats: 'Figures', testimonial: 'Client quote', contact: 'Contact' };

function tabPages() {
  const pages = S.cfg.pages || [];
  const cur = curPage();
  let out = '<div class="grp"><h4>Pages</h4>' +
    '<p class="note">Every page is a real document with its own address, title and description. ' +
    'Click a page to edit it; the preview follows. The navigation on the site is this list.</p>';

  out += pages.map((p, i) => {
    const live = pageIsLive(S.cfg, p);
    const n = liveSections(pageView(S.cfg, p)).length;
    return '<div class="srow' + (p.id === S.pageId ? ' on' : '') + '">' +
      '<button class="arr" ' + (i <= 1 ? 'disabled' : '') + ' onclick="movePage(' + i + ',-1)" title="Move up">↑</button>' +
      '<button class="arr" ' + (i === 0 || i === pages.length - 1 ? 'disabled' : '') + ' onclick="movePage(' + i + ',1)" title="Move down">↓</button>' +
      '<button class="pgname" onclick="setPage(\'' + p.id + '\')"><b>' + E(p.name) + '</b>' +
      '<span class="pgurl">' + E(pageHref(p)) + '</span></button>' +
      (isHome(p) ? '<span class="pillx">home</span>'
        : '<button class="arr" onclick="delPage(\'' + p.id + '\')" title="Delete page">✕</button>') +
      (live ? '' : '<span class="pillx warnx">empty</span>') +
      (n ? '<span class="pillx">' + n + '</span>' : '') +
      '</div>';
  }).join('');

  out += '<button class="btn ghost sm" style="margin-top:10px" onclick="addPage()">Add a page</button></div>';

  if (cur) {
    out += '<div class="grp"><h4>' + E(cur.name) + '</h4>' +
      '<label class="f"><span>Page name</span><input value="' + E(cur.name) + '" ' +
      'oninput="pageSet(\'name\',this.value)"></label>' +
      (isHome(cur)
        ? '<p class="note">The home page always sits at the root of the site, so it has no address of its own.</p>'
        : '<label class="f"><span>Address</span><input value="' + E(cur.slug) + '" ' +
          'oninput="pageSet(\'slug\',this.value)" onblur="pageSlugDone()"></label>' +
          '<p class="note">This page will be at <b>' + E(pageHref(cur)) + '</b></p>') +
      '<label class="f"><span>Browser title</span><input value="' + E(cur.title) + '" ' +
      'placeholder="' + E(isHome(cur) ? (S.cfg.business.name || 'Business name') : cur.name) + '" ' +
      'oninput="pageSet(\'title\',this.value)"></label>' +
      '<label class="f"><span>Search description</span><textarea rows="2" ' +
      'oninput="pageSet(\'description\',this.value)">' + E(cur.description) + '</textarea></label>' +
      '<p class="note">Used for the page title, the search result and the link preview when the page is shared.</p>' +
      '</div>';

    out += '<div class="grp"><h4>What is on this page</h4>' +
      '<p class="note">A section lives on one page at a time. Moving it here takes it off the page it is on now; ' +
      'its content stays exactly as you wrote it.</p>' +
      SECTION_TYPES.map(t => {
        const owner = pageOfType(S.cfg, t);
        const here = owner && owner.id === cur.id;
        const homeOnly = t === 'hero';
        return '<div class="srow">' +
          '<b>' + E(SECTION_LABEL[t] || t) + '</b>' +
          (homeOnly
            ? '<span class="pillx">home only</span>'
            : here
              ? '<span class="pillx">on this page</span>'
              : '<button class="btn ghost sm" onclick="moveSectionTo(\'' + t + '\',\'' + cur.id + '\')">Move here</button>' +
                '<span class="pgurl">' + E(owner ? owner.name : 'nowhere') + '</span>') +
          '</div>';
      }).join('') + '</div>';
  }
  return out;
}

function pageSet(k, v) {
  const p = curPage(); if (!p) return;
  if (k === 'slug') {
    if (isHome(p)) return;
    /* Cleaned, but NOT de-duplicated here: renaming a slug to one that
       is taken would rewrite the field under the cursor mid-word. The
       clash is settled on blur, by pageSlugDone(). */
    v = slugify(v);
  }
  p[k] = v;
  S.dirty = true;

  /* update the few places this is shown, in place */
  if (k === 'name') {
    const row = $('.srow.on .pgname b');
    if (row) row.textContent = v || 'Untitled';
    const h = $('.pbody .grp:nth-of-type(2) h4');
    if (h) h.textContent = v || 'This page';
  }
  if (k === 'slug') {
    const url = $('.srow.on .pgurl');
    if (url) url.textContent = pageHref(p);
    const hint = $('.pbody .grp:nth-of-type(2) .note b');
    if (hint) hint.textContent = pageHref(p);
  }
  schedule();
}

/* Two pages at one address makes one of them unreachable, so the clash
   has to be settled — but never under the cursor, which is why it does
   not happen on input. It happens when the field is left, and again
   whenever the project is saved, so a clash can exist while someone is
   mid-word and can never be stored. */
function settleSlugs(cfg) {
  const seen = {};
  let changed = null;
  (cfg.pages || []).forEach(p => {
    if (isHome(p)) { seen[''] = true; return; }
    const base = slugify(p.slug) || 'page';
    let v = base, n = 2;
    while (seen[v]) { v = base + '-' + n; n++; }
    if (v !== p.slug) changed = v;
    p.slug = v;
    seen[v] = true;
  });
  return changed;
}
function pageSlugDone() {
  const p = curPage(); if (!p || isHome(p)) return;
  const changed = settleSlugs(S.cfg);
  if (changed) toast('That address was taken — using /' + changed + '/', 'warn');
  S.dirty = true; render();
}

function addPage() {
  const pages = S.cfg.pages || (S.cfg.pages = []);
  let name = 'New page', slug = 'new-page', n = 2;
  while (pages.some(p => p.slug === slug)) { slug = 'new-page-' + n; name = 'New page ' + n; n++; }
  const p = blankPage(newPageId(), name, slug, []);
  pages.push(p);
  S.pageId = p.id; S.dirty = true; render();
  toast('Page added — move a section onto it to fill it', 'ok');
}

function delPage(id) {
  const pages = S.cfg.pages || [];
  const p = pageById(S.cfg, id);
  if (!p || isHome(p)) return;
  /* Sections on it go back to the home page rather than being deleted
     with it: a page is a container, and emptying the bin is not what
     deleting a page should mean. */
  const home = homePage(S.cfg);
  const moved = (p.sections || []).length;
  if (home) (p.sections || []).forEach(s => {
    if (!home.sections.some(x => x.type === s.type)) home.sections.push(s);
  });
  S.cfg.pages = pages.filter(x => x !== p);
  if (S.pageId === id) S.pageId = HOME;
  S.dirty = true; render();
  toast(moved ? 'Page deleted — its ' + moved + ' section(s) moved to Home' : 'Page deleted', 'ok');
}

function movePage(i, d) {
  const a = S.cfg.pages || [], j = i + d;
  /* Home stays first: it is the site's root, not an entry in a list. */
  if (i === 0 || j <= 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  S.dirty = true; render();
}

function moveSectionTo(type, pageId) {
  const to = pageById(S.cfg, pageId); if (!to) return;
  let moved = null;
  (S.cfg.pages || []).forEach(p => {
    const i = (p.sections || []).findIndex(s => s.type === type);
    if (i >= 0 && p !== to) { moved = p.sections.splice(i, 1)[0]; }
  });
  /* Moving carries the instance, so its id and anything it owns travel
     with it and nothing has to be retyped. */
  if (!moved) moved = blankSection(type);
  if (!to.sections.some(s => s.type === type)) to.sections.push(moved);
  S.dirty = true; render();
  toast((SECTION_LABEL[type] || type) + ' moved to ' + to.name + ' — content unchanged', 'ok');
}

/* ---------------------------------------------------------------------
   Publish — the address, the crawler policy, and an honest scorecard.
   --------------------------------------------------------------------- */
function tabPublish() {
  const site = S.cfg.site || (S.cfg.site = blankSite());
  const o = siteOrigin(S.cfg);
  const pages = (S.cfg.pages || []).filter(p => pageIsLive(S.cfg, p));

  let out = '<div class="grp"><h4>Where this site will live</h4>' +
    '<label class="f"><span>Web address</span>' +
    '<input value="' + E(site.url) + '" placeholder="example.com" oninput="siteSet(\'url\',this.value)"></label>' +
    (o ? '<p class="note">Pages will be at <b>' + E(o) + '/</b> — the sitemap and the canonical links use this.</p>'
       : '<p class="note warnnote">Without an address there is no sitemap and no canonical links. ' +
         'Both need an absolute address, and guessing one would put your pages under a domain that is not yours. ' +
         'Everything else still exports.</p>') +
    '<label class="fchk"><input type="checkbox"' + (site.robots.indexable === false ? '' : ' checked') +
    ' onchange="siteSet(\'robots.indexable\',this.checked)"><span>Let search engines index this site</span></label>' +
    '<p class="note">Switching this off writes a robots.txt asking crawlers to stay away and a noindex tag on every page. ' +
    'It is a request, not a lock — crawlers choose whether to honour it, and it keeps nothing private.</p>' +
    '</div>';

  out += '<div class="grp"><h4>Download the website</h4>' +
    '<p class="note">' + pages.length + ' page(s), plus robots.txt, a sitemap, an icon, a manifest and a 404 page. ' +
    'Plain HTML and CSS — nothing to build, nothing to install. Drag the folder onto a host and it is live.</p>' +
    '<button class="btn brand" onclick="exportSite()">Download website (.zip)</button> ' +
    '<button class="btn ghost sm" onclick="exportCfg()">Export settings only</button></div>';

  /* the scorecard */
  const checks = launchChecks(S.cfg);
  const groups = [];
  checks.forEach(c => { if (groups.indexOf(c.group) < 0) groups.push(c.group); });
  const counts = { ready: 0, attention: 0, waiting: 0, na: 0 };
  checks.forEach(c => { counts[c.state]++; });

  out += '<div class="grp"><h4>Launch readiness</h4>' +
    '<p class="note">Nothing here is green because the feature exists. It is green because it is true of this site now. ' +
    'Anything untested says so.</p>' +
    '<div class="lstats">' +
    '<span class="pillx ok">' + counts.ready + ' ready</span>' +
    '<span class="pillx warnx">' + counts.attention + ' need attention</span>' +
    '<span class="pillx">' + counts.waiting + ' waiting on you</span>' +
    '</div>';

  groups.forEach(g => {
    out += '<div class="lgroup"><h5>' + E(g) + '</h5>' +
      checks.filter(c => c.group === g).map(c => {
        const st = LAUNCH_STATE[c.state] || LAUNCH_STATE.na;
        return '<div class="lrow ' + st.cls + '"><div class="lhead"><b>' + E(c.label) + '</b>' +
          '<span class="lstate">' + E(st.label) + '</span></div>' +
          (c.detail ? '<p>' + E(c.detail) + '</p>' : '') + '</div>';
      }).join('') + '</div>';
  });
  out += '</div>';
  return out;
}

let siteTmr;
function siteSet(path, v) {
  const site = S.cfg.site || (S.cfg.site = blankSite());
  if (path === 'robots.indexable') { site.robots.indexable = !!v; S.dirty = true; render(); return; }
  site[path] = v;
  S.dirty = true;
  /* The address is typed, so the panel is never rebuilt under the
     cursor. The hint updates in place; the scorecard — which reads the
     whole configuration — waits until typing stops. */
  const o = siteOrigin(S.cfg);
  const hint = $('.pbody .grp:first-of-type .note');
  if (hint) {
    hint.className = o ? 'note' : 'note warnnote';
    hint.innerHTML = o
      ? 'Pages will be at <b>' + E(o) + '/</b> — the sitemap and the canonical links use this.'
      : 'Without an address there is no sitemap and no canonical links. Both need an absolute address, ' +
        'and guessing one would put your pages under a domain that is not yours. Everything else still exports.';
  }
  clearTimeout(siteTmr);
  siteTmr = setTimeout(() => { if (S.tab === 'publish') render(); }, 900);
}

/* Build the site and hand it over as one file. Everything happens in
   the browser: there is no server in this build to ask. */
function exportSite() {
  let files, bytes;
  try {
    files = buildSite(S.cfg);
    bytes = zipFiles(files);
  } catch (err) {
    toast('Could not build the site: ' + (err && err.message ? err.message : err), 'err');
    return;
  }
  const blob = new Blob([bytes], { type: 'application/zip' });
  saveFile(fileStem(S.cfg.business.name, 'website') + '-website.zip', blob,
    files.length + ' files — unzip it and drag the folder onto a host');
}

/* ---------------------------------------------------------------------
   Store — the Shipping and Payments centers.

   Everything here reads the registry. There is no list of couriers in
   this file and no branch that names one: add a descriptor and it
   appears, remove one and it goes.
   --------------------------------------------------------------------- */
function providerRow(kind, desc, entry) {
  const st = providerState(S.cfg, desc, entry);
  const on = !!(entry && entry.on);
  const creds = desc.credentials || [];
  let h = '<div class="prov ' + st.state + '">' +
    '<div class="phead">' +
    '<label class="sw2"><input type="checkbox"' + (on ? ' checked' : '') +
      ' onchange="provToggle(\'' + kind + '\',\'' + desc.id + '\',this.checked)"><b>' + E(desc.name) + '</b></label>' +
    '<span class="pstate">' + E(st.label) + '</span></div>';

  const tags = [];
  if (kind === 'couriers') {
    if (desc.cod) tags.push('cash on delivery');
    if (desc.tracking) tags.push('tracked');
    (desc.services || []).forEach(sv => tags.push(sv.name + ' · ' + sv.days + ' days'));
  } else {
    if (desc.kind) tags.push(desc.kind);
    (desc.currencies || []).forEach(c => tags.push(c));
  }
  if (desc.countries && desc.countries.length) tags.push(desc.countries.join(', '));
  if (tags.length) h += '<div class="ptags">' + tags.map(t => '<span>' + E(t) + '</span>').join('') + '</div>';

  if (on && creds.length) {
    h += '<div class="pcreds">' + creds.map(c => {
      const have = !!((entry.credentials || {})[c.key]);
      return '<label class="fchk"><input type="checkbox"' + (have ? ' checked' : '') +
        ' onchange="provCred(\'' + kind + '\',\'' + desc.id + '\',\'' + c.key + '\',this.checked)">' +
        '<span>' + E(c.label) + ' is set up</span></label>';
    }).join('') +
    '<p class="note">Tick what you hold. The values themselves are never typed here and never stored: ' +
    'this studio builds static pages, and anything typed in would be shipped inside them. ' +
    'They belong in your host’s environment settings, on the server.</p></div>';
  }
  if (on && st.detail) h += '<p class="note">' + E(st.detail) + '</p>';
  if (desc.site) h += '<p class="note"><a href="' + E(desc.site) + '" target="_blank" rel="noopener noreferrer">' +
    E(desc.site.replace(/^https:\/\//, '').replace(/\/$/, '')) + '</a></p>';
  return h + '</div>';
}

      '<label class="f"><span>Free over</span><input type="number" min="0" value="' + E(z.free == null ? '' : z.free) + '" oninput="zoneSet(' + i + ',\'free\',Number(this.value)||0)"></label>' +
      '<label class="f"><span>Takes</span><input value="' + E(z.days || '') + '" placeholder="1-2 days" oninput="zoneSet(' + i + ',\'days\',this.value)"></label>' +
      '<button class="arr" onclick="zoneDel(' + i + ')" title="Remove">✕</button></div>').join('') +
    '<button class="btn ghost sm" onclick="zoneAdd()">Add a zone</button></div>';

  out += '<div class="grp"><h4>Payment methods</h4>' +
    '<p class="note">Cash on delivery needs a courier that collects it; it stays unavailable until one is switched on.</p>' +
    paymentList().map(d => providerRow('payments', d, c.payments[d.id])).join('') +

  out += '<div class="grp"><h4>What you tell customers</h4>' +
    '<label class="f"><span>Shipping note</span><textarea rows="2" oninput="policySet(\'shipping\',this.value)">' +
      E(c.policy.shipping) + '</textarea></label>' +
    '<label class="f"><span>Returns note</span><textarea rows="2" oninput="policySet(\'returns\',this.value)">' +
      E(c.policy.returns) + '</textarea></label></div>';

  out += '<div class="grp"><h4>Product experience</h4>' +
    '<p class="note">Four levels, named for what they do. "5D" is not a web technology and there is no standard behind it, ' +
    'so it is not used as a label here.</p>' +
    EXPERIENCE_TIERS.map(t =>

      '<span class="lstate">' + (t.state === 'built' ? 'Built' : 'Planned') + '</span></div>' +
      '<p>' + E(t.what) + ' ' + E(t.detail) + '</p></div>').join('') +
    '</div>';
  return out;

function provCred(kind, id, key, have) {

/* subject-safe cropping: click the photo to set the point every crop keeps */
function focalPicker(id, src, f) {
  f = f || { x: 50, y: 50 };
  return '<div class="focal" onclick="setFocal(\'' + id + '\',event)"><img src="' + src + '" alt="" style="' + focal(f) + '">' +
    '<span class="pin" style="left:' + f.x + '%;top:' + f.y + '%"></span>' +
    '<span class="hint">Click the subject — crops keep this point in frame</span></div>';
}
function setFocal(path, ev) {
  const box = ev.currentTarget.getBoundingClientRect();
  const x = Math.round((ev.clientX - box.left) / box.width * 100), y = Math.round((ev.clientY - box.top) / box.height * 100);
  const parts = path.split('.'), idx = parts.pop();
  const target = /^\d+$/.test(idx) ? dig(S.cfg, parts.join('.'))[+idx] : dig(S.cfg, path);
  if (/^\d+$/.test(idx)) target.focal = { x, y }; else S.cfg.media.heroFocal = { x, y };
  S.dirty = true; render();
}

        (!live && s.visible && s.type !== 'hero' ? '<span class="pillx warnx">empty</span>' : '') + '</div>';
    }).join('') + '</div>';
}
const moveSec = (i, d) => { const a = (curPage() || {}).sections || [], j = i + d; if (j < 0 || j >= a.length) return; [a[i], a[j]] = [a[j], a[i]]; S.dirty = true; render(); };

    txt(p + '.poster', 'Poster image URL', 'dist/media/website-hero-poster.jpg') +

    chk(p + '.settings.autoplay', 'Autoplay where the browser allows it', st.autoplay !== false) +

}

/* live preview */
let tmr;
const schedule = () => { clearTimeout(tmr); tmr = setTimeout(paintLive, 260); };
function paintLive() {
  const host = $('#stageframe'); if (!host) return;
  previewMode(true);
  let html;
  try { html = dsById(S.cfg.theme.ds).render(pageView(S.cfg, curPage())); } finally { previewMode(false); }

  /* Built detached and given its content BEFORE it joins the page, the
     way the proposal thumbnails already did it. The old code put an
     empty iframe in the page and assigned srcdoc after; that frame had
     already committed about:blank, and what arrived next was parsed
     but never laid out. Every element measured 0x0, innerText fell
     back to textContent — so the text was all there to a script, and
     the reader saw white. */
  const f = document.createElement('iframe');
  f.id = 'live';
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('title', 'Live preview');
  f.srcdoc = html;
  const old = host.querySelector('#live');
  if (old) host.replaceChild(f, old); else host.appendChild(f);
}

/* The preview is sandboxed, so this message is the only thing that crosses
   back. Anything that is not the shape we expect is dropped on the floor. */
const SECTION_TAB = { hero: 'content', about: 'content', services: 'content',
  work: 'content', stats: 'content', testimonial: 'content', contact: 'content',
  products: 'products' };
const SECTION_GROUP = { hero: 'Hero', about: 'About', services: 'Services', work: 'Work',
  stats: 'Figures', testimonial: 'Client quote', contact: 'Contact', products: 'Storefront' };
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d.ws !== 'string') return;

  /* A page link was clicked inside the preview. In the full-screen
     preview that means: show that page. In the editor it means: edit
     that page. Either way the id is checked against this project's own
     pages before anything happens — the message crosses a sandbox
     boundary and is treated as a request, not an instruction. */
  if (d.ws === 'page') {
    if (typeof d.page !== 'string' || !pageById(S.cfg, d.page)) return;
    if (S.pvId !== null) { S.pvPageId = d.page; paintPv(); }
    else { S.pageId = d.page; render(); }
    return;
  }

  if (d.ws !== 'edit' || typeof d.section !== 'string') return;
  const tab = SECTION_TAB[d.section]; if (!tab) return;
  const first = S.tab !== tab;
  S.tab = tab; render();
  requestAnimationFrame(() => {
    const want = SECTION_GROUP[d.section];
    const grp = [...document.querySelectorAll('.pbody .grp h4')]
      .find(h => h.textContent.trim().toLowerCase().startsWith(want.toLowerCase()));
    if (!grp) return;
    grp.parentNode.scrollIntoView({ behavior: first ? 'auto' : 'smooth', block: 'start' });
    grp.parentNode.classList.add('grp-hot');
    setTimeout(() => grp.parentNode.classList.remove('grp-hot'), 1400);
    const inp = grp.parentNode.querySelector('input,textarea,select');
    if (inp) inp.focus({ preventScroll: true });
  });
});

const openPv = (id) => { S.pvId = id; S.pvPageId = HOME; $('#pv').classList.add('on'); document.body.style.overflow = 'hidden'; paintPv(); };

function paintPv() {
  const list = (S.cfg.batch || { proposals: [] }).proposals;
  const comp = list[S.pvId]; if (!comp) return;
  const d = S.device, dd = describe(comp), pal = bankItem('palette', comp.palette) || {};
  const w = d === 'desktop' ? Math.min(window.innerWidth - 48, 1440) : 390;
  $('#pv').innerHTML = '<div class="pvbar"><span class="sw">' +
    [pal.nightBg, pal.brand, pal.accent].map(c => '<i style="background:' + (c || '#888') + '"></i>').join('') + '</span>' +
    '<b>' + E(dd.title) + '</b><span class="pvline">' + E(dd.line) + '</span>' +
    '<div class="seg">' + ['desktop', 'mobile'].map(x =>
      '<button class="' + (d === x ? 'on' : '') + '" onclick="setDeviceP(\'' + x + '\')">' + x[0].toUpperCase() + x.slice(1) + '</button>').join('') + '</div>' +
    '<div class="right"><button class="btn ghost sm" onclick="cyclePv(-1)">‹</button>' +

    '<button class="btn ghost sm" onclick="closePv()">Close</button></div></div>' +
    '<div class="pvstage ' + d + '"><div class="pvwait"><i></i>Building the preview…</div></div>';
  /* Built detached and given its srcdoc before insertion, the way
     paintShots does it, so the frame never commits an about:blank it
     then has to navigate away from. It is transparent until it has
     loaded: each preview is a complete document carrying its own copy
     of the 3D library, which takes a second or two, and an empty white
     rectangle for that long reads as a failure rather than a wait. */
  const f = document.createElement('iframe');
  f.setAttribute('sandbox', 'allow-scripts');
  f.setAttribute('title', 'Full preview — ' + dd.title);
  f.style.width = w + 'px';
  f.style.height = (window.innerHeight - 110) + 'px';
  f.addEventListener('load', () => {
    f.classList.add('ready');
    const wait = f.parentNode && f.parentNode.querySelector('.pvwait');
    if (wait) wait.remove();
  });
  previewMode(true, 'nav');
  try { f.srcdoc = renderProposal(S.cfg, comp, pageById(S.cfg, S.pvPageId) || homePage(S.cfg)); }
  finally { previewMode(false); }
  $('#pv .pvstage').appendChild(f);
}

}

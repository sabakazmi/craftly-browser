/* =====================================================================
   THE IMAGE LABS, IN THE BROWSER
   =====================================================================

   The twelve creative labs supplied in the Python package run on Pillow
   and genuinely work — the demo produced twenty-five real files. But a
   Python worker cannot be part of a thirty-second preview: it needs an
   upload, a queue, a round trip and a server that this single-file build
   does not have. The supplied brief is explicit about the split:

     "Use instant browser rendering for most effects, and run expensive
      jobs only when necessary."
     "Do not call Python, Blender or expensive AI image generation for
      every preview."

   So the three labs that belong IN the creation flow are implemented
   here against Canvas, and run in milliseconds with no server:

     labCrops    ← image_variants   six responsive derivatives
     labPalette  ← palette_lab      dominant colours from an image
     labCatalog  ← catalog_lab      a CSV of products, normalised

   They are deliberate re-implementations of the same algorithms, not
   approximations of them: the same six preset sizes, the same
   contain-fit onto a white ground, the same median-cut quantisation to
   six colours ordered by population, and the same refusal to invent a
   price. services/creative-labs/parity.py checks the two agree, so the
   browser and the worker cannot drift apart without a test failing.

   The other nine labs stay in Python, where they belong: batch work,
   social graphics, hero banners, QA sweeps over a folder. Those run on
   the server, out of the preview path.

   WHAT THESE DO NOT DO. No background removal, no object segmentation,
   no relighting, no generative editing. The Python package is careful to
   say so of itself — "simple catalog stage, not object segmentation or
   generative relighting" — and nothing here claims more.
   ===================================================================== */

/* The same six presets as SIZES in creative_labs.py. */
const LAB_SIZES = {
  square:    [1200, 1200],
  portrait:  [900, 1200],
  landscape: [1600, 900],
  social:    [1080, 1350],
  story:     [1080, 1920],
  thumb:     [480, 480]
};

const labSlug = (s) => String(s || '').toLowerCase()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'item';

/* Read a File into an ImageBitmap (or an <img>, where bitmaps are not
   available), with EXIF orientation applied by the decoder. */
function labLoad(file) {
  return new Promise((resolve, reject) => {
    if (typeof createImageBitmap === 'function') {
      createImageBitmap(file, { imageOrientation: 'from-image' })
        .then(resolve).catch(() => fallback());
    } else fallback();
    function fallback() {
      const url = URL.createObjectURL(file);
      const im = new Image();
      im.onload = () => { URL.revokeObjectURL(url); resolve(im); };
      im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('that file is not an image this browser can read')); };
      im.src = url;
    }
  });
}

const labCanvas = (w, h) => {
  const c = (typeof OffscreenCanvas === 'function') ? new OffscreenCanvas(w, h)
    : Object.assign(document.createElement('canvas'), { width: w, height: h });
  return c;
};

function labBlob(canvas, type, quality) {
  if (canvas.convertToBlob) return canvas.convertToBlob({ type, quality });
  return new Promise(res => canvas.toBlob(res, type, quality));
}

/* ---------- labCrops ← image_variants -------------------------------
   Contain-fit, centred, on a white ground — the same as Pillow's
   ImageOps.contain followed by an alpha_composite onto white. Contain
   rather than cover because a product photograph that has been cropped
   to fill a 9:16 story frame has usually lost the product. */
async function labCrops(file, opts) {
  opts = opts || {};
  const img = await labLoad(file);
  const stem = labSlug(opts.name || (file.name || 'item').replace(/\.[^.]+$/, ''));
  /* WebP where the browser really encodes it; some do not and silently
     hand back a PNG, which would make the "webp" label a lie. */
  const webpOk = await labWebpSupported();
  const out = [];
  for (const key of Object.keys(LAB_SIZES)) {
    const [W, H] = LAB_SIZES[key];
    const c = labCanvas(W, H);
    const g = c.getContext('2d');
    g.fillStyle = '#ffffff';
    g.fillRect(0, 0, W, H);
    g.imageSmoothingEnabled = true;
    g.imageSmoothingQuality = 'high';
    const s = Math.min(W / img.width, H / img.height);
    const dw = Math.round(img.width * s), dh = Math.round(img.height * s);
    g.drawImage(img, Math.round((W - dw) / 2), Math.round((H - dh) / 2), dw, dh);
    const formats = webpOk ? [['image/webp', .85, 'webp'], ['image/jpeg', .86, 'jpg']]
                           : [['image/jpeg', .86, 'jpg']];
    for (const [type, q, ext] of formats) {
      const blob = await labBlob(c, type, q);
      out.push({ preset: key, format: ext, width: W, height: H,
        bytes: blob.size, name: stem + '_' + key + '.' + ext, blob,
        url: URL.createObjectURL(blob) });
    }
  }
  if (img.close) img.close();
  return { stem, webp: webpOk, files: out,
    total: out.reduce((n, f) => n + f.bytes, 0) };
}

let LAB_WEBP = null;
async function labWebpSupported() {
  if (LAB_WEBP !== null) return LAB_WEBP;
  try {
    const c = labCanvas(2, 2);
    const b = await labBlob(c, 'image/webp', .8);
    LAB_WEBP = !!b && b.type === 'image/webp';
  } catch (e) { LAB_WEBP = false; }
  return LAB_WEBP;
}

/* ---------- labPalette ← palette_lab --------------------------------
   Pillow quantises with median cut to six entries and orders them by
   how many pixels map to each ENTRY. The distinction matters, and the
   first version of this function got it wrong.

   Median cut repeatedly splits the most populous box. A logo with a
   solid navy field covering 55% of the image has that field split into
   several boxes, each now smaller than the single box holding a 22%
   brass field — so brass ranked first and navy did not appear at all.
   Worse, a box straddling two flat colours averages to a third that is
   nowhere in the image: the test produced #9A7744 from a picture
   containing only navy, brass and white.

   Pillow does not have this problem because identical pixels map to one
   palette entry however the boxes fell. So this counts the same way:
   bin the pixels, rank the bins by population, then take bins that are
   far enough apart in colour to be different colours rather than shades
   of one. The value reported for each is the mean of the pixels IN THAT
   BIN, which is a colour the image actually contains.

   Near-white and near-black are separated out of the result rather than
   out of the histogram — a product shot on a white sweep is mostly its
   background, and a palette of six whites is not a palette. They are
   returned under `neutral` so nothing is hidden, and so the surfaces can
   be taken from the image's own light and dark ends. */
async function labPalette(file) {
  const img = await labLoad(file);
  const s = Math.min(1, 128 / Math.max(img.width, img.height));
  const W = Math.max(1, Math.round(img.width * s)), H = Math.max(1, Math.round(img.height * s));
  const c = labCanvas(W, H);
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(img, 0, 0, W, H);
  const d = g.getImageData(0, 0, W, H).data;
  if (img.close) img.close();

  /* 5 bits per channel: fine enough that two colours a person would call
     different land in different bins, coarse enough that JPEG noise
     across one flat field does not scatter into dozens. */
  const SHIFT = 3, SIDE = 32;
  const bins = new Map();
  let total = 0;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 128) continue;                 /* transparent */
    const r = d[i], g2 = d[i + 1], b2 = d[i + 2];
    const key = ((r >> SHIFT) * SIDE + (g2 >> SHIFT)) * SIDE + (b2 >> SHIFT);
    let e = bins.get(key);
    if (!e) { e = { n: 0, r: 0, g: 0, b: 0 }; bins.set(key, e); }
    e.n++; e.r += r; e.g += g2; e.b += b2; total++;
  }
  if (!total) return { dominant: [], neutral: [], count: 0 };

  const hex = (r, gg, b) => '#' + [r, gg, b].map(v =>
    Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('').toUpperCase();

  const ranked = [...bins.values()]
    .map(e => {
      const col = [e.r / e.n, e.g / e.n, e.b / e.n];
      return { rgb: col, hex: hex(col[0], col[1], col[2]), n: e.n,
        share: Math.round(e.n / total * 100),
        lum: (col[0] * .299 + col[1] * .587 + col[2] * .114) / 255 };
    })
    .sort((a, b) => b.n - a.n);

  /* Collapse bins that are near-neighbours of one already taken, adding
     their weight to it. Without this a gradient returns six samples of
     one colour and calls them a palette. */
  const near = (a, b) => {
    const dr = a.rgb[0] - b.rgb[0], dg = a.rgb[1] - b.rgb[1], db = a.rgb[2] - b.rgb[2];
    return Math.sqrt(dr * dr + dg * dg + db * db) < 56;
  };
  const kept = [];
  for (const c of ranked) {
    const hit = kept.find(k => near(k, c));
    if (hit) { hit.n += c.n; hit.share = Math.round(hit.n / total * 100); continue; }
    kept.push(c);
    if (kept.length >= 12) break;
  }
  kept.sort((a, b) => b.n - a.n);

  return {
    count: total,
    dominant: kept.filter(x => x.lum > .08 && x.lum < .94).slice(0, 6),
    neutral: kept.filter(x => x.lum <= .08 || x.lum >= .94).slice(0, 4)
  };
}

/* Turn an uploaded logo into a palette the generator can actually use.
   The brand colour is the most-populated non-neutral; the accent is the
   next one far enough away in hue to read as a second colour rather than
   a shade of the first. Surfaces come from the image's own light and
   dark ends when they are usable, and from a neutral pair when they are
   not — and every one of the four is then run through the application's
   contrast repair, so a logo can never produce an illegible site. */
async function labBrandPalette(file, label) {
  const p = await labPalette(file);
  if (!p.dominant.length) return null;
  const h2r = (h) => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
  const hue = (hx) => {
    const [r, g, b] = h2r(hx).map(v => v / 255);
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
    if (!d) return -1;
    let hh = mx === r ? ((g - b) / d + (g < b ? 6 : 0)) : mx === g ? ((b - r) / d + 2) : ((r - g) / d + 4);
    return hh * 60;
  };
  const brand = p.dominant[0].hex;
  const bh = hue(brand);
  const far = p.dominant.slice(1).find(x => {
    const d = Math.abs(hue(x.hex) - bh);
    return hue(x.hex) < 0 || bh < 0 ? true : Math.min(d, 360 - d) > 40;
  });
  const accent = (far || p.dominant[1] || p.dominant[0]).hex;

  const lightEnd = p.neutral.filter(x => x.lum >= .94)[0];
  const darkEnd = p.neutral.filter(x => x.lum <= .08)[0];
  const dayBg = lightEnd ? lightEnd.hex : '#F7F7F5';
  const dayInk = darkEnd ? darkEnd.hex : '#0D0D10';
  const nightBg = darkEnd ? darkEnd.hex : '#0A0A0C';
  const nightInk = lightEnd ? lightEnd.hex : '#F2F2F0';

  return {
    id: 'brand-upload',
    name: (label || 'Your logo') + ' colours',
    family: 'custom', fromUpload: true,
    brand, accent,
    /* readable() nudges a colour toward the ink until it clears 4.5:1,
       so a pale gold logo cannot produce unreadable body text. */
    dayBg, dayInk: readable(dayInk, dayBg, dayInk, 4.5),
    nightBg, nightInk: readable(nightInk, nightBg, nightInk, 4.5),
    fit: () => 1,
    swatch: p.dominant.slice(0, 4).map(x => x.hex)
  };
}

/* Install it into the bank and let every direction reach it. A palette
   no direction permits can never be chosen, because every proposal now
   carries a direction. */
function labUsePalette(pal) {
  if (!pal) return false;
  const i = PALETTE_BANK.findIndex(x => x.id === pal.id);
  if (i >= 0) PALETTE_BANK[i] = pal; else PALETTE_BANK.push(pal);
  DIRECTIONS.forEach(d => {
    const at = d.axes.palette.indexOf(pal.id);
    if (at >= 0) d.axes.palette.splice(at, 1);
    /* first, so the client's own colours lead in every direction */
    d.axes.palette.unshift(pal.id);
  });
  return true;
}

function labDropPalette() {
  const i = PALETTE_BANK.findIndex(x => x.id === 'brand-upload');
  if (i >= 0) PALETTE_BANK.splice(i, 1);
  DIRECTIONS.forEach(d => {
    const at = d.axes.palette.indexOf('brand-upload');
    if (at >= 0) d.axes.palette.splice(at, 1);
  });
}

/* ---------- labCatalog ← catalog_lab --------------------------------
   The same normalisation and the same refusal: a row whose price cannot
   be read keeps a null price and earns a warning. It is never guessed,
   never defaulted to zero, and never dropped silently. */
function labParseCSV(text) {
  const rows = [];
  let row = [], field = '', q = false;
  const s = String(text).replace(/^﻿/, '');
  for (let i = 0; i < s.length; i++) {
    const c = s[i];
    if (q) {
      if (c === '"') { if (s[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ',') { row.push(field); field = ''; }
    else if (c === '\n' || c === '\r') {
      if (c === '\r' && s[i + 1] === '\n') i++;
      row.push(field); field = '';
      if (row.length > 1 || row[0] !== '') rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function labCatalog(text) {
  const rows = labParseCSV(text);
  if (!rows.length) return { products: [], warnings: ['the file is empty'], count: 0 };
  const head = rows[0].map(h => String(h || '').trim().toLowerCase());
  const col = (names) => { for (const n of names) { const i = head.indexOf(n); if (i >= 0) return i; } return -1; };
  const ix = {
    name: col(['name', 'title', 'product']), sku: col(['sku', 'id', 'code']),
    price: col(['price', 'amount']), currency: col(['currency']),
    category: col(['category', 'type']), description: col(['description', 'desc']),
    image: col(['image', 'photo', 'img']), inventory: col(['inventory', 'stock', 'qty'])
  };
  const products = [], warnings = [], seen = new Set();
  if (ix.name < 0) warnings.push('no "name" column was found — the first row must be a header');

  rows.slice(1).forEach((r, n) => {
    const line = n + 2;
    const get = (k) => ix[k] >= 0 ? String(r[ix[k]] || '').trim() : '';
    const name = get('name');
    if (!name) { warnings.push('row ' + line + ': no name, so the row was skipped'); return; }
    const sku = get('sku') || labSlug(name);
    if (seen.has(sku)) { warnings.push('row ' + line + ': duplicate SKU "' + sku + '", skipped'); return; }
    seen.add(sku);
    const raw = get('price').replace(/,/g, '');
    let price = null;
    if (raw === '') warnings.push('row ' + line + ': no price — left blank for you to fill in');
    else if (!isFinite(Number(raw)) || Number(raw) < 0) {
      warnings.push('row ' + line + ': "' + get('price') + '" is not a price — left blank rather than guessed');
    } else price = Number(raw);

    products.push({ id: sku, name, slug: labSlug(name), price,
      currency: get('currency') || (S.cfg.business.currency || 'PKR'),
      category: get('category') || '', desc: get('description'),
      img: get('image'), inventory: get('inventory') });
  });
  return { products, warnings, count: products.length, skipped: Math.max(0, rows.length - 1 - products.length) };
}

/* What the catalogue becomes in the configuration. Price stays a string
   in the product schema because it is the owner's own text in their own
   currency; a null price becomes an empty string, which the renderer
   shows as "price on request" rather than as a zero. */
function labApplyCatalog(cfg, parsed) {
  const items = parsed.products.map(p => ({
    name: p.name,
    price: p.price === null ? '' : String(p.price),
    desc: p.desc || '',
    img: /^https?:\/\//i.test(p.img) || p.img.startsWith('/') ? p.img : ''
  }));
  cfg.content.products = cfg.content.products || { heading: 'Shop', intro: '', items: [] };
  cfg.content.products.items = items;
  (cfg.pages || []).forEach(pg => (pg.sections || []).forEach(s => {
    if (s.type === 'products') s.visible = items.length > 0;
  }));
  return items.length;
}
/* =====================================================================
   CART, CHECKOUT AND ORDERS
   =====================================================================

   This was the largest honest gap in the product, and it has been named
   as such in every report: there was a catalogue and a provider
   registry, and nothing could be bought.

   WHAT IS REAL HERE

   A working cart: add, change quantity, remove, persisted across a
   visit. A checkout that collects what a courier actually needs. Totals
   computed from the delivery zones the owner configured, including the
   free-over threshold. An order that is genuinely placed, through a
   channel that genuinely exists, with a reference the customer keeps.

   WHAT IS DELIBERATELY NOT HERE

   No payment is taken, and no order is ever shown as paid. That is not
   a limitation to be worked around; it is the only honest position
   available. Taking a card payment requires a gateway account, a server
   holding the secret, and the provider's own approval of the merchant —
   none of which a generated static site has. So:

     cash on delivery   the order is COMPLETE. The customer has ordered,
                        the merchant has the order, money changes hands
                        at the door. Nothing is pretended.
     bank transfer      the order is COMPLETE and awaiting payment. The
                        merchant's own account details are shown; the
                        customer pays and the merchant confirms. The
                        site never claims to have seen the money.
     card / wallet      NOT OFFERED at checkout, however the provider is
                        configured in the studio, because this site
                        cannot capture a payment. The studio says so.

   Every order therefore leaves here as `payment: pending`, and the word
   "paid" appears nowhere in this file.

   HOW THE ORDER LEAVES THE PAGE

   Three channels, chosen by what the owner has configured, checked at
   render time rather than assumed:

     endpoint   POST to the owner's own orders URL. A real order record.
     whatsapp   the order is composed into a message to the owner's own
                number. This is a real channel — it is how a great many
                shops in Pakistan actually take orders — and the order
                is only "placed" once the customer has sent it, which is
                what the confirmation says.
     none       checkout is DISABLED, with an explanation. A shop that
                cannot receive an order must not show a button that
                looks like it works.

   STOCK

   Not tracked, so never claimed. No product says "in stock", no
   quantity is capped at an inventory figure that does not exist, and
   nothing is marked "only 2 left".
   ===================================================================== */

/* What the owner has set up for taking orders. Stored on commerce. */
function orderChannel(cfg) {
  const c = commerceOf(cfg);
  const o = c.orders || {};
  if (o.endpoint && /^https:\/\//i.test(o.endpoint))
    return { kind: 'endpoint', url: o.endpoint,
      label: 'Orders are sent to your own server.' };
  const wa = (cfg.business.whatsapp || '').replace(/[^0-9]/g, '');
  if (wa.length >= 8)
    return { kind: 'whatsapp', to: wa,
      label: 'Orders arrive as a WhatsApp message on ' + cfg.business.whatsapp + '.' };
  return { kind: 'none',
    label: 'No way to receive an order is configured yet, so checkout is switched off.' };
}

/* The payment methods a checkout can honestly offer. A configured card
   gateway is excluded here on purpose — see the note at the top. */
function checkoutMethods(cfg) {
  return livePayments(cfg).filter(p => p.kind === 'manual' || p.id === 'cod')
    .map(p => ({ id: p.id, name: p.name,
      settle: p.id === 'cod' ? 'on delivery' : 'by transfer, before dispatch' }));
}

function cartReadiness(cfg) {
  const items = ((cfg.content.products || {}).items || []).filter(x => x && x.name);
  const ch = orderChannel(cfg);
  const methods = checkoutMethods(cfg);
  const zones = (commerceOf(cfg).zones || []).filter(z => (z.name || '').trim());
  const blockers = [];
  if (!items.length) blockers.push('There are no products yet.');
  if (ch.kind === 'none') blockers.push('No WhatsApp number and no orders URL, so an order has nowhere to go.');
  if (!methods.length) blockers.push('No payment method this site can honestly offer is switched on. '
    + 'Cash on delivery needs a courier that carries it; bank transfer needs your account details.');
  if (!zones.length) blockers.push('No delivery zone, so a delivery charge cannot be worked out.');
  return { ok: !blockers.length, blockers, channel: ch, methods, zones, count: items.length };
}

/* The data the runtime works from. Emitted as JSON rather than built
   into the script, so nothing the owner typed is ever interpolated into
   executable source. */
function cartIsland(cfg) {
  const r = cartReadiness(cfg);
  const items = ((cfg.content.products || {}).items || [])
    .filter(x => x && x.name)
    .map((x, i) => ({ i, name: x.name, price: x.price === undefined ? '' : String(x.price),
      img: x.img || '', desc: x.desc || '' }));
  const data = {
    cur: cfg.business.currency || 'PKR',
    shop: cfg.business.name || '',
    items,
    zones: r.zones.map(z => ({ name: z.name, places: z.places || '',
      rate: Number(z.rate) || 0, free: Number(z.free) || 0, days: z.days || '' })),
    methods: r.methods,
    channel: r.channel.kind,
    to: r.channel.to || '',
    url: r.channel.url || '',
    ready: r.ok,
    blockers: r.blockers,
    policy: commerceOf(cfg).policy || {}
  };
  /* A closing script tag inside the JSON would end the element early,
     so every "<" in the payload is escaped. The hazard is real enough
     that the previous version of THIS COMMENT spelled the tag out in
     full and broke the whole bundle: the browser stopped parsing at the
     comment, and `S` was undefined on every page. */
  return '<script type="application/json" id="wsc-data">' +
    JSON.stringify(data).replace(/</g, '\\u003c') + '<\/script>';
}

const CART_RUNTIME = `
<script>
(function(){
  var el = document.getElementById('wsc-data'); if(!el) return;
  var D; try { D = JSON.parse(el.textContent); } catch(e){ return; }
  if(!D.items.length) return;

  var KEY = 'wsc:' + (location.pathname || '/');
  var cart = {};
  try { cart = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ cart = {}; }
  var placed = null;

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(cart)); } catch(e){} }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function num(p){ var n = parseFloat(String(p).replace(/[^0-9.]/g,'')); return isFinite(n)?n:null; }
  function money(n){ return D.cur + ' ' + (Math.round(n*100)/100).toLocaleString('en-US'); }
  function count(){ var n=0; for(var k in cart) n += cart[k]; return n; }

  /* A product with no readable price cannot be added: the total would
     be a guess, and a guessed total on a real order is a wrong invoice.
     It shows "price on request" and the enquiry route instead. */
  function sellable(it){ return num(it.price) !== null; }

  function sub(){ var t=0; for(var k in cart){ var it=D.items[k]; if(!it) continue;
    var p=num(it.price); if(p!==null) t += p*cart[k]; } return t; }

  function zoneOf(i){ return D.zones[i] || null; }
  function ship(zi){
    var z = zoneOf(zi); if(!z) return 0;
    if(z.free > 0 && sub() >= z.free) return 0;
    return z.rate;
  }

  /* ---------- attaching to whatever the engine drew ----------
     The six engines each draw their catalogue differently, so rather
     than assume a class, each product is found by its own name and the
     button is attached to the card that contains it. */
  function attach(){
    var scope = document.getElementById('products'); if(!scope) return;

    /* One cart, not two.
       Spectra is the commerce engine and ships its own bag — an
       "Add to bag" button per product, a counter and a drawer — which
       ends at an enquiry rather than an order. With this runtime also
       attaching, that engine rendered two buy buttons on every card and
       kept two separate bags, which is worse than either alone. The
       engine's buy chrome stands down so there is exactly one bag, the
       one that can actually place an order. Everything else the engine
       draws is untouched. */
    /* Document-wide, not just inside #products: the engine's quick-view
       modal carries its own "Add to bag" and lives outside the
       catalogue section, so scoping the search to #products left a
       second way to fill a second bag. */
    var owned = document.querySelectorAll('[onclick^="ADD("],[onclick*=";ADD("],[onclick*=" ADD("]');
    for (var oi = 0; oi < owned.length; oi++) owned[oi].setAttribute('hidden','');
    var launchers = document.querySelectorAll('[onclick^="CART("],[onclick*=";CART("]');
    for (var li = 0; li < launchers.length; li++) launchers[li].setAttribute('hidden','');
    var cards = [];
    D.items.forEach(function(it, i){
      var node = null, walk = document.createTreeWalker(scope, NodeFilter.SHOW_TEXT, null);
      var n;
      while((n = walk.nextNode())){
        if(n.nodeValue && n.nodeValue.trim() === it.name){ node = n; break; }
      }
      if(!node) return;
      var card = node.parentNode;
      while(card && card !== scope && cards.indexOf(card) >= 0) card = card.parentNode;
      /* climb to something card-sized rather than the heading itself */
      var hops = 0;
      while(card && card.parentNode !== scope && hops < 4 &&
            card.getBoundingClientRect().height < 80){ card = card.parentNode; hops++; }
      if(!card || card === scope) return;
      cards.push(card);
      var b = document.createElement('button');
      b.type = 'button'; b.className = 'wsc-add'; b.setAttribute('data-i', i);
      if(!sellable(it)){ b.textContent = 'Price on request'; b.disabled = true;
        b.title = 'This product has no price yet'; }
      else b.textContent = 'Add to bag';
      card.appendChild(b);

  }

  function sync(){
    document.querySelectorAll('.wsc-add[data-i]').forEach(function(b){
      var i = b.getAttribute('data-i'), q = cart[i] || 0;

      b.classList.toggle('in', !!q);

    if(bar){ var n = count(); bar.hidden = !n;
      bar.querySelector('b').textContent = n; }
  }

  /* ---------- the drawer ---------- */
  var panel = document.createElement('div');
  panel.className = 'wsc-panel'; panel.setAttribute('role','dialog');
  panel.setAttribute('aria-modal','true'); panel.setAttribute('aria-label','Your bag');
  document.body.appendChild(panel);

  var bar = document.createElement('button');
  bar.type='button'; bar.className='wsc-bar'; bar.hidden = true;
  bar.innerHTML = 'Your bag <b>0</b>';
  bar.setAttribute('aria-haspopup','dialog');
  document.body.appendChild(bar);

  var view = 'cart', lastFocus = null;

  function open(v){ view = v || 'cart'; lastFocus = document.activeElement;
    panel.classList.add('on'); draw();
    document.body.style.overflow='hidden';
    var f = panel.querySelector('.wsc-x'); if(f) f.focus(); }
  function close(){ panel.classList.remove('on'); panel.innerHTML='';
    document.body.style.overflow='';
    if(lastFocus && lastFocus.focus) try{ lastFocus.focus(); }catch(e){} }

  function rows(){
    var keys = Object.keys(cart).filter(function(k){ return cart[k] > 0 && D.items[k]; });
    if(!keys.length) return '<p class="wsc-empty">Your bag is empty.</p>';
    return keys.map(function(k){
      var it = D.items[k], p = num(it.price);
      return '<div class="wsc-row">' +
        (it.img ? '<img src="'+esc(it.img)+'" alt="">' : '<span></span>') +
        '<div><div class="n">'+esc(it.name)+'</div><div class="p">'+
          (p!==null ? esc(money(p)) : 'price on request') +'</div>' +
          '<button class="wsc-rm" data-rm="'+k+'">Remove</button></div>' +

        '<p>'+esc(placed.message)+'</p>' +
        '<div class="ref">'+esc(placed.ref)+'</div>' +
        '<p class="wsc-note">'+esc(placed.settle)+'</p></div>';
      foot = '<button class="wsc-btn ghost" data-close>Close</button>';
    } else if(view === 'checkout'){
      var zi = parseInt(panel.getAttribute('data-zone')||'0',10) || 0;
      body = '<form id="wsc-form" novalidate>' +
        '<div class="wsc-f"><label for="wsc-n">Your name</label><input id="wsc-n" name="name" autocomplete="name" required></div>' +
        '<div class="wsc-f"><label for="wsc-t">Phone</label><input id="wsc-t" name="phone" type="tel" autocomplete="tel" required></div>' +
        '<div class="wsc-f"><label for="wsc-a">Delivery address</label><textarea id="wsc-a" name="address" autocomplete="street-address" required></textarea></div>' +
        '<div class="wsc-f"><label for="wsc-z">Delivery area</label><select id="wsc-z" name="zone">'+zoneOptions(zi)+'</select></div>' +
        '<div class="wsc-f"><label for="wsc-o">Anything we should know? (optional)</label><textarea id="wsc-o" name="notes"></textarea></div>' +
        '<div class="wsc-pay" role="radiogroup" aria-label="How you would like to pay">' +
        D.methods.map(function(m,i){
          return '<label><input type="radio" name="pay" value="'+esc(m.id)+'"'+(i===0?' checked':'')+'>' +
            '<span><b>'+esc(m.name)+'</b><em>Settled '+esc(m.settle)+'. No payment is taken on this page.</em></span></label>';
        }).join('') + '</div>' +
        '</form>';
      foot = totals(zi) +
        '<button class="wsc-btn" data-place>Place order</button>' +
        '<button class="wsc-btn ghost" data-back>Back to bag</button>' +
        '<p class="wsc-note">'+esc(D.channel==='whatsapp'
          ? 'Your order opens as a WhatsApp message to the shop. It is placed once you send it.'
          : 'Your order is sent to the shop. You will be contacted to confirm.')+
          ' No card details are asked for and no payment is taken here.</p>';
    } else {

      .map(function(k){ var it=D.items[k];

      ref: ref(), shop: D.shop, currency: D.cur, items: lines,
      subtotal: sub(), delivery: ship(zi), total: sub()+ship(zi),

      customer: { name: f.name, phone: f.phone, address: f.address },
      notes: f.notes, placedAt: new Date().toISOString()

   CHOOSING THE PAGES
   =====================================================================

   "The user must select the pages required before generating a website"

   much content the brief contained and the client was shown the result.
   That is a reasonable default and it stays the default, but it is not
   a choice, and the brief asks for one.

   WHAT IS OFFERED, AND WHY NOT MORE

   The supplied specification lists forty-one page types. Most of them —
   Pricing, FAQ, Careers, Events, Blog, Team, Order Tracking, Customer
   Account — need section types this application does not render. A
   builder that offers a Pricing page and then produces an empty one has
   not given anyone a Pricing page; it has given them a dead link in
   their own navigation.

   So PAGE_KINDS holds the pages that can actually be filled from the
   eight section types that exist, and PAGE_PLANNED holds the rest, shown
   in the same list, plainly marked, in the order the specification put
   them. A client sees what is coming rather than discovering the gap
   after publishing, and the list is in code so it cannot drift from what
   the product does.

   A page is only offered when there is something to put on it: a Work

/* ---------------------------------------------------------------------
   WHAT BELONGS ON A HOMEPAGE

   This list is the fix for the worst defect the benchmark found. Home
   used to carry `types: ['hero']` and nothing else, because the other
   section types were handed to the pages named after them — so a
   four-page consulting site rendered a homepage of exactly two things:
   a hero and a contact form. Measured, not guessed: one <section>
   element in the document, against twenty-five on the reference site.
   That is the "looks like an empty template" complaint, and it was
   caused by the multi-page work rather than by the designs.

   A homepage is not the leftovers of a sitemap. It is a composed
   summary that sends people onward: what we do, who we are, proof,
   and a way to get in touch. So Home carries a teaser of each thing
   the site holds, in this order, and the dedicated page still carries
   the full version.

   HOW THE TWO DO NOT COLLIDE

   The dedicated page keeps the shared content store, so About holds
   the whole story. Home's copy of that section owns its own content
   and is filled with a condensed version by `writeHome`. Neither
   overwrites the other, which was the exact constraint the brief
   asked for ("a testimonial section on Home must not automatically
   overwrite a different testimonial section on About Us").
   --------------------------------------------------------------------- */
const HOME_ORDER = ['hero', 'about', 'services', 'products', 'work',
                    'stats', 'testimonial', 'faq', 'contact'];

const PAGE_KINDS = [
  { id: HOME,      name: 'Home',     slug: '',         pinned: true,
    types: ['hero'],
    home: HOME_ORDER,
    blurb: 'The opening frame, a summary of everything else, and a way to get in touch.' },
  { id: 'about',   name: 'About',    slug: 'about',
    types: ['about', 'stats', 'testimonial'],
    blurb: 'Your story, your figures and a client quote.',

    needsWhat: 'a paragraph about the business' },
  { id: 'services', name: 'Services', slug: 'services',
    types: ['services'],
    blurb: 'What you do, one entry at a time.',
    needs: (cfg) => ((cfg.content.services || {}).items || []).filter(x => x && x.title).length >= 2,
    needsWhat: 'at least two services' },
  { id: 'work',    name: 'Work',     slug: 'work',
    types: ['work'],
    blurb: 'Projects, with their own page when there are enough of them.',
    needs: (cfg) => ((cfg.content.work || {}).items || []).filter(x => x && x.title).length >= 2,

  { id: 'shop',    name: 'Shop',     slug: 'shop',
    types: ['products'],
    blurb: 'The catalogue, with the bag and checkout attached.',
    needs: (cfg) => ((cfg.content.products || {}).items || []).filter(x => x && x.name).length >= 1,

  { id: 'faq',     name: 'FAQ',      slug: 'faq',
    types: ['faq'],
    blurb: 'The questions people actually ask before getting in touch.',
    needs: (cfg) => ((cfg.content.faq || {}).items || [])
      .filter(x => x && x.q && String(x.a || '').trim()).length >= 2,
    needsWhat: 'at least two answered questions' },
  { id: 'team',    name: 'Team',     slug: 'team',
    types: ['team'],
    blurb: 'Who does the work. Names and roles are yours to add.',
    needs: (cfg) => ((cfg.content.team || {}).items || []).filter(x => x && x.name).length >= 1,
    needsWhat: 'at least one person' },
  { id: 'pricing', name: 'Pricing',  slug: 'pricing',
    types: ['pricing'],
    blurb: 'What things cost. Only you can set these.',
    needs: (cfg) => ((cfg.content.pricing || {}).items || []).filter(x => x && x.name).length >= 1,
    needsWhat: 'at least one priced item' },
  { id: 'contact', name: 'Contact',  slug: 'contact',
    types: ['contact'],
    blurb: 'How people reach you.' }
];

/* From the supplied page list, in its own order. Not built, not offered,
   and said so in the same breath rather than left out of the list. */
const PAGE_PLANNED = [
  { name: 'Individual product detail', note: 'Needs a template page per product.' },
  { name: 'Case study / project detail', note: 'Needs a template page per project.' },
  { name: 'Testimonials',    note: 'Exists as a section, not yet as its own page.' },
  { name: 'Blog / insights', note: 'Needs a content store and article routes.' },
  { name: 'Careers',         note: 'Needs a vacancies section.' },
  { name: 'Events',          note: 'Needs a dated listing section.' },
  { name: 'Book an appointment', note: 'Needs a calendar provider.' },
  { name: 'Request a quote', note: 'The contact form takes a request in the meantime.' },
  { name: 'Cart and checkout pages', note: 'Built as a drawer on the shop rather than separate pages.' },
  { name: 'Order tracking',  note: 'Needs order status lookup.' },
  { name: 'Customer account', note: 'Needs customer sign-in.' },
  { name: 'Privacy, terms, cookies', note: 'Needs a plain text page type. Wording is yours.' }

/* ---------------------------------------------------------------------
   A PAGE PER SERVICE

   This is where the page count actually comes from. A consultancy with
   three services has three more real pages in it — "Feasibility",
   "Transaction advisory", "Institutional advisory" — each with its own
   address, its own title and description, and a body written about
   that one service rather than about the practice. Four pages becomes
   eight without inventing a single page nobody asked for, which is the
   difference between reaching the brief's 8-12 and padding to it.

   The pages are derived from the services the client listed, so they
   appear when there are services and disappear when there are not.
   Each carries a `detail` section that owns its content, so editing
   one service page cannot change another.
   --------------------------------------------------------------------- */
const DETAIL_PREFIX = 'svc-';

function serviceDetailKinds(cfg) {
  const items = ((cfg.content.services || {}).items || []).filter(x => x && x.title);
  const seen = {};
  return items.map((x, i) => {
    let slug = slugify(x.title) || ('service-' + (i + 1));
    while (seen[slug]) slug = slug + '-' + (i + 1);     /* two services, one slug */
    seen[slug] = true;
    return {
      id: DETAIL_PREFIX + slug,
      name: x.title,
      slug: 'services/' + slug,
      types: ['detail'],
      parent: 'services',
      index: i,
      blurb: 'A page for ' + x.title + ' on its own.'
    };
  });
}

/* every page kind available for this configuration, built-in and derived */
function allPageKinds(cfg) {
  const out = [];
  PAGE_KINDS.forEach(k => {
    out.push(k);
    /* the service pages sit directly under the Services page */
    if (k.id === 'services') serviceDetailKinds(cfg).forEach(d => out.push(d));
  });
  return out;
}

const pageKind = (id, cfg) =>
  (cfg ? allPageKinds(cfg) : PAGE_KINDS).find(k => k.id === id) || null;

/* Can this page be filled right now? */
function pageAvailable(cfg, kind) {
  if (!kind) return false;
  if (typeof kind.needs !== 'function') return true;
  return kind.needs(cfg);
}

/* What the studio would choose on its own — the current default, which
   is also what is ticked when the client has expressed no preference. */
function recommendedPages(cfg, brief) {
  const out = [HOME];
  allPageKinds(cfg).forEach(k => {
    if (k.id === HOME) return;
    if (k.id === 'contact') { out.push(k.id); return; }
    if (k.id === 'shop') { if ((brief || {}).mode === 'store' || pageAvailable(cfg, k)) out.push(k.id); return; }
    /* A service page is recommended whenever its service exists; the
       body is written by the copy engine from the service's own title
       and description, so there is nothing missing to wait for. */
    if (k.parent === 'services') { out.push(k.id); return; }
    if (pageAvailable(cfg, k)) out.push(k.id);
  });
  return out;
}

/* Build exactly the chosen pages.
   Section instances are carried across rather than rebuilt, so a page
   that already existed keeps its ids and anything its sections own —
   deselecting a page and selecting it again does not silently discard
   the words on it. Anything left homeless goes back on Home, hidden if
   it was hidden, which is the rule the derived sitemap already kept. */
function applyPageChoice(cfg, chosen) {
  const want = (chosen && chosen.length ? chosen : [HOME]).slice();
  if (want.indexOf(HOME) < 0) want.unshift(HOME);

  /* every section instance that exists today, by type */
  const have = {};
  (cfg.pages || []).forEach(p => (p.sections || []).forEach(s => {
    (have[s.type] = have[s.type] || []).push(s);
  }));
  const take = (type) => (have[type] && have[type].length) ? have[type].shift() : blankSection(type);

  /* Dedicated pages are built FIRST, before Home, and the order here
     is load-bearing: the first instance of a type to be created keeps
     the shared content store, so the page named after a section is the
     one that holds its full text. Home's copy is made afterwards and
     owns a condensed version. Build Home first and it is the homepage
     that holds the only copy of the About text, leaving the About page
     blank — which is how this went wrong the first time. */
  const pages = [];
  const order = allPageKinds(cfg).filter(k => want.indexOf(k.id) >= 0);
  const dedicated = order.filter(k => k.id !== HOME);
  const homeKind = order.find(k => k.id === HOME);

  const makePage = (k) => {
    const old = (cfg.pages || []).find(p => p.id === k.id);
    const p = blankPage(k.id, k.name, k.slug, []);
    if (old) { p.title = old.title || ''; p.description = old.description || ''; p.name = old.name || k.name; }
    /* A derived service page gets a section of its own rather than one
       pulled from the shared pool: every one of them is a `detail`,
       and `take` would hand the same instance to the first and leave
       the rest empty. */
    if (k.parent) p.parent = k.parent;
    p.sections = k.parent === 'services'
      ? k.types.map(t => { const sx = blankSection(t); ownContent(cfg, sx); sx.detailOf = k.index; return sx; })
      : k.types.map(take);
    /* A page the client asked for must show the section it exists for.
       Section visibility is carried across from wherever the instance
       came from, and a Contact section that had been switched off
       elsewhere produced a Contact page with nothing on it — measured
       at zero live sections on the store brief. The page's FIRST type
       is what the page is for, so that one is turned back on; the
       extras keep whatever state they had. */
    if (p.sections[0]) p.sections[0].visible = true;
    return p;
  };

  dedicated.forEach(k => pages.push(makePage(k)));

  /* ---- the homepage ------------------------------------------------
     Built last so the dedicated pages hold the full content, then
     given a teaser of every section the site actually has something
     for. A teaser for a section with nothing in it is an empty band,
     so each one is included only when its content exists. */
  const home = makePage(homeKind);
  (homeKind.home || []).forEach(type => {
    if (type === 'hero') return;                       /* already there */
    if (home.sections.some(s => s.type === type)) return;
    const carriesContent = pages.some(p =>
      p.sections.some(s => s.type === type && s.visible));
    const s = blankSection(type);
    /* It owns its own copy, so Home's summary and the inner page's
       full version are two separate pieces of text. */
    ownContent(cfg, s);
    s.visible = carriesContent;
    s.teaser = true;
    home.sections.push(s);
  });
  pages.unshift(home);

  /* Anything a client had filled in that no page claimed is parked on
     Home, hidden, so unticking a page never discards their words. */
  Object.keys(have).forEach(type => {
    have[type].forEach(s => {
      if (home.sections.some(x => x.type === type)) return;
      s.visible = false;
      home.sections.push(s);
    });
  });
  SECTION_TYPES.forEach(t => {
    if (!pages.some(p => p.sections.some(s => s.type === t)))
      home.sections.push(blankSection(t, { visible: false }));
  });

  /* Belt and braces on the shared store: exactly one instance of each
     type may read it. The construction above already arranges that —
     this catches anything carried over from an older configuration. */
  const claimed = {};
  pages.forEach(p => p.sections.forEach(s => {
    if (!s.content && !claimed[s.type]) { claimed[s.type] = true; return; }
    if (!s.content) ownContent(cfg, s);
  }));

  cfg.pages = pages;
  if (typeof writeHome === 'function') writeHome(cfg);
  if (typeof writeServicePages === 'function') writeServicePages(cfg);
  return pages;
}
/* =====================================================================
   THE COPY ENGINE — writing from the client's own facts
   =====================================================================

   WHY THIS EXISTS, MEASURED

   The brief says the generated sites "contain little or no automatically
   written content" and "look like empty templates rather than real
   businesses". That was checked rather than taken on faith, with
   diagnose.mjs, across the three businesses the brief names:

     Management consulting   4 pages, 116 words in the whole site
     Luxury home décor       4 pages,  45 words, Shop page empty
     Technology company      4 pages,  98 words

   And the part that matters most: three businesses in three unrelated
   industries shared 46-52% of their vocabulary. That is the definition
   of a template.

   The cause was a bank of twelve categories holding two or three
   options per field, each a sentence or two. Every consultancy in the
   world got the same paragraph.

   WHAT THIS DOES INSTEAD

   It composes from what the client actually typed — their name, their
   sector, their description, their own service titles, their city — and
   uses those words as the raw material rather than as a key into a
   lookup table. Two consultancies that describe themselves differently
   get different copy, because their copy is made of their own
   description.

   WHAT THIS IS NOT

   It is NOT a language model and is never described as one. It cannot
   understand a business; it can only arrange what it was given. The
   difference shows in prose that is specific where the client was
   specific and careful where they were vague. The model path exists in
   apps/web/src/lib/ai and remains the upgrade; nothing here pretends to
   be it.

   WHAT IT WILL NOT WRITE

   The same refusals as before, and for the same reason: figures,
   client names, testimonials, awards, certifications, years in
   business, prices. Those are claims the client makes about themselves
   and a generator that invents them is forging their signature. FAQ
   answers are drafted only where the answer is about the arrangement
   ("how do we start?") and never where it is a fact only they hold
   ("how much does it cost?") — that question is drafted with the
   question and an answer marked for them to complete.
   ===================================================================== */

/* ---------- reading the brief for its own words --------------------- */

const STOP = ('a an the and or but for with from into of to in on at by we our us you your '
  + 'is are was were be been being that this these those it its as not no than then so if '
  + 'can will would should may might also more most other such only own same just').split(' ');

/* The nouns a business used about itself. These become the raw material;
   nothing is invented to fill a gap. */
function vocabularyOf(cfg) {
  const b = cfg.business || {};
  const c = cfg.content || {};
  const bag = [b.sector, b.tagline, (c.about || {}).body, (c.hero || {}).sub]
    .concat(((c.services || {}).items || []).map(x => (x && x.title) || ''))
    .concat(((c.products || {}).items || []).map(x => (x && x.name) || ''))
    .join(' ');
  const freq = {};
  (bag.toLowerCase().match(/[a-z][a-z-]{3,}/g) || []).forEach(wd => {
    if (STOP.indexOf(wd) >= 0) return;
    freq[wd] = (freq[wd] || 0) + 1;
  });
  const terms = Object.keys(freq).sort((x, y) => freq[y] - freq[x]);
  return {
    terms,
    /* the sector, as the client wrote it, lower-cased for mid-sentence use */
    sector: (b.sector || '').trim(),
    sectorLc: (b.sector || '').trim().toLowerCase().replace(/\.$/, ''),
    city: (b.city || '').trim(),
    name: (b.name || '').trim(),
    services: ((c.services || {}).items || []).map(x => (x && x.title) || '').filter(Boolean),
    products: ((c.products || {}).items || []).map(x => (x && x.name) || '').filter(Boolean),
    audience: (cfg.intake || {}).audience || '',
    tone: (cfg.intake || {}).tone || ''
  };
}

/* A deterministic pick, so the same brief always writes the same site
   and a client who regenerates does not lose a paragraph they liked. */
const pickBy = (list, seed, salt) =>
  list[Math.abs(hashSeed(String(seed) + '|' + salt)) % list.length];

/* Join a list the way a person would. */
function listPhrase(items, max) {
  const a = items.slice(0, max || 3).filter(Boolean);
  if (!a.length) return '';
  if (a.length === 1) return a[0];
  if (a.length === 2) return a[0] + ' and ' + a[1];
  return a.slice(0, -1).join(', ') + ' and ' + a[a.length - 1];
}

/* A name with an internal capital is spelled that way on purpose, so
   neither of these touches its first letter. "iCore Business Solutions"
   was being rendered "ICore Business Solutions" at the start of a
   sentence and "iCore" mid-sentence — the client's own name misspelled
   on their own About page. A first word that is all lower case is
   ordinary prose and is still capitalised. */
const hasInnerCap = (w) => /^[a-z]/.test(w) && /[A-Z]/.test(w.slice(1));
const firstWord = (s) => String(s).split(/\s+/)[0] || '';

const lower = (s) => {
  if (!s) return s;
  return hasInnerCap(firstWord(s)) ? s : s.charAt(0).toLowerCase() + s.slice(1);
};
const sentence = (s) => {
  const t = String(s || '').trim();
  if (!t) return '';
  const head = hasInnerCap(firstWord(t)) ? t.charAt(0) : t.charAt(0).toUpperCase();
  return head + t.slice(1) + (/[.!?]$/.test(t) ? '' : '.');
};

/* ---------- a category as a noun, not a label ------------------------
   One entry per category in SITE_KINDS and STORE_KINDS. `countable`
   decides between "is a X" and "works in X" — "is a real estate" is
   wrong and "works in real estate" is right, and no amount of article
   logic gets there from the label alone.

   A sector the client typed themselves is used as they wrote it: they
   know their trade better than this table does. */
const SECTOR_NOUN = {
  /* websites */
  corporate:   { text: 'business',                     countable: true },
  portfolio:   { text: 'independent practice',         countable: true },
  agency:      { text: 'creative agency',              countable: true },
  consultancy: { text: 'management consultancy',       countable: true },
  hospitality: { text: 'hospitality business',         countable: true },
  property:    { text: 'property and architecture',    countable: false },
  tech:        { text: 'technology company',           countable: true },
  education:   { text: 'education',                    countable: false },
  health:      { text: 'healthcare practice',          countable: true },
  travel:      { text: 'travel business',              countable: true },
  nonprofit:   { text: 'nonprofit',                    countable: true },
  editorial:   { text: 'publication',                  countable: true },
  /* stores */
  fashion:     { text: 'clothing shop',                countable: true },
  home:        { text: 'home décor shop',              countable: true },
  furniture:   { text: 'furniture shop',               countable: true },
  beauty:      { text: 'beauty shop',                  countable: true },
  electronics: { text: 'electronics shop',             countable: true },
  jewelry:     { text: 'jewellery shop',               countable: true },
  carpets:     { text: 'carpet and rug shop',          countable: true },
  gifts:       { text: 'gift shop',                    countable: true },
  food:        { text: 'food shop',                    countable: true },
  handmade:    { text: 'maker selling our own work',   countable: true },
  sports:      { text: 'sports shop',                  countable: true },
  general:     { text: 'shop',                         countable: true }
};

function nounFor(cfg, v) {
  const vv = v || vocabularyOf(cfg);
  const kind = ((cfg.brief || {}).kind || '').trim();
  /* A sector the client edited by hand wins: it is their words. The
     category labels are the ones that must not be used raw, and they
     are recognised by being exactly what the list holds. */
  const label = (vv.sector || '').trim();
  const fromList = SECTOR_NOUN[kind];
  if (fromList) {
    const kindLabel = (typeof siteKind === 'function' && siteKind(kind)) ||
                      (typeof storeKind === 'function' && storeKind(kind)) || null;
    const untouched = !label || !kindLabel || label === (kindLabel.sector || '');
    if (untouched) return fromList;
  }
  if (!label) return { text: '', countable: true };
  /* their own wording, with a dropdown-style "A or B" reduced to A */
  const own = label.replace(/\s+or\s+.*$/i, '').toLowerCase().replace(/\.$/, '');
  return { text: own, countable: true };
}

/* ---------- the story -----------------------------------------------
   Three paragraphs, each built from a different fact the client gave,
   so a business that said more gets more and a business that said
   little gets a short honest opening rather than three invented ones. */
function composeAbout(cfg, seed) {
  const v = vocabularyOf(cfg);
  const paras = [];

  /* THE SECTOR LABEL IS NOT A NOUN.
     The opening sentence used `business.sector` verbatim, and that
     field holds the label from the category list — written to be read
     in a dropdown, not in a sentence. So an agency's About page opened
     "We are an agency or creative studio.", which reads as a form
     field rather than a description of anyone, and a property firm got
     "Mehran Estates is a real estate." Both were in delivered pages.

     `nounFor` gives each category a form that survives being put in a
     sentence, and says whether it takes "is a" or "is in". Nothing is
     guessed from the label. */
  const noun = nounFor(cfg, v);
  if (noun.text) {
    const openers = noun.countable
      ? ['{name} is {a}{noun}{where}.', 'We are {a}{noun}{where}.',
         '{name} is {a}{noun}{where}.']
      : ['{name} works in {noun}{where}.', 'Our work is in {noun}{where}.',
         '{name} works in {noun}{where}.'];
    paras.push(sentence(pickBy(openers, seed, 'open')
      .replace('{name}', v.name || 'This practice')
      .replace('{a}', /^[aeiou]/i.test(noun.text) ? 'an ' : 'a ')
      .replace(/\{noun\}/g, noun.text)
      .replace('{where}', v.city ? ', based in ' + v.city : '')));
  }

  /* What the client said about themselves, in their own words, placed
     second so it reads as the substance rather than as a strapline. It
     is the only sentence on the page that is genuinely theirs, which is
     why it leads the body rather than being buried. */
  const own = String((cfg.business || {}).tagline || '').trim();
  if (own && own.split(/\s+/).length > 4) paras.push(sentence(own.replace(/\.$/, '')));

  /* what they do, in their own service words */
  if (v.services.length) {
    const shape = [
      'The work falls into {list}.',
      'Most of what we do is {list}.',
      'We are usually asked for one of {count} things: {list}.'
    ];
    paras.push(sentence(pickBy(shape, seed, 'what')
      .replace('{list}', listPhrase(v.services.map(lower), 4))
      .replace('{count}', String(Math.min(4, v.services.length)))));
  } else if (v.products.length) {
    /* Only REAL products may be written about as what the business
       makes. The sample catalogue is demo furniture, and a paragraph
       announcing "we make and sell everyday vessel, woven runner and
       large bowl" over a client's own name is a fabrication about their
       business, not a draft of it. */
    const realProducts = ((cfg.content.products || {}).items || [])
      .filter(x => x && x.name && !x.sample).map(x => lower(x.name));
    if (realProducts.length)
      paras.push(sentence('We make and sell ' + listPhrase(realProducts, 3) +
        (realProducts.length > 3 ? ', among other things' : '')));
  }

  /* How they work. The paragraph with the least to go on, so it is
     written about the arrangement rather than about them, and takes
     whichever of their own words it can so two businesses do not get
     the same sentence.

     A SHOP IS NOT A PRACTICE. One set of sentences served both at
     first, and a rug shop was told it had "clients", "engagements",
     and work that was "scoped and priced before it starts". Register
     is most of what makes copy read as written for a business rather
     than poured into it, so the two registers are separate. */
  const isShop = (cfg.brief || {}).mode === 'store' || v.products.length > 0;
  const subject = v.services.length ? lower(v.services[0])
    : v.products.length ? lower(v.products[0])
    : v.sectorLc || 'the work';
  const howPractice = [
    'We take on a limited number of {s} engagements at a time. That is deliberate: it is the only way we have found to keep the standard where we want it.',
    'We would rather do {s} properly for a few clients than quickly for many, and we say so early when a piece of work is not a good fit.',
    'You deal with the people doing the {s}, not with an account manager between you and them.',
    'Every piece of {s} is scoped and priced before it starts, so there is nothing to argue about afterwards.',
    'We will tell you when {s} is not what you need. It has cost us work and saved clients more.'
  ];
  const howShop = [
    'We keep a short list rather than a large one. Everything on it is something we would happily own ourselves.',
    'Things are bought in small numbers, so what is in stock is usually what there is.',
    'We would rather sell you one thing that lasts than three that do not.',
    'If something is not right when it arrives, say so and we will put it right.',
    'What we sell is chosen one piece at a time, which is slower and the reason the list stays short.'
  ];
  paras.push(sentence(pickBy(isShop ? howShop : howPractice, seed, 'how')
    .replace(/\{s\}/g, subject)));

  if (v.audience) {
    paras.push(sentence((isShop ? 'Most of our customers are ' : 'Most of our clients are ')
      + lower(v.audience)));
  }

  paras.push('Replace this with your own account: it will read better in your words than in ours.');
  return paras.join('\n\n');
}

/* ---------- a service description from its own title -----------------
   The title is the only fact available, so the sentence is built around
   it rather than around a category. "Feasibility studies" and "Brand
   strategy" produce different sentences because the words differ. */
function composeService(title, cfg, seed) {
  const t = String(title || '').trim();
  if (!t) return '';
  const v = vocabularyOf(cfg);
  const frames = [
    'What {t} involves, how long it takes, and what you are left with at the end.',
    '{T} — scoped before it starts, so you know what you are agreeing to.',
    'Where {t} fits, what it costs you in time, and what it changes.',
    'A short description of {t}: who it is for and what it produces.'
  ];
  const withWho = v.audience
    ? ' Usually for ' + lower(v.audience) + '.' : '';
  return sentence(pickBy(frames, seed, 'svc:' + t)
    .replace('{t}', lower(t)).replace('{T}', t)) + withWho +
    ' Rewrite this in your own words.';
}

/* ---------- questions a customer of THIS business asks ---------------
   Drafted only where the answer is about the arrangement. Anything that
   is a fact the client holds — price, turnaround, coverage — is drafted
   as the QUESTION with the answer left for them, and marked, because a
   generator that answers "what does it cost?" is inventing a price. */
function composeFAQ(cfg, seed) {
  const v = vocabularyOf(cfg);
  const store = ((cfg.brief || {}).mode === 'store') || v.products.length > 0;
  const out = [];
  const ask = (q, a, owner) => out.push({ q: q, a: a, ownerAnswer: !!owner });

  if (store) {
    ask('How long does delivery take?', '', true);
    ask('What are the delivery charges?',
      'They depend on where you are. The delivery areas and their charges are listed on the shop page.');
    ask('How do I pay?',
      'Cash on delivery and bank transfer. No card payment is taken on this site.');
    ask('Can I return something?', '', true);
    if (v.products.length) ask('Is everything made to order?', '', true);
  } else {
    ask('How do we start?',
      'Tell us what you are trying to decide or build. If it is something we can help with, '
      + 'we will say so and set out what the work would involve before anyone commits.');
    if (v.services.length)
      ask('Do you only do ' + lower(v.services[0]) + '?',
        'No — ' + listPhrase(v.services.map(lower), 4) + ' are the usual starting points, '
        + 'but the work is scoped to the question rather than to a service list.');
    ask('What does it cost?', '', true);
    ask('How long does it take?', '', true);
    if (v.city) ask('Do you work outside ' + v.city + '?', '', true);
  }
  return out;
}

/* ---------- per-page SEO --------------------------------------------
   Built from the page's own purpose and the business's own words, so
   two pages never share a title — which is the single most common SEO
   fault in generated sites. */
function composePageSEO(cfg, page) {
  const v = vocabularyOf(cfg);
  const name = v.name || 'Website';
  const suffix = v.city ? ' · ' + v.city : (v.sector ? ' · ' + v.sector : '');
  const byId = {
    home:     { t: name + (v.sector ? ' — ' + v.sector : ''),
                d: cfg.business.tagline || ('What ' + name + ' does, and who for.') },
    about:    { t: 'About ' + name + suffix,
                d: 'Who we are, how we work, and the kind of work we take on.' },
    services: { t: (v.services.length ? listPhrase(v.services, 2) + ' — ' : 'Services — ') + name,
                d: v.services.length
                  ? 'What we do: ' + listPhrase(v.services.map(lower), 4) + '.'
                  : 'What we do and how each piece of work is scoped.' },
    work:     { t: 'Selected work — ' + name,
                d: 'Projects we have taken from start to finish.' },
    shop:     { t: 'Shop — ' + name,
                d: v.products.length
                  ? 'Browse ' + listPhrase(v.products.map(lower), 3) + ' and more.'
                  : 'Everything currently available.' },
    contact:  { t: 'Contact ' + name + suffix,
                d: 'How to reach us' + (v.city ? ' in ' + v.city : '') + '.' }
  };
  const got = byId[page.id] || { t: (page.name || 'Page') + ' — ' + name,
    d: (page.name || 'This page') + ' at ' + name + '.' };
  return { title: got.t.slice(0, 68), description: got.d.slice(0, 180) };
}

/* ---------- a clearly-labelled sample catalogue ----------------------
   The brief asks for this explicitly and attaches the condition that
   makes it honest:

     "For a demo store, automatically generate a realistic sample
      catalog ... clearly identified sample products ... Do not present
      invented inventory as actual merchant stock."

   So every one carries `sample: true`, the renderer marks them, and the
   studio offers to clear them in one action. Prices are ROUND NUMBERS
   that read as placeholders rather than as a considered price list, and
   the description says what the product is for rather than claiming
   materials, origin or dimensions nobody has told us. */
const SAMPLE_SHAPES = {
  decor:    ['Vessel', 'Runner', 'Bowl', 'Lamp', 'Throw', 'Platter', 'Mirror', 'Cushion',
             'Tray', 'Planter', 'Candleholder', 'Wall hanging'],
  fashion:  ['Shirt', 'Coat', 'Scarf', 'Trousers', 'Dress', 'Knit', 'Bag', 'Belt',
             'Cap', 'Socks', 'Jacket', 'Shawl'],
  food:     ['Blend', 'Preserve', 'Honey', 'Spice tin', 'Tea', 'Oil', 'Chutney', 'Syrup',
             'Nut mix', 'Salt', 'Vinegar', 'Biscuits'],
  general:  ['Item', 'Set', 'Kit', 'Pack', 'Edition', 'Bundle', 'Piece', 'Collection',
             'Starter', 'Refill', 'Case', 'Accessory']
};
const SAMPLE_QUALIFIERS = ['Small', 'Large', 'Classic', 'Everyday', 'Studio', 'Heritage',
  'Soft', 'Plain', 'Woven', 'Hand-finished', 'Compact', 'Wide'];

function sampleCatalogue(cfg, count) {
  const v = vocabularyOf(cfg);
  const seed = v.name || 'shop';
  const kind = (cfg.brief || {}).kind || '';
  const family = SAMPLE_SHAPES[kind] ? kind
    : /rug|decor|home|furnit|interior/i.test(kind + ' ' + v.sectorLc) ? 'decor'
    : /cloth|fashion|apparel|wear/i.test(kind + ' ' + v.sectorLc) ? 'fashion'
    : /food|coffee|tea|grocer|bak/i.test(kind + ' ' + v.sectorLc) ? 'food' : 'general';
  const shapes = SAMPLE_SHAPES[family];
  const n = Math.max(1, Math.min(24, count || 12));
  const out = [];
  for (let i = 0; i < n; i++) {
    const shape = shapes[i % shapes.length];
    const qual = SAMPLE_QUALIFIERS[(i * 5 + 3) % SAMPLE_QUALIFIERS.length];
    const name = qual + ' ' + lower(shape);
    /* Round numbers on purpose: a sample price must not look decided. */
    const price = String((Math.abs(hashSeed(seed + name)) % 18 + 2) * 500);
    out.push({
      name: name,
      price: price,
      desc: 'Sample product. Replace the name, price and description with your own.',
      img: '',
      sample: true
    });
  }
  return out;
}

const hasSamples = (cfg) =>
  ((cfg.content.products || {}).items || []).some(x => x && x.sample);
const sampleCount = (cfg) =>
  ((cfg.content.products || {}).items || []).filter(x => x && x.sample).length;
function clearSamples(cfg) {
  const items = (cfg.content.products || {}).items || [];
  cfg.content.products.items = items.filter(x => x && !x.sample);
  return items.length - cfg.content.products.items.length;
}

/* ---------- the pass that fills a site ------------------------------
   Runs after the brief is applied. Never overwrites a field the client
   has filled, and records everything it wrote so the studio can show
   what is drafted and a client can see what is theirs. */
function writeSite(cfg, opts) {
  opts = opts || {};
  const seed = (cfg.business.name || 'untitled') + '|' + (cfg.business.sector || '');
  const c = cfg.content;
  const drafted = cfg._drafted = Object.assign({}, cfg._drafted || {});
  const put = (path, value) => {
    if (!value) return;
    const a = path.split('.'), k = a.pop();
    const host = a.reduce((x, n) => x[n], c);
    if (String(host[k] || '').trim()) return;
    host[k] = value;
    drafted[path] = 'engine';
  };

  /* the story, at length */
  const about = composeAbout(cfg, seed);
  if (!String((c.about || {}).body || '').trim()) {
    c.about.body = about;
    drafted['content.about.body'] = 'engine';
  }

  /* a description for every service that has only a title */
  ((c.services || {}).items || []).forEach((s, i) => {
    if (!s || !s.title) return;
    if (String(s.body || '').trim()) return;
    s.body = composeService(s.title, cfg, seed + i);
    drafted['content.services.items[' + i + '].body'] = 'engine';
  });
  put('services.intro', (c.services.items || []).length
    ? 'Each of these is scoped before it starts.' : '');

  /* a sample catalogue for a store with nothing in it */
  if (opts.samples !== false && (cfg.brief || {}).mode === 'store'
      && !((c.products || {}).items || []).filter(x => x && x.name).length) {
    c.products.items = sampleCatalogue(cfg, opts.sampleCount || 12);
    drafted['content.products.items'] = 'sample';
  }

  /* the contact page, which was rendering with nothing on it at all */
  put('contact.heading', (cfg.brief || {}).mode === 'store'
    ? 'Questions about an order?' : 'Start a conversation');
  put('contact.body', (cfg.brief || {}).mode === 'store'
    ? 'Ask us about a product, a delivery or an order you have already placed.'
    : ('Tell us what you are trying to decide or build. If it is something we can help '
       + 'with, we will say so' + (vocabularyOf(cfg).city
         ? ' — and if you are in ' + vocabularyOf(cfg).city + ', we can meet' : '') + '.'));
  put('hero.sub', (c.hero || {}).sub || '');

  /* questions, kept on the page that answers them */
  const faq = composeFAQ(cfg, seed);
  /* The FAQ used to be parked on cfg._faq, where nothing rendered it:
     the questions were written and then thrown away. There is a faq
     section type now, so they go into the content store where every
     engine picks them up. An unanswered question is kept with its
     owner flag so the editor can prompt for it; sectionHasContent
     holds the whole section back until at least one is answered, so a
     published page never shows a question with no answer. */
  if (faq.length) {
    cfg.content.faq = cfg.content.faq || { heading: 'Questions', items: [] };
    if (!(cfg.content.faq.items || []).length) {
      cfg.content.faq.items = faq;
      drafted['faq'] = 'engine';
    }
    cfg._faq = faq;
  }

  /* per-page metadata, each one different */
  (cfg.pages || []).forEach(p => {
    const seo = composePageSEO(cfg, p);
    if (!String(p.title || '').trim()) { p.title = seo.title; drafted['pages.' + p.id + '.title'] = 'engine'; }
    if (!String(p.description || '').trim()) {
      p.description = seo.description; drafted['pages.' + p.id + '.description'] = 'engine';
    }
  });

  return cfg;
}

/* what was written for the client, and by what */
function writtenReport(cfg) {
  const d = cfg._drafted || {};
  const keys = Object.keys(d);
  return {
    total: keys.length,
    engine: keys.filter(k => d[k] === 'engine' || d[k] === true).length,
    model: keys.filter(k => d[k] === 'model').length,
    sample: keys.filter(k => d[k] === 'sample').length,
    fields: keys
  };
}

/* =====================================================================
   THE HOMEPAGE
   =====================================================================

   A homepage is a summary with exits, not a dumping ground. These are
   the teaser sections `applyPageChoice` puts on Home: each one owns its
   own content, so what is written here never touches the full version
   on the page the section is named after.

   The teasers are CONDENSED, not truncated. A sentence cut at eighty
   characters reads as a bug, and the first thing a client would do is
   rewrite it. Each type has its own rule for what the short form is.
   ===================================================================== */

/* the first sentence or two of a longer passage, ending where a
   sentence ends rather than mid-word */
function leadIn(text, maxSentences) {
  const parts = String(text || '').split(/\n\n+/);
  const first = (parts[0] || '').trim();
  if (!first) return '';
  const sent = first.match(/[^.!?]+[.!?]+/g) || [first];
  return sent.slice(0, maxSentences || 2).join(' ').trim();
}

function writeHome(cfg) {
  const home = typeof homePage === 'function' ? homePage(cfg) : (cfg.pages || [])[0];
  if (!home) return cfg;
  const shared = cfg.content || {};
  const biz = cfg.business || {};
  const name = (biz.name || 'we').trim();
  const v = vocabularyOf(cfg);
  const seed = (name + '|home').length;
  const drafted = cfg._drafted = cfg._drafted || {};
  const mark = (k) => { drafted['home.' + k] = 'engine'; };

  (home.sections || []).forEach(s => {
    if (!s.teaser || !s.content) return;
    const full = shared[s.type] || {};
    const c = s.content;

    if (s.type === 'about') {
      c.heading = pickBy(['Who we are', 'About ' + name, 'In short'], seed, 'abh');
      /* the opening of the full story, which the copy engine wrote as
         a standalone first paragraph for exactly this reason */
      c.body = leadIn(full.body, 2);
      if (c.body) mark('about');

    } else if (s.type === 'services') {
      c.heading = pickBy(['What we do', 'How we help', 'Our work'], seed, 'svh');
      c.intro = full.intro ? leadIn(full.intro, 1) : '';
      /* three, each with its own one-line form rather than the full
         description — a homepage card is not a service page */
      c.items = (full.items || []).filter(x => x && x.title).slice(0, 3)
        .map(x => ({ title: x.title, body: leadIn(x.body, 1) }));
      if (c.items.length) mark('services');

    } else if (s.type === 'products') {
      c.heading = pickBy(['Featured', 'A few pieces', 'From the shop'], seed, 'prh');
      c.intro = '';
      /* Four featured products, carried across with their sample flag
         intact. A teaser that drops the flag would present demo stock
         as real on the one page everybody sees. */
      c.items = (full.items || []).filter(x => x && x.name).slice(0, 4)
        .map(x => Object.assign({}, x));
      if (c.items.length) mark('products');

    } else if (s.type === 'work') {
      c.heading = pickBy(['Selected work', 'Recent projects', 'A sample'], seed, 'wkh');
      c.items = (full.items || []).filter(x => x && x.title).slice(0, 3)
        .map(x => Object.assign({}, x));
      if (c.items.length) mark('work');

    } else if (s.type === 'stats' || s.type === 'testimonial') {
      /* Figures and quotes are the client's to supply and the engine
         never invents them. The teaser copies across whatever they
         have entered and stays hidden while they have not. */
      Object.assign(c, JSON.parse(JSON.stringify(full)));
      const empty = s.type === 'stats'
        ? !(c.items || []).some(x => x && x.v)
        : !String(c.quote || '').trim();
      if (empty) s.visible = false;

    } else if (s.type === 'contact') {
      c.heading = pickBy(['Start a conversation', 'Get in touch',
                          'Tell us what you need'], seed, 'cth');
      const where = biz.city ? ' We are in ' + biz.city + '.' : '';
      const who = v.audience ? ' Most of our ' +
        ((cfg.brief || {}).mode === 'store' ? 'customers' : 'clients') +
        ' are ' + lower(v.audience) + '.' : '';
      c.body = sentence(pickBy([
        'Tell us what you are trying to decide and we will tell you whether we can help',
        'Send a line about what you need and we will come back to you',
        'If you are weighing something up, start here'
      ], seed, 'ctb')) + where + who;
      mark('contact');
    }
  });
  return cfg;
}

/* =====================================================================
   SERVICE DETAIL PAGES
   =====================================================================

   A one-line card description is enough on a Services page and far too
   thin for a page of its own. These pages are the bulk of the page
   count the brief asks for, so an empty one would be padding — which
   is exactly what the brief says not to do ("Do not create irrelevant
   pages merely to reach a page count").

   So each page is written from the only facts that exist about that
   service: its own title, its card description, who the business says
   its clients are, and where it works. Different titles produce
   different pages because the title is in nearly every sentence. What
   nobody else can know — price, turnaround, who exactly will do it —
   is asked as a question rather than answered.
   ===================================================================== */
function composeServicePage(cfg, item, seed) {
  const v = vocabularyOf(cfg);
  const t = String((item || {}).title || '').trim();
  if (!t) return null;
  const lt = lower(t);
  const sd = seed + '|' + t;
  const paras = [];

  /* what it is — their own card line, which they wrote or we drafted,
     kept rather than replaced so the two pages agree */
  const card = String((item || {}).body || '').trim()
    .replace(/\s*Rewrite this in your own words\.?$/, '');
  if (card) paras.push(sentence(card));

  /* who it is for */
  if (v.audience) {
    paras.push(sentence(pickBy([
      '{T} is usually for {who}.',
      'Most of the {t} we do is for {who}.',
      'The clients for {t} are generally {who}.'
    ], sd, 'who').replace('{T}', t).replace(/\{t\}/g, lt)
      .replace('{who}', lower(v.audience))));
  }

  /* how it runs — about the arrangement, which is a real fact about

    const out = [];
    for (const f of Array.from(i.files || [])) out.push(await shrink(f));
    if (out.length) cb(multi ? out : out[0]);
  };
  i.click();
}
function shrink(file) {
  return new Promise(res => {
    const fr = new FileReader();
    fr.onload = () => {
      const img = new Image();
      img.onload = () => {
        const max = 1400, sc = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width * sc); cv.height = Math.round(img.height * sc);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.84));
      };
      img.onerror = () => res(fr.result);
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- chrome ---------- */

        : '<input class="inp" placeholder="' + E(sf.label) + '" value="' + E(it[sf.id] || '') + '" oninput="repSet(\'' + f.id + '\',' + i + ',\'' + sf.id + '\',this.value)">').join('') +

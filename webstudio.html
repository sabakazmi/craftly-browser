const bankSpace = () => AXES.reduce((n, a) => n * Math.max(1, BANKS[a].items().length), 1);

/* ---------- hard constraints ----------------------------------------
   Fit is a preference and can be overruled by chance; these cannot. They
   exist because some combinations are not "unlikely", they are incoherent
   — a shop-first topology on a site with no shop, or a conversion-led
   commerce engine for a practice that sells nothing. An earlier version
   of this generator handed an institutional consultancy a storefront,
   which is exactly the failure a soft weight does not prevent. */
function eligible(axis, item, dna, cfg) {
  const shopVisible = allSections(cfg).some(s => s.type === 'products' && s.visible) &&
    dna.counts.products > 0;
  if (axis === 'order' && item.id === 'shop-first') return shopVisible && dna.commerce > .35;
  if (axis === 'engine' && item.id === 'spectra') return shopVisible || dna.commerce > .3;
  if (axis === 'order' && item.id === 'proof-first') return dna.evidence > .2;
  if (axis === 'order' && item.id === 'work-first') return dna.counts.work > 0;
  if (axis === 'order' && item.id === 'voice-first') return !!(cfg.content.testimonial || {}).quote;
  if (axis === 'order' && item.id === 'story-first') return dna.counts.aboutWords > 20;
  if (axis === 'scene' && item.webgl) return dna.techDepth > .3;
  if (axis === 'motion' && item.id === 'immersive') return dna.techDepth > .45;
  return true;
}

/* ---------- weighted pick, with a novelty penalty -------------------
   Fit is raised to a power before weighting: a linear weight lets a 0.1
   entry win often enough to produce incoherent proposals, while the
   exponent makes a poor fit genuinely rare without making it impossible.
   `used` holds what earlier proposals in this batch already took. */
const FIT_SHARPNESS = 2.8;
/* The axes a client reads off the card first. A soft penalty still let two
   proposals in one batch carry the same palette, which reads as a bug
   whatever the measured distance says, so these are unique per batch while
   the bank has anything left to offer. */
const UNIQUE_IN_BATCH = ['palette', 'typeset', 'hero', 'order'];
function pick(axis, dna, rnd, used, locked, cfg, dirId) {
  if (locked) { const it = bankItem(axis, locked); if (it) return it; }
  let items = BANKS[axis].items().filter(it => eligible(axis, it, dna, cfg));
  if (!items.length) items = BANKS[axis].items();
  /* The direction narrows the candidates before weighting, so it decides
     design rather than merely influencing it. dirFilter drops its own
     allow-list if eligibility has already emptied it — coherence wins
     over the direction, never the other way round. */
  const eligibleAll = items;
  if (dirId) items = dirFilter(dirId, axis, items);
  if (UNIQUE_IN_BATCH.indexOf(axis) >= 0 && used[axis]) {
    const fresh = items.filter(it => used[axis].indexOf(it.id) < 0);
    if (fresh.length) items = fresh;
  }
  /* Reaching past the allow-list when it is exhausted.

     A direction permits two or three values per axis. A batch is six.
     When a client chooses ONE direction, the third proposal onward has
     nothing left to take, so the opening frame, the navigation and the
     density repeat and six proposals become three pairs — measured at
     0.20 structural distance on a one-word brief, against a floor of
     0.50.

     Reaching outside the list is safe in a way it would not have been
     before the direction CSS layer existed: a direction's identity is
     now carried by its type scale, shape language, page rhythm, media
     treatment and interaction, all of which are applied from dirCSS
     whatever the banks choose. So a fourth navigation does not stop the
     page being Quiet luxury. The direction's own values still rank far
     ahead, so this changes the fifth and sixth proposal, not the first.

     Only the starved axis widens, only after its list is used up, and
     only for the axes a reader would notice repeating. */
  const WIDEN = ['hero', 'nav', 'density', 'order', 'ornament'];
  if (dirId && WIDEN.indexOf(axis) >= 0 && used[axis]) {
    const freshInDir = items.filter(it => used[axis].indexOf(it.id) < 0);
    if (!freshInDir.length) {
      const outside = eligibleAll.filter(it => used[axis].indexOf(it.id) < 0);
      if (outside.length) items = outside;
    }
  }
  const weights = items.map(it => {
    const f = typeof it.fit === 'function' ? it.fit(dna) : .5;
    const seen = used[axis] ? used[axis].filter(x => x === it.id).length : 0;
    const fitW = Math.pow(Math.max(0.02, f), FIT_SHARPNESS);
    if (!dirId) return fitW * Math.pow(0.05, seen);
    /* Inside a direction, the direction's preference order leads and DNA
       fit modulates it, rather than the other way round.
       It was the other way round first, and rendering all eight showed
       why that was wrong: five of the eight directions came out on the
       same engine, and Experimental brutalism rendered an institutional
       consultancy in Atelier with an oxblood palette. DNA fit varies by
       an order of magnitude once raised to FIT_SHARPNESS, so it buried a
       rank multiplier of 0.72. A client who chooses brutalism has made
       the design decision; the brief is not entitled to overrule it.
       Hard eligibility still does — a shop-first topology on a site with
       nothing to sell stays impossible — which is why Spectra remains
       unavailable to a consultancy however it is asked for. */
    const rank = dirRank(dirId, axis, it.id);
    return Math.pow(rank, 3) * (0.3 + 0.7 * fitW) * Math.pow(0.05, seen);
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = rnd() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

/* Two different clients must not draw the same sequence from one seed.
   The DNA is folded into the stream, so a seed reproduces a batch for a
   given client and means something different for the next one. */
function dnaFingerprint(dna) {
  return ['authority', 'expressive', 'techDepth', 'imageLed', 'commerce', 'editorial', 'density', 'evidence']
    .map(k => Math.round(dna[k] * 100)).join('.');
}

/* a scene has to be one the chosen engine can actually drive */
function reconcileScene(comp, dna) {
  const own = SCENE_BANK.find(x => x.engines && x.engines.indexOf(comp.engine) >= 0);
  const s = bankItem('scene', comp.scene);
  if (s && s.engines && s.engines.indexOf(comp.engine) < 0) comp.scene = own ? own.id : 'light-field';
  /* an engine that carries a real scene should normally use it: the two
     flagships exist for that scene, and shipping one with a CSS stand-in
     while the geometry sits unused is a worse proposal, not a varied one */
  if (own && comp.scene !== own.id && dna && dna.techDepth > .4 && comp.motion !== 'still') comp.scene = own.id;
  if (!own && s && s.webgl) comp.scene = 'light-field';
  return comp;
}

/* ---------- the variant axes ----------------------------------------
   One per section type the registry varies. They behave like the ten
   bank axes — eligibility, direction filter, direction rank, novelty
   penalty, per-batch uniqueness — but they live on comp.variants rather
   than on comp itself, so nothing that reads a composition by axis name
   has to know they exist. */
function pickVariant(type, dna, rnd, used, locked, cfg, dirId) {
  const all = variantsOf(type);
  if (!all.length) return null;
  if (locked) { const v = variantItem(type, locked); if (v) return v; }
  let items = all.filter(v => variantEligible(type, v, cfg, dna));
  if (!items.length) items = [all[0]];
  if (dirId) items = dirVariantFilter(dirId, type, items);
  const seenKey = 'v:' + type;
  if (used[seenKey]) {
    const fresh = items.filter(v => used[seenKey].indexOf(v.id) < 0);
    if (fresh.length) items = fresh;
  }
  const weights = items.map(v => {
    const f = typeof v.fit === 'function' ? v.fit(dna) : .5;
    const seen = used[seenKey] ? used[seenKey].filter(x => x === v.id).length : 0;
    const fitW = Math.pow(Math.max(0.02, f), FIT_SHARPNESS);
    if (!dirId) return fitW * Math.pow(0.18, seen);
    /* Flatter than the bank axes above: six proposals have to spread
       across these to be six different pages, so the novelty penalty is
       left room to work and the rank curve is gentler. */
    const rank = dirVariantRank(dirId, type, v.id);
    return Math.pow(rank, 2) * (0.4 + 0.6 * fitW) * Math.pow(0.18, seen);
  });
  const total = weights.reduce((a, b) => a + b, 0);
  let r = rnd() * total;
  for (let i = 0; i < items.length; i++) { r -= weights[i]; if (r <= 0) return items[i]; }
  return items[items.length - 1];
}

function composeOne(dna, rnd, used, locks, cfg, dirId) {
  const comp = { id: 'p' + Math.floor(rnd() * 1e9).toString(36) };
  if (dirId) comp.direction = dirId;
  AXES.forEach(a => { comp[a] = pick(a, dna, rnd, used, (locks || {})[a], cfg, dirId).id; });
  /* A variant is recorded only for a section that is actually on the
     site. Assigning one to every type looked harmless and was not: a
     type with no section has nothing to vary, so its variant was pinned
     to the default and identical in all six proposals — which dragged
     structural distance down by counting four sections nobody would
     ever see. A one-word brief, where work, figures and quotes are all
     deliberately empty, measured 0.26 for that reason alone. */
  comp.variants = {};
  VARIANT_TYPES.forEach(t => {
    if (!allSections(cfg).some(s => s.type === t && s.visible !== false)) return;
    const v = pickVariant(t, dna, rnd, used, ((locks || {}).variants || {})[t], cfg, dirId);
    if (v) comp.variants[t] = v.id;
  });
  reconcileScene(comp, dna);
  /* an immersive motion language with no WebGL scene is a contradiction */
  const sc = bankItem('scene', comp.scene);
  if (comp.motion === 'immersive' && (!sc || !sc.webgl)) comp.motion = 'rise';
  /* ...and so is the reverse, which is the one that actually shipped.
     Every engine gates its scene on the motion LEVEL as well as on the
     scene id: `useGL = m.three >= 1 && comp.scene === <its own scene>`.
     A composition could therefore choose a WebGL scene and the `still`
     motion language, whose level is `essential` and never loads three.js
     — so the proposal advertised Suspended sheets and rendered nothing.
     Editorial minimalism hit this every time, because stillness is
     exactly what that direction asks for.
     Stillness wins: a direction that chose to be quiet should not be
     given geometry to make a scene label true. The scene steps down to
     the CSS light field instead. */
  const mo = bankItem('motion', comp.motion);
  const level = MOTION[mo ? mo.motion : 'premium'] || MOTION.premium;
  if (sc && sc.webgl && level.three < 1) comp.scene = 'light-field';
  return comp;
}

/* ---------- structural distance ------------------------------------
   Weighted so that the axes a visitor would actually notice count for
   more. Section order is compared position by position rather than as a
   label, so two differently-named orders that produce the same page are
   correctly scored as identical. */
const AXIS_WEIGHT = {
  hero: 2.2, order: 2.0, nav: 1.5, typeset: 1.8, palette: 1.6,
  engine: 1.5, density: 1.2, motion: .9, scene: .9, ornament: .6
};
function orderOf(id) { const o = bankItem('order', id); return o ? o.mid : []; }

function distance(a, b) {
  let score = 0, total = 0;
  /* Direction counts, and counts heavily: two proposals in different
     directions differ in type scale, rhythm, shape, media treatment and
     interaction as well as in the ten axes, and none of that is visible
     to an axis-by-axis comparison. It is weighted below hero and order
     so that two proposals in ONE direction still have to earn their
     distance structurally — otherwise a single-direction batch would
     score well while looking like six recolours, which is the exact
     failure this is here to catch. */
  if (a.direction || b.direction) {
    const w = 1.8; total += w;
    score += w * (a.direction === b.direction ? 0 : 1);
  }
  /* Page composition. Seven section layouts, weighted together a little
     above a single bank axis: a visitor reads the shape of the services
     block and the portfolio before they read the type specimen. Scored
     as a proportion so a site with three sections is not penalised
     against one with seven. */
  const vt = VARIANT_TYPES.filter(t => (a.variants && a.variants[t]) || (b.variants && b.variants[t]));
  if (vt.length) {
    const w = 2.4; total += w;
    let diff = 0;
    vt.forEach(t => { if ((a.variants || {})[t] !== (b.variants || {})[t]) diff++; });
    score += w * (diff / vt.length);
  }
  AXES.forEach(ax => {
    const w = AXIS_WEIGHT[ax] || 1; total += w;
    if (ax === 'order') {
      const x = orderOf(a.order), y = orderOf(b.order);
      const n = Math.max(x.length, y.length) || 1;
      let same = 0;
      for (let i = 0; i < n; i++) if (x[i] === y[i]) same++;
      score += w * (1 - same / n);
    } else {
      score += w * (a[ax] === b[ax] ? 0 : 1);
    }
  });
  return score / total;
}

/* ---------- structural distance --------------------------------------
   `distance` above answers "are these two different websites?" and
   counts the whole composition, look included. It is the right question
   for a batch drawn from the full set of directions, and the measured
   floor of 0.55 is met there.

   It is the wrong question for a batch inside ONE direction. Choosing
   Quiet luxury is a decision to fix the palette, the type pairing, the
   motion language and the scene — so a measurement that counts those as
   differences can only report that a client got what they asked for as
   though it were a failure. Measured on the eight directions, a
   single-direction batch scores 0.14-0.46 on `distance`, and widening
   the allow-lists until it cleared 0.55 would mean dissolving the
   direction into the open pool.

   So this measures only what a direction leaves free: the opening frame,
   the section sequence, the navigation, the density and the seven
   section layouts. Six proposals inside one direction have to be six
   different pages even when they are deliberately one brand world, and
   this is the number that says whether they are. Both figures are
   reported; neither is asserted without being shown. */
const STRUCT_AXES = ['hero', 'order', 'nav', 'density'];
const STRUCT_WEIGHT = { hero: 2.2, order: 2.0, nav: 1.3, density: 1.2 };

function structDistance(a, b) {
  let score = 0, total = 0;
  STRUCT_AXES.forEach(ax => {
    const w = STRUCT_WEIGHT[ax]; total += w;
    if (ax === 'order') {
      const x = orderOf(a.order), y = orderOf(b.order);
      const n = Math.max(x.length, y.length) || 1;
      let same = 0;
      for (let i = 0; i < n; i++) if (x[i] === y[i]) same++;
      score += w * (1 - same / n);
    } else score += w * (a[ax] === b[ax] ? 0 : 1);
  });
  const vt = VARIANT_TYPES.filter(t => (a.variants && a.variants[t]) || (b.variants && b.variants[t]));
  if (vt.length) {
    const w = 3.2; total += w;
    let diff = 0;
    vt.forEach(t => { if ((a.variants || {})[t] !== (b.variants || {})[t]) diff++; });
    score += w * (diff / vt.length);
  }
  return score / total;
}

function uniqueness(comps) {
  const pairs = [];
  let min = 1, sum = 0, n = 0, sMin = 1, sSum = 0;
  for (let i = 0; i < comps.length; i++) {
    for (let j = i + 1; j < comps.length; j++) {
      const d = distance(comps[i], comps[j]);
      const sd = structDistance(comps[i], comps[j]);
      pairs.push({ a: i, b: j, d: Math.round(d * 100) / 100,
        sd: Math.round(sd * 100) / 100,
        shared: AXES.filter(ax => comps[i][ax] === comps[j][ax]) });
      if (d < min) min = d;
      if (sd < sMin) sMin = sd;
      sum += d; sSum += sd; n++;
    }
  }
  pairs.sort((x, y) => x.d - y.d);
  /* one direction across the whole batch means the client chose it */
  const dirs = comps.map(c => c.direction).filter(Boolean);
  const single = dirs.length === comps.length && new Set(dirs).size === 1;
  return {
    min: Math.round(min * 100) / 100,
    mean: n ? Math.round(sum / n * 100) / 100 : 1,
    structMin: Math.round(sMin * 100) / 100,
    structMean: n ? Math.round(sSum / n * 100) / 100 : 1,
    single,
    pairs,
    /* judged against the floor that applies to how the batch was asked for */
    verdict: single
      ? (sMin >= STRUCT_FLOOR ? 'distinct layouts, one direction'
         : sMin >= .35 ? 'close' : 'too similar')
      : (min >= DISTINCT_FLOOR ? 'distinct' : min >= 0.4 ? 'close' : 'too similar')
  };
}

/* ---------- the generator -------------------------------------------
   Composes a batch, then repairs it: the proposal involved in the
   closest pair is recomposed, up to a bounded number of attempts. The
   result records the uniqueness it achieved rather than asserting it. */
const DISTINCT_FLOOR = 0.55;
/* The floor for a single-direction batch, applied to structural
   distance. Set at 0.5 from measurement, not from preference: see the
   note above structDistance. */
const STRUCT_FLOOR = 0.5;

function generate(cfg, opts) {
  opts = opts || {};
  /* Six directions, one per design family. The directive is explicit:
     six, and distinguishable from each other in grayscale. */
  const count = opts.count || 6;
  const dna = opts.dna || deriveDNA(cfg);
  const seed = opts.seed || newSeed();
  const rnd = mulberry32(hashSeed(seed + '|' + dnaFingerprint(dna)));
  const locks = opts.locks || {};
  const keep = opts.keep || [];          /* proposals carried over untouched */

  /* ---- which creative directions this batch is drawn from ----
     The pool comes from the brief: the directions chosen in the Design
     Gallery, or all eight when none were. With all eight in the pool and
     six slots to fill, each proposal gets a different direction, which
     is what makes a batch read as six studios rather than one studio in
     six moods. With one chosen, all six sit inside it and differ on
     whatever that direction leaves free. A caller can override the pool
     outright, which is how regenerate-one-in-this-direction works. */
  const pool = opts.directions && opts.directions.length ? opts.directions
    : (((cfg.brief || {}).styles || []).length ? cfg.brief.styles : DIRECTION_IDS);
  const dirs = assignDirections(count, pool, dna);
  /* A kept proposal keeps its own direction; only the empty slots are
     dealt from the pool, so regenerating one slot cannot silently
     re-theme the five a client decided to keep. */
  keep.forEach((c, i) => { if (c && c.direction) dirs[i] = c.direction; });

  const used = {}; AXES.forEach(a => { used[a] = []; });
  VARIANT_TYPES.forEach(t => { used['v:' + t] = []; });
  const note = (c) => {
    AXES.forEach(a => used[a].push(c[a]));
    VARIANT_TYPES.forEach(t => { if (c.variants && c.variants[t]) used['v:' + t].push(c.variants[t]); });
  };
  keep.forEach(note);

  const out = keep.slice();
  while (out.length < count) {
    const c = composeOne(dna, rnd, used, locks, cfg, dirs[out.length]);
    c.seed = seed;
    out.push(c); note(c);
  }

  /* Repair pass. The pair it goes after is the closest pair by whichever
     measure applies to how the batch was asked for — overall distance
     for an open pool, structural distance when the client has chosen one
     direction and the look is theirs to keep. */
  let attempts = 0;
  while (attempts < 40) {
    const u = uniqueness(out);
    const ok = u.single ? u.structMin >= STRUCT_FLOOR : u.min >= DISTINCT_FLOOR;
    if (ok) break;
    const worst = u.single
      ? u.pairs.slice().sort((x, y) => x.sd - y.sd)[0]
      : u.pairs[0];
    /* never recompose something the user asked to keep */
    const idx = (worst.b >= keep.length) ? worst.b : (worst.a >= keep.length ? worst.a : -1);
    if (idx < 0) break;
    const fresh = composeOne(dna, rnd, used, locks, cfg, dirs[idx]);
    fresh.seed = seed;
    out[idx] = fresh; note(fresh);
    attempts++;
  }

  /* a client who sells things must be offered at least one proposal on an
     engine built for selling; without this the batch can be coherent and
     still miss the point of the brief */
  const shopVisible = allSections(cfg).some(s => s.type === 'products' && s.visible);
  if (dna.commerce > .5 && shopVisible && !out.some(p => p.engine === 'spectra') && !locks.engine) {
    let worst = keep.length;
    for (let i = keep.length; i < out.length; i++) {
      const f = ENGINE_FIT[out[i].engine] ? ENGINE_FIT[out[i].engine](dna) : .4;
      const wf = ENGINE_FIT[out[worst].engine] ? ENGINE_FIT[out[worst].engine](dna) : .4;
      if (f < wf) worst = i;
    }
    if (worst < out.length) { out[worst] = Object.assign({}, out[worst], { engine: 'spectra' });
      reconcileScene(out[worst], dna); }
  }

  const u = uniqueness(out);
  return {
    seed, dna, count, locks,
    proposals: out,
    uniqueness: u,
    space: combinationCount(),
    repaired: attempts,
    /* said plainly, not asserted: the floor is 0.55 and this is what was reached */
    /* `met` answers the question the batch was asked, and `floor`
       records which one that was, so a reader is never left guessing
       which number the verdict refers to. */
    met: u.single ? u.structMin >= STRUCT_FLOOR : u.min >= DISTINCT_FLOOR,
    floor: u.single ? { kind: 'structural', value: STRUCT_FLOOR, got: u.structMin }
                    : { kind: 'overall', value: DISTINCT_FLOOR, got: u.min },
    directions: dirs
  };
}

/* regenerate one slot, leaving every other proposal exactly as it was */
function regenerateOne(cfg, batch, index, locks) {
  const dna = batch.dna || deriveDNA(cfg);
  const keep = batch.proposals.filter((_, i) => i !== index);
  const seed = newSeed();
  const r = generate(cfg, { count: batch.proposals.length, dna, seed,
    locks: locks || batch.locks, keep });
  /* put the fresh one back in the slot it came from */
  const fresh = r.proposals[r.proposals.length - 1];
  const out = batch.proposals.slice();
  out[index] = fresh;
  const u = uniqueness(out);
  return Object.assign({}, batch, { proposals: out, uniqueness: u,
    met: u.single ? u.structMin >= STRUCT_FLOOR : u.min >= DISTINCT_FLOOR,
    floor: u.single ? { kind: 'structural', value: STRUCT_FLOOR, got: u.structMin }
                    : { kind: 'overall', value: DISTINCT_FLOOR, got: u.min } });
}

/* ---------- a composition becomes a configuration -------------------
   The engines read tokens, not bank entries, so this is where a
   composition is flattened. Content is never touched: only theme,
   section order and the composition record change. */
function withComposition(cfg, comp) {
  const c = JSON.parse(JSON.stringify(cfg));
  const pal = bankItem('palette', comp.palette) || PALETTE_BANK[0];
  const ty = bankItem('typeset', comp.typeset) || TYPE_BANK[0];
  const mo = bankItem('motion', comp.motion) || MOTION_BANK[1];
  const tch = cfg.theme._touched || {};

  c.theme = Object.assign({}, c.theme, { ds: comp.engine });
  if (!tch.brand) c.theme.brand = pal.brand;
  if (!tch.accent) c.theme.accent = pal.accent;
  if (!tch.fontPair) c.theme.fontPair = ty.pair;
  if (!tch.motion) c.theme.motion = mo.motion;

  /* The direction's appearance. Three of the eight are conceived dark —
     a cinematic studio, quiet luxury, immersive dimension — and opening
     them in day mode shows the client something the gallery card did not
     promise. The visitor's own toggle still works, and a client who has
     set the mode by hand keeps it. */
  const dir = directionById(comp.direction);
  if (dir && dir.mode && !tch.mode) c.theme.mode = dir.mode;

  /* Section order from the composition, applied within each page: hero
     first, contact last, anything the client hid stays hidden. A page
     that holds one section is unaffected, which is most of them — the
     axis does its real work on the home page. */
  const ord = orderOf(comp.order);
  (c.pages || []).forEach(pg => {
    const by = {}; (pg.sections || []).forEach(s => { by[s.type] = s; });
    const next = [];
    if (by.hero) next.push(by.hero);
    ord.forEach(t => { if (by[t]) next.push(by[t]); });
    (pg.sections || []).forEach(s => { if (next.indexOf(s) < 0 && s.type !== 'contact') next.push(s); });
    if (by.contact) next.push(by.contact);
    pg.sections = next;
  });

  c._comp = comp;
  return c;
}

/* ---------------------------------------------------------------------
   The sitemap, derived from the brief.

   v11 §06 puts a sitemap between the brief and the five directions, and
   this is where it belongs: by the time a batch is generated there is
   finally something to base one on — what the client actually sells,
   how much of it there is, and who they are talking to.

   A section type lives on exactly one page. That is what keeps content
   keyed by type: the About section is the About section wherever it is
   shown, and moving it between pages never asks the client to retype it.

   A section is promoted to its own page only when there is enough of it
   to fill one. Three services make a Services page; two do not, and
   padding a page out with nothing is how template builders produce
   sites with four empty tabs.
   --------------------------------------------------------------------- */
function deriveSitemap(cfg) {
  const c = cfg.content || {};
  const n = (k) => ((c[k] || {}).items || []).filter(x => x && (x.title || x.name || x.v)).length;
  const was = {};
  allSections(cfg).forEach(s => { was[s.type] = s; });
  const vis = (t) => was[t] ? was[t].visible !== false : true;

  const hasShop = vis('products') && n('products') > 0;
  const ownPage = {
    about:    !!(c.about && (c.about.body || '').trim().length > 160),
    services: n('services') >= 3,
    work:     n('work') >= 2,
    products: hasShop,
    contact:  true,
  };

  const home = ['hero'];
  ['services', 'work', 'about', 'stats', 'testimonial'].forEach(t => {
    if (!ownPage[t] && vis(t)) home.push(t);
  });

  const pages = [blankPage(HOME, 'Home', '', home)];
  const add = (id, name, slug, types, desc) => {
    const live = types.filter(vis);
    if (!live.length) return;
    const p = blankPage(id, name, slug, live);
    p.description = desc || '';
    pages.push(p);
  };

  if (ownPage.about)    add('about', 'About', 'about', ['about']);
  if (ownPage.services) add('services', 'Services', 'services', ['services']);
  if (ownPage.work)     add('work', 'Work', 'work', ['work']);
  if (ownPage.products) add('shop', 'Shop', 'shop', ['products']);
  add('contact', 'Contact', 'contact', ['contact']);

  /* Carry each section's visibility across, so a section the client
     switched off stays off wherever the sitemap puts it. */
  pages.forEach(p => p.sections.forEach(s => {
    if (was[s.type]) s.visible = was[s.type].visible !== false;
  }));

  /* Nothing is dropped. Any section type the rules above did not place
     goes back on Home, hidden if it was hidden, so a sitemap change can
     never silently lose a section the client had filled in. */
  const placed = {};
  pages.forEach(p => p.sections.forEach(s => { placed[s.type] = true; }));
  SECTION_TYPES.forEach(t => {
    if (!placed[t]) pages[0].sections.push({ type: t, visible: was[t] ? was[t].visible !== false : false });
  });
  return pages;
}

const renderProposal = (cfg, comp, page) =>
  dsById(comp.engine).render(pageView(withComposition(cfg, comp), page));

/* a one-line description of a proposal, built from the banks rather than
   from an adjective generator */
function describe(comp) {
  const n = (ax) => { const it = bankItem(ax, comp[ax]); return it ? it.name : comp[ax]; };
  const eng = DESIGN_SYSTEMS.find(d => d.id === comp.engine);
  const dir = directionById(comp.direction);
  return {
    /* The direction is what a client recognises, so it leads the card.
       The engine is the craft underneath and stays on the detail line. */
    title: dir ? dir.name : ((eng ? eng.name : comp.engine) + ' · ' + n('palette')),
    direction: dir ? dir.id : '',
    wordmark: dir ? dir.wordmark : '',
    sector: dir ? dir.sector : '',
    line: [n('hero'), n('typeset'), n('order'), n('density') + ' density'].join(' · '),
    engine: eng ? eng.name : comp.engine,
    palette: n('palette'),
    scene: n('scene'), nav: n('nav'), motion: n('motion'), ornament: n('ornament')
  };
}

/* =====================================================================
   06 · VERTEX — bold creative studio

   The sixth direction, and deliberately the least well-behaved of the
   six. Where Plinth is a grid and Atelier is a column, Vertex is an
   argument with the grid: a vertical rail of section labels pinned down
   the left edge, enormous ghost numerals behind each section, headlines
   that switch to outlined type mid-sentence, and a portfolio that
   staggers down the page at four different offsets instead of lining up.

   The point of the sixth is not another palette. Printed in grayscale
   with the logo removed, this has to be unmistakably not the other
   five, and what makes it so is the rail, the numerals and the stagger
   — none of which any other engine has.
   ===================================================================== */
function dsVertex(cfg) {
  const t = cfg.theme, c = cfg.content, b = cfg.business;

  /* The scene: a woven ribbon lattice. Chosen because it reads as a
     made object rather than a data visualisation — the other engines
     already have terrain, dust, suspended sheets and massing between

  const gl = !useGL ? '' : GL_RUNTIME + `
<script>
__icoreScene({
  z: 5.4, fov: 44, brand: '${brand}', accent: '${accent}',
  build: function(c){
    var T = c.THREE;
    c.group = new T.Group();
    c.ribbons = [];
    var count = c.small ? 5 : 7, seg = c.small ? 56 : 90;
    for (var r = 0; r < count; r++){
      var pts = [];
      for (var i = 0; i <= seg; i++){
        var tt = i / seg;
        pts.push(new T.Vector3(
          (tt - .5) * 9,
          Math.sin(tt * Math.PI * 2 + r * .9) * (.5 + r * .085),
          Math.cos(tt * Math.PI * 1.6 + r * .55) * .85 - r * .22));
      }
      var geo = new T.BufferGeometry().setFromPoints(pts);
      var line = new T.Line(geo, new T.LineBasicMaterial({ transparent: true }));
      c.group.add(line);
      c.ribbons.push({ line: line, phase: r * .9, amp: .5 + r * .085, i: r });
    }
    var N = c.small ? 90 : 180, pos = new Float32Array(N * 3);
    for (var k = 0; k < N; k++){
      pos[k*3]   = (k % 17 / 17 - .5) * 10;
      pos[k*3+1] = ((k * 7) % 23 / 23 - .5) * 5.5;
      pos[k*3+2] = ((k * 13) % 11 / 11 - .5) * 3.5;
    }
    var dg = new T.BufferGeometry();
    dg.setAttribute('position', new T.BufferAttribute(pos, 3));
    c.dust = new T.Points(dg, new T.PointsMaterial({ size: .035, transparent: true, opacity: .5 }));
    c.group.add(c.dust);
    c.scene.add(c.group);
  },
  mode: function(c, tk){
    c.ribbons.forEach(function(rb){
      rb.line.material.color.set(rb.i % 2 ? tk.brand : tk.accent);
      rb.line.material.opacity = (tk.day ? .34 : .26) + (rb.i / 7) * .3;
    });
    c.dust.material.color.set(tk.brand);
    c.dust.material.opacity = tk.day ? .34 : .5;
  },
  frame: function(c, t){
    c.group.rotation.z = Math.sin(t * .11) * .07;
    c.group.rotation.y = Math.sin(t * .08) * .13;
    for (var i = 0; i < c.ribbons.length; i++){
      var rb = c.ribbons[i], pa = rb.line.geometry.attributes.position;
      for (var j = 0; j < pa.count; j++){
        var tt = j / (pa.count - 1);
        pa.setY(j, Math.sin(tt * Math.PI * 2 + rb.phase + t * .42) * rb.amp);
      }
      pa.needsUpdate = true;
    }
  }
});
<\/script>` + '';

  return docShell(cfg, css, orderSections(cfg, S).join('') + gl);

/* =====================================================================
   COMMERCE — couriers and payment methods as a registry.

   The requirement is architectural: a store owner configures providers
   without programming, and a developer adds a courier or a gateway
   without touching the core. So there is no branch anywhere that says
   "if TCS". There is a registry of descriptors, a validator that
   decides what may enter it, and code that reads whatever is in it.

   Pakistan's couriers are in the registry because this firm sells in
   Pakistan, not because the engine knows anything about Pakistan. An
   international store registers a different set and nothing else
   changes.

   WHAT THIS DOES NOT DO, and does not pretend to.

   There is no cart, no checkout, no order and no payment capture. A
   courier descriptor describes a courier; it does not move a parcel. A
   gateway descriptor describes a gateway; it does not take money. That
   needs a server, credentials, sandbox testing and each provider's own
   approval, and none of those exist here. So a provider's state is
   never "live". The best any of them reaches in this build is
   "configured" — the store owner has entered what it needs and the
   store can honestly say it offers that method.
   ===================================================================== */

/* ---------- what a descriptor must look like ---------- */
/* Deliberately small and declarative. Nothing here is a function, so
   nothing registered can execute. */
const COURIER_FIELDS = ['id', 'name', 'countries', 'services', 'cod', 'tracking', 'credentials', 'site', 'notes'];
const PAYMENT_FIELDS = ['id', 'name', 'kind', 'countries', 'currencies', 'credentials', 'site', 'notes', 'capture'];

const COURIERS = {};
const PAYMENTS = {};

/* A registration is untrusted input — it may come from an imported
   configuration file. Anything that could execute, navigate or smuggle
   markup is refused outright rather than sanitised, because a
   half-cleaned descriptor is harder to reason about than a rejected
   one. */
function safeDescriptor(d, allowed, kind) {
  if (!d || typeof d !== 'object' || Array.isArray(d)) throw new Error(kind + ': not an object');
  if (typeof d.id !== 'string' || !/^[a-z0-9][a-z0-9_-]{1,30}$/.test(d.id))
    throw new Error(kind + ': id must be lower-case letters, digits, dash or underscore');
  if (typeof d.name !== 'string' || !d.name.trim() || d.name.length > 60)
    throw new Error(kind + ' ' + d.id + ': needs a name under 60 characters');

  for (const k of Object.keys(d)) {
    if (allowed.indexOf(k) < 0) throw new Error(kind + ' ' + d.id + ': unknown field "' + k + '"');
    const v = d[k];
    if (typeof v === 'function') throw new Error(kind + ' ' + d.id + ': "' + k + '" is executable');
  }
  const scan = (v, path) => {
    if (typeof v === 'string') {
      if (/^\s*javascript:/i.test(v)) throw new Error(kind + ' ' + d.id + ': ' + path + ' is a javascript: URL');
      if (/^\s*data:text\/html/i.test(v)) throw new Error(kind + ' ' + d.id + ': ' + path + ' is an inline HTML document');
      if (/<\s*script/i.test(v)) throw new Error(kind + ' ' + d.id + ': ' + path + ' contains a script tag');
      if (/\bon[a-z]+\s*=/i.test(v)) throw new Error(kind + ' ' + d.id + ': ' + path + ' contains an event handler');
    } else if (Array.isArray(v)) {
      v.forEach((x, i) => scan(x, path + '[' + i + ']'));
    } else if (v && typeof v === 'object') {
      Object.keys(v).forEach(k => scan(v[k], path + '.' + k));
    } else if (typeof v === 'function') {
      throw new Error(kind + ' ' + d.id + ': ' + path + ' is executable');
    }
  };
  Object.keys(d).forEach(k => scan(d[k], k));

  if (d.site && !/^https:\/\/[a-z0-9.-]+\.[a-z]{2,}(\/|$)/i.test(d.site))
    throw new Error(kind + ' ' + d.id + ': site must be an https address');
  if (d.credentials && !Array.isArray(d.credentials))
    throw new Error(kind + ' ' + d.id + ': credentials must be a list of field names');
  (d.credentials || []).forEach(c => {
    if (!c || typeof c.key !== 'string' || typeof c.label !== 'string')
      throw new Error(kind + ' ' + d.id + ': each credential needs a key and a label');
    if (Object.prototype.hasOwnProperty.call(c, 'value'))
      throw new Error(kind + ' ' + d.id + ': a descriptor must not carry a credential value');
  });
  return d;
}

function registerCourier(d) {
  safeDescriptor(d, COURIER_FIELDS, 'courier');
  COURIERS[d.id] = Object.assign({ countries: [], services: [], cod: false, tracking: false, credentials: [] }, d);
  return COURIERS[d.id];
}
function registerPayment(d) {
  safeDescriptor(d, PAYMENT_FIELDS, 'payment method');
  PAYMENTS[d.id] = Object.assign({ countries: [], currencies: [], credentials: [], kind: 'gateway', capture: 'provider' }, d);
  return PAYMENTS[d.id];
}
const courierList = () => Object.keys(COURIERS).map(k => COURIERS[k]);
const paymentList = () => Object.keys(PAYMENTS).map(k => PAYMENTS[k]);

/* ---------- the store's own configuration ---------- */
function blankCommerce() {
  return {
    country: 'PK',
    couriers: {},     /* id -> { on, credentials: {key: 'set'|''} } */
    payments: {},     /* id -> { on, credentials: {...} }           */
    zones: [],        /* [{ id, name, places, rate, free, days }]   */
    policy: { returns: '', shipping: '' },
    /* Where a placed order goes. Empty means checkout is switched off
       rather than silently dropping orders — see parts/078_cart.js. */
    orders: { endpoint: '' },
  };
}
const commerceOf = (cfg) => cfg.commerce || (cfg.commerce = blankCommerce());

/* Credentials are a presence map, never values. The studio runs in a
   browser and exports static HTML; a key typed here would end up in the
   page. So what is stored is "this field has been provided", and the
   value itself belongs in the host's environment, server side. */
function credState(entry, desc) {
  const need = (desc.credentials || []).map(c => c.key);
  if (!need.length) return 'ready';
  const have = (entry && entry.credentials) || {};
  const missing = need.filter(k => !have[k]);
  return missing.length ? 'missing' : 'ready';
}
function missingCreds(entry, desc) {
  const have = (entry && entry.credentials) || {};
  return (desc.credentials || []).filter(c => !have[c.key]);
}

/* The one function that decides what a provider's state is. Nothing
   anywhere else may call a provider live. */
function providerState(cfg, desc, entry) {
  if (!entry || !entry.on) return { state: 'off', label: 'Not offered' };
  const cs = credState(entry, desc);
  if (cs === 'missing') {
    const m = missingCreds(entry, desc);
    return { state: 'incomplete', label: 'Waiting on details',
      detail: 'Needs ' + m.map(c => c.label).join(', ') };
  }
  if (!(desc.credentials || []).length) {
    return { state: 'configured', label: 'Offered',
      detail: desc.notes || 'No account needed' };
  }
  return { state: 'configured', label: 'Offered',
    detail: 'Details recorded. Nothing is charged or booked from this site — that needs a server and this provider’s own approval' };
}

/* What the store can honestly say it offers. */
function liveCouriers(cfg) {
  const c = commerceOf(cfg);
  return courierList().filter(d => {
    const e = c.couriers[d.id];
    return providerState(cfg, d, e).state === 'configured';
  });
}
function livePayments(cfg) {
  const c = commerceOf(cfg);
  return paymentList().filter(d => {
    const e = c.payments[d.id];
    if (providerState(cfg, d, e).state !== 'configured') return false;
    /* Cash on delivery is collected by a courier. Offering it with no
       courier that does it would be a promise nobody can keep. */
    if (d.id === 'cod') return liveCouriers(cfg).some(x => x.cod);
    return true;
  });
}

/* ---------- what the shop page shows ---------- */
const money2 = (cfg, n) => (cfg.business.currency || 'PKR') + ' ' + (Number(n) || 0).toLocaleString('en-US');

function deliveryPanel(cfg) {
  const c = commerceOf(cfg);
  const cour = liveCouriers(cfg);
  const pay = livePayments(cfg);
  const zones = (c.zones || []).filter(z => (z.name || '').trim());
  if (!cour.length && !pay.length && !zones.length) return '';

  let h = '<div class="deliv" id="delivery"><div class="dgrid">';

  if (zones.length) {
    h += '<div class="dcol"><h3>Delivery</h3><table class="dz"><tbody>' +
      zones.map(z =>
        '<tr><th>' + E(z.name) + (z.places ? '<span>' + E(z.places) + '</span>' : '') + '</th>' +
        '<td>' + (Number(z.rate) > 0 ? E(money2(cfg, z.rate)) : 'Free') +
        (Number(z.free) > 0 ? '<span>free over ' + E(money2(cfg, z.free)) + '</span>' : '') + '</td>' +
        '<td>' + (z.days ? E(z.days) : '') + '</td></tr>').join('') +
      '</tbody></table></div>';
  }
  if (cour.length) {
    h += '<div class="dcol"><h3>Couriers</h3><ul class="dlist">' +
      cour.map(d => '<li>' + E(d.name) +
        (d.tracking ? '<span>tracked</span>' : '') +
        (d.cod ? '<span>cash on delivery</span>' : '') + '</li>').join('') +
      '</ul></div>';
  }
  if (pay.length) {
    h += '<div class="dcol"><h3>Payment</h3><ul class="dlist">' +
      pay.map(d => '<li>' + E(d.name) + (d.kind === 'manual' ? '<span>confirmed by us</span>' : '') + '</li>').join('') +
      '</ul>' +
      '<p class="dnote">' + E(cartReadiness(cfg).ok
        ? 'You can order on this site. No card payment is taken here: ' +
          checkoutMethods(cfg).map(m => m.name.toLowerCase() + ' is settled ' + m.settle).join(', ') + '.'
        : 'Orders are arranged by enquiry — there is no checkout on this site, and no payment is taken here.') +
      '</p>' +
      '</div>';
  }
  if (c.policy && (c.policy.shipping || c.policy.returns)) {
    h += '<div class="dcol">' +
      (c.policy.shipping ? '<h3>Shipping</h3><p class="dnote">' + E(c.policy.shipping) + '</p>' : '') +
      (c.policy.returns ? '<h3>Returns</h3><p class="dnote">' + E(c.policy.returns) + '</p>' : '') +
      '</div>';
  }
  h += '</div></div>';
  return h;
}

/* Seated inside the products section rather than appended to the page,
   because delivery and payment are facts about buying these things and
   belong beside them. The engines do not nest <section>, so the first
   closing tag after the products section opens is that section's. */
function withDelivery(cfg, html) {
  const panel = deliveryPanel(cfg);
  if (!panel) return html;
  const open = html.indexOf('<section id="products"');
  if (open < 0) return html;
  const close = html.indexOf('</section>', open);
  if (close < 0) return html;
  return html.slice(0, close) + panel + html.slice(close);
}

/* =====================================================================
   PUBLISH — the technical infrastructure every site ships with.

   v14 asks that a non-technical person never hand-write robots.txt,
   favicons, sitemaps, metadata or structured data, and that every
   generated site be portable. So the export stops being a configuration
   file and becomes the website: a folder of real documents, one per
   page, with the files a web server and a crawler expect to find.

   Two rules run through all of it.

   Nothing is invented. Structured data carries only what the client
   actually typed. There is no AggregateRating, because there are no
   reviews; no priority or changefreq in the sitemap, because those are
   guesses dressed as facts. A field with no answer is left out rather
   than filled with something plausible.

   Nothing is claimed. A sitemap needs absolute URLs, so until the
   client says where the site will live there is no sitemap and the
   scorecard says so. An address is a fact about the world that this
   program cannot find out on its own.
   ===================================================================== */

/* ---------- the site's own settings ---------- */
function blankSite() {
  return {
    url: '',              /* where it will live; empty until the client says */
    locale: 'en',
    themeColor: '',       /* falls back to the brand colour */
    social: { title: '', description: '' },
    robots: { indexable: true },
  };
}

/* An origin we can build absolute URLs from, or '' when we cannot. A
   half-typed address is worse than none: it produces canonical tags
   pointing at a host that does not exist. */
function siteOrigin(cfg) {
  const raw = ((cfg.site || {}).url || '').trim();
  if (!raw) return '';
  let u = raw;
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  try {
    const p = new URL(u);
    if (!p.hostname || p.hostname.indexOf('.') < 0) return '';
    return p.protocol + '//' + p.host;
  } catch (e) { return ''; }
}
const absUrl = (cfg, path) => {
  const o = siteOrigin(cfg);
  return o ? o + (path || '/') : '';
};

/* ---------- icons ---------- */
/* Drawn here rather than fetched: a mark built from the business's own
   initials and its own brand colour, which is what v14 asks for — the
   site's branding, never the builder's. Two letters at most; at 16px
   anything more is a smudge. */
function siteInitials(cfg) {
  const n = (cfg.business.name || '').trim();
  if (!n) return '';
  const words = n.replace(/[^\p{L}\p{N} ]/gu, ' ').split(/\s+/).filter(Boolean);
  if (!words.length) return '';
  if (words.length === 1) return words[0].slice(0, 2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function faviconSVG(cfg) {
  const brand = cfg.theme.brand || '#1B3A6B';
  /* white on the brand unless the brand is pale, measured rather than
     guessed — the same contrast formula the rest of the product uses */
  const ink = ratio('#FFFFFF', brand) >= 3.2 ? '#FFFFFF' : '#0B0D12';
  const t = siteInitials(cfg);
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="' +
    E(cfg.business.name || 'Site icon') + '">' +
    '<rect width="64" height="64" rx="14" fill="' + E(brand) + '"/>' +
    (t ? '<text x="32" y="33" text-anchor="middle" dominant-baseline="central" ' +
         'font-family="Helvetica,Arial,sans-serif" font-weight="700" font-size="' +
         (t.length > 1 ? 28 : 36) + '" fill="' + ink + '" letter-spacing="-1">' + E(t) + '</text>' : '') +
    '</svg>\n';
}
function webManifest(cfg) {
  const name = cfg.business.name || 'Website';
  /* `display: browser` and no service worker: this is a manifest for
     the icon and the name, not a claim that the site installs as an
     app. v14 is explicit that installable claims need real
     installability behind them. */
  return JSON.stringify({
    name: name,
    short_name: name.length > 12 ? name.slice(0, 12).trim() : name,
    icons: [{ src: '/favicon.svg', sizes: 'any', type: 'image/svg+xml' }],
    start_url: '/',
    display: 'browser',
    theme_color: (cfg.site || {}).themeColor || cfg.theme.brand || '#1B3A6B',
    background_color: '#FFFFFF',
  }, null, 2) + '\n';
}

/* ---------- robots.txt ---------- */
function robotsTxt(cfg) {
  const site = cfg.site || blankSite();
  const sm = absUrl(cfg, '/sitemap.xml');
  if (site.robots && site.robots.indexable === false) {
    return '# This site is set to stay out of search results.\n' +
      'User-agent: *\nDisallow: /\n';
  }
  return 'User-agent: *\n' +
    'Allow: /\n' +
    (sm ? '\nSitemap: ' + sm + '\n'
        : '\n# No sitemap line: the site has no address yet. Set one in\n' +
          '# the Publish tab and export again.\n');
}

/* ---------- sitemap.xml ---------- */
/* Only canonical, public, indexable URLs, and no priority or
   changefreq — v14 §03 calls those out, and they are guesses that
   search engines ignore anyway. lastmod is the day the file was
   built, which is the one honest thing we know about it. */
function sitemapXml(cfg, pages, when) {
  const o = siteOrigin(cfg);
  if (!o) return '';
  const day = (when || new Date()).toISOString().slice(0, 10);
  const urls = pages.map(p =>
    '  <url>\n' +
    '    <loc>' + E(o + pageHref(p)) + '</loc>\n' +
    '    <lastmod>' + day + '</lastmod>\n' +
    '  </url>').join('\n');
  return '<?xml version="1.0" encoding="UTF-8"?>\n' +
    '<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n' +
    urls + '\n</urlset>\n';
}

/* ---------- structured data ---------- */
/* JSON-LD built only from what the client typed. No ratings, no review
   counts, no founding date, no employee count — none of that has been
   asked for, so none of it is asserted. */
function jsonLd(cfg, page, pages) {
  const o = siteOrigin(cfg);
  const b = cfg.business;
  const nodes = [];

  const org = { '@type': 'Organization', name: b.name || '' };
  if (!org.name) return '';
  if (o) org.url = o;
  if (o) org.logo = o + '/favicon.svg';
  if (b.email) org.email = b.email;
  if (b.phone) org.telephone = b.phone;
  if (b.city) org.address = { '@type': 'PostalAddress', addressLocality: b.city };
  if (b.tagline) org.description = b.tagline;
  nodes.push(org);

  if (o) {
    nodes.push({ '@type': 'WebSite', name: b.name, url: o });
    if (!isHome(page)) {
      nodes.push({
        '@type': 'BreadcrumbList',
        itemListElement: [
          { '@type': 'ListItem', position: 1, name: 'Home', item: o + '/' },
          { '@type': 'ListItem', position: 2, name: page.name, item: o + pageHref(page) },
        ],
      });
    }
  }
  return '<script type="application/ld+json">' +
    JSON.stringify({ '@context': 'https://schema.org', '@graph': nodes })
      .replace(/</g, '\\u003c') +
    '<\/script>';
}

/* ---------- the head additions every exported page carries ---------- */
function seoHead(cfg, page, pages) {
  const o = siteOrigin(cfg);
  const site = cfg.site || blankSite();
  let h = '';
  if (o) h += '<link rel="canonical" href="' + E(o + pageHref(page)) + '">';
  if (site.robots && site.robots.indexable === false) h += '<meta name="robots" content="noindex,nofollow">';
  h += '<link rel="icon" href="/favicon.svg" type="image/svg+xml">';
  h += '<link rel="manifest" href="/site.webmanifest">';
  h += '<meta name="theme-color" content="' + E(site.themeColor || cfg.theme.brand || '#1B3A6B') + '">';
  if (o) h += '<meta property="og:url" content="' + E(o + pageHref(page)) + '">';
  if (cfg.business.name) h += '<meta property="og:site_name" content="' + E(cfg.business.name) + '">';
  h += '<meta name="twitter:card" content="summary">';
  h += jsonLd(cfg, page, pages);
  return h;
}

/* ---------- the 404 page ---------- */
/* Rendered by the site's own engine so it looks like the site rather
   than like a server error, and it links home so the visitor is not
   stranded. */
function notFoundPage(cfg) {
  const p = blankPage('notfound', 'Page not found', '404', []);
  p.title = 'Page not found';
  p.description = 'That address does not exist on this site.';
  const view = pageView(cfg, p);
  /* It carries the icon and the manifest like any page, but no
     canonical link and an explicit noindex: a 404 is not a page anyone
     should be sent to from a search result. */
  view._seoHead =
    '<meta name="robots" content="noindex">' +
    '<link rel="icon" href="/favicon.svg" type="image/svg+xml">' +
    '<link rel="manifest" href="/site.webmanifest">' +
    '<meta name="theme-color" content="' +
      E((cfg.site || {}).themeColor || cfg.theme.brand || '#1B3A6B') + '">';
  const ds = dsById(cfg.theme.ds);
  const html = ds.render(view);
  /* The page header is already there; this adds the way back. */
  return html.replace('</header>',
    '</header><div class="w" style="padding:40px 0 80px">' +
    '<p><a href="/" style="color:var(--brandText,inherit)">Go to the home page</a></p></div>');
}

/* ---------- the whole site, as files ---------- */
function buildSite(cfg, when) {
  const pages = (cfg.pages || []).filter(p => pageIsLive(cfg, p));
  const ds = dsById(cfg.theme.ds);
  const files = [];

  asPublished(() => {
    pages.forEach(p => {
      const view = pageView(cfg, p);
      view._seoHead = seoHead(cfg, p, pages);
      const path = isHome(p) ? 'index.html' : p.slug + '/index.html';
      files.push({ path: path, text: ds.render(view) });
    });
  });

  files.push({ path: '404.html', text: notFoundPage(cfg) });
  files.push({ path: 'robots.txt', text: robotsTxt(cfg) });
  const sm = sitemapXml(cfg, pages, when);
  if (sm) files.push({ path: 'sitemap.xml', text: sm });
  files.push({ path: 'favicon.svg', text: faviconSVG(cfg) });
  files.push({ path: 'site.webmanifest', text: webManifest(cfg) });
  files.push({ path: '_redirects', text: '/*  /404.html  404\n' });
  files.push({ path: 'README.txt', text: readmeFor(cfg, pages) });

  /* Two files at one path makes an archive that unpacks differently
     depending on the tool, and a site where one page silently replaces
     another. Two pages can only collide if they share a slug, which
     the editor prevents — so if it happens here, something upstream is
     wrong and saying so beats shipping it. */
  const seen = {};
  files.forEach(f => {
    if (seen[f.path]) throw new Error('two files would be written to ' + f.path +
      ' — two pages share the address /' + f.path.replace(/\/index\.html$/, '') + '/');
    seen[f.path] = true;
  });
  return files;
}

function readmeFor(cfg, pages) {
  const o = siteOrigin(cfg);
  return [
    (cfg.business.name || 'Your website'),
    '',
    'This folder is the website. Every file in it is plain HTML, CSS and',
    'JavaScript — there is nothing to build and nothing to install.',
    '',
    'To put it online, drag this folder onto app.netlify.com/drop, or',
    'upload its contents to any web host.',
    '',
    'Pages:',
  ].concat(pages.map(p => '  ' + pageHref(p) + '   ' + p.name))
   .concat([
    '',
    o ? 'Addresses were written for ' + o
      : 'No address was set, so this site has no sitemap and no canonical',
    o ? '' : 'links. Set one in the Publish tab and export again before you',
    o ? '' : 'submit the site to a search engine.',
    '',
    'The 3D scenes load three.js from a public CDN. Everything else is',
    'in this folder.',
    '',
  ]).filter(x => x !== undefined).join('\n');
}

/* =====================================================================
   A ZIP file, written by hand.

   Store-only: no compression, so there is no deflate implementation to
   get wrong and no library to pull in — which matters because this has
   to work in a file:// page with no network. The format is a sequence
   of local headers and payloads, then a central directory, then an end
   record. Everything is little-endian.
   ===================================================================== */
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function dosTime(d) {
  return { t: ((d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() / 2)) & 0xFFFF,
           d: (((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate()) & 0xFFFF };
}
function zipFiles(files, when) {
  const enc = new TextEncoder();
  const stamp = dosTime(when || new Date());
  const parts = [], central = [];
  let offset = 0;

  files.forEach(f => {
    const name = enc.encode(f.path);
    const data = f.bytes || enc.encode(f.text || '');
    const crc = crc32(data);

    const lh = new DataView(new ArrayBuffer(30));
    lh.setUint32(0, 0x04034b50, true);
    lh.setUint16(4, 20, true);            /* version needed */
    lh.setUint16(6, 0x0800, true);        /* names are UTF-8 */
    lh.setUint16(8, 0, true);             /* stored, not deflated */
    lh.setUint16(10, stamp.t, true);
    lh.setUint16(12, stamp.d, true);
    lh.setUint32(14, crc, true);
    lh.setUint32(18, data.length, true);
    lh.setUint32(22, data.length, true);
    lh.setUint16(26, name.length, true);
    lh.setUint16(28, 0, true);
    parts.push(new Uint8Array(lh.buffer), name, data);

    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true);
    ch.setUint16(4, 20, true);
    ch.setUint16(6, 20, true);
    ch.setUint16(8, 0x0800, true);
    ch.setUint16(10, 0, true);
    ch.setUint16(12, stamp.t, true);
    ch.setUint16(14, stamp.d, true);
    ch.setUint32(16, crc, true);
    ch.setUint32(20, data.length, true);
    ch.setUint32(24, data.length, true);
    ch.setUint16(28, name.length, true);
    ch.setUint32(42, offset, true);
    central.push(new Uint8Array(ch.buffer), name);

    offset += 30 + name.length + data.length;
  });

  const centralSize = central.reduce((a, b) => a + b.length, 0);
  const end = new DataView(new ArrayBuffer(22));
  end.setUint32(0, 0x06054b50, true);
  end.setUint16(8, files.length, true);
  end.setUint16(10, files.length, true);
  end.setUint32(12, centralSize, true);
  end.setUint32(16, offset, true);

  const all = parts.concat(central, [new Uint8Array(end.buffer)]);
  const total = all.reduce((a, b) => a + b.length, 0);
  const out = new Uint8Array(total);
  let at = 0;
  all.forEach(chunk => { out.set(chunk, at); at += chunk.length; });
  return out;
}

  if (brief.mode === 'store') {
    out.audience = 'Consumers';
    out.objective = 'Sell products';
    why.audience = 'a shop sells to people';
    why.objective = 'a shop sells to people';
  }

  /* Several styles can be chosen. Later ones win on any axis they set,
     so the last card tapped is the strongest signal — which is how the
     customer will expect it to behave. */
  styles.forEach(s => {
    Object.keys(s.dna).forEach(k => { out[k] = s.dna[k]; why[k] = 'from ' + s.name; });
  });

  /* Anything still unanswered takes a neutral default rather than being
     left empty, because an empty axis silently weakens the DNA. */
  const fallback = { positioning: 'Premium and considered', audience: 'Founders and small business',
    tone: 'Plain and direct', objective: 'Win enquiries', imagery: 'A little photography',
    appetite: 'Measured movement' };
  Object.keys(fallback).forEach(k => {
    if (!out[k]) { out[k] = fallback[k]; why[k] = 'not chosen — a neutral default'; }
  });
  return { intake: out, why: why };
}

/* Which sections a brief turns on. The category proposes, the feature
   checkmarks dispose. */
function briefSections(brief) {
  const kind = brief.mode === 'store' ? null : siteKind(brief.kind);
  const on = {};
  (kind ? kind.sections : ['about', 'services', 'contact']).forEach(t => { on[t] = true; });
  if (brief.mode === 'store') on.products = true;

  (brief.features || []).forEach(id => {
    const f = featureById(id);
    if (f && f.section) on[f.section] = true;
  });
  /* A feature that is off should switch its section off too — otherwise
     unticking "Testimonials" leaves a testimonial section on the page. */
  FEATURES.forEach(f => {
    if (f.section && (brief.features || []).indexOf(f.id) < 0 && !(kind && kind.sections.indexOf(f.section) >= 0)) {
      if (!(brief.mode === 'store' && f.section === 'products')) on[f.section] = false;
    }
  });
  on.hero = true;
  return on;
}

/* Features that were asked for and are not built. Named, every time,
   rather than quietly dropped. */
function unbuiltFeatures(brief) {
  return (brief.features || []).map(featureById).filter(f => f && !f.built);
}

/* ---------- applying a brief to a project ---------- */
function applyBrief(cfg, brief) {
  const kind = brief.mode === 'store' ? null : siteKind(brief.kind);
  const store = brief.mode === 'store' ? storeKind(brief.kind) : null;
  const inf = inferIntake(brief);

  cfg.brief = JSON.parse(JSON.stringify(brief));
  cfg.business.name = brief.name || cfg.business.name;
  cfg.business.sector = store ? 'Retail or e-commerce' : (kind ? kind.sector : cfg.business.sector);
  /* The one sentence the client typed about themselves. It becomes the
     tagline and, more importantly, the raw material the copy engine
     composes every paragraph from. */
  if ((brief.desc || '').trim() && !String(cfg.business.tagline || '').trim())
    cfg.business.tagline = brief.desc.trim();
  cfg.intake = inf.intake;
  cfg._inferred = inf.why;

  /* Fill the site, so nothing opens empty.
     writeSite FIRST, because both passes refuse to overwrite a filled
     field and whichever runs first owns the prose. writeSite composes a
     multi-paragraph story from what the client typed; draftContent then
     fills the short headline fields from the category bank. The other
     way round, the bank's single stock paragraph won every time and the
     composer never ran — which is why a whole generated site came to
     about a hundred words. */
  /* draftContent FIRST: it fills the short headline fields and the
     service TITLES from the category bank, and it is good at those.
     writeSite SECOND, because it composes from what is now on the
     config — a service title is the only fact a service description
     can be built from, and running the composer first gave it nothing
     to work with. Neither overwrites a word the client wrote. */
  draftContent(cfg, brief);
  if (typeof writeSite === 'function') writeSite(cfg);

  /* Sections follow the brief; the page map is derived afterwards. */
  const want = briefSections(brief);
  const home = homePage(cfg) || blankPage(HOME, 'Home', '', SECTION_TYPES);
  if (!cfg.pages || !cfg.pages.length) cfg.pages = [home];
  allSections(cfg).forEach(s => {
    if (Object.prototype.hasOwnProperty.call(want, s.type)) s.visible = !!want[s.type];
  });
  cfg.pages = deriveSitemap(cfg);
  return cfg;
}

/* Deterministic, so the same brand gets the same draft twice and a
   regenerate is a real change rather than a reshuffle. */
function pickFrom(list, seedStr, salt) {
  if (!list || !list.length) return '';
  const n = hashSeed(String(seedStr || '') + '|' + String(salt || ''));
  return list[n % list.length];
}

/* ---- paired halves of a headline ------------------------------------
   `heroA` and `heroB` are PARALLEL arrays: index i of one completes
   index i of the other. They were being picked independently, with
   salts 'hA' and 'hB', so the halves cross-paired and produced
   headlines that read as a bug the moment anyone looked at the page:

     "Decisions, decisions into clear ones"   (A[2] + B[0])
     "Useful keeping"                         (A[0] + B[1])

   One index, used for both halves. The pairing is the whole point of
   writing them as two lists, and nothing enforced it. */
function pickPair(a, b, seedStr, salt) {
  const A = a || [], B = b || [];
  const n = Math.min(A.length, B.length);
  if (!n) return { a: A[0] || '', b: B[0] || '' };
  const i = hashSeed(String(seedStr || '') + '|' + String(salt || 'pair')) % n;
  return { a: A[i], b: B[i] };
}

/* ---------- the writer ---------- */
/* Every block it fills is recorded in `cfg._drafted` so the editor can
   mark it, the Review tab can count it, and the customer always knows
   which words are theirs and which are ours. */
/* ══════════════════════════════════════════════════════════════════════
   WHAT THE OWNER WROTE

   The brief asks, optionally, "in a sentence, what does it do?" — and
   the comment on that field says it is what the writing is built from.
   It was not. `brief.desc` reached exactly one place, the tagline, and
   every word on the page still came from the category bank.

   That is what made a generated site feel generic no matter how
   distinct its structure was: a coffee ROASTERY that supplies cafes got
   the restaurant bank's "A room, a table, an evening" over "Open most
   days. Booking is wise at the weekend." The second of those is not
   merely generic, it is FALSE — an invented claim about a business that
   takes no bookings, on a page that elsewhere refuses to invent a
   statistic or a testimonial for exactly that reason.

   These two helpers take only what the owner actually typed and
   rearrange it. Nothing here invents a fact. When the sentence is too
   short or too strange to work with, they return nothing and the
   category bank runs as before.
   ══════════════════════════════════════════════════════════════════ */

/* The owner's sentence, tidied: trimmed, one space between words, and
   closed with a full stop if they did not close it themselves. */
function ownSentence(desc) {
  let t = String(desc || '').replace(/\s+/g, ' ').trim();
  if (t.length < 12 || t.length > 420) return '';
  if (!/[.!?]$/.test(t)) t += '.';
  return t[0].toUpperCase() + t.slice(1);
}

/* Services pulled out of the owner's own sentence.

   Only clauses that START WITH A VERB become services, because those
   are the ones that name something the business DOES: "roast single
   origin beans", "supply cafes across Lahore". A clause that starts
   with a noun is usually a description of the business itself and
   belongs in the about text, not in a services list.

   The verb list is deliberately short and concrete. A longer list, or
   any attempt to guess at a verb by its shape, produced services like
   "Are" and "Been" — which is worse than having no services at all,
   and worse in a way the owner has to notice and delete. */
const DOING_VERBS = ('prepare provide offer handle arrange process finish fit ' +
  'grind blend sew tailor mill forge mould glaze fire bind frame mount ' +
  'roast make build design supply deliver sell install repair ' +
  'maintain grow bake brew print publish teach train advise host run manage ' +
  'source import export package cook serve craft weave stitch cut fit wash ' +
  'clean photograph film record write edit translate audit survey plan ' +
  'develop test ship stock curate restore paint fabricate assemble')
  .split(' ');

function servicesFromDesc(desc) {
  const t = String(desc || '').replace(/\s+/g, ' ').trim();
  if (t.length < 20) return [];
  const isVerb = w => {
    w = String(w || '').toLowerCase().replace(/[^a-z-]/g, '');
    return DOING_VERBS.indexOf(w) >= 0 ||
           DOING_VERBS.indexOf(w.replace(/(es|s)$/, '')) >= 0;
  };
  /* "and" joins clauses as often as it joins nouns, so splitting on
     every one of them is wrong in both directions: it cut "Lahore and
     Islamabad" in half, and it cut "design and build" in half too.
     The split happens only where the word AFTER the "and" is a doing
     verb and the word BEFORE it is not — which is the shape of a new
     clause, and not the shape of a compound verb or a pair of nouns. */
  const pieces = [];
  t.split(/[.;]|,\s+/).forEach(seg => {
    const w = seg.split(/\s+/);
    let start = 0;
    for (let i = 1; i < w.length - 1; i++) {
      if (w[i].toLowerCase() === 'and' && isVerb(w[i + 1]) && !isVerb(w[i - 1])) {
        pieces.push(w.slice(start, i).join(' '));
        start = i + 1;
      }
    }
    pieces.push(w.slice(start).join(' '));
  });
  const out = [];
  pieces.forEach(raw => {
    /* "and" has to come off too. A clause that followed a comma keeps
       its conjunction — "…, and we photograph the products" — and with
       it still attached the clause starts with "and", fails the verb
       test, and is dropped. That left one service standing, which the
       floor of two then threw away as well, so a sentence naming two
       real services produced none at all. */
    let s = raw.replace(/^\s*(and|but|also)\s+/i, '')
               .replace(/^\s*(we|they|i)\s+/i, '')
               .replace(/\s+/g, ' ').trim().replace(/[.,;]+$/, '');
    if (!s) return;
    const w = s.split(' ');
    if (w.length < 2 || w.length > 14) return;
    const head = w[0].toLowerCase().replace(/(es|s)$/, '');
    if (DOING_VERBS.indexOf(head) < 0 && DOING_VERBS.indexOf(w[0].toLowerCase()) < 0) return;
    /* The title is the verb and its object, three words at most, so it
       reads as a heading rather than as the sentence repeated twice.
       Pronouns and articles are skipped: "Install them in" is not a
       heading anyone would write. */
    const SKIP = /^(them|it|these|those|the|a|an|his|her|their|our|your)$/i;
    const tw = [w[0]];
    for (let i = 1; i < w.length && tw.length < 3; i++) {
      if (SKIP.test(w[i]) && tw.length < 2) continue;
      if (SKIP.test(w[i])) break;
      tw.push(w[i]);
    }
    /* A heading does not end on a preposition. Cutting the clause at
       three words left "Supply cafes across" and "Photograph products
       that", which read as sentences someone forgot to finish. */
    const TAIL = /^(across|that|which|in|on|for|with|to|from|of|and|at|by)$/i;
    while (tw.length > 1 && TAIL.test(tw[tw.length - 1])) tw.pop();
    const title = tw.join(' ');
    out.push({ title: title[0].toUpperCase() + title.slice(1),
               body: s[0].toUpperCase() + s.slice(1) + '.' });
  });
  /* Two is the floor. One service on a services page looks like a bug,
     and the bank's three are better than that. */
  return out.length >= 2 ? out.slice(0, 4) : [];
}

/* A headline out of the owner's own sentence.

   The bank's headlines are evocative and category-wide, which is fine
   until the category is only approximately right. A coffee ROASTERY
   filed under hospitality got "A room, a table, an evening" — a lovely
   line about a restaurant, on the site of a business that does not have
   a room.

   This takes the first thing the sentence says the business DOES and
   breaks it where the phrase breaks: "Roast single-origin beans" /
   "from Gilgit-Baltistan". Specific, and true by construction, because
   every word came from the owner.

   Returns null when the sentence does not name an action, and the bank
   runs as before — an evocative line is a better failure than a clumsy
   specific one. */
function headlineFromDesc(desc) {
  const sv = servicesFromDesc(desc);
  if (!sv.length) return null;
  const body = sv[0].body.replace(/\.$/, '');
  const a = sv[0].title;
  const rest = body.slice(a.length).trim().split(/\s+/).filter(Boolean);
  if (!rest.length) return { a: a, b: '' };
  /* The second line runs to the next preposition after it, so it breaks
     on a phrase rather than on a word count: "from Gilgit-Baltistan",
     not "from Gilgit-Baltistan in small". */
  const STOP = /^(in|on|for|with|to|at|and|across|from|of|by|that|which)$/i;
  const b = [rest[0]];
  for (let i = 1; i < rest.length && b.length < 4; i++) {
    if (STOP.test(rest[i])) break;
    b.push(rest[i]);
  }
  return { a: a, b: b.join(' ') };
}

function draftContent(cfg, brief) {
  const name = (brief.name || cfg.business.name || '').trim();
  const seed = name || 'untitled';
  const c = cfg.content;
  const own = ownSentence(brief.desc);
  const ownSvc = servicesFromDesc(brief.desc);
  /* Merged, not reset. writeSite records what it composed, and
     replacing the map here erased it — the studio then showed six
     drafted fields when eleven had been written. */
  const drafted = cfg._drafted = Object.assign({}, cfg._drafted || {});
  const put = (path, value) => {
    if (!value) return;
    const a = path.split('.'), k = a.pop();
    const host = a.reduce((x, n) => x[n], c);
    if (String(host[k] || '').trim()) return;   /* never overwrite the owner */
    host[k] = value;
    drafted[path] = true;
  };

  if (brief.mode === 'store') {
    const sc = STORE_COPY[brief.kind] || STORE_COPY.general;
    const kindName = (storeKind(brief.kind) || {}).name || 'shop';
    put('hero.eyebrow', kindName);
    const shpOwn = headlineFromDesc(brief.desc);
    const shp = shpOwn || pickPair(sc.heroA, sc.heroB, seed, 'h');
    put('hero.headlineA', shp.a);
    put('hero.headlineB', shp.b);
    /* The owner's own sentence first. The bank's is a stand-in for not
       knowing anything about the shop, and the moment they tell us
       something it stops being the best line available — except where
       the headline already IS that sentence, which is the same
       say-it-twice fault the site branch had. */
    put('hero.sub', (shpOwn && ownSvc.length > 1
          ? ownSvc.slice(1).map(x => x.body).join(' ')
          : own) || sc.about);
    put('about.heading', 'About ' + (name || 'the shop'));
    /* about.body is left to the copy engine, which composes several
       paragraphs from the client's own words. Writing a stock one here
       claimed the field first and the composer, which refuses to
       overwrite, never ran. */
    put('products.heading', 'Shop');
    put('products.intro', 'Everything currently available.');
    put('contact.heading', 'Questions?');
    put('contact.body', 'Ask us anything about an order, a size or a delivery.');
    if (!cfg.business.ctaLabel || cfg.business.ctaLabel === 'Get in touch') cfg.business.ctaLabel = 'Shop now';
    if (!cfg.business.tagline) { cfg.business.tagline = sc.about; drafted['business.tagline'] = true; }
    return cfg;
  }

  const k = COPY[brief.kind] || COPY.corporate;
  put('hero.eyebrow', (siteKind(brief.kind) || {}).sector || '');
  /* Theirs first here too. The bank is the fallback. */
  const ownH = headlineFromDesc(brief.desc);
  const hp = ownH || pickPair(k.heroA, k.heroB, seed, 'h');
  put('hero.headlineA', hp.a);
  put('hero.headlineB', hp.b);
  /* Theirs beats ours. The bank sentences are written to be safe for a
     whole category, which means some of them assert things that are not
     true of every business in it — "Booking is wise at the weekend" on
     a wholesale roaster. One sentence from the owner removes the guess
     entirely. */
  /* When the headline was taken from the owner's sentence, the sub must
     NOT be that same sentence — the hero then says the same thing twice
     in two sizes. It gets the clauses the headline did not use, which
     is still all their own words and says something new. */
  put('hero.sub', (ownH && ownSvc.length > 1
        ? ownSvc.slice(1).map(x => x.body).join(' ')
        : own) || pickFrom(k.sub, seed, 'sub'));
  put('about.heading', k.aboutHeading);
  /* The about text opens with what they told us and then asks for the
     rest, instead of opening with our paragraph about a business we
     have never seen. */
  if (own) put('about.body', own + '\n\n' +
    'Write the rest here: how you came to do this, who you do it for, '
    + 'and what someone can expect from working with you.');
  /* about.body: see the note above — the copy engine owns it. */
  put('services.heading', k.svcHeading);
  put('contact.heading', k.contactHeading);
  put('contact.body', k.contactBody);

  if (!(c.services.items || []).filter(x => x.title).length) {
    /* Services the owner named, where the sentence named any. These are
       extracted, not invented — every word is theirs. The bank's three
       are the fallback, not the default. */
    c.services.items = ownSvc.length ? ownSvc
      : k.services.map(([title, body]) => ({ title: title, body: body }));
    drafted['services.items'] = true;
  }
  /* A call to action is a PROMISE. "Book a table" on a wholesale
     roaster offers something the business does not do — the same class
     of invention this function refuses elsewhere when it declines to
     write a statistic. The category's CTA is kept only when the owner's
     own sentence supports it; otherwise it falls back to the one
     request every business can honour. */
  let ctaLabel = k.cta;
  if (own) {
    const d = (brief.desc || '').toLowerCase();
    /* The evidence has to be of HOSTING, not of the word appearing.
       "supply cafes across Lahore" means they sell TO cafes; matching
       on the bare word "cafe" read that as being one and kept the
       table-booking button on a wholesaler. Only words that describe
       seating people count. */
    const promises = { 'Book a table': ['book', 'table', 'reservation', 'reserve',
                                        'dine', 'diner', 'covers', 'bistro'],
                       'Order online': ['order', 'deliver', 'shop', 'buy', 'checkout'],
                       'Make a booking': ['book', 'booking', 'appointment', 'stay',
                                          'guest', 'night'] };
    const need = promises[k.cta];
    if (need && !need.some(w => d.indexOf(w) >= 0)) ctaLabel = 'Get in touch';
  }
  if (!cfg.business.ctaLabel || cfg.business.ctaLabel === 'Get in touch') cfg.business.ctaLabel = ctaLabel;
  if (own && ctaLabel === 'Get in touch' && c.contact &&
      String(c.contact.heading || '') === k.contactHeading &&
      (drafted['contact.heading'] || !String(c.contact.heading || '').trim())) {
    c.contact.heading = 'Start a conversation';
  }
  if (!cfg.business.tagline) { cfg.business.tagline = pickFrom(k.sub, seed, 'sub'); drafted['business.tagline'] = true; }

  /* Deliberately NOT written: stats, testimonials, work items. Each is a
     claim about the world. The section stays visible and visibly empty,
     and the Review tab asks for it. */
  return cfg;
}

/* How much of what is on the page is still ours rather than theirs. */
function draftedCount(cfg) {
  return Object.keys(cfg._drafted || {}).length;
}
function draftedList(cfg) {
  const LABEL = {
    'hero.eyebrow': 'Hero eyebrow', 'hero.headlineA': 'Headline', 'hero.headlineB': 'Headline, second part',
    'hero.sub': 'Hero sentence', 'about.heading': 'About heading', 'about.body': 'About text',
    'services.heading': 'Services heading', 'services.items': 'The services themselves',
    'products.heading': 'Shop heading', 'products.intro': 'Shop introduction',
    'contact.heading': 'Contact heading', 'contact.body': 'Contact text',
    'business.tagline': 'One-line description',
    /* written by the copy engine */
    'content.about.body': 'About text', 'services.intro': 'Services introduction',
    'content.products.items': 'Sample catalogue', 'faq': 'Questions and answers'
  };
  /* Paths with an index or a page id in them cannot be listed one by
     one, so they are matched by shape. This list is read by the client,
     and a raw path in it ("pages.about.description") is this panel
     failing at the one thing it is for. */
  const SHAPED = [
    [/^content\.services\.items\[\d+]\.body$/, 'Service description'],
    [/^pages\.[\w-]+\.title$/,                 'Page title'],
    [/^pages\.[\w-]+\.description$/,           'Page description']
  ];
  const seen = {};
  return Object.keys(cfg._drafted || {}).map(p => {
    if (LABEL[p]) return LABEL[p];
    for (let i = 0; i < SHAPED.length; i++)
      if (SHAPED[i][0].test(p)) return SHAPED[i][1];
    return p;
  }).filter(name => {           /* 'Page title' once, not once per page */
    if (seen[name]) return false;
    seen[name] = 1; return true;
  });
}

    total: CAPABILITIES.length,
    /* Counted rather than asserted, so the number cannot flatter itself. */

          capCount('planned') + ' planned · ' + capCount('external') + ' needs an account'
  };
}

/* A plain-text report, for the client and for a commit message. */
function capabilityReport() {

  const out = ['iCore WebStudio — capability register', s.line, ''];
  Object.keys(CAP_AREAS).forEach(area => {
    const rows = capsByArea(area);
    if (!rows.length) return;
    out.push(CAP_AREAS[area].toUpperCase());
    rows.forEach(c => {

      if (c.note) out.push('             ' + c.note.replace(/\s+/g, ' '));
      if (c.evidence) out.push('             evidence: ' + c.evidence);

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>iCore WebStudio — Visual Excellence Prototype v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D1017;--bg:#F5F6F8;--panel:#fff;--line:#E3E6EB;--line2:#EFF1F4;--mute:#646C7A;
  --brand:#1740DC;--soft:#EDF1FF;--ok:#07703F;--warn:#9A5B06;--r:11px;
  --sh:0 1px 2px rgba(13,16,23,.05),0 12px 30px -20px rgba(13,16,23,.4)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%}
body{font:400 15px/1.6 'Inter',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;margin:0;letter-spacing:-.025em;line-height:1.12;font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

.top{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
/* min-height, not height: this row wraps, and a fixed height gave the
   wrapped line nowhere to go, so it spilled out of the bar and — the
   bar being z-index 50 — painted over the panel beneath. At 1024px that
   put the Save button exactly on top of the Content tab. */
.tb{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:8px;font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-.03em;font-size:15.5px}
.logo i{width:25px;height:25px;border-radius:7px;background:var(--ink);color:#fff;display:grid;place-items:center;font-style:normal;font-size:12px}
.steps{display:flex;gap:3px;font-size:12.5px;color:var(--mute);margin-inline-start:8px}
.steps .s{padding:5px 9px;border-radius:999px;white-space:nowrap}
.steps .s.on{background:var(--soft);color:var(--brand);font-weight:600}
/* 1100, not 1000: between the two the bar needed a second row, and
   1024px — one of the widths this is tested at — fell in that gap. */
@media(max-width:1100px){.steps .s:not(.on){display:none}}
.meter{display:flex;align-items:center;gap:8px;margin-inline-start:auto;font-size:12.5px;color:var(--mute)}
.meter .bar2{width:84px;height:5px;border-radius:99px;background:var(--line);overflow:hidden}
.meter .bar2 i{display:block;height:100%;background:var(--ok);border-radius:99px;transition:width .4s}
.meter b{font-size:13px;color:var(--ink)}
@media(max-width:700px){.meter .mt{display:none}}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:9px;font-weight:600;font-size:14.5px;
  background:var(--ink);color:#fff;border:1.5px solid var(--ink);transition:transform .15s,box-shadow .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn:hover{box-shadow:var(--sh)}
.btn.brand{background:var(--brand);border-color:var(--brand)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:#fff}
.btn.sm{padding:7px 13px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* questionnaire */
.q{max-width:700px;margin:0 auto;padding:42px 20px 90px}
.bar{height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:30px}
.bar i{display:block;height:100%;background:var(--brand);transition:width .45s cubic-bezier(.2,.8,.3,1)}
.qhead{margin-bottom:28px}
.qhead .ix{font:600 11.5px/1 'Space Grotesk',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--brand);margin-bottom:11px}
.qhead h1{font-size:clamp(25px,4.2vw,34px)}
.qhead p{color:var(--mute);margin:9px 0 0;font-size:15px}
.fld{margin-bottom:20px}
.fld>label{display:block;font-weight:600;font-size:14.5px;margin-bottom:8px}
.inp{width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;transition:border-color .15s,box-shadow .15s}
.inp:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 4px var(--soft)}
textarea.inp{min-height:78px;resize:vertical;line-height:1.55}
.opts{display:grid;gap:8px}.opts.c2{grid-template-columns:1fr 1fr}
@media(max-width:560px){.opts.c2{grid-template-columns:1fr}}
.opt{display:flex;gap:10px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:start;
  transition:border-color .15s,background .15s;width:100%;margin-bottom:7px}
.opt:hover{border-color:#C2C9D4}
.opt.on{border-color:var(--brand);background:var(--soft)}
.opt .bx{width:17px;height:17px;border:1.5px solid #C2C9D4;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;background:#fff;font-size:11px}
.opt.on .bx{background:var(--brand);border-color:var(--brand);color:#fff}
.opt b{font-weight:600;font-size:14.5px}
.rep{border:1.5px solid var(--line);border-radius:10px;padding:13px;margin-bottom:8px;background:#fff}
.rep .rh{display:flex;align-items:center;margin-bottom:8px}
.rep .rh b{font-size:12px;color:var(--mute);letter-spacing:.1em;text-transform:uppercase}
.rep .rh button{margin-inline-start:auto;color:var(--mute);font-size:13px}
.rep .rh button:hover{color:#B42318}
.rep .inp{margin-bottom:7px}
.qnav{display:flex;gap:9px;margin-top:30px;align-items:center;flex-wrap:wrap}
.qnav .sp{color:var(--mute);font-size:12.5px}

/* selection */
.sel{padding:26px 0 70px}
.selhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.selhead h1{font-size:clamp(22px,3.4vw,31px)}
.selhead p{color:var(--mute);margin:7px 0 0;font-size:14.5px;max-width:64ch}
.toolbar{display:flex;gap:8px;margin-inline-start:auto;align-items:center}
.seg{display:inline-flex;background:var(--line2);border-radius:9px;padding:3px}
.seg button{padding:6px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--mute)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(13,16,23,.12)}
.vgrid{display:grid;gap:16px;margin-top:22px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.vcard{background:var(--panel);border:1.5px solid var(--line);border-radius:15px;overflow:hidden;display:flex;flex-direction:column;transition:.2s}
.vcard:hover{box-shadow:var(--sh);transform:translateY(-2px)}
.vcard.on{border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.vtop{display:flex;align-items:center;gap:9px;padding:12px 14px;border-bottom:1px solid var(--line2)}
.sw{display:flex;gap:3px;flex:0 0 auto}
.sw i{width:12px;height:12px;border-radius:4px;display:block;border:1px solid rgba(0,0,0,.12)}
.vtop b{font-family:'Space Grotesk',sans-serif;font-size:14.5px;display:block}
.vtop span span,.vtop>span>span{font-size:12px;color:var(--mute)}
.shot{height:320px;background:#fff;overflow:hidden;border-bottom:1px solid var(--line2);position:relative}
.shot.mobile{background:var(--line2);display:grid;place-items:start center;padding:12px 0}
.shot iframe{border:0;display:block;transform-origin:top left}
.shot.mobile iframe{transform-origin:top center;border-radius:12px;border:4px solid #11151C}
.vbody{padding:13px 14px;flex:1}
.vbody p{margin:0;color:var(--mute);font-size:13.5px;line-height:1.5}
.vacts{display:flex;gap:8px;padding:0 14px 14px}.vacts .btn{flex:1}

/* editor */
.edit{display:grid;grid-template-columns:352px 1fr;height:calc(100vh - 56px)}
@media(max-width:900px){.edit{grid-template-columns:1fr;height:auto}}
.panel{background:var(--panel);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
/* The panel is 352px and six tabs wanted 440px, so the row overflowed
   and the last tab — Review — was laid out beyond the panel's edge,
   under the preview pane. It could not be clicked at any width; only
   the console could reach it. Wrapping keeps every tab inside the
   panel and inside the tab order at every width. */
.ptabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line);padding:0 6px;flex:0 0 auto}
.ptabs button{padding:13px 8px;font-size:13.5px;font-weight:600;color:var(--mute);border-bottom:2.5px solid transparent;margin-bottom:-1px}
.ptabs button.on{color:var(--ink);border-color:var(--brand)}
.pbody{overflow-y:auto;padding:16px;flex:1;min-height:0}
@media(max-width:900px){.pbody{max-height:440px}}
.grp{margin-bottom:24px}
.grp h4{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin-bottom:11px;display:flex;gap:7px;align-items:center}
.warn{background:#FEF6E7;color:var(--warn);font-size:10px;letter-spacing:.06em;padding:3px 7px;border-radius:999px;font-weight:700}
.note{font-size:12.5px;color:var(--mute);margin:8px 0 0;line-height:1.5}
.f{display:block;margin-bottom:11px}
.f>span{display:block;font-size:12.5px;font-weight:600;color:var(--mute);margin-bottom:5px}
.f input,.f textarea{width:100%;padding:9px 11px;border:1.5px solid var(--line);border-radius:9px;background:#fff;font-size:14px}
.f input:focus,.f textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--soft)}
.f textarea{resize:vertical;line-height:1.55}
.f.row{display:flex;align-items:center;gap:10px}
.f.row>span{margin:0;flex:1}
.f.row input[type=color]{width:52px;height:32px;padding:2px;border-radius:7px;flex:0 0 auto}
.list .li{border:1.5px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#FBFCFD}
.list .lh{display:flex;align-items:center;margin-bottom:7px}
.list .lh b{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.list .lh button{margin-inline-start:auto;color:var(--mute);font-size:13px;line-height:1}
.list .lh button:hover{color:#B42318}
.list .li input{width:100%;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13.5px;background:#fff}
.list .li input:focus{outline:none;border-color:var(--brand)}
.dsrow{display:grid;gap:7px}
.dsb{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;text-align:start;width:100%}
.dsb.on{border-color:var(--brand);background:var(--soft)}
.dsb b{font-size:14px}.dsb>span:last-child{font-size:12px;color:var(--mute);margin-inline-start:auto}
.srow{display:flex;align-items:center;gap:7px;padding:8px 0;border-bottom:1px solid var(--line2);font-size:14px}
.srow b{flex:1;font-weight:600}
.arr{width:24px;height:24px;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--mute);display:grid;place-items:center}
.arr[disabled]{opacity:.3}
.sw2{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute)}
.sw2 input{accent-color:var(--brand)}
.pillx{font-size:10.5px;background:var(--line2);color:var(--mute);padding:3px 7px;border-radius:999px;font-weight:600}
.pillx.warnx{background:#FEF6E7;color:var(--warn)}
.mslot{border:1.5px solid var(--line);border-radius:11px;padding:11px;margin-bottom:11px;background:#fff}
.mh{display:flex;align-items:center;margin-bottom:8px}
.mh b{font-size:13.5px}.mh button{margin-inline-start:auto;font-size:12.5px;color:var(--mute)}
.mh button:hover{color:#B42318}
.mslot img{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px;background:var(--line2)}
.mph{height:110px;border:1.5px dashed var(--line);border-radius:8px;display:grid;place-items:center;text-align:center;
  color:var(--mute);font-size:13px;margin-bottom:8px;padding:10px}
.mph span{font-size:11.5px;opacity:.8}

.stage{display:flex;flex-direction:column;min-width:0;background:#E9EBEF}
.stbar{display:flex;align-items:center;gap:10px;padding:9px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.dsname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px}
.stbar .right{margin-inline-start:auto;display:flex;gap:7px}
.frame{flex:1;overflow:auto;display:grid;place-items:start center;padding:14px;min-height:460px}
.frame iframe{border:0;background:#fff;width:100%;height:100%;min-height:600px;border-radius:7px;box-shadow:var(--sh)}
.frame.mobile iframe{width:390px;flex:0 0 auto;border-radius:20px;border:7px solid #11151C;min-height:720px}

/* preview overlay + modal */
.pv{position:fixed;inset:0;z-index:80;background:#0C0F14;display:none;flex-direction:column}
.pv.on{display:flex}
.pvbar{display:flex;align-items:center;gap:11px;padding:10px 14px;background:#161A21;color:#fff;flex-wrap:wrap}
.pvbar b{font-family:'Space Grotesk',sans-serif;font-size:14.5px}
.pvbar .seg{background:#232833}.pvbar .seg button{color:#99A2B0}
.pvbar .seg button.on{background:#333A47;color:#fff;box-shadow:none}
.pvbar .right{margin-inline-start:auto;display:flex;gap:7px}
.pvbar .btn.ghost{color:#fff;border-color:#333A47}
.pvbar .btn.ghost:hover{background:#232833}
.pvstage{flex:1;overflow:auto;display:grid;place-items:start center;padding:16px;background:#080A0E}
.pvstage iframe{grid-area:1/1;border:0;background:#fff;border-radius:6px;box-shadow:0 20px 60px -30px #000;opacity:0;transition:opacity .22s ease}
.pvstage iframe.ready{opacity:1}
.pvstage.mobile iframe{border-radius:22px;border:8px solid #1A1F27}
/* Each preview is a whole document carrying its own copy of the 3D
   library, so building one takes a moment. Without this the stage is a
   sheet of white with nothing to say why. */
.pvwait{grid-area:1/1;align-self:center;justify-self:center;display:flex;align-items:center;gap:10px;color:#7A8494;font-size:13.5px;letter-spacing:.02em;pointer-events:none}
.pvwait i{width:13px;height:13px;border:2px solid #2A313D;border-top-color:#7A8494;border-radius:50%;animation:pvspin .7s linear infinite}
@keyframes pvspin{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;z-index:90;background:rgba(13,16,23,.5);display:none;align-items:center;justify-content:center;padding:18px}
.modal.on{display:flex}
.sheet{background:#fff;border-radius:15px;width:min(520px,100%);max-height:84vh;overflow-y:auto;box-shadow:var(--sh)}
.sheet .mh{padding:16px 18px;border-bottom:1px solid var(--line);margin:0}
.sheet .mh h3{font-size:17px}
.sheet .mh .x{margin-inline-start:auto;font-size:15px;color:var(--mute)}
.sheet .mb{padding:16px 18px}
.gap{padding:10px 0;border-bottom:1px solid var(--line2)}
.gap b{display:block;font-size:14px}
.gap span{display:block;font-size:12.5px;color:var(--mute);margin-top:2px}
.toasts{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:7px;z-index:200;pointer-events:none;padding:0 14px}
.toast{background:var(--ink);color:#fff;padding:10px 17px;border-radius:999px;font-size:13.5px;font-weight:500;box-shadow:var(--sh);transition:opacity .25s}
.toast.ok{background:var(--ok)}.toast.err{background:#B42318}

/* v3 additions */
.focal{position:relative;cursor:crosshair;border-radius:8px;overflow:hidden;margin-bottom:8px}
.focal img{width:100%;height:150px;object-fit:cover;display:block}
.focal .pin{position:absolute;width:20px;height:20px;border-radius:50%;border:2.5px solid #fff;
  box-shadow:0 0 0 2px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.4);transform:translate(-50%,-50%);pointer-events:none}
.focal .hint{position:absolute;left:0;right:0;bottom:0;background:rgba(13,16,23,.72);color:#fff;font-size:11px;padding:5px 8px;text-align:center}
.gal{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.gal .cell{width:54px;height:54px;border-radius:9px;overflow:hidden;position:relative;border:1px solid var(--line);background:var(--line2)}
.gal .cell img{width:100%;height:100%;object-fit:cover}
.gal .cell button{position:absolute;top:2px;right:2px;width:17px;height:17px;border-radius:5px;background:rgba(13,16,23,.8);color:#fff;font-size:10px;line-height:1;display:grid;place-items:center}
.gal .addc{width:54px;height:54px;border-radius:9px;border:1.5px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:17px}
.flag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.07em;padding:3px 7px;border-radius:999px;background:var(--soft);color:var(--brand);margin-inline-start:6px}
.hintbox{background:#F7F9FC;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:12.5px;color:var(--mute);line-height:1.55;margin-bottom:12px}
.vrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fchk{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12.5px;color:var(--ink)}
.fchk input{width:15px;height:15px;accent-color:var(--brand)}
.vstat{font:700 9.5px/1 var(--ui);letter-spacing:.09em;text-transform:uppercase;padding:3px 7px;border-radius:999px;vertical-align:middle}
.vstat.empty{background:#EFF2F6;color:var(--mute)}
.vstat.blocked{background:#FEF6E7;color:var(--warn)}
.vstat.live{background:#E8F6EE;color:#1B7A45}
.vwarn{margin:8px 0 2px;padding:9px 11px;border-radius:8px;font-size:12px;line-height:1.5;
  background:#FEF6E7;color:#7A5A12;border:1px solid #F2E2BE}
.vwarn.ok{background:#E8F6EE;color:#1B7A45;border-color:#C6E6D4}
.rvsum{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.rvchip{font:700 11px/1 var(--ui);padding:7px 11px;border-radius:999px}
.rvchip.error{background:#FDEBEC;color:#A4232B}
.rvchip.warn{background:#FEF6E7;color:#7A5A12}
.rvchip.info{background:#EFF2F6;color:var(--mute)}
.rv{border:1px solid var(--line);border-inline-start-width:3px;border-radius:9px;padding:11px 13px;margin-bottom:9px}
.rv.error{border-inline-start-color:#D4454F;background:#FFFBFB}
.rv.warn{border-inline-start-color:#E0A300;background:#FFFDF8}
.rv.info{border-inline-start-color:#9AA5B5;background:#FBFCFE}
.rv b{display:block;font-size:13px;color:var(--ink)}
.rv p{margin:5px 0 9px;font-size:12.5px;line-height:1.55;color:var(--mute)}
.rvclean{padding:20px;border:1px dashed var(--line);border-radius:10px;text-align:center;font-size:13.5px;color:var(--ink)}
.rvclean span{display:block;margin-top:7px;font-size:12px;color:var(--mute);line-height:1.55}
/* ---- generated-proposal gallery ---- */
.dnabar{display:flex;flex-wrap:wrap;align-items:center;gap:7px 14px;margin-top:14px}
.dnatag{font:700 10.5px/1 var(--ui);letter-spacing:.12em;text-transform:uppercase;background:var(--ink);color:#fff;padding:6px 10px;border-radius:999px}
.dnam{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);letter-spacing:.02em}
.dnam i{display:block;width:52px;height:4px;border-radius:999px;background:var(--line);overflow:hidden}
.dnam i b{display:block;height:100%;background:var(--brand);border-radius:999px}
.uniq{margin:16px 0 4px;padding:11px 14px;border-radius:10px;font-size:12.5px;line-height:1.55;
  display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;border:1px solid var(--line)}
.uniq.ok{background:#E8F6EE;border-color:#C6E6D4;color:#1B5E3A}
.uniq.warn{background:#FEF6E7;border-color:#F2E2BE;color:#7A5A12}
.uniq.bad{background:#FDEBEC;border-color:#F3CFD2;color:#8E1F28}
.uniq b{font-size:13px}
.seedtag{margin-inline-start:auto;font:500 11px/1 var(--mono,ui-monospace,monospace);opacity:.7}
.lockbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 2px;font-size:12px;color:var(--mute)}
.lockchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 11px;font-size:11.5px;color:var(--ink)}
.lockchip:hover{border-color:var(--brand)}
.favbar{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px}
.vcard .fav{margin-inline-start:auto;font-size:15px;line-height:1;color:var(--line);padding:4px}
.vcard .fav.on,.vcard .fav:hover{color:#E0A300}
.axrow{display:flex;flex-wrap:wrap;gap:5px}

<body>
<div id="app"></div>
<div class="pv" id="pv"></div>
<div class="modal" id="modal" onclick="if(event.target.id==='modal')closeModal()"></div>
<div class="toasts" id="toasts"></div>
<script>
/* =====================================================================
   THE SECTIONS THAT WERE MISSING
   =====================================================================

   The brief asks for roughly 8-12 pages. The benchmark delivered four,
   every time, on every brief. The reason was not the page chooser: it
   was that a page can only be offered when there is something to put
   on it, and the eight section types that existed could not fill a
   FAQ, a team page, a pricing page or a service detail page. Offering
   them anyway would have produced empty pages and dead links in the
   client's own navigation, which is worse than four honest pages.

   WHY THESE ARE NOT WRITTEN INTO THE SIX ENGINES

   Six engines times four section types is twenty-four implementations
   to write and keep in step, and each engine's file is already the
   length it should be. These render once, from the tokens every engine
   already emits (--ink, --dim, --hair, --chip, --accent) and inside
   the .w wrapper every engine already uses, so they take on the
   composition's palette, type scale, density and radius rather than
   looking bolted on. The page header and the cart drawer are built the
   same way and for the same reason.

   HOW THEY REACH THE PAGE

   Every engine ends with `orderSections(cfg, S)`. Any live section
   whose type the engine did not render is rendered here and appended
   before the ordering runs, so the new types take part in the section
   order axis exactly like the built-in ones.

   WHAT IS AND IS NOT WRITTEN FOR THE CLIENT

   The FAQ is composed from what the client told us, and questions only
   they can answer are marked as theirs rather than answered on their
   behalf. Team, pricing and service-detail pages carry facts nobody
   else holds — who works there, what it costs — so those sections stay
   unavailable until the client supplies them, in the same way the Work
   page waits for projects and the Shop waits for products. Nothing
   here invents a person, a price or a credential.
   ===================================================================== */

/* The new types, in the order they tend to read best on a page. */
const EXTRA_SECTION_TYPES = ['faq', 'team', 'pricing', 'detail'];

/* Blank content for each, matching the shape blankConfig uses. */
function blankExtraContent() {
  return {
    faq:     { heading: 'Questions', items: [] },
    team:    { heading: 'The team', intro: '', items: [] },
    pricing: { heading: 'What it costs', intro: '', items: [] },
    detail:  { heading: '', body: '', points: [] }
  };
}

/* Is there anything in one of these worth rendering? Mirrors
   sectionHasContent, which delegates here for the new types. */
function extraHasContent(content, type) {
  const c = content || {};
  if (type === 'faq')     return (c.items || []).some(x => x && x.q && x.a);
  if (type === 'team')    return (c.items || []).some(x => x && x.name);
  if (type === 'pricing') return (c.items || []).some(x => x && x.name);
  if (type === 'detail')  return !!String(c.body || '').trim();
  return false;
}

/* ---------------------------------------------------------------------
   The stylesheet. Tokens only — not one literal colour, so the blocks
   follow whichever palette and density the composition chose, in both
   appearance modes.
   --------------------------------------------------------------------- */
const EXTRA_CSS = `
/* ---- sections rendered from the shared registry ---- */
.xs-h{margin:0 0 6px}
.xs-intro{margin:0 0 clamp(18px,2.4vw,28px);color:var(--dim);max-width:60ch}

/* FAQ — a description list, which is what it is */
.xs-faq{display:grid;gap:0;margin:0;border-top:1px solid var(--hair)}
.xs-faq > div{border-bottom:1px solid var(--hair);padding-block:clamp(14px,1.8vw,20px);
  display:grid;grid-template-columns:minmax(0,22ch) minmax(0,1fr);gap:4px clamp(18px,3vw,40px)}
.xs-faq dt{font-weight:600;margin:0;min-width:0;text-wrap:balance}
.xs-faq dd{margin:0;min-width:0;color:var(--dim);line-height:1.62}
@media(max-width:700px){.xs-faq > div{grid-template-columns:1fr}}

/* an answer only the owner can give, marked as theirs and never invented */
.xs-owner{display:inline-block;font-size:.84em;letter-spacing:.02em;color:var(--dim);
  border:1px dashed currentColor;border-radius:4px;padding:.15em .55em}

/* Team */
.xs-team{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));
  gap:clamp(16px,2.4vw,28px);list-style:none;margin:0;padding:0}
.xs-team li{min-width:0}
.xs-team .xs-nm{font-weight:600;display:block}
.xs-team .xs-ro{color:var(--dim);font-size:.9em;display:block;margin-top:2px}
.xs-team p{margin:8px 0 0;color:var(--dim);font-size:.94em;line-height:1.6}

/* Pricing */
.xs-price{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));
  gap:clamp(14px,2vw,22px);list-style:none;margin:0;padding:0}
.xs-price li{min-width:0;border:1px solid var(--hair);border-radius:inherit;
  padding:clamp(16px,2vw,24px);display:grid;gap:10px;align-content:start}
.xs-price .xs-nm{font-weight:600}
.xs-price .xs-amt{font-size:clamp(22px,3vw,30px);line-height:1.1;font-variant-numeric:tabular-nums}
.xs-price .xs-note{color:var(--dim);font-size:.92em;line-height:1.55}

/* ---------------------------------------------------------------------
   The renderer. One block per type, returning the same
   `<section id="type">` shape the engines produce so orderSections can
   reseat it.
   --------------------------------------------------------------------- */
function renderExtraSection(cfg, type) {
  const c = (cfg.content || {})[type] || {};
  const head = (h) => h ? '<h2 class="xs-h">' + E(h) + '</h2>' : '';
  const intro = (t) => t ? '<p class="xs-intro">' + E(t) + '</p>' : '';
  const open = '<section id="' + type + '"><div class="w">';
  const close = '</div></section>';

  if (type === 'faq') {
    /* A published page carries only the questions that have answers.
       In the editor the unanswered ones stay visible as prompts,
       because that is where the client fills them in; shipping them
       would put a question with a blank answer on a live site. */
    const items = (c.items || []).filter(x => x && x.q)
      .filter(x => !publishing() || String(x.a || '').trim());
    if (!items.length) return '';
    return open + head(c.heading || 'Questions') +
      '<dl class="xs-faq">' + items.map(x => {
        /* A question whose answer is a fact only the client holds is
           flagged, not guessed. In the editor that reads as a prompt;
           a published page never carries an unanswered one, because
           sectionHasContent keeps the section back until it is. */
        const answer = String(x.a || '').trim();
        const body = answer
          ? E(answer)
          : (publishing() ? '' : '<span class="xs-owner">' +
              E('Your answer — this is a fact only you hold') + '</span>');
        return '<div><dt>' + E(x.q) + '</dt><dd>' + body + '</dd></div>';
      }).join('') + '</dl>' + close;
  }

  if (type === 'team') {
    const items = (c.items || []).filter(x => x && x.name);
    if (!items.length) return '';
    return open + head(c.heading || 'The team') + intro(c.intro) +
      '<ul class="xs-team">' + items.map(x =>
        '<li><span class="xs-nm">' + E(x.name) + '</span>' +
        (x.role ? '<span class="xs-ro">' + E(x.role) + '</span>' : '') +
        (x.bio ? '<p>' + E(x.bio) + '</p>' : '') + '</li>'
      ).join('') + '</ul>' + close;
  }

  if (type === 'pricing') {
    const items = (c.items || []).filter(x => x && x.name);
    if (!items.length) return '';
    return open + head(c.heading || 'What it costs') + intro(c.intro) +
      '<ul class="xs-price">' + items.map(x =>
        '<li><span class="xs-nm">' + E(x.name) + '</span>' +
        (x.price ? '<span class="xs-amt">' + E(x.price) + '</span>' : '') +
        (x.note ? '<span class="xs-note">' + E(x.note) + '</span>' : '') +
        ((x.features || []).filter(Boolean).length
          ? '<ul>' + x.features.filter(Boolean).map(f => '<li>' + E(f) + '</li>').join('') + '</ul>'
          : '') +
        '</li>'
      ).join('') + '</ul>' + close;
  }

  if (type === 'detail') {
    const body = String(c.body || '').trim();
    if (!body) return '';
    const paras = body.split(/\n\n+/).filter(Boolean)
      .map(p => '<p>' + E(p) + '</p>').join('');
    const points = (c.points || []).filter(Boolean);
    return open + head(c.heading || '') +
      '<div class="xs-detail">' + paras +
      (points.length ? '<ul>' + points.map(p => '<li>' + E(p) + '</li>').join('') + '</ul>' : '') +
      '</div>' + close;
  }

  return '';
}

/* Any live section this engine did not render, rendered here.
   Called by orderSections, so every engine picks these up without a
   line changed in any of them. */
function fillExtraSections(cfg, S) {
  const present = {};
  S.forEach(html => {
    const m = /^<section id="([a-z]+)"/.exec(html);
    if (m) present[m[1]] = true;
  });
  liveSections(cfg).forEach(s => {
    if (present[s.type]) return;
    if (EXTRA_SECTION_TYPES.indexOf(s.type) < 0) return;
    const html = renderExtraSection(cfg, s.type);
    if (html) { S.push(html); present[s.type] = true; }
  });
  return S;
}

/* every factual slot, empty by default; the meter reads this */
/* ---------------------------------------------------------------------
   What is actually missing — and when.

   Email, phone and location used to sit in this list unconditionally, so
   a person who had typed a name and wanted to look at six designs was
   immediately told they were missing a phone number. They are not: a
   contact detail is needed to PUBLISH a site that invites contact, and
   to take an order. It is not needed to see what the site looks like,
   and nagging for it at that moment is the builder asking the client to
   do admin before it has shown them anything.

   `when` makes an item conditional. An item whose condition is false is
   not counted, not listed, and not weighed — it is genuinely not
   missing, rather than missing and politely ignored. `urgency` says
   whether something is wanted now or at publication, so the editor can
   separate the two instead of presenting one undifferentiated list.
   --------------------------------------------------------------------- */
const hasShop = (cfg) => ((cfg.content.products || {}).items || [])
  .filter(x => x && x.name).length > 0;
const wantsContact = (cfg) => allSections(cfg)
  .some(s => s.type === 'contact' && s.visible !== false);

const COMPLETENESS = [
  { path: 'business.name',            label: 'Business name',        weight: 3 },
  { path: 'business.tagline',         label: 'One-line description', weight: 3 },
  { path: 'business.email',           label: 'Email address',        weight: 2,

  { path: 'business.phone',           label: 'Phone number',         weight: 2,

    note: 'Needed to take orders. A website that is not selling does not need one.' },
  { path: 'business.city',            label: 'Location',             weight: 1,

  { path: 'content.hero.headlineA',   label: 'Hero headline',        weight: 3 },
  { path: 'content.about.body',       label: 'About text',           weight: 3, note: 'Your own words. Nothing is drafted for you.' },
  { path: 'content.services.items',   label: 'Services',             weight: 3, list: true },
  { path: 'media.logo',               label: 'Logo',                 weight: 2 },
  { path: 'media.hero',               label: 'Hero photograph',      weight: 3, note: 'Until you add one, each design shows its own composition instead.' },
  { path: 'content.products.items',   label: 'Products',             weight: 2, list: true, note: 'Needed for the commerce layout.' },
  { path: 'content.work.items',       label: 'Projects',             weight: 2, list: true, note: 'Section stays hidden while empty.' },
  { path: 'content.stats.items',      label: 'Figures you can evidence', weight: 2, list: true, note: 'Never pre-filled. Only publish numbers you can support.' },
  { path: 'content.testimonial.quote',label: 'Client quote',         weight: 1, note: 'Needs the client’s written permission.' }
];
const dig = (o, p) => p.split('.').reduce((x, k) => (x == null ? x : x[k]), o);
function isFilled(cfg, it) {
  const v = dig(cfg, it.path);
  if (it.list) return Array.isArray(v) && v.filter(x => x && (x.title || x.v || x.name)).length > 0;
  return !!(v && String(v).trim());
}
function completeness(cfg) {
  let got = 0, total = 0; const missing = [], later = [];
  /* An item whose condition is false is not part of the total, so the
     percentage cannot be held down by something this site will never
     need. */
  const live = COMPLETENESS.filter(i => typeof i.when !== 'function' || i.when(cfg));
  live.forEach(i => {
    total += i.weight;
    if (isFilled(cfg, i)) { got += i.weight; return; }
    (i.urgency === 'publish' ? later : missing).push(i);
  });
  return {
    pct: total ? Math.round(got / total * 100) : 100,
    missing,            /* wanted now */
    later,              /* wanted before publishing, not before looking */
    all: missing.concat(later),
    total: live.length, done: live.length - missing.length - later.length
  };
}

/* ---------------------------------------------------------------------
   Video slots.

   `src` and `poster` are URLs or paths — a video file is far too large for
   localStorage, and the output of `python -m video_factory` is exactly what
   belongs here (dist/media/website-hero.mp4 and its poster).

   `provenance` is not optional decoration. A slot with no recorded source
   and licence does not play: the site shows the poster, or a labelled note
   in the editor. This mirrors the same guard in the Python engines —
   royalty-free is not copyright-free, and an unattributed clip on a client's
   public homepage is their liability, not a cosmetic detail.
   --------------------------------------------------------------------- */
function blankVideoSlot() {
  return {
    src: '', poster: '',
    provenance: { source: '', licence: '', credit: '' },
    settings: { muted: true, loop: true, autoplay: true, start: 0, overlay: 45, mobile: false }
  };

const vslot = (cfg, key) => ((cfg.media && cfg.media.video) || {})[key] || blankVideoSlot();
const vHasSource = (v) => !!(v && String(v.src || '').trim());
const vHasProvenance = (v) => !!(v && v.provenance &&
  String(v.provenance.source || '').trim() && String(v.provenance.licence || '').trim());
/* playable = a source AND a provenance record. Source only means poster only. */
const vPlayable = (v) => vHasSource(v) && vHasProvenance(v);

/* Why a given slot is not playing, in words the editor can show verbatim. */
function vStatus(v) {
  if (!vHasSource(v)) return { ok: false, label: 'empty', note: 'No video set for this slot.' };
  if (!vHasProvenance(v)) return { ok: false, label: 'blocked',
    note: 'Source and licence are required before this plays. Until they are ' +
          'recorded the site shows the poster image instead.' };
  return { ok: true, label: 'live', note: 'Plays muted, on capable devices.' };
}

/* The markup for a background video slot. Degradation is in the markup
   itself, not in a promise: no source -> nothing; source without provenance
   -> the poster as a plain image; reduced motion or a small screen with
   `mobile` off -> the poster, because the <video> is removed by the runtime
   before it can fetch anything. */
function videoBlock(cfg, key, cls, focalStyle) {
  const v = vslot(cfg, key);
  const st = v.settings || {};
  const poster = String(v.poster || '').trim();
  if (!vHasSource(v)) return '';
  if (!vHasProvenance(v)) {
    return poster
      ? '<div class="vwrap ' + (cls || '') + '"><img src="' + E(poster) + '" alt="" style="' +
        (focalStyle || '') + '"><span class="vnote">Video held: source and licence not recorded</span></div>'
      : '<div class="vwrap ' + (cls || '') + '"><span class="vnote">Video held: source and licence not recorded</span></div>';
  }
  const credit = String((v.provenance || {}).credit || '').trim();
  return '<div class="vwrap ' + (cls || '') + '" data-vslot="' + E(key) + '"' +
    ' data-mobile="' + (st.mobile ? '1' : '0') + '" data-start="' + (Number(st.start) || 0) + '">' +
    '<video playsinline preload="metadata" muted' +
      (st.loop === false ? '' : ' loop') +
      (poster ? ' poster="' + E(poster) + '"' : '') +
      (st.autoplay === false ? ' data-autoplay="0"' : '') +
      ' style="' + (focalStyle ? focalStyle.replace('object-position', 'object-position') : '') + '">' +
      '<source src="' + E(v.src) + '">' +
    '</video>' +
    (poster ? '<img class="vposter" src="' + E(poster) + '" alt="" style="' + (focalStyle || '') + '">' : '') +
    '<span class="vscrim" style="opacity:' + (Math.max(0, Math.min(100, Number(st.overlay) || 0)) / 100) + '"></span>' +

/* One call per design: video if the slot is playable, else the photograph,
   else nothing and the design falls back to its own composition. */
function heroMedia(cfg, imgHTML) {
  const v = vslot(cfg, 'hero');
  if (vHasSource(v)) return videoBlock(cfg, 'hero', 'vhero', focal(cfg.media.heroFocal));
  return imgHTML || '';

/* ---------------------------------------------------------------------
   Design coherence review.

   These are measurements, not opinions: contrast ratios computed to the
   WCAG formula against the design's own surface colours, character counts
   against the measure each design sets, focal points checked against the
   edge of the frame. Each finding says what was measured and what to do,
   and nothing here blocks publishing — the judgement stays with the person
   who knows the brand.
   --------------------------------------------------------------------- */
function hex2rgb(h) {
  h = String(h || '').trim().replace('#', '');
  if (h.length === 3) h = h.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(h)) return null;
  return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
}
function lum(rgb) {
  const f = v => { v /= 255; return v <= 0.04045 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
  return 0.2126 * f(rgb[0]) + 0.7152 * f(rgb[1]) + 0.0722 * f(rgb[2]);
}
function ratio(a, b) {
  const x = hex2rgb(a), y = hex2rgb(b);
  if (!x || !y) return null;
  const l1 = lum(x), l2 = lum(y);
  return Math.round(((Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05)) * 100) / 100;
}
/* ---------------------------------------------------------------------
   MUTED TEXT THAT STILL PASSES

   `--dim` used to be a flat `color-mix(in srgb, ink 58%, bg)`. The
   palettes are all validated at 4.5:1 for ink on bg, but this derived
   token never was, and 58% of a palette that sits at 11:1 lands near
   4.2:1 — under AA for body text. The benchmark found it as a cluster
   of failures all reading 4.16 to 4.42 against a 4.5 requirement:
   service descriptions, form labels, hero subheads. Hundreds of nodes,
   one token.

   So the blend is computed rather than assumed: start at the design's
   preferred 58% and add ink until the result clears the floor against
   its own background. A palette with lots of headroom keeps the muted
   look it was designed with; a tight one gives up some softness and
   stays readable, which is the right way round.

   Mixing in sRGB, as `color-mix(in srgb, …)` does, so the number
   computed here is the number the browser paints.
   --------------------------------------------------------------------- */
function mixSrgb(aHex, bHex, pct) {
  const a = hex2rgb(aHex), b = hex2rgb(bHex);
  if (!a || !b) return aHex;
  const f = pct / 100;
  const to = (x) => Math.round(Math.max(0, Math.min(255, x)));
  const h = (n) => to(n).toString(16).padStart(2, '0');
  return '#' + h(a[0] * f + b[0] * (1 - f)) +
               h(a[1] * f + b[1] * (1 - f)) +
               h(a[2] * f + b[2] * (1 - f));
}

/* the lowest ink percentage, at or above `from`, whose blend with bg
   clears `floor` — or 100 if even solid ink does not, which would mean
   the palette itself is broken and is reported elsewhere */
function dimMix(ink, bg, from, floor) {
  const start = from == null ? 58 : from;
  const want = floor == null ? 4.5 : floor;
  for (let p = start; p <= 100; p += 2) {
    const r = ratio(mixSrgb(ink, bg, p), bg);
    if (r != null && r >= want) return p;
  }
  return 100;
}

/* the surfaces a design actually paints, read back from its own CSS so the
   check can never drift from the stylesheet */
function surfaces(cfg) {
  let html = '';
  try { html = dsById(cfg.theme.ds).render(cfg); } catch (e) { return {}; }
  /* Atelier calls its surface --paper rather than --bg, so both are read;
     the text tokens are read back too, because those are what the page
     actually paints type in. */
  const grab = (mode, token) => {
    const m = new RegExp('html\\[data-mode=' + mode + '\\]\\{[^}]*?--' + token +
      ':\\s*(#[0-9A-Fa-f]{3,8})').exec(html);
    return m ? m[1] : null;
  };
  return {
    day: grab('day', 'bg') || grab('day', 'paper'),
    night: grab('night', 'bg') || grab('night', 'paper'),
    dayBrandText: grab('day', 'brandText'), nightBrandText: grab('night', 'brandText'),
    dayAccentText: grab('day', 'accentText'), nightAccentText: grab('night', 'accentText')
  };
}

/* ---------------------------------------------------------------------
   A legible version of a brand colour, for the places it is used as TEXT.

   A brand colour chosen for a logo or a button fill is often unreadable as
   small type on the page surface — a cyan on white, a near-black on black.
   Rather than mute every brand by a fixed amount, this blends toward the
   page's ink only as far as it must to reach the target ratio, and returns
   the colour untouched when it already passes. A brand that works keeps
   working; one that does not gets the smallest correction that fixes it.

   Fills are left alone: a lime button with dark text on it is fine, and
   it is judged by its own foreground, not by the page behind it.
   --------------------------------------------------------------------- */
function readable(col, bg, ink, target) {
  const c = hex2rgb(col), b = hex2rgb(bg), k = hex2rgb(ink);
  if (!c || !b || !k) return col;
  const hex = (r) => '#' + r.map(v => Math.max(0, Math.min(255, Math.round(v))).toString(16).padStart(2, '0')).join('');
  const rat = (x) => { const l1 = lum(x), l2 = lum(b); return (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05); };
  if (rat(c) >= (target || 4.5)) return col;
  for (let p = 2; p <= 100; p += 2) {
    const t = p / 100;
    const m = c.map((v, i) => v * (1 - t) + k[i] * t);
    if (rat(m) >= (target || 4.5)) return hex(m);
  }
  return hex(k);
}
/* the two tokens every design emits in each appearance mode */
/* Ink to put ON a filled surface, as opposed to the tokens above, which
   are the brand and accent made readable AS text on the page.
   The two are not interchangeable, and using one for the other is how a
   headline highlight ended up near-black on a near-black accent: the
   colour was readable against the page, and the page was not what it was
   sitting on. Here the fill is the background and the candidates are the
   palette's own ink and paper, better one first; if neither clears the
   target, black or white does. */
function onFill(fill, ink, bg) {
  if (!hex2rgb(fill)) return ink;
  const options = [ink, bg, '#000000', '#ffffff'];
  let best = options[0], bestR = 0;
  for (const o of options) {
    /* ratio() takes hex strings, not rgb triples. Handing it triples
       returns null for every pair, which reads as "nothing qualifies"
       and silently keeps the first candidate — how a near-white ink was
       chosen to sit on an acid-lime fill. */
    const r = ratio(o, fill) || 0;
    if (r >= 4.5) return o;
    if (r > bestR) { bestR = r; best = o; }
  }
  return best;
}

const textTokens = (brand, accent, bg, ink) =>
  '--brandText:' + readable(brand, bg, ink, 4.5) +
  ';--accentText:' + readable(accent, bg, ink, 4.5) +
  ';--onBrand:' + onFill(brand, ink, bg) +
  ';--onAccent:' + onFill(accent, ink, bg);

function coherence(cfg) {
  const out = [], c = cfg.content, t = cfg.theme, m = cfg.media;
  const add = (level, title, note, tab) => out.push({ level, title, note, tab: tab || 'content' });
  const ds = dsById(t.ds), def = ds.defaults || {};
  const brand = t.brand || def.brand, accent = t.accent || def.accent;
  const surf = surfaces(cfg);

  /* 1 · contrast, measured in both appearance modes.
     What is measured is the colour the page paints TEXT in, which is the
     adjusted token, not the raw brand — a raw brand is free to be a button
     fill with its own foreground. When the adjustment had to move the
     colour a long way, that is worth saying, because the client will see a
     brand on the page that is not quite the one in their guidelines. */
  [['Brand', brand, 'BrandText'], ['Accent', accent, 'AccentText']].forEach(([label, raw, key]) => {
    ['day', 'night'].forEach(mode => {
      const bg = surf[mode], used = surf[mode + key];
      if (!bg || !used || !raw) return;
      const r = ratio(used, bg);
      if (r == null) return;
      if (r < 3) add('error', label + ' text is not legible in ' + mode,
        label.toLowerCase() + ' text renders as ' + used + ' on ' + bg + ', measuring ' + r +
        ':1 — under the 3:1 floor even for large text. Choose a tone with more separation from the page.', 'design');
      else if (r < 4.5) add('warn', label + ' text is weak for body copy in ' + mode,
        used + ' on ' + bg + ' measures ' + r + ':1. That clears the 3:1 bar for large text but not the ' +
        '4.5:1 bar for body copy.', 'design');
      else if (ratio(raw, bg) !== null && ratio(raw, bg) < 2.2)
        add('info', label + ' had to be adjusted to stay readable in ' + mode,
          raw + ' measures ' + ratio(raw, bg) + ':1 on ' + bg + ', so type is painted in ' + used +
          ' instead (' + r + ':1). Fills and logos still use ' + raw + '.', 'design');
    });
  });

  /* 2 · headings against the measure each design sets */
  const head = ((c.hero.headlineA || '') + ' ' + (c.hero.headlineB || '')).trim();
  if (head.length > 95) add('error', 'The headline will not hold its shape',
    head.length + ' characters. Above about 90 it stops reading as a headline and wraps to four or more lines on a phone.');
  else if (head.length > 62) add('warn', 'The headline is long',
    head.length + ' characters. Under about 60 keeps it to two lines at the sizes these designs use.');
  if ((c.hero.sub || '').length > 180) add('warn', 'The supporting line is long',
    (c.hero.sub || '').length + ' characters. It sits directly under a large headline, where a long line is hard to scan.');
  svcItems(cfg).forEach(s => {
    if ((s.title || '').length > 36) add('warn', 'Service name is long: "' + s.title.slice(0, 28) + '…"',
      (s.title || '').length + ' characters. Service cards sit in a grid; a long name breaks the row rhythm.');
  });

  /* 3 · crops, checked against the focal point actually set */
  const imgs = [];
  if (m.hero) imgs.push({ what: 'the hero photograph', f: m.heroFocal, tab: 'media' });
  workItems(cfg).forEach(x => { if (x.img) imgs.push({ what: 'project "' + x.title + '"', f: x.focal, tab: 'content' }); });
  prodItems(cfg).forEach(p => { if ((p.images || [])[0]) imgs.push({ what: 'product "' + p.name + '"', f: p.focal, tab: 'products' }); });
  imgs.forEach(it => {
    const f = it.f || { x: 50, y: 50 };
    if (f.x === 50 && f.y === 50) add('info', 'Crop not reviewed on ' + it.what,
      'The focal point is still at the centre. If the subject is off-centre, a square or wide crop will cut it. ' +
      'Click the photo to set the point every crop keeps.', it.tab);
    else if (f.x < 12 || f.x > 88 || f.y < 12 || f.y > 88)
      add('warn', 'Subject sits at the edge on ' + it.what,
        'The focal point is at ' + f.x + '%, ' + f.y + '%. A tighter crop will push it out of frame.', it.tab);
  });

  /* 4 · section density */
  const live = liveSections(cfg);
  if (live.length > 7) add('warn', 'The page is carrying ' + live.length + ' sections',
    'Past about seven, a single-page site asks more scrolling than most visitors give it. ' +
    'Hide what is not earning its place.', 'sections');
  const thin = [
    ['about', (c.about.body || '').length, 120],
    ['services intro', (c.services.intro || '').length, 0],
    ['contact', (c.contact.body || '').length, 0]
  ].filter(([k, len, floor]) => floor && len > 0 && len < floor);
  thin.forEach(([k, len]) => add('info', 'The ' + k + ' section is thin',
    'Only ' + len + ' characters. Short is fine, but at this length the section reads as unfinished rather than concise.'));

  /* 5 · media slots */
  Object.keys((m.video || {})).forEach(k => {
    const v = m.video[k];
    if (!vHasSource(v)) return;
    if (!vHasProvenance(v)) add('error', 'The ' + k + ' video has no recorded source or licence',
      'It will not play until both are filled in. An unattributed clip on a public site is the client\'s liability.', 'media');
    else if (!String(v.poster || '').trim()) add('warn', 'The ' + k + ' video has no poster image',
      'A motion-sensitive visitor, a narrow screen and any browser that blocks autoplay all get an empty frame.', 'media');
  });

  /* 6 · storefront */
  prodItems(cfg).forEach(p => {
    if (!Number(p.price)) add('warn', 'No price on "' + p.name + '"',
      'The card will show a zero. Set a price or hide the product.', 'products');
    if (!(p.images || []).filter(Boolean).length) add('info', 'No photograph on "' + p.name + '"',
      'The card shows a labelled empty frame instead.', 'products');
  });

  const rank = { error: 0, warn: 1, info: 2 };
  return out.sort((a, b) => rank[a.level] - rank[b.level]);
}

function blankConfig() {
  return {
    v: 5,
    intake: blankIntake(),
    batch: null,          /* the generated proposals and the seed that made them */
    favourites: [],
    business: { name: '', sector: '', tagline: '', city: '', email: '', phone: '', whatsapp: '',
      ctaLabel: 'Get in touch', currency: 'PKR' },
    theme: { ds: 'meridian', brand: '', accent: '', fontPair: '', motion: 'premium', mode: 'auto', _touched: {} },
    site: blankSite(),
    commerce: blankCommerce(),
    /* One page to begin with. The sitemap is derived from the brief at
       generation time, which is when there is finally something to
       base it on. */
    pages: [(() => {
      const p = blankPage(HOME, 'Home', '', SECTION_TYPES);
      p.sections.forEach(s => { if (s.type === 'products') s.visible = false; });
      return p;
    })()],
    /* The four types added in parts/081_sections.js bring their own
       blank shapes, merged in rather than restated here so the two
       cannot drift apart. */
    content: Object.assign({
      hero:        { eyebrow: '', headlineA: '', headlineB: '', sub: '' },
      about:       { heading: 'About', body: '' },
      services:    { heading: 'What we do', intro: '', items: [] },
      products:    { heading: 'Shop', intro: '', items: [] },
      work:        { heading: 'Selected work', items: [] },
      stats:       { heading: 'By the numbers', items: [] },
      testimonial: { quote: '', who: '' },
      contact:     { heading: 'Start a conversation', body: '' }
    }, blankExtraContent()),

    /* every image carries its own focal point so crops keep the subject.
       Video slots carry a provenance record and playback settings; a slot
       without a recorded source and licence is not played. */
    media: {
      logo: null, hero: null, heroFocal: { x: 50, y: 50 }, gallery: [],
      video: {
        hero:     blankVideoSlot(),
        campaign: blankVideoSlot(),
        product:  blankVideoSlot()
      }
    }
  };
}
/* ---------------------------------------------------------------------
   Pages.

   A site is a list of pages; a page owns a slice of the section list and
   its own title, description and slug. A section type belongs to exactly
   one page, which is what lets `content` stay keyed by type — an About
   section is the About section wherever it sits.

   The five engines are not page-aware and do not need to be. They ask
   `sec(cfg, type)` what to render and `navItems(cfg)` what to link to.
   `pageView(cfg, page)` hands them a config whose `sections` are that
   one page's, so each engine renders one page without a line changed,
   and `cfg.page` tells the shared chrome which page it is looking at.
   --------------------------------------------------------------------- */
const HOME = 'home';
const slugify = (s) => String(s || '').toLowerCase().trim()
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48);
const newPageId = () => 'p' + Math.random().toString(36).slice(2, 9);

/* ---------------------------------------------------------------------
   SECTION INSTANCES

   A section used to be `{ type, visible }`, and its content lived in one
   global store keyed by type: `cfg.content.testimonial`. That made a
   section type a singleton across the whole site. It was a deliberate
   choice and it bought something real — moving the About section between
   pages never asked anyone to retype it — but it made a genuine
   multi-page site impossible:

     "A testimonial section on Home must not automatically overwrite a
      different testimonial section on About Us."

   It did exactly that. Two testimonial sections on two pages read and
   wrote one object, so the second was the first.

   A section is now an INSTANCE with its own identity and, when it needs
   one, its own content:

     id       unique, stable across moves, renames and reorders
     type     which component
     variant  a layout override for this instance alone
     content  null  -> this instance uses the shared store for its type
              {...} -> this instance owns its content

   `content: null` is not a loose end; it is what keeps the old benefit.
   The FIRST section of a type on a site uses the shared store, so every
   configuration that already exists keeps working untouched and moving
   that section between pages is still lossless. The SECOND instance of
   the same type is given its own object at the moment it is created, so
   it cannot reach the first. Resolution happens in one place —
   `sectionContent` — and `pageView` applies it, which is why none of the
   six engines had to change: they still read `cfg.content.testimonial`
   and are handed the right one for the page they are drawing.
   --------------------------------------------------------------------- */
let SECTION_SEQ = 0;
const newSectionId = () =>
  's' + (++SECTION_SEQ).toString(36) + Math.floor(Math.random() * 1296).toString(36);

/* The four later types are opt-in: a client adds a FAQ, a team page or
   a price list when they have one, and an empty band is worse than no
   band. They are created switched off wherever a section is created —
   a new project, a migrated one, or a page rebuild — so there is one
   rule rather than three places that each remember it. */
const blankSection = (type, extra) =>
  Object.assign({ id: newSectionId(), type: type,
    visible: EXTRA_SECTION_TYPES.indexOf(type) < 0,
    variant: '', content: null }, extra || {});

function blankPage(id, name, slug, types) {
  return { id: id, name: name, slug: slug,
    title: '', description: '',
    sections: (types || []).map(t => blankSection(t)) };
}

/* What this instance actually shows. */
function sectionContent(cfg, sec) {
  if (!sec) return {};
  if (sec.content && typeof sec.content === 'object') return sec.content;
  return (cfg.content || {})[sec.type] || {};
}

/* Does any OTHER section already own the shared store for this type? */
function typeIsClaimed(cfg, type, exceptId) {
  return allSections(cfg).some(s =>
    s.type === type && s.id !== exceptId && !s.content);
}

/* Give an instance its own content, so editing it cannot reach another.
   A fresh object rather than a copy of the shared one: a second
   testimonial is a different client saying a different thing, and
   pre-filling it with the first would be the same bug wearing a hat. */
function ownContent(cfg, sec) {
  if (!sec || sec.content) return sec;
  const blank = blankConfig().content[sec.type];
  sec.content = blank ? JSON.parse(JSON.stringify(blank)) : {};
  return sec;
}
const homePage = (cfg) => (cfg.pages || [])[0] || null;
const pageById = (cfg, id) => (cfg.pages || []).filter(p => p.id === id)[0] || null;
const allSections = (cfg) => (cfg.pages || []).reduce((a, p) => a.concat(p.sections || []), []);
const pageOfType = (cfg, type) =>
  (cfg.pages || []).filter(p => (p.sections || []).some(s => s.type === type))[0] || null;
const pageHref = (p) => p && p.slug ? '/' + p.slug + '/' : '/';
const isHome = (p) => !!p && p.id === HOME;

/* A shallow view. The copy is deliberate: nothing downstream mutates it,
   and a per-render copy cannot leak one page's section list into the
   next render the way a mutable `currentPage` on the config would. */
function pageView(cfg, page) {
  const p = page || homePage(cfg);
  const v = Object.assign({}, cfg);
  v.sections = (p && p.sections) || [];
  v.page = p;
  /* The content THIS page's sections hold, keyed by type so every engine
     keeps reading `cfg.content.testimonial` and is handed the right one.
     A page cannot carry two sections of one type — the launch checks
     already refuse that — so keying by type within a page is exact.
     Instances that own their content shadow the shared store; the rest
     fall through to it. */
  const own = v.sections.filter(s => s && s.content && typeof s.content === 'object');
  if (own.length) {
    v.content = Object.assign({}, cfg.content);
    own.forEach(s => { v.content[s.type] = s.content; });
  }
  /* A published page carries no empty bands. In the editor an empty
     section is a prompt to fill it in and must stay visible; in the
     export it is a stretch of nothing with a heading over it. */
  if (PUBLISHING)
    v.sections = v.sections.filter(s => !s.visible || sectionHasContent(v, s));
  return v;
}

/* Is there anything in this section worth rendering? One rule per type,
   because "empty" means a different thing for a quote than for a grid. */
function sectionHasContent(view, s) {
  if (!s) return false;
  const c = (view.content || {})[s.type] || {};
  switch (s.type) {
    case 'hero':        return true;          /* always: it is the page's opening */
    case 'contact':     return true;          /* the form is the content */
    case 'about':       return String(c.body || '').trim().length > 0;
    case 'services':    return (c.items || []).some(x => x && x.title);
    case 'products':    return (c.items || []).some(x => x && x.name);
    case 'work':        return (c.items || []).some(x => x && x.title);
    case 'stats':       return (c.items || []).some(x => x && x.v);
    case 'testimonial': return String(c.quote || '').trim().length > 0;
    default:
      if (EXTRA_SECTION_TYPES.indexOf(s.type) >= 0) return extraHasContent(c, s.type);
      return true;
  }
}

/* A page with nothing live on it is not linked. Home is always linked:
   it is the site's front door even before anyone has filled it in. */
function pageIsLive(cfg, p) {
  if (isHome(p)) return true;
  return liveSections(pageView(cfg, p)).length > 0;
}

/* `cfg.sections` is what a page view carries. A config that has not
   been through one is the whole site, and the whole site's front page
   is Home — so `render(cfg)` still means "render this site", and no
   caller has to know about pages to get a sensible document. */
function sectionsOf(cfg) {
  if (Array.isArray(cfg.sections)) return cfg.sections;
  const h = homePage(cfg);
  return (h && h.sections) || [];
}

function liveSections(cfg) {
  const c = cfg.content;
  return sectionsOf(cfg).filter(s => {
    if (!s.visible) return false;
    if (s.type === 'work')     return (c.work.items || []).filter(x => x.title).length > 0;
    if (s.type === 'products') return (c.products.items || []).filter(x => x.name).length > 0;
    if (s.type === 'stats')    return (c.stats.items || []).filter(x => x.v).length > 0;
    if (s.type === 'testimonial') return !!(c.testimonial.quote || '').trim();
    if (s.type === 'about')    return !!(c.about.body || '').trim();
    /* the types added in parts/081_sections.js decide for themselves */
    if (EXTRA_SECTION_TYPES.indexOf(s.type) >= 0)
      return extraHasContent(c[s.type], s.type);
    return true;
  });
}
/* ---------------------------------------------------------------------
   Section order, applied after the fact.

   Every engine builds its sections in whatever sequence reads best in its
   own source. Rather than rewrite five engines into a dispatch table, the
   blocks are reordered once they exist: the slots a section occupies are
   found by its own `id`, and the blocks are re-seated in the order the
   composition asked for. Nav, hero and footer keep their places.

   This is why section order is a real generative axis and not a label —
   a visitor genuinely meets the page in a different sequence.
   --------------------------------------------------------------------- */
function orderSections(cfg, S) {
  /* Any live type this engine does not render itself is produced by the
     shared registry and appended here, so it takes part in the ordering
     below exactly like a built-in section. */
  S = fillExtraSections(cfg, S);
  const want = liveSections(cfg).map(s => s.type).filter(t => t !== 'hero');
  if (want.length < 2) return S;
  const slots = [], byType = {};
  S.forEach((html, i) => {
    const m = /^<section id="([a-z]+)"/.exec(html);
    if (m && want.indexOf(m[1]) >= 0) { slots.push(i); byType[m[1]] = html; }
  });
  const seq = want.filter(t => byType[t]);
  if (seq.length !== slots.length) return S;        /* nothing to reseat safely */
  slots.forEach((pos, k) => { S[pos] = byType[seq[k]]; });
  return S;
}

/* ---------------------------------------------------------------------
   PUBLISHING MODE

   The editor's preview and a published website are not the same
   document, and until now they were rendered identically. That is how
   a dashed "Business name" placeholder and a panel reading "No figures
   entered yet. Add numbers you can evidence and this panel charts
   them." ended up in exported sites — builder guidance, correct in the
   editor, shown to the client's visitors on the live page. The
   benchmark found them by rendering the export and reading the text.

   `PUBLISHING` is set by buildSite around one synchronous render and
   cleared in a finally block. Rendering is synchronous and
   single-threaded — no await anywhere between the two — so the flag
   cannot be observed by anything other than the render it wraps.

   In publishing mode: placeholders render as nothing, and an
   engine's empty-state guidance is suppressed. What is left is the
   client's own content and the chrome around it. */
let PUBLISHING = false;
const publishing = () => PUBLISHING;
function asPublished(fn) {
  const was = PUBLISHING;
  PUBLISHING = true;
  try { return fn(); } finally { PUBLISHING = was; }
}

const PH = (t, b) => PUBLISHING ? ''
  : '<span class="ph' + (b ? ' ph-b' : '') + '">' + E(t) + '</span>';
const svcItems  = (c) => (c.content.services.items || []).filter(x => x.title);
const workItems = (c) => (c.content.work.items || []).filter(x => x.title);
const statItems = (c) => (c.content.stats.items || []).filter(x => x.v);
const prodItems = (c) => (c.content.products.items || []).filter(x => x.name);
const sec = (c, t) => liveSections(c).some(s => s.type === t);

/* focal point → object-position, so a crop never cuts the subject out */
const focal = (m) => 'object-position:' + ((m && m.x) || 50) + '% ' + ((m && m.y) || 50) + '%';

/* Navigation is the page list, not a list of anchors on one page. Each
   entry carries `data-page` so the sandboxed preview can intercept the
   click and ask the editor to switch page; a published site follows the
   href and loads the real document. */
/* The top-level pages only. A site with three service pages has eight
   pages, and all eight in one bar is a nav nobody reads — at phone
   width it was most of the first screen. A child page (a service with
   its own page) is reached from its parent, which is where someone
   looks for it, and it still appears in the sitemap and in the
   parent's own list of links. `current` lights the parent while a
   child is open, so the bar still says where the reader is. */
function navItems(cfg) {
  const here = cfg.page;
  return (cfg.pages || [])
    .filter(p => pageIsLive(cfg, p))
    .filter(p => !p.parent)
    .map(p => ({ label: p.name, href: pageHref(p), page: p.id,
                 current: !!here && (p.id === here.id || here.parent === p.id) }));
}

/* { childPageId: parentPageId } for this configuration */
function childPages(cfg) {
  const out = {};
  (cfg.pages || []).forEach(p => { if (p.parent) out[p.id] = p.parent; });
  return out;
}

/* The links from a parent page down to its children. Shared chrome, so
   every engine gets it: a Services page that does not link to the
   service pages leaves them reachable only from the sitemap. */
function childLinks(cfg) {
  const here = cfg.page;
  if (!here) return '';
  const kids = (cfg.pages || []).filter(p => p.parent === here.id && pageIsLive(cfg, p));
  if (!kids.length) return '';
  return '<section id="pages"><div class="w">' +
    '<h2 class="xs-h">' + E(here.name === 'Services' ? 'Each service in detail' : 'In this section') + '</h2>' +
    '<ul class="xs-kids">' + kids.map(p =>
      '<li><a href="' + pageHref(p) + '"><span class="xs-knm">' + E(p.name) + '</span>' +
      (p.description ? '<span class="xs-kds">' + E(p.description) + '</span>' : '') +
      '</a></li>').join('') + '</ul></div></section>';
}
const money = (cfg, n) => (cfg.business.currency || 'PKR') + ' ' + (Number(n) || 0).toLocaleString('en-US');

/* runtime: reveals, theme switch, pointer parallax, honest form + install */
